<script id="data" type="application/json">{"rules":[{"id":"BR-001","title":"Papyrus Command Behavior","description":"Each Papyrus command and subcommand performs the behavior stated in its Papyrus manpage entry; behavior not stated there is unspecified.","rationale":"REQ-01 — Project Setup and CLI Access; REQ-02 — Task and Board Management; REQ-03 — Milestone and Release Planning; REQ-04 — Decision Records; REQ-05 — Project Documentation Management; and REQ-06 — Search and Local Web Interface ground the documented command areas. `README.md` is the sole behavior source for this rule.","applicability":"Applies to all Papyrus command invocations and the project data they manage. The excerpts below reproduce relevant manpage behavior verbatim. Each heading identifies the README section and exact source line range.\n\n### papyrus(1): SYNOPSIS, DESCRIPTION, GLOBAL OPTIONS, and COMMANDS — `README.md` lines 20–705\n\n```text\nSYNOPSIS\n\n       papyrus \u003ccommand\u003e [options]\n\n       papyrus \u003ccommand\u003e \u003csubcommand\u003e [options]\n\nDESCRIPTION\n\n       papyrus manages a project's backlog and long-term documentation from a single command-line interface. It combines:\n\n       - **Backlog management** - tasks, milestones, releases, and decisions.\n        - **Documentation management** - business and non-functional requirements, glossary terms, UI and technical specifications, audit records, and business rules.\n\n       All project data lives in the project directory selected with --dir (default: the current working directory). IDs are generated automatically and remain stable across archive/restore and deprecate/restore cycles.\n\nGLOBAL OPTIONS\n\n       --json\n       Emit stable, machine-readable JSON. Applies to every command that produces output, including errors.\n\n       --dir \u003cpath\u003e\n       Project directory. Default: the current working directory.\n\n       --config \u003cfile\u003e\n       Configuration file. Default: papyrus.config.yml in the project directory.\n\n       --no-color\n       Disable ANSI color output. The NO_COLOR environment variable has the same effect.\n\n       --version\n       Print the version and exit.\n\n       -h, --help\n       Print help and exit. Use papyrus \u003ccommand\u003e --help for command help.\n\nCOMMANDS\n\ninit\nconfig\nbrowser\ntask\nmilestone\nrelease\ndecision\nreq\nnfreq\nglossary\nui-spec\nrule\naudit\nsearch\n\n```\n\n### papyrus(1): STATUSES — `README.md` lines 707–756\n\n```text\nSTATUSES\n\nTasks\n\n        ToDo -\u003e Initiated -\u003e Refined -\u003e Implemented -\u003e Validated -\u003e Done\n\n        ToDo\n       Initial status.\n\n       Initiated\n       Scope confirmed.\n\n       Refined\n       Ready for implementation.\n\n       Implemented\n       Work complete.\n\n       Validated\n       Reviewed and accepted.\n\n        Done\n        Completion approved by the user. This is the only terminal status.\n\nMilestones\n\n        active -\u003e archived\n\n        Archiving a milestone is separate from task workflow status.\n\nReleases\n\n        active -\u003e released\n\n        Releases group milestones.\n\nDecisions\n\n       Nygard ADR statuses:\n\n       proposed -\u003e accepted | rejected\n       accepted -\u003e deprecated | superseded\n\nDocuments\n\n        Business requirements, non-functional requirements, glossary terms,\n        UI specifications, and business rules share this lifecycle:\n\n        active -\u003e deprecated\n\n```\n\n### papyrus(1): FILES — `README.md` lines 757–816\n\n```text\nFILES\n\n        papyrus.config.yml\n        Project configuration. Its location can be overridden with --config\n        or PAPYRUS_CONFIG. See papyrus-config(5).\n\n        backlog/tasks/\n        Task records. The backlog_directory setting controls the parent path.\n\n        backlog/milestones/\n        Milestone records. The backlog_directory setting controls the parent path.\n\n        backlog/releases/\n        Release records. The backlog_directory setting controls the parent path.\n\n        decisions/\n        Decision records. The decision_directory setting controls this path.\n\n        docs/requirements/business/\n        Business requirements. Path is doc_directory plus\n        document_types.req.directory.\n\n        \u003cdoc_directory\u003e/\u003cdocument_types.req.directory\u003e/deprecated/\n        Deprecated business requirements, under the configured requirement folder.\n\n        docs/requirements/non-functional/\n        Non-functional requirements. Path is doc_directory plus\n        document_types.nfr.directory.\n\n        \u003cdoc_directory\u003e/\u003cdocument_types.nfr.directory\u003e/deprecated/\n        Deprecated non-functional requirements, under the configured requirement folder.\n\n        docs/glossary/\n        Glossary terms. Path is doc_directory plus\n        document_types.glossary.directory.\n\n        \u003cdoc_directory\u003e/\u003cdocument_types.glossary.directory\u003e/deprecated/\n        Deprecated glossary terms, under the configured glossary folder.\n\n        docs/specifications/ui/\n        UI specifications. Path is controlled by doc_directory and\n        document_types.ui-spec.directory.\n\n        \u003cdoc_directory\u003e/\u003cdocument_types.ui-spec.directory\u003e/deprecated/\n        Deprecated UI specifications, under the configured UI specifications folder.\n\n        docs/business-rules/\n        Business rules. Path is doc_directory plus\n        document_types.rule.directory.\n\n        \u003cdoc_directory\u003e/\u003cdocument_types.rule.directory\u003e/deprecated/\n        Deprecated business rules, under the configured business rules folder.\n\n        docs/audit-records/\n        Audit records. Path is doc_directory plus\n        document_types.audit.directory.\n\n        \u003cdoc_directory\u003e/\u003cdocument_types.audit.directory\u003e/deprecated/\n        Deprecated audit records, under the configured audit records folder.\n\n```\n\n### papyrus(1): ENVIRONMENT and EXIT STATUS — `README.md` lines 817–846\n\n```text\nENVIRONMENT\n\n       PAPYRUS_DIR\n       Default project directory. Overridden by --dir.\n\n       PAPYRUS_CONFIG\n       Default configuration file. Overridden by --config.\n\n       NO_COLOR\n       Disable color output when set to any value.\n\n       EDITOR, VISUAL\n        Editor used by document-type edit commands and other interactive edit commands.\n\nEXIT STATUS\n\n       0\n       Success.\n\n       1\n       Runtime error.\n\n       2\n       Usage error.\n\n       3\n       Record not found.\n\n       4\n       Validation error or conflict.\n```\n\n### papyrus-config(5): DESCRIPTION, PRECEDENCE, and KEYS — `README.md` lines 902–999\n\n```text\nDESCRIPTION\n\n       papyrus.config.yml is a YAML file that controls project paths, ID formats, workflow statuses, document types, and the local web UI.\n\n       The file is read from the project directory (--dir) unless --config or PAPYRUS_CONFIG names another file.\n\nPRECEDENCE\n\n       From highest to lowest:\n\n       1. Command-line options.\n       2. Environment variables (PAPYRUS_DIR, PAPYRUS_CONFIG).\n       3. papyrus.config.yml in the project directory.\n       4. Built-in defaults.\n\nKEYS\n\nGeneral\n\n       project_name\n       Project name. Default: the directory name.\n\n       task_prefix\n       Task ID prefix. Default: TASK.\n\n       milestone_prefix\n       Milestone ID prefix. Default: MS.\n\n       release_prefix\n       Release ID prefix. Default: REL.\n\n        id_padding\n        Positive integer for ID zero-padding width. Default: 3 (for example TASK-001). IDs wider than the padding are not truncated.\n\n       date_format\n       Date format. Default: yyyy-mm-dd.\n\n       editor\n       Editor command. Default: $VISUAL, then $EDITOR.\n\nPaths\n\n       backlog_directory\n       Backlog store. Default: backlog/.\n\n       decision_directory\n       Decision records. Default: decisions/, outside the backlog store.\n\n       doc_directory\n       Active documentation store. Default: docs/.\n\n       Each document type has its own configured directory relative to this path.\n       Deprecated documents are stored in a deprecated/ subfolder within\n       their type directory.\n\nWorkflow\n\n       statuses\n       Ordered task statuses. Default: [\"ToDo\", \"Initiated\", \"Refined\", \"Implemented\", \"Validated\", \"Done\"].\n       Use unique values; default_status must match one of them.\n\n       default_status\n       Status assigned to new tasks. Default: ToDo.\n\nDecisions\n\n       decision_types\n       Decision types and their ID prefixes. Default:\n\n         \n         decision_types:\n           adr: { prefix: ADR, enabled: true }\n           bdr: { prefix: BDR, enabled: true }\n         \n\n         Additional types may be added. A disabled type is rejected by papyrus decision create and hidden from lists and search.\n\nDocuments\n\n       document_types\n       Document type keys, ID prefixes, directories relative to doc_directory,\n       and enabled flags. Deprecated documents are stored in a deprecated/\n       subfolder of each type directory. Default:\n\n       \n       document_types:\n         req:      { prefix: REQ, directory: requirements/business/,       enabled: true }\n         nfr:      { prefix: NFR, directory: requirements/non-functional/, enabled: true }\n         glossary: { prefix: GLO, directory: glossary/,                    enabled: true }\n         rule:     { prefix: RUL, directory: business-rules/,              enabled: true }\n         ui-spec:  { prefix: UI,  directory: specifications/ui/,           enabled: true }\n         audit:    { prefix: AUD, directory: audit-records/,                enabled: true }\n         deploy:   { prefix: DEP, directory: architecture/deployment/,     enabled: true }\n       \n\n       The nfreq command uses the nfr type key. Additional types may\n       be added. Disabled types cannot be created and are hidden from lists and search.\n\n```"},{"id":"BR-002","title":"Papyrus init Command Behavior","description":"The papyrus init command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → init); behavior not stated there is unspecified.","rationale":"Based on REQ-01.001 — Initialize a Papyrus Project, this rule exists because the documented init behavior is the contract for papyrus init; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus init` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): init — `README.md` lines 57–70\n\n```text\ninit\n\n       Initialize a project in the directory where papyrus init is run. If --dir \u003cpath\u003e is given, initialize in that directory instead; the directory is created if it does not exist. Initialization creates the backlog store, the documentation structure, and papyrus.config.yml.\n       \n       papyrus init \u003cname\u003e [--no-git] [--force]\n       \n       \u003cname\u003e is the project name stored in the configuration.\n\n       --no-git\n       Do not initialize a Git repository.\n\n       --force\n       Allow initialization in a non-empty directory. Existing files are never overwritten.\n```"},{"id":"BR-003","title":"Papyrus config Command Behavior","description":"The papyrus config command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → config); behavior not stated there is unspecified.","rationale":"Based on REQ-01.002 — Read and Edit Project Configuration, this rule exists because the documented config behavior is the contract for papyrus config; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus config` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): config — `README.md` lines 71–93\n\n```text\nconfig\n\n       Read and edit the configuration. Keys use dotted notation for nested values, for example document_types.req.enabled.\n       \n       papyrus config list\n       papyrus config get \u003ckey\u003e\n       papyrus config set \u003ckey\u003e \u003cvalue\u003e\n       papyrus config unset \u003ckey\u003e\n       \n       list\n       Print all effective keys, including defaults.\n\n       get \u003ckey\u003e\n       Print one effective value.\n\n       set \u003ckey\u003e \u003cvalue\u003e\n       Persist one value. The value is parsed as a YAML scalar.\n\n       unset \u003ckey\u003e\n       Remove one key and fall back to its default.\n\n       Precedence is described in papyrus-config(5).\n```"},{"id":"BR-004","title":"Papyrus browser Command Behavior","description":"The papyrus browser command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → browser); behavior not stated there is unspecified.","rationale":"Based on REQ-06.002 — Serve the Local Web Interface, this rule exists because the documented browser behavior is the contract for papyrus browser; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus browser` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): browser — `README.md` lines 94–108\n\n```text\nbrowser\n\n       Serve the local web UI over both the backlog and documentation stores.\n       \n       papyrus browser [--host \u003chost\u003e] [--port \u003cport\u003e] [--no-open]\n       \n       --host \u003chost\u003e\n       Bind address. Default: 127.0.0.1. A non-loopback address is allowed but prints a warning.\n\n       --port \u003cport\u003e\n       TCP port. Default: 6420.\n\n       --no-open\n       Do not open the default browser automatically.\n```"},{"id":"BR-005","title":"Papyrus task Command Behavior","description":"The papyrus task command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → task); behavior not stated there is unspecified.","rationale":"Based on REQ-02.001 — Create and Describe Tasks and REQ-02.002 — View and Edit Tasks and REQ-02.003 — List and Filter Tasks and REQ-02.004 — Archive, Restore, and Delete Tasks, this rule exists because the documented task behavior is the contract for papyrus task; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus task` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): task — `README.md` lines 109–228\n\n```text\ntask\n\n        Manage tasks (TASK-001, ...). A task may be assigned to zero or one milestone, may depend on zero or more tasks, and may reference zero or more business requirements, non-functional requirements, UI specifications, technical specifications, audit records, and business rules.\n       \n       papyrus task create \u003ctitle\u003e [options]\n       papyrus task list [options]\n       papyrus task view \u003cid\u003e\n       papyrus task \u003cid\u003e\n       papyrus task edit \u003cid\u003e [options]\n       papyrus task archive \u003cid\u003e\n       papyrus task restore \u003cid\u003e\n       papyrus task delete \u003cid\u003e [--force]\n       \n       create\n       Create a task.\n\n          -d, --description \u003ctext\u003e\n          Task description.\n\n          --ac \u003ccriteria\u003e\n          Acceptance criterion. Repeatable.\n\n          --depends-on \u003cid\u003e\n           Task dependency. Repeatable; tasks may depend on zero or more tasks.\n\n          --milestone \u003cid\u003e\n          Parent milestone.\n\n          --label \u003clabel\u003e\n          Label. Repeatable.\n\n          --assignee \u003cname\u003e\n          Assignee.\n\n       list\n       List tasks.\n\n          -s, --status \u003cstatus\u003e\n          Filter by status. See STATUSES.\n\n          --milestone \u003cid\u003e\n          Filter by milestone.\n\n          --release \u003cid\u003e\n          Filter by release. Collects tasks belonging to milestones that belong to the release.\n\n          --label \u003clabel\u003e\n          Filter by label.\n\n          --assignee \u003cname\u003e\n          Filter by assignee.\n\n          --search \u003ctext\u003e\n          Filter by text.\n\n          --limit \u003cn\u003e\n          Maximum number of results.\n\n          --sort \u003cfield\u003e\n          Sort field, for example id, created, or status.\n\n          --watch\n          Keep the list open and refresh on changes.\n\n       view \u003cid\u003e\n       View a task.\n\n       edit \u003cid\u003e\n       Edit a task.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          -d, --description \u003ctext\u003e\n          Update the description.\n\n          --ac \u003ccriteria\u003e\n          Add an acceptance criterion. Repeatable.\n\n          --comment \u003ctext\u003e\n          Add a comment.\n\n          --comment-author \u003cname\u003e\n          Set the comment author.\n\n          --status \u003cstatus\u003e\n          Set the status.\n\n          --depends-on \u003cid\u003e\n          Add a dependency. Repeatable.\n\n          --milestone \u003cid\u003e\n          Set the parent milestone.\n\n          --no-milestone [\u003cid\u003e]\n          Remove the specified milestone; without an ID, remove all milestone assignments.\n\n          --label \u003clabel\u003e\n          Add a label. Repeatable.\n\n          --assignee \u003cname\u003e\n          Set the assignee.\n\n          --editor\n          Open the task body in $VISUAL or $EDITOR. All repeatable options add to the existing set; field flags update metadata without launching an editor.\n\n       archive \u003cid\u003e\n       Move a task off the board. The ID and every dependency are preserved.\n\n       restore \u003cid\u003e\n       Return an archived task to the board with its previous status.\n\n       delete \u003cid\u003e [--force]\n       Permanently delete a task. An archived task can be deleted; an active task is archived first.\n\n          --force\n          Skip confirmation prompt.\n\n       task view \u003cid\u003e and task \u003cid\u003e are equivalent.\n```"},{"id":"BR-006","title":"Papyrus milestone Command Behavior","description":"The papyrus milestone command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → milestone); behavior not stated there is unspecified.","rationale":"Based on REQ-03.001 — Manage Milestones, this rule exists because the documented milestone behavior is the contract for papyrus milestone; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus milestone` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): milestone — `README.md` lines 229–278\n\n```text\nmilestone\n\n       Manage milestones (MS-001, ...). A milestone may be assigned to zero or one release.\n       \n       papyrus milestone create \u003ctitle\u003e [-d \u003cdescription\u003e] [--release \u003cid\u003e]\n       papyrus milestone list\n       papyrus milestone view \u003cid\u003e\n        papyrus milestone edit \u003cid\u003e [--title \u003ctitle\u003e] [-d \u003cdescription\u003e] [--release \u003cid\u003e] [--no-release [\u003cid\u003e]]\n       papyrus milestone archive \u003cid\u003e\n       papyrus milestone delete \u003cid\u003e [--force]\n       \n       create\n       Create a milestone.\n\n          -d, --description \u003ctext\u003e\n          Milestone description.\n\n          --release \u003cid\u003e\n          Assign the milestone to a release.\n\n       list\n       List milestones.\n\n       view \u003cid\u003e\n       View a milestone.\n\n       edit \u003cid\u003e\n       Edit a milestone.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          -d, --description \u003ctext\u003e\n          Update the description.\n\n          --release \u003cid\u003e\n          Assign the milestone to a release.\n\n          --no-release [\u003cid\u003e]\n          Remove the specified release; without an ID, remove all release assignments.\n\n       archive \u003cid\u003e\n       Archive a milestone.\n\n       delete \u003cid\u003e [--force]\n       Permanently delete a milestone.\n\n          --force\n          Skip confirmation prompt.\n```"},{"id":"BR-007","title":"Papyrus release Command Behavior","description":"The papyrus release command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → release); behavior not stated there is unspecified.","rationale":"Based on REQ-03.002 — Manage Releases, this rule exists because the documented release behavior is the contract for papyrus release; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus release` and the project data they manage. The excerpts below reproduce relevant manpage behavior verbatim; each heading identifies the README section and exact source line range. No `archive`, `restore`, or `delete` subcommand is documented for `papyrus release`; its lifecycle is `active -\u003e released`.\n\n### papyrus(1): release — `README.md` lines 279–305\n\n```text\nrelease\n\n       Manage releases (REL-001, ...). A release may contain multiple milestones; each milestone may be assigned to zero or one release.\n       \n       papyrus release create \u003ctitle\u003e\n       papyrus release list\n       papyrus release view \u003cid\u003e\n       papyrus release edit \u003cid\u003e [--title \u003ctitle\u003e] [-d \u003cdescription\u003e]\n       \n       create\n       Create a release.\n\n       list\n       List releases.\n\n       view \u003cid\u003e\n       View a release.\n\n       edit \u003cid\u003e\n       Edit a release.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          -d, --description \u003ctext\u003e\n          Update the description.\n```\n\n### papyrus(1): STATUSES → Releases — `README.md` lines 737–741\n\n```text\nReleases\n\n        active -\u003e released\n\n        Releases group milestones.\n```"},{"id":"BR-008","title":"Papyrus decision Command Behavior","description":"The papyrus decision command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → decision); behavior not stated there is unspecified.","rationale":"Based on REQ-04.001 — Create and Inspect Decisions and REQ-04.002 — Update, Supersede, and Archive Decisions, this rule exists because the documented decision behavior is the contract for papyrus decision; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus decision` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): decision — `README.md` lines 306–367\n\n```text\ndecision\n\n       Manage decisions (ADR-001, BDR-001, ...). Decisions may reference zero or more business requirements and zero or more non-functional requirements, and may be superseded by zero or one decision of the same type.\n       \n        papyrus decision create \u003ctitle\u003e [-t, --decision-type \u003ctype\u003e] [-d \u003cdecision\u003e] [--context \u003ctext\u003e] [--consequences \u003ctext\u003e]\n        papyrus decision list [-t, --decision-type \u003ctype\u003e]\n       papyrus decision view \u003cid\u003e\n       papyrus decision edit \u003cid\u003e [--title \u003ctitle\u003e] [-d \u003cdecision\u003e]\n                                     [--status \u003cstatus\u003e] [--context \u003ctext\u003e] [--consequences \u003ctext\u003e]\n                                     [--superseded-by \u003cid\u003e]\n       papyrus decision archive \u003cid\u003e\n       \n       create\n       Create a decision.\n\n           -t, --decision-type \u003ctype\u003e\n          Decision type. Built-in types: adr (default) and bdr. Additional types are configured in papyrus-config(5).\n\n          -d, --decision \u003ctext\u003e\n          The decision which was taken.\n\n          --context \u003ctext\u003e\n          Context of the decision.\n\n          --consequences \u003ctext\u003e\n          Consequences of the decision.\n\n       list\n       List decisions.\n\n           -t, --decision-type \u003ctype\u003e\n           Filter by decision type.\n\n       view \u003cid\u003e\n       View a decision.\n\n       edit \u003cid\u003e\n       Edit a decision.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          -d, --decision \u003ctext\u003e\n          The decision which was taken.\n\n          --status \u003cstatus\u003e\n          Set the status.\n\n          --context \u003ctext\u003e\n          Context of the decision.\n\n          --consequences \u003ctext\u003e\n          Consequences of the decision.\n\n          --superseded-by \u003cid\u003e\n           Mark this decision as superseded by at most one other decision of the same type. Cannot be combined with --status.\n\n       archive \u003cid\u003e\n       Archive a decision.\n\n       Decision records follow the Nygard ADR template: Title, Status, Decision, Context, and Consequences. Statuses are proposed, accepted, rejected, deprecated, and superseded.\n```"},{"id":"BR-009","title":"Papyrus req Command Behavior","description":"The papyrus req command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → req); behavior not stated there is unspecified.","rationale":"Based on REQ-05.001 — Manage Business Requirements, this rule exists because the documented req behavior is the contract for papyrus req; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus req` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): req — `README.md` lines 368–435\n\n```text\nreq\n\n         Manage business requirements (REQ-...). Requirement-to-group cardinality is 1..1; each group contains business requirements only.\n\n       \n        papyrus req create \u003ctitle\u003e [--title \u003ctitle\u003e] [--story \u003ctext\u003e] [-d \u003cdescription\u003e] --group \u003cid\u003e\n       papyrus req create-group --title \u003ctitle\u003e [--story \u003ctext\u003e] [-d \u003cdescription\u003e]\n       papyrus req list\n       papyrus req view \u003cid\u003e\n       papyrus req edit \u003cid\u003e [--title \u003ctitle\u003e] [--story \u003ctext\u003e] [-d \u003cdescription\u003e] [--editor]\n       papyrus req deprecate \u003cid\u003e\n       papyrus req restore \u003cid\u003e\n       \n\n       create\n       Create a business requirement.\n\n          --title \u003ctitle\u003e\n          Requirement title.\n\n          --story \u003ctext\u003e\n          User story.\n\n          -d, --description \u003ctext\u003e\n          Description.\n\n          --group \u003cid\u003e\n           Add the requirement to its required business-requirement group.\n\n       create-group\n        Create a business-requirement group. It can contain business requirements only.\n\n          --title \u003ctitle\u003e\n          Requirement group title.\n\n          --story \u003ctext\u003e\n          User story.\n\n          -d, --description \u003ctext\u003e\n          Description.\n\n       list\n       List business requirements.\n\n       view \u003cid\u003e\n       View a business requirement.\n\n       edit \u003cid\u003e\n       Edit a business requirement.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          --story \u003ctext\u003e\n          Update the user story.\n\n          -d, --description \u003ctext\u003e\n          Update the description.\n\n          --editor\n          Open the document body in $VISUAL or $EDITOR.\n\n       deprecate \u003cid\u003e\n       Move a business requirement to the deprecated folder. Deprecated documents are hidden from lists, search, and the web UI.\n\n       restore \u003cid\u003e\n       Return a deprecated business requirement to its original folder. The ID is preserved.\n```"},{"id":"BR-010","title":"Papyrus nfreq Command Behavior","description":"The papyrus nfreq command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → nfreq); behavior not stated there is unspecified.","rationale":"Based on REQ-05.002 — Manage Non-Functional Requirements, this rule exists because the documented nfreq behavior is the contract for papyrus nfreq; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus nfreq` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): nfreq — `README.md` lines 436–491\n\n```text\nnfreq\n\n          Manage non-functional requirements (NFR-...). Requirement-to-group cardinality is 1..1; each group contains non-functional requirements only. Non-functional requirements may be referenced by tasks, decisions, and technical specifications.\n\n       \n        papyrus nfreq create \u003ctitle\u003e [-d \u003cdescription\u003e] --group \u003cid\u003e\n       papyrus nfreq create-group --title \u003ctitle\u003e [-d \u003cdescription\u003e]\n       papyrus nfreq list\n       papyrus nfreq view \u003cid\u003e\n       papyrus nfreq edit \u003cid\u003e [--title \u003ctitle\u003e] [-d \u003cdescription\u003e] [--editor]\n       papyrus nfreq deprecate \u003cid\u003e\n       papyrus nfreq restore \u003cid\u003e\n       \n\n       create\n       Create a non-functional requirement.\n\n          -d, --description \u003ctext\u003e\n          Requirement description.\n\n          --group \u003cid\u003e\n           Add the requirement to its required non-functional-requirement group.\n\n       create-group\n        Create a non-functional-requirement group. It can contain non-functional requirements only.\n\n          --title \u003ctitle\u003e\n          Requirement group title.\n\n          -d, --description \u003ctext\u003e\n          Description.\n\n       list\n       List non-functional requirements.\n\n       view \u003cid\u003e\n       View a non-functional requirement.\n\n       edit \u003cid\u003e\n       Edit a non-functional requirement.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          -d, --description \u003ctext\u003e\n          Update the description.\n\n          --editor\n          Open the document body in $VISUAL or $EDITOR.\n\n       deprecate \u003cid\u003e\n       Move a non-functional requirement to the deprecated folder. Deprecated documents are hidden from lists, search, and the web UI.\n\n       restore \u003cid\u003e\n       Return a deprecated non-functional requirement to its original folder. The ID is preserved.\n```"},{"id":"BR-011","title":"Papyrus glossary Command Behavior","description":"The papyrus glossary command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → glossary); behavior not stated there is unspecified.","rationale":"Based on REQ-05.003 — Manage Glossary Terms, this rule exists because the documented glossary behavior is the contract for papyrus glossary; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus glossary` and the project all invocations of `papyrus ui-spec` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): ui-spec — `README.md` lines 538–583\n\n```text\nui-spec\n\n        Manage UI specifications (UI-...).\n\n       \n       papyrus ui-spec create \u003ctitle\u003e --view \u003cview\u003e --description \u003ctext\u003e\n       papyrus ui-spec list\n       papyrus ui-spec view \u003cid\u003e\n       papyrus ui-spec edit \u003cid\u003e [--view \u003cview\u003e] [--description \u003ctext\u003e] [--editor]\n       papyrus ui-spec deprecate \u003cid\u003e\n       papyrus ui-spec restore \u003cid\u003e\n       \n\n       create\n       Create a UI specification.\n\n          --view \u003cview\u003e\n          Associate the specification with a view.\n\n          --description \u003ctext\u003e\n          Description of the UI specification.\n\n       list\n       List UI specifications.\n\n       view \u003cid\u003e\n       View a UI specification.\n\n       edit \u003cid\u003e\n       Edit a UI specification.\n\n          --view \u003cview\u003e\n          Update the associated view.\n\n          --description \u003ctext\u003e\n          Update the description.\n\n          --editor\n          Open the document body in $VISUAL or $EDITOR.\n\n       deprecate \u003cid\u003e\n        Move a UI specification to the deprecated folder. Deprecated documents are hidden from lists, search, and the web UI.\n\n       restore \u003cid\u003e\n        Return a deprecated UI specification to its original folder. The ID is preserved.\n```"},{"id":"BR-013","title":"Papyrus rule Command Behavior","description":"The papyrus rule command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → rule); behavior not stated there is unspecified.","rationale":"Based on REQ-05.005 — Manage Business Rules, this rule exists because the documented rule behavior is the contract for papyrus rule; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus rule` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): rule — `README.md` lines 584–641\n\n```text\nrule\n\n       Manage business rules (RUL-...).\n\n       \n        papyrus rule create \u003ctitle\u003e --description \u003ctext\u003e --rationale \u003ctext\u003e --applicability \u003ctext\u003e [--requirement \u003cid\u003e...]\n       papyrus rule list\n       papyrus rule view \u003cid\u003e\n        papyrus rule edit \u003cid\u003e [--title \u003ctitle\u003e] [-d \u003cdescription\u003e] [--requirement \u003cid\u003e...] [--no-requirement [\u003cid\u003e]] [--editor]\n       papyrus rule deprecate \u003cid\u003e\n       papyrus rule restore \u003cid\u003e\n        \n\n        create\n        Create a business rule.\n\n          --description \u003ctext\u003e\n          State the business rule precisely.\n\n          --rationale \u003ctext\u003e\n          Explain why the rule exists, referencing its requirement(s).\n\n          --applicability \u003ctext\u003e\n          Describe when and where the rule applies.\n\n          --requirement \u003cid\u003e\n           Reference a business requirement. Repeatable; zero or more may be specified.\n\n       list\n        List business rules.\n\n       view \u003cid\u003e\n        View a business rule.\n\n       edit \u003cid\u003e\n        Edit a business rule.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          -d, --description \u003ctext\u003e\n          Update the description.\n\n          --requirement \u003cid\u003e\n           Add a business requirement to the existing list. Repeatable.\n\n          --no-requirement [\u003cid\u003e]\n           Remove the specified business requirement; if no ID is given, remove all business-requirement references.\n\n          --editor\n          Open the document body in $VISUAL or $EDITOR.\n\n       deprecate \u003cid\u003e\n        Move a business rule to the deprecated folder. Deprecated documents are hidden from lists, search, and the web UI.\n\n       restore \u003cid\u003e\n       Return a deprecated business rule to its original folder. The ID is preserved.\n```"},{"id":"BR-014","title":"Papyrus audit Command Behavior","description":"The papyrus audit command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → audit); behavior not stated there is unspecified.","rationale":"Based on REQ-05.006 — Manage Audit Records and REQ-05.007 — Manage Documentation Record Lifecycle, this rule exists because the documented audit behavior is the contract for papyrus audit; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus audit` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): audit — `README.md` lines 642–691\n\n```text\naudit\n\n        Manage audit records (AUD-001, ...).\n       \n       papyrus audit create --title \u003ctitle\u003e --content \u003ctext\u003e [--audit-type \u003ctype\u003e]\n       papyrus audit list\n       papyrus audit view \u003cid\u003e\n       papyrus audit edit \u003cid\u003e [--title \u003ctitle\u003e] [--content \u003ctext\u003e] [--audit-type \u003ctype\u003e] [--editor]\n       papyrus audit deprecate \u003cid\u003e\n       papyrus audit restore \u003cid\u003e\n       \n       create\n       Create an audit record.\n\n          --title \u003ctitle\u003e\n          Audit record title.\n\n          --content \u003ctext\u003e\n          Audit record content.\n\n          --audit-type \u003ctype\u003e\n          Audit record type. Built-in types: security (default), licence, and architecture; additional types are configurable.\n\n       list\n       List audit records.\n\n       view \u003cid\u003e\n       View an audit record.\n\n       edit \u003cid\u003e\n       Edit an audit record.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          --content \u003ctext\u003e\n          Update the content.\n\n          --audit-type \u003ctype\u003e\n          Set the audit record type.\n\n          --editor\n          Open the audit record content in $VISUAL or $EDITOR.\n\n       deprecate \u003cid\u003e\n       Deprecate an audit record.\n\n       restore \u003cid\u003e\n       Restore a deprecated audit record.\n```"},{"id":"BR-015","title":"Papyrus search Command Behavior","description":"The papyrus search command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → search); behavior not stated there is unspecified.","rationale":"Based on REQ-06.001 — Search Project Records, this rule exists because the documented search behavior is the contract for papyrus search; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus search` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): search — `README.md` lines 692–706\n\n```text\nsearch\n\n       Search tasks, milestones, releases, decisions, and documents in one pass.\n       \n        papyrus search \u003cquery\u003e [--type \u003ctype\u003e]... [--limit \u003cn\u003e]\n        \n        \u003cquery\u003e\n        Free-text search term or phrase. Quote phrases that contain spaces.\n\n        --type \u003ctype\u003e...\n        Repeatable. Restrict to record types: task, milestone, release, decision, or doc. Default: all types.\n\n       --limit \u003cn\u003e\n       Maximum number of results.\n```"},{"id":"BR-016","title":"Papyrus Configuration Keys and Precedence","description":"The papyrus configuration file papyrus.config.yml defines keys and precedence as stated in papyrus-config(5); behavior not stated there is unspecified.","rationale":"Based on REQ-01.002 — Read and Edit Project Configuration and REQ-01.003 — Select Project and Configuration Context, this rule exists because configuration keys and precedence are defined by the manpage; README.md is the sole behavior source.","applicability":"Applies to papyrus configuration files (papyrus.config.yml) and the project data they govern. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus-config(5): DESCRIPTION, PRECEDENCE, and KEYS — `README.md` lines 902–999\n\n```text\nDESCRIPTION\n\n       papyrus.config.yml is a YAML file that controls project paths, ID formats, workflow statuses, document types, and the local web UI.\n\n       The file is read from the project directory (--dir) unless --config or PAPYRUS_CONFIG names another file.\n\nPRECEDENCE\n\n       From highest to lowest:\n\n       1. Command-line options.\n       2. Environment variables (PAPYRUS_DIR, PAPYRUS_CONFIG).\n       3. papyrus.config.yml in the project directory.\n       4. Built-in defaults.\n\nKEYS\n\nGeneral\n\n       project_name\n       Project name. Default: the directory name.\n\n       task_prefix\n       Task ID prefix. Default: TASK.\n\n       milestone_prefix\n       Milestone ID prefix. Default: MS.\n\n       release_prefix\n       Release ID prefix. Default: REL.\n\n        id_padding\n        Positive integer for ID zero-padding width. Default: 3 (for example TASK-001). IDs wider than the padding are not truncated.\n\n       date_format\n       Date format. Default: yyyy-mm-dd.\n\n       editor\n       Editor command. Default: $VISUAL, then $EDITOR.\n\nPaths\n\n       backlog_directory\n       Backlog store. Default: backlog/.\n\n       decision_directory\n       Decision records. Default: decisions/, outside the backlog store.\n\n       doc_directory\n       Active documentation store. Default: docs/.\n\n       Each document type has its own configured directory relative to this path.\n       Deprecated documents are stored in a deprecated/ subfolder within\n       their type directory.\n\nWorkflow\n\n       statuses\n       Ordered task statuses. Default: [\"ToDo\", \"Initiated\", \"Refined\", \"Implemented\", \"Validated\", \"Done\"].\n       Use unique values; default_status must match one of them.\n\n       default_status\n       Status assigned to new tasks. Default: ToDo.\n\nDecisions\n\n       decision_types\n       Decision types and their ID prefixes. Default:\n\n         \n         decision_types:\n           adr: { prefix: ADR, enabled: true }\n           bdr: { prefix: BDR, enabled: true }\n         \n\n         Additional types may be added. A disabled type is rejected by papyrus decision create and hidden from lists and search.\n\nDocuments\n\n       document_types\n       Document type keys, ID prefixes, directories relative to doc_directory,\n       and enabled flags. Deprecated documents are stored in a deprecated/\n       subfolder of each type directory. Default:\n\n       \n       document_types:\n         req:      { prefix: REQ, directory: requirements/business/,       enabled: true }\n         nfr:      { prefix: NFR, directory: requirements/non-functional/, enabled: true }\n         glossary: { prefix: GLO, directory: glossary/,                    enabled: true }\n         rule:     { prefix: RUL, directory: business-rules/,              enabled: true }\n         ui-spec:  { prefix: UI,  directory: specifications/ui/,           enabled: true }\n         audit:    { prefix: AUD, directory: audit-records/,                enabled: true }\n         deploy:   { prefix: DEP, directory: architecture/deployment/,     enabled: true }\n       \n\n       The nfreq command uses the nfr type key. Additional types may\n       be added. Disabled types cannot be created and are hidden from lists and search.\n\n```"},{"id":"BR-017","title":"Papyrus tech-spec Command Behavior","description":"The papyrus tech-spec command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → tech-spec); behavior not stated there is unspecified.","rationale":"Based on REQ-05.009 — Manage Technical Specifications and REQ-05.007 — Manage Documentation Record Lifecycle (and REQ-01.002 — Read and Edit Project Configuration for the document_types.tech-spec key), this rule exists because the documented tech-spec behavior is the contract for papyrus tech-spec; README.md is the sole behavior source (tech-spec entry to be added).","applicability":"Applies to all invocations of `papyrus tech-spec` and the project data they manage. The excerpt below reproduces the relevant command behavior; heading identifies the source location.\n\n### papyrus(1): tech-spec — `README.md` lines (to be added)\n\n```text\ntech-spec\n\n        Manage technical specifications (TECH-...).\n\n        papyrus tech-spec create \u003ctitle\u003e --description \u003ctext\u003e\n        papyrus tech-spec list\n        papyrus tech-spec view \u003cid\u003e\n        papyrus tech-spec edit \u003cid\u003e [--title \u003ctitle\u003e] [--description \u003ctext\u003e] [--editor]\n        papyrus tech-spec deprecate \u003cid\u003e\n        papyrus tech-spec restore \u003cid\u003e\n\n        create\n        Create a technical specification.\n\n           \u003ctitle\u003e\n           Technical specification title (required).\n\n           --description \u003ctext\u003e\n           Description of the technical specification (required).\n\n        list\n        List technical specifications.\n\n        view \u003cid\u003e\n        View a technical specification.\n\n        edit \u003cid\u003e\n        Edit a technical specification.\n\n           --title \u003ctitle\u003e\n           Update the title.\n\n           --description \u003ctext\u003e\n           Update the description.\n\n           --editor\n           Open the document body in $VISUAL or $EDITOR.\n\n        deprecate \u003cid\u003e\n        Move a technical specification to the deprecated folder. Deprecated documents are hidden from lists, search, and the web UI.\n\n        restore \u003cid\u003e\n        Return a deprecated technical specification to its original folder. The ID is preserved.\n```\n\n### IDs, directories, and configuration\n\n- Technical specification IDs use the `TECH` prefix (for example `TECH-001`), padded to the configured `id_padding`, and remain stable across deprecate/restore cycles.\n- Technical specifications are stored under `\u003cdoc_directory\u003e/technical/` (`document_types.tech-spec.directory`); deprecated technical specifications are stored under `\u003cdoc_directory\u003e/technical/deprecated/`.\n- Configuration key: `document_types.tech-spec: { prefix: TECH, directory: technical/, enabled: true }`. A disabled type cannot be created and is hidden from lists and search.\n\n### Sanitization and project-directory boundary\n\n- Technical specifications follow the same input sanitization and project-directory path boundary as other document types."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const listEl = document.getElementById("list");
const detailEl = document.getElementById("detail");
const filterEl = document.getElementById("filter");
const buttons = new Map();

function addField(label, value) {
  const heading = document.createElement("h3");
  heading.textContent = label;
  const text = document.createElement("p");
  text.className = value ? "content" : "content empty";
  text.textContent = value || "—";
  detailEl.append(heading, text);
}

function select(rule) {
  for (const button of buttons.values()) button.classList.remove("active");
  buttons.get(rule.id).classList.add("active");
  detailEl.replaceChildren();
  const id = document.createElement("div");
  id.className = "rid";
  id.textContent = rule.id;
  const title = document.createElement("h2");
  title.textContent = rule.title;
  detailEl.append(id, title);
  addField("Description", rule.description);
  addField("Rationale", rule.rationale);
  addField("Applicability", rule.applicability);
}

for (const rule of DATA.rules) {
  const button = document.createElement("button");
  button.className = "rule";
  button.dataset.search = [rule.id, rule.title, rule.description, rule.rationale, rule.applicability].join(" ").toLowerCase();
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = rule.id;
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = rule.title;
  button.append(badge, label);
  button.addEventListener("click", () => select(rule));
  listEl.appendChild(button);
  buttons.set(rule.id, button);
}
if (!DATA.rules.length) {
  const empty = document.createElement("p");
  empty.className = "empty";
  empty.textContent = "No business rules yet.";
  listEl.appendChild(empty);
}

filterEl.addEventListener("input", () => {
  const query = filterEl.value.trim().toLowerCase();
  for (const button of buttons.values()) button.classList.toggle("hidden", !button.dataset.search.includes(query));
});
document.getElementById("counts").textContent = DATA.rules.length + (DATA.rules.length === 1 ? " business rule" : " business rules");
if (DATA.rules.length) select(DATA.rules[0]);
</script>
</body>
</html>
