[package]
name = "papyrus"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
description = "Project-level backlog and documentation manager."
authors = ["Papyrus Maintainers"]
homepage = "https://github.com/papyrus/papyrus"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml_serde = "0.10"

[profile.release]
lto = true
strip = true

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
