iption`, `story`, `rationale`, `applicability`, `definition`, `view`, `context`, `consequences`, `content`, and the generic document body text. IDs, titles, labels, list cells, metadata rows, and form inputs stay literal — they are identity, not prose, and KaTeX inside a list cell would break the shared list layout (ADR-0028). This ADR adds **no record-body view**: no page renders a raw record body, and a future body view is a separate feature that reuses this pre-pass rather than widening this scope silently.\n\n9. **No new Rust crate, no new build step.** The only new artifacts are vendored browser assets; `Cargo.toml` is untouched. `cargo build` stays the entire build.\n\n10. **Rendering is a display concern only.** No write path, patch, front matter, or search index knows about math. `papyrus search` and `papyrus \u003cslug\u003e view` keep matching and printing the source text."},{"heading":"Consequences","content":"**Positive:**\n\n- REQ-06.017's offline, bundled, single-binary, and graceful-degradation criteria are met with one asset family and no runtime dependency.\n- The CSP keeps `script-src 'self'`, `default-src 'none'`, and no `eval`; the only relaxation is `font-src 'self'`, which cannot execute anything.\n- The fallback is the source text by construction, not by error handling, so a browser without JavaScript and a browser with a broken asset behave identically and acceptably.\n- Restricting the pre-pass to `$`/`$$`/fenced math keeps ADR-0005's \"no Markdown renderer\" decision intact and keeps the served markup auditable.\n\n**Negative:**\n\n- The project takes on a vendored third-party browser asset with its own release cycle, checksums, and licence notices (ADR-0027).\n- KaTeX needs its woff2 fonts, so the \"no web font\" wording used in several existing packaging specifications must be revised (owner: business analyst / tech writer).\n- The `$…$` rule is a heuristic: a record containing a literal dollar amount (`$5 and $10`) will be read as inline math. Escaping with `\\$` is the escape hatch, and the fallback shows the expression rather than hiding it.\n- `strict: 'warn'` writes KaTeX warnings to the browser console on unusual input.\n- The pre-pass touches every prose field in `browser::render` (4.7k lines), which is the largest regression surface of this change.\n\n**Risks and mitigations:**\n\n- *Dollar-sign false positives*: a record with prices renders oddly. Mitigation: require the `$…$` form to open on a non-space and close on a non-space, disallow a newline inside inline math, and document `\\$`; block math (`$$`, fenced) is unambiguous and is the recommended form.\n- *Asset drift or tampering*: the vendored file is committed with a SHA-256 and a licence file, and a test asserts the embedded bytes match the recorded digest.\n- *CSP regression*: one test asserts the exact CSP string per response class; a second asserts KaTeX renders with that CSP in the supported browsers.\n- *Font rendering differences across the three supported browsers*: NFR-05.001 verification must include a math page on Firefox 100+, Edge 130+, and Safari 18+.\n- *Licence uncertainty on the font files*: KaTeX code is MIT and its woff2 fonts are SIL OFL-1.1; the OFL review must complete before acceptance. If it fails, the recorded fallback is MathJax 3 with SVG output (Apache-2.0, no web fonts, no `font-src`), which needs its own ADR because the asset weight and the CSP delta differ."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| KaTeX, vendored, client-side, `font-src 'self'` (this ADR) | Selected | Smallest bundle (≈560 KB), no `eval`, permissive licences, synchronous DOM rendering that keeps the source-text fallback trivial. *Revision 2026-11-16: this row previously read \"no inline style\". KaTeX does emit inline `style` attributes, which `style-src 'self'` drops; the cosmetic deviation is accepted and the CSP is unchanged (decision 6 revision note).* |\n| MathJax 3, vendored, SVG output | Rejected for now | Apache-2.0 and no web fonts (no CSP delta), but ≈1.4–2 MB, slower startup, and its SVG pipeline adds DOM/style behaviour that needs its own review; kept as the licence fallback. |\n| Server-side TeX preprocessing in Rust | Rejected | Excluded by REQ-06.017 (\"rendering happens in the browser only\"), and no TeX engine exists among the four current crates. |\n| Server-side preprocessing in a helper process (TeX Live, `pandoc`) | Rejected | Breaks single-binary packaging (ADR-0002), offline guarantee, and adds an external runtime. |\n| MathJax or KaTeX from a CDN | Rejected | Violates NFR-01.003 and ADR-0005's no-remote-asset rule. |\n| Render math into the stored record at write time (SVG or MathML in the file) | Rejected | Rewrites record content, breaks source-of-truth and the preservation rule (ADR-0013), and duplicates the rendering contract in the CLI. |\n| Full Markdown rendering (headings, lists, emphasis, math) | Rejected | Contradicts ADR-0005 and expands the sanitisation surface far beyond this requirement. |"},{"heading":"Resolved questions (owner, 2026-11-15)","content":"1. **Delimiter set** — decided: `$$...$$` (display), `$...$` (inline, `\\$` escapes a literal dollar), and a fenced block with info string `math`, `tex`, or `latex` (display). `\\(...\\)` and `\\[...\\]` are not recognized.\n2. **Record body** — decided: rendering applies to the curated prose fields of decision 8 only; no full record-body view is added by this ADR.\n3. **Lists and metadata rows** — decided: no math rendering there; structure and identity stay literal (decision 8)."},{"heading":"Downstream constraints","content":"1. No Rust crate is added; math rendering has no server component beyond the delimiter pre-pass.\n2. The pre-pass may not interpret any Markdown construct other than math/diagram delimiters; a diff that adds bold, links, headings, or lists to it is out of contract.\n3. KaTeX receives only escaped attribute values; `trust` stays `false`; no KaTeX option may enable `\\href`/`\\includegraphics`.\n4. `script-src` stays `'self'`; the CSP may add `font-src 'self'` and nothing else on account of this ADR. `style-src` stays `'self'` with no nonce, hash, `'unsafe-hashes'`, or `'unsafe-inline'`; the inline `style` attributes KaTeX emits are dropped and the resulting deviation is accepted (decision 6 revision note).\n5. Math assets are served only on pages that contain math; the binary must not grow by more than the ADR-0027 budget.\n6. The source text is never modified, never re-saved, and never sent to the CLI in rendered form.\n7. Existing packaging-specification wording that forbids web fonts (`docs/specifications/*.md`) must be revised; that update is owned by the business analyst / tech writer, not by this ADR."},{"heading":"Revision notes (2026-11-16, status unchanged)","content":"| Decision | Before | After | Reason |\n|---|---|---|---|\n| 5 — rendering call | `output: 'html'` | `output: 'htmlAndMathml'` | `output: 'html'` emits only `.katex-html`, which KaTeX marks `aria-hidden=\"true\"`, so a rendered formula would be invisible to assistive technology after the source fallback is replaced. MathML costs client-side DOM only; the served payload is unchanged. |\n| 6 — CSP delta | `font-src 'self'` only, inline-style loss noted but not decided | `font-src 'self'` only, and the loss of KaTeX's inline `style` attributes is accepted as the contract | A nonce cannot target `style` attributes, hashes cannot enumerate content-dependent widths, and `'unsafe-inline'` weakens every page for a cosmetic deviation. TASK-146's Mermaid relaxation (ADR-0026 decision 5) addresses an injected `\u003cstyle\u003e` element and is not inherited here. |\n\nConsequences for downstream tickets: TASK-146 keeps ADR-0026 decision 5 and does not follow this style rule; TASK-148 ports both decisions into the browser requirement specifications and the README math wording; TASK-149/TASK-150 verify the accepted spacing/error-colour deviation in Firefox 100+, Edge 130+, and Safari 18+ and record it as expected, not as a defect."},{"heading":"References","content":"- `docs/requirements/business/REQ-06.017.md` — render math and diagrams in the browser.\n- `docs/requirements/business/REQ-06.015.md` — content-width rules that apply to rendered output.\n- `docs/requirements/non-functional/NFR-01.003.md`, `NFR-02.002.md`, `NFR-03.001.md`, `NFR-05.001.md`, `NFR-06.002.md`.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — transport, templates, CSP baseline, no Markdown renderer.\n- `docs/architecture/adr/ADR-0027-vendored-embedded-browser-assets-and-packaging-notices.md` — how vendored assets are embedded, served, and licensed.\n- `docs/architecture/adr/ADR-0028-browser-shell-shared-list-layout-content-width-and-collapsible-navigation.md` — width classes applied to rendered output.\n- `docs/specifications/browser-math-and-diagram-rendering.md` — canonical detail for the pre-pass, client pass (`output`), and CSP delta.\n- Implementation: `src/browser/render.rs` (pre-pass and placeholders), `src/browser/vendor/katex/0.16.11/`, `src/browser/assets.rs` (new), `src/browser/http.rs` (CSP, binary bodies), `src/browser/app.css`."}]},{"id":"ADR-0026","title":"Mermaid-Only Offline Diagram Rendering, PlantUML Out of Scope","status":"Accepted (2026-11-15 owner scope decision; mechanics completed 2026-11-16). The 2026-11-15 decision fixed Mermaid-only scope and the PlantUML exclusion but left four questions open and did not pin a Mermaid version; TASK-146 treated the ADR as `Proposed` and stayed blocked. This amendment resolves every open question, pins Mermaid 11.17.2, and records the executed decision. Owner approval was not available in the 2026-11-16 run: the completion was made under delegated architecture authority and is reported to the owner through the orchestrator.","sections":[{"heading":"Date","content":"2026-11-15; amended 2026-11-16."},{"heading":"Context","content":"REQ-06.017 requires the browser to render diagrams embedded in record content, offline, with bundled assets, in a single binary, under a dependency licence compatible with GPLv3-or-later, without arbitrary script execution, and with graceful degradation. It names \"PlantUML- or Mermaid-style diagrams\" as examples and deliberately leaves the library choice to implementation.\n\nADR-0025 settles math with a vendored KaTeX. Diagram rendering is a different problem: the two named ecosystems have incompatible delivery models.\n\n- **Mermaid** is a JavaScript library (MIT). A pre-built classic-script bundle, `mermaid.min.js`, renders into the current document. Version 11.17.2's file is 3,572,661 bytes; version 12.3.0's is 5,537,838 bytes.\n- **PlantUML** is a Java program (GPL-3.0). Rendering requires `plantuml.jar` and a JVM (a second runtime, a second process, and ~50 MB of JVM plus jar), or a running PlantUML HTTP service (a network dependency). The available JavaScript package, `plantuml-encoder`, only deflates and encodes source into a URL or image path; it does not render. PlantUML's `!include` directive reads local files, which is a second filesystem surface in a page renderer.\n\nForces: ADR-0002/ADR-0003 ship one `.deb` containing `/usr/bin/papyrus`; ADR-0005 forbids dependencies, external servers, and remote assets; NFR-01.003 forbids network use; NFR-03.001 fixes a Rust single binary; NFR-02.002 requires sanitisation; NFR-05.001 sets Firefox 100, Edge 130, and Safari 18 as the browser floor; REQ-06.015 lets diagram content use the full window width.\n\nVersion choice is part of the decision, not an implementation detail:\n\n- **11.17.2 is the last 11.x release** (published 2026-08-25). It is a classic IIFE bundle that assigns `globalThis.mermaid`, has no `import`/`export`, no dynamic import, and no reachable `eval`/`new Function` (its only `Function(...)` constructor calls are the lodash global fallbacks, short-circuited by `self` in a browser). The advisory batches through 2026-08-06 — configuration prototype pollution, CSS injection into sibling elements, architecture-diagram prototype pollution, and radar/XY/gantt DoS — are all fixed by 11.16.1, so no open advisory affects 11.17.2.\n- **12.3.0 is the current `latest`** (published 2026-11-03) but is a breaking release: it declares an ES2024 baseline, a Safari 17.4+ floor, and ELK as the bundled default layout with a new default theme. ES2024 syntax is not supported by Firefox 100, which NFR-05.001 still requires; adopting 12.x would require an NFR-05.001 change, not an implementation choice. It is also 1,965,177 bytes larger and changes how existing diagrams look.\n\nMermaid's renderer injects a `\u003cstyle\u003e` element into the SVG it produces, which collides with the current `style-src 'self'` policy. A Firefox 153esr probe against the exact CSP confirmed the consequence: with `style-src 'self'` the SVG renders as an unreadable black box; with `style-src 'self' 'unsafe-inline'` the neutral theme renders correctly. The relaxation is therefore required, not cosmetic.\n\nMermaid quality also matters: it is JS code executing in the same origin as the write API, so its sanitisation and input limits are part of the security model, not a detail.\n\nThe current release binary is 4,730,296 bytes (KaTeX and its fonts already embedded). The projected binary with Mermaid 11.17.2 is 8,302,957 bytes before the small Rust/client additions."},{"heading":"Decision","content":"1. **Diagram syntax support is Mermaid only.** The accepted fence info string is exactly `mermaid` (case-sensitive, trailing whitespace trimmed, zero to three leading spaces, at least three backticks or tildes, same opener/closer rules as the math fence in `docs/specifications/browser-math-and-diagram-rendering.md` §3.4). The `mmd` alias is **dropped**: REQ-06.017 names only `mermaid`, the alias is an unrequested extension, and it would double the fence-recognition and test surface. An `mmd` fence stays literal text.\n\n   - `plantuml` and `puml` fences are PlantUML fences and render as source with a visible note (decision 2). `uml`, `dot`, `graphviz`, and every other unknown fence remain literal text exactly as today, fence lines included, never an error, never silently dropped.\n   - An empty or whitespace-only `mermaid` fence is literal text (fences included), not a figure and not an error.\n\n2. **PlantUML is excluded from the product scope, not deferred silently.** A `plantuml` or `puml` fence renders as a static block:\n\n   ```html\n   \u003cfigure class=\"diagram diagram--unsupported\" data-diagram=\"plantuml\"\u003e\n     \u003cpre\u003eescaped source\u003c/pre\u003e\n     \u003cfigcaption class=\"render-note\"\u003ePlantUML diagrams are not supported in this release; showing source.\u003c/figcaption\u003e\n   \u003c/figure\u003e\n   ```\n\n   The block is server-rendered; it never links the Mermaid bundle and never relaxes the CSP. `dot`, `graphviz`, and `uml` are not PlantUML and get no note.\n\n   Reasons, in order of force: a JVM and `plantuml.jar` cannot be shipped inside a Rust binary (NFR-03.001, ADR-0002); a PlantUML service is a network dependency (NFR-01.003); `plantuml-encoder` does not render; and PlantUML's file-include semantics would add a filesystem surface to the renderer. REQ-06.017's wording is permissive (\"for example … PlantUML- or Mermaid-style\"), so this is a scope decision, not a requirement gap.\n\n3. **Server-side work is the same delimiter pre-pass as ADR-0025, extended with one fence shape.** A `mermaid` fence becomes:\n\n   ```html\n   \u003cfigure class=\"diagram bleed\" data-diagram=\"mermaid\"\u003e\n     \u003cdiv class=\"diagram-scroll\"\u003e\u003cpre\u003eescaped source\u003c/pre\u003e\u003c/div\u003e\n   \u003c/figure\u003e\n   ```\n\n   - The content between the fences is taken with one trailing line break removed and trimmed of leading and trailing whitespace, then escaped with `render::escape`; newlines are preserved. The `\u003cpre\u003e` is both the no-JavaScript fallback and the source of truth for the client. Mermaid receives `pre.textContent`, which restores the escaped characters exactly.\n   - A diagram fence is a block segment, like display math: it is never nested inside a `\u003cp\u003e`; a surrounding paragraph is split around it. A field with no diagram keeps byte-identical output.\n   - `Prose` gains `has_diagram`, true only when at least one `mermaid` figure is under the input caps and therefore renderable. `has_diagram` controls both the bundle link and the CSP variant; a page with only an over-limit or PlantUML block gets neither.\n   - Nothing about Mermaid syntax is parsed on the server. The server counts bytes and lines only; the edge cap is enforced by Mermaid (decision 7).\n\n4. **Pinned asset: Mermaid 11.17.2, one file.**\n\n   - Upstream: `https://registry.npmjs.org/mermaid/-/mermaid-11.17.2.tgz`, published 2026-08-25T11:52:39Z, MIT.\n   - Vendored file: `src/browser/vendor/mermaid/11.17.2/mermaid.min.js`, 3,572,661 bytes, SHA-256 `581ed7d74bd9048d0e3a91363927d72ef22942d7722546b27f7cc29e35390eb8`.\n   - Served path: `/assets/mermaid/mermaid.min.js`, `Content-Type: text/javascript; charset=utf-8`, through the ADR-0027 asset table with a `MANIFEST.md` row, a `LICENSE`, and an `UPSTREAM.md`. No `.map`, no CSS, no icon pack, no second file is vendored.\n   - The file is a classic IIFE script, loaded as `\u003cscript src=\"/assets/mermaid/mermaid.min.js\" defer\u003e\u003c/script\u003e`. No module loading, no dynamic `import()`, no `fetch`. It assigns `globalThis.mermaid`.\n   - Load order on a page: KaTeX stylesheet, KaTeX script, Mermaid script, then `app.js`, all deferred, so both globals exist before the client passes run.\n   - The bundle is linked only on pages whose pre-pass found at least one renderable `mermaid` figure. `no-store` is unchanged (ADR-0027 decision 8), so a diagram page re-sends the 3.4 MiB bundle on each navigation; accepted for a loopback single-user interface.\n\n5. **Client contract.**\n\n   ```js\n   mermaid.initialize({\n     startOnLoad: false,\n     securityLevel: 'strict',\n     htmlLabels: false,\n     theme: 'neutral',\n     fontFamily: 'system-ui, sans-serif',\n     flowchart: { htmlLabels: false },\n     maxTextSize: 100000,\n     maxEdges: 500\n   });\n   ```\n\n   - For each `figure[data-diagram=\"mermaid\"]:not([data-render-error])`, read the source from its `\u003cpre\u003e`, then call `mermaid.render(id, source)` with a deterministic, page-unique id derived from the record id and the figure index and sanitised to `[A-Za-z0-9_-]`.\n   - On success, replace the `\u003cpre\u003e` with the returned SVG inside `.diagram-scroll`. Never call the returned `bindFunctions`: no click, link, or tooltip binding is installed.\n   - **Supported diagram types for this release:** `flowchart` (including `graph`), `sequence`, `class`, `state`, `ER`, `gantt`, `pie`, `journey`, and `gitGraph`. These are the types covered by fixtures and by TASK-150. No allowlist is enforced: another Mermaid type that 11.17.2 can parse is rendered on a best-effort basis and is not a promised capability. A type the pinned bundle cannot detect or parse — including `flowchart-elk`, whose ELK layout package is not vendored — fails through the standard failure contract below.\n   - **Failure contract:** on any thrown error, the `\u003cpre\u003e` stays in place, the figure gains `data-render-error=\"diagram\"`, and one `\u003cfigcaption class=\"render-note\"\u003e` line is appended: `Diagram not rendered: Mermaid rejected the source.` Each figure is rendered in its own `try`/`catch`; one failure does not abort the page or any other figure. If `window.mermaid` is missing (asset blocked or failed), every figure gets `data-render-error=\"diagram\"` and the note `Diagram not rendered: the diagram script did not load.` and no content is removed.\n   - No `fetch`, dynamic `import()`, `MutationObserver`, second pass, storage write, or DOM state beyond `data-render-error` is added. No click binding, no `markdownAutoWrap` change, no `layout: 'elk'`.\n\n6. **CSP: `style-src 'self' 'unsafe-inline'` is granted only on diagram pages; `script-src 'self'` is unchanged everywhere.**\n\n   The server emits exactly two HTML CSP strings:\n\n   - Strict (every HTML response without a renderable diagram, including math-only record views, edit pages, lists, the board, and error pages):\n\n     ```\n     default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'\n     ```\n\n   - Diagram (only an HTML response whose pre-pass set `has_diagram`):\n\n     ```\n     default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'\n     ```\n\n   Asset responses keep no CSP header. The two strings differ in exactly one token; `script-src` never contains `'unsafe-inline'`, `'unsafe-eval'`, a nonce, or a hash.\n\n   Reasoning:\n\n   - `script-src 'self'` remains, so no inline script, `eval`, `Function`, or remote script can execute. Mermaid's only `Function(\"return this\")` is unreachable in a browser (the lodash `self` branch wins), and the Firefox probe confirmed the bundle initialises and renders under this policy.\n   - `default-src 'none'` remains, so the rendered SVG cannot fetch anything. `img-src 'self'` and `font-src 'self'` are unchanged.\n   - Mermaid's injected `\u003cstyle\u003e` element is inside the SVG and is blocked without `'unsafe-inline'`; the probe showed the result is an unreadable black diagram, not a merely unstyled one. A nonce cannot help because Mermaid sets no nonce, and hashes cannot enumerate dynamic theme CSS. Patching the vendored file is forbidden by ADR-0027 decision 3.\n   - The relaxation is confined to the response class that already links a 3.4 MiB third-party renderer. Math-only and diagram-free pages keep the strict policy.\n   - Residual risk is CSS-only: a hostile record that gets CSS through Mermaid could restyle or occlude the diagram page. It cannot execute script, cannot read files, and cannot reach the network: `default-src 'none'` blocks remote `@import`/`url()`, and `img-src`/`font-src` allow only same-origin asset paths. No supported browser executes CSS as script.\n   - Tests assert the literal strict string for a math-only record view, a no-math record view, a list, an edit page, and an error page; the literal diagram string for a record view with a Mermaid figure; no CSP on assets; and the absence of `unsafe-inline` in every `script-src`.\n\n7. **Input caps are fixed constants and part of the contract.**\n\n   - Server pre-pass, per fence: **100,000 UTF-8 bytes** and **1,000 lines**. Counting stops at the cap. Over-limit input is not handed to Mermaid: the server emits the same figure shape, carries `data-render-error=\"diagram\"`, keeps the full source in the `\u003cpre\u003e`, and adds `Diagram not rendered: source exceeds the 100,000-byte or 1,000-line limit.` The client skips any figure with `data-render-error`.\n   - Client: `maxTextSize: 100000` (characters) and `maxEdges: 500`. Mermaid's flowchart parser throws `Edge limit exceeded` above 500 edges; `render()` rejects; the per-figure catch applies the failure contract. The server does **not** count edges, because counting them would require parsing Mermaid syntax on the server, which decision 3 and ADR-0025 forbid.\n   - The caps are not configurable in this release: no configuration key, no environment variable, no per-record override. A record is user input (NFR-02.002), and a pathological diagram must not hang the browser thread or exhaust memory; changing a constant requires a new ADR.\n\n8. **The sandboxed-iframe fallback is rejected.** An opaque-origin `sandbox=\"allow-scripts\"` document cannot load `/assets/mermaid.min.js`: the request is cross-origin from an opaque origin and the asset server sends no CORS headers. Adding `allow-same-origin` removes the isolation that motivated the iframe. The only remaining variant inlines the 3.4 MiB bundle into the child document, which needs `script-src 'unsafe-inline'` inside the frame — a larger relaxation than the scoped `style-src` grant — plus height messaging, print, full-width, focus, and accessibility machinery. The scoped style grant contains the risk with less complexity, so the fallback is not adopted. A future proposal to revisit it needs its own ADR.\n\n9. **No new Rust crate, no JVM, no service, no network.** Mermaid is a browser asset under ADR-0027; `Cargo.toml` is unchanged.\n\n10. **Diagram output obeys the width contract.** A rendered diagram is a full-width-eligible region (ADR-0028): the `\u003cfigure\u003e` carries the `bleed` class and a `.diagram-scroll` container with `overflow-x: auto`, so a wide diagram scrolls inside the figure instead of forcing page-wide horizontal scroll. The PlantUML source block is not a rendered visualization and stays within the normal text measure.\n\n11. **Rendering is browser-only.** CLI output, `--json`, search, and the record files keep the source text. Nothing about a diagram is stored, cached, pre-rendered, or written back.\n\n12. **Binary budget: the 12 MiB ceiling in ADR-0027 decision 6 is unchanged.** The projected binary is 4,730,296 + 3,572,661 = 8,302,957 bytes (7.92 MiB) before the small Rust and `app.js` additions, leaving 4,279,955 bytes (4.08 MiB) of headroom. The compressed `.deb` estimate rises by roughly 0.75–0.98 MB; no package-size budget exists."},{"heading":"Threat model","content":"A record author controls the diagram source, and Mermaid parses it client-side and builds SVG/DOM in the same origin as the unauthenticated loopback write API, so a Mermaid defect is a same-origin defect; the assets are the record corpus and the write API, not a remote account. Containment is layered and type-independent: `securityLevel: 'strict'` keeps Mermaid's DOMPurify sanitisation and disables click handling, `htmlLabels: false` removes the HTML-label injection path, the client never calls `bindFunctions` so no click or link binding is installed, the byte/line caps and `maxEdges` bound CPU and memory, `script-src 'self'` prevents inline, `eval`, or remote script, `default-src 'none'` prevents network fetches, `img-src`/`font-src 'self'` limit subresources to embedded assets, and the only style relaxation (`style-src 'self' 'unsafe-inline'`) is scoped to pages that already load the diagram bundle, so a CSS-only injection can restyle or occlude a diagram page but cannot execute script or exfiltrate data. Residual risk is a Mermaid CVE or a CSS-injection variant; the pinned version, the manifest digest, the advisory review, and the hostile-fixture tests are the controls."},{"heading":"Consequences","content":"**Positive:**\n\n- One diagram ecosystem, one asset, one sanitisation story, and one set of limits; the security review has a single target.\n- The single-binary, offline, and packaging constraints hold without a second runtime.\n- The source-text fallback means a broken diagram never costs the reader the diagram source.\n- The CSP relaxation is scoped to diagram pages; math-only and diagram-free pages keep the strict policy, which is stronger than a site-wide grant.\n- Excluding PlantUML is an explicit, documented scope decision rather than an accidental capability gap.\n- Pinning the last 11.x keeps Firefox 100 support and avoids the 12.x ES2024 floor and default-layout change.\n\n**Negative:**\n\n- Authors who write PlantUML must convert to Mermaid or accept source-only display. This is a visible product limitation relative to the customer's phrasing.\n- The vendored bundle is 3.4 MiB — by far the largest single asset in the project. A diagram page transfers it on every navigation because `no-store` is retained.\n- `style-src 'unsafe-inline'` weakens the strongest CSP directive pair on diagram pages. The mitigation is that `script-src` is untouched and the relaxation never reaches a page without a diagram, but a reviewer must accept the change consciously.\n- Mermaid's own vulnerabilities become Papyrus vulnerabilities: a Mermaid CVE is a Papyrus CVE until the asset is updated. ADR-0027's pin, manifest digest, and update procedure are the control; 11.17.2 is clear of the known 2026 advisories.\n- Only nine diagram types are promised. Other Mermaid types are best-effort; a type needing an unvendored layout (for example `flowchart-elk`) falls back to source.\n- Diagram rendering is a client-side CPU cost on a page load; a large diagram is visibly slow on first paint.\n\n**Risks and mitigations:**\n\n- *XSS through Mermaid output*: `securityLevel: 'strict'`, `htmlLabels: false`, no click bindings, no `bindFunctions`, input caps, and a CSP that forbids remote content. A regression test renders hostile fixtures (`\u003cimg src=x onerror=…\u003e`, a `classDef` payload, a `javascript:` link) and asserts no script node, no event-handler attribute, and no `javascript:` URL survives. The Firefox probe showed an `\u003cimg onerror\u003e` label rendered as literal text under `securityLevel: 'strict'` and `htmlLabels: false`.\n- *CSS injection on a diagram page*: accepted residual risk, bounded to restyling or occlusion. `default-src 'none'` blocks remote fetches, and no script path opens.\n- *Bundle drift and CVEs*: pinned version, recorded SHA-256, licence file, and a documented review step on each Mermaid security advisory.\n- *Diagram hangs the page*: byte and line caps plus Mermaid's `maxEdges`, per-figure `try`/`catch`; the rest of the page stays interactive.\n- *CSP accepted too broadly*: two literal strings, asserted per response class; `unsafe-inline` appears only in the diagram `style-src`, never in `script-src`.\n- *Full-width diagram forces page-level horizontal scroll*: every diagram is wrapped in an `overflow-x: auto` container and a test asserts `document.scrollWidth == clientWidth` on a wide-diagram page.\n- *Mermaid 12.x drift*: the manifest pins 11.17.2; an update to 12.x is an NFR-05.001 browser-floor decision and needs a new ADR."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Mermaid 11.17.2 vendored, client-side, scoped `style-src 'unsafe-inline'` (this ADR) | Selected | Only option that renders the requested diagram class offline, in one binary, without a second runtime, while keeping Firefox 100 support. |\n| Mermaid 12.3.0 vendored | Rejected | 5,537,838 B (+1,965,177 B), ES2024 baseline and Safari 17.4+ floor incompatible with NFR-05.001's Firefox 100, and a breaking default-layout/theme change. |\n| Mermaid rendered inside a sandboxed opaque-origin iframe with its own CSP | Rejected | An opaque origin cannot load the same-origin bundle without CORS, `allow-same-origin` defeats the isolation, and inlining the bundle requires `script-src 'unsafe-inline'` in the frame plus height/print/full-width complexity. |\n| PlantUML via `plantuml.jar` + JVM | Rejected | Second runtime and process; breaks single-binary packaging (NFR-03.001, ADR-0002). |\n| PlantUML via a local or remote PlantUML server | Rejected | Network or a background service; violates NFR-01.003 and ADR-0005's no-external-server rule. |\n| `plantuml-encoder` in the browser + an image endpoint | Rejected | The encoder does not render; it produces a URL for a renderer that does not exist offline. |\n| Graphviz / `viz.js` (WASM) | Rejected | 2–3 MB WASM plus `script-src 'wasm-unsafe-eval'` and a wasm loader; its syntax is not PlantUML or Mermaid, so it satisfies neither named example. |\n| Server-side rendering to SVG at record save time | Rejected | REQ-06.017 requires browser-side rendering and source preservation; it would rewrite records or store derived artifacts, both forbidden by ADR-0013. |\n| Mermaid syntax subset re-implemented in Rust → inline SVG | Rejected | A diagram layout engine is a large, permanent in-project liability; it would also contradict \"no server-side rendering\". |\n| Diagrams deferred to a later release (math only) | Rejected | REQ-06.017 has an explicit acceptance criterion for diagrams; deferral is a requirement change, not an implementation choice. |"},{"heading":"Open Questions","content":"All resolved. No open question remains for this ADR.\n\n1. ~~Confirm PlantUML exclusion~~ — resolved by owner decision 2026-11-15: Mermaid-only in this release; a `plantuml`/`puml` fence displays as source with a note (decision 2).\n2. ~~Accept `style-src 'self' 'unsafe-inline'`, or require the sandboxed-iframe fallback?~~ — resolved 2026-11-16: accept, scoped to HTML responses that link the diagram bundle; the sandboxed-iframe fallback is rejected (decisions 6 and 8).\n3. ~~Which Mermaid diagram types are in the supported set?~~ — resolved 2026-11-16: flowchart, sequence, class, state, ER, gantt, pie, journey, gitGraph are promised and tested; other types are best-effort, and unparseable types fall back through the failure contract (decision 5).\n4. ~~Should the input caps be configurable?~~ — resolved 2026-11-16: fixed constants, no configuration key (decision 7).\n5. ~~Which Mermaid version?~~ — resolved 2026-11-16: 11.17.2, the last 11.x, for Firefox 100 compatibility, size, and advisory status (decision 4).\n6. ~~Keep the `mmd` alias?~~ — resolved 2026-11-16: no; only `mermaid` is accepted (decision 1).\n7. ~~Adopt the sandboxed-iframe fallback?~~ — resolved 2026-11-16: no (decision 8)."},{"heading":"Revision notes (2026-11-16, status completed)","content":"| Decision | Before | After | Reason |\n|---|---|---|---|\n| Status | `Accepted` claimed on 2026-11-15 while four questions were open | Completed 2026-11-16; every open question resolved | TASK-146 could not start against an incomplete acceptance. |\n| 1 — fence set | `mermaid` and `mmd` | `mermaid` only | REQ-06.017 names only `mermaid`; the alias is an unrequested extension. |\n| 2 — PlantUML | `.puml`/`plantuml` note, `dot`/`graphviz` ambiguous | `plantuml`/`puml` source block with note; `uml`/`dot`/`graphviz` literal text | Aligns with the requirement's single named `plantuml` fence and removes ambiguity. |\n| 4 — version and asset | \"Mermaid 11.x\", 3.4 MiB | 11.17.2, one file, 3,572,661 B, SHA-256 recorded | 11.x was not a pin; 12.x breaks Firefox 100 and adds 1.97 MB. |\n| 5 — client | `mermaid.render()` only; type set unspecified | nine promised types, no allowlist, explicit failure contract, no `bindFunctions` | Makes the promise testable and the fallback deterministic. |\n| 6 — CSP | site-wide `style-src 'unsafe-inline'` implied | only HTML responses with a renderable diagram | Keeps math-only and diagram-free pages on the strict policy. |\n| 7 — caps | 100 KB / 1,000 lines / 500 edges enforced by \"the pre-pass\" | 100 KB / 1,000 lines server-side; 500 edges client-side via `maxEdges` | The server must not parse Mermaid syntax (decision 3, ADR-0025). |\n| 8 — iframe | recorded fallback if `unsafe-inline` refused | rejected | Opaque-origin/CORS and inline-bundle costs outweigh the scoped style grant. |"},{"heading":"Downstream constraints","content":"1. **TASK-146 (implementation).** Use `mermaid` only; no `mmd`. Emit the exact figure shapes of decisions 1–3; keep the `\u003cpre\u003e` until a successful render; enforce the 100,000-byte and 1,000-line caps server-side and `maxEdges: 500` client-side; do not parse Mermaid on the server; do not call `bindFunctions`; link the bundle only on `has_diagram` pages; use the two literal CSP strings of decision 6 and apply the diagram string only to `has_diagram` responses.\n2. **TASK-148 (specifications).** Record the diagram fence set (`mermaid` only; `plantuml`/`puml` note; other fences literal), the supported type list, the two CSP strings and their response classes, the caps, the failure contract, and the 11.17.2 pin. Do not describe a site-wide `style-src` relaxation or an `mmd` alias.\n3. **TASK-149 (packaging and budget).** The 12 MiB ceiling is unchanged; no threshold adjustment. TASK-149 runs before TASK-146 and can only measure the KaTeX-only binary, so it records that measurement and the 4.0 MiB projected headroom; the final post-Mermaid binary size is measured by TASK-150. If a single final measurement is preferred, TASK-146 must be added as a dependency (planner decision, not this ADR).\n4. **TASK-150 (verification).** Verify the nine supported types, the `plantuml` note, the `mmd`/literal fence behaviour, an unknown-type fallback, per-figure isolation, the hostile fixtures, both CSP strings per response class, the absence of `unsafe-inline` in `script-src`, the bundle-only-on-diagram-pages rule, the final binary size, and the offline behaviour in Firefox 100+, Edge 130+, and Safari 18+.\n5. **Asset and notice.** The Mermaid file, `LICENSE`, `UPSTREAM.md`, `MANIFEST.md` row, digest test, and the MIT section of the package `copyright` are mandatory before the asset ships (ADR-0027).\n6. **No JVM, no `plantuml.jar`, no rendering service, no network call** exists in any code path; a grep test asserts no `plantuml`/`java` invocation.\n7. **`script-src` stays `'self'`**; `'unsafe-inline'` may appear only in the diagram response's `style-src`. A change to that grant, to `securityLevel`, to `htmlLabels`, or to a cap requires a new ADR.\n8. **Mermaid 12.x is out of scope** until NFR-05.001's Firefox floor is revisited; an asset update to 12.x needs a new ADR, not a manifest edit.\n9. **Every rendered figure keeps its source `\u003cpre\u003e` until a successful replacement**, and a failure restores/keeps the source and marks the figure.\n10. **Diagram source is never parsed, rewritten, or persisted by the server.**\n11. **The 12 MiB binary budget** (ADR-0027 decision 6) remains the release gate; the projected 7.92 MiB leaves 4.08 MiB of headroom."},{"heading":"References","content":"- `docs/requirements/business/REQ-06.017.md` — diagrams in the browser.\n- `docs/requirements/business/REQ-06.015.md` — full-width diagram content.\n- `docs/requirements/non-functional/NFR-01.003.md`, `NFR-02.002.md`, `NFR-03.001.md`, `NFR-05.001.md`, `NFR-06.002.md`.\n- `docs/specifications/browser-math-and-diagram-rendering.md` — the shared pre-pass, fallback contract, and CSP baseline.\n- `docs/architecture/adr/ADR-0002-distribution-format-amd64-deb-packages.md`, `ADR-0003-supported-debian-release-target-forky-only.md` — one binary per package.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — dependency-free server, CSP baseline.\n- `docs/architecture/adr/ADR-0025-bundled-katex-client-side-math-rendering.md` — the shared delimiter pre-pass and the fallback contract.\n- `docs/architecture/adr/ADR-0027-vendored-embedded-browser-assets-and-packaging-notices.md` — asset embedding, checksums, licence notices, 12 MiB budget.\n- `docs/architecture/adr/ADR-0028-browser-shell-shared-list-layout-content-width-and-collapsible-navigation.md` — width classes.\n- Mermaid 11.17.2: `https://registry.npmjs.org/mermaid/-/mermaid-11.17.2.tgz`; advisory batches fixed by 11.16.1 (GHSA-c4c3-pg64-4m4v, GHSA-6x64-9x62-f2gx, GHSA-3rrr-jr9j-h3q3, GHSA-2v8p-3f2j-5mp7, GHSA-rhh3-jpg6-66xh, GHSA-6m6c-36f7-fhxh).\n- Implementation: `src/browser/render.rs`, `src/browser/math.rs`, `src/browser/vendor/mermaid/11.17.2/mermaid.min.js`, `src/browser/assets.rs`, `src/browser/http.rs`, `src/browser/app.js`, `src/browser/app.css`."}]},{"id":"ADR-0027","title":"Vendored Embedded Browser Assets and Packaging Notices","status":"Accepted (2026-11-15) — owner decision 2026-11-15: vendored, digest-verified browser assets ship embedded in the single binary with a consolidated `copyright` notice file.","sections":[{"heading":"Date","content":"2026-11-15"},{"heading":"Context","content":"ADR-0025 and ADR-0026 require third-party browser assets (KaTeX with its font files, Mermaid) inside the single binary that ADR-0002/ADR-0003 package as a `.deb`. The current asset model does not cover them:\n\n- `src/browser/mod.rs` embeds exactly two assets (`include_str!(\"app.css\")`, `include_str!(\"app.js\")`) and serves them from two hard-coded `if path == \"/assets/app.css\"` blocks.\n- `browser::http::Response::text` only carries `\u0026str`; there is no binary body and no font MIME type.\n- ADR-0005 permits embedded assets and forbids remote ones, forbids compression, and fixes `Cache-Control: no-store`.\n- The package contains exactly three entries under `usr/share/doc/papyrus/`: the `copyright` file. `scripts/build-deb.sh` copies one copyright file and one control file.\n- Several existing packaging specifications and tests assert that **no** served CSS contains `url(`, and that no page references a web font. KaTeX CSS contains 60 `url(fonts/…)` references and 20 `@font-face` blocks, so those criteria must change.\n\nForces: single binary and no runtime asset directory (ADR-0002, ADR-0005); no new Rust crate and no Node/npm build step (ADR-0001, ADR-0004); offline determinism; GPLv3-or-later compatibility for every bundled licence (NFR-06.002, NFR-06.001); an auditable supply chain for files that become Papyrus bugs when they become Papyrus CVEs; and Debian's requirement that `usr/share/doc/\u003cpkg\u003e/copyright` carry every licence and copyright notice of the distributed files.\n\nThe total new weight is ≈4.0 MiB (Mermaid 3,572,661 B; KaTeX 275,414 B + 23,335 B + ≈259,792 B of woff2). The current binary is 4,197,544 B."},{"heading":"Decision","content":"1. **One static asset table, exact-match routing, binary-safe bodies.** A new module `src/browser/assets.rs` exposes:\n\n   ```rust\n   pub struct Asset {\n       pub path: \u0026'static str,       // \"/assets/katex/katex.min.css\"\n       pub mime: \u0026'static str,       // \"text/css; charset=utf-8\"\n       pub bytes: \u0026'static [u8],     // include_bytes! / include_str!.as_bytes()\n   }\n   pub static ASSETS: \u0026[Asset] = \u0026[ /* … */ ];\n   pub fn lookup(path: \u0026str) -\u003e Option\u003c\u0026'static Asset\u003e;\n   ```\n\n   `browser::http` gains `Response::bytes(status, content_type, \u0026'static [u8])`. `lookup` is a linear scan over exact strings; a miss is `404` for every method, a hit with a method other than `GET`/`HEAD` is `405` (ADR-0005 semantics preserved). `HEAD` sends `Content-Length` and no body. No prefix matching, no directory expansion, no path join, no percent-decoded filesystem access.\n\n2. **Vendored assets are committed upstream artifacts, not build products.** Layout: `src/browser/vendor/\u003cpackage\u003e/\u003cversion\u003e/` containing the unmodified upstream files, `LICENSE`, and `UPSTREAM.md` (package, version, upstream URL, retrieval date). Redirect/registry URLs are recorded, not fetched at build time. Consequence: `cargo build` remains the entire build and a checkout builds identically offline.\n\n3. **No vendoring patches by default.** Files are served byte-identical to upstream so a recorded digest is meaningful; the KaTeX font references work unmodified because `/assets/katex/katex.min.css` resolves `fonts/…` to `/assets/katex/fonts/…`. If a future asset genuinely needs a patch, the patch is a documented `.patch` file next to the asset and the digest is recorded **after** patching, with the patch listed in the notice.\n\n4. **Integrity and update procedure.** `src/browser/vendor/MANIFEST.md` lists, per asset: package, version, licence, upstream URL, byte size, and SHA-256. A unit test recomputes the digest of every embedded asset and fails on a mismatch. Updating an asset is a task that updates the version directory, the manifest, the notices, and re-runs the browser test suite. There is no automatic updater, no lockfile fetch, and no network in the build.\n\n5. **Licence notices ship in the package.** `packaging/deb/usr/share/doc/papyrus/copyright` gains one section per bundled asset (name, version, licence identifier, full licence text or a `debian/copyright`-style reference to the on-disk text), in addition to the existing Papyrus GPL-3.0-or-later statement. The package keeps exactly one documentation file so `scripts/build-deb.sh` and the packaging verification tests keep their shape. The licence inventory is a release gate: an asset whose licence cannot be shown compatible with GPLv3-or-later (NFR-06.002) does not ship.\n\n   Current inventory to be recorded: KaTeX 0.16.11 — code MIT, fonts SIL OFL-1.1; Mermaid 11.x — MIT.\n\n6. **Weight budget and load discipline.** The release check asserts the release binary stays within **12 MiB** (current 4.2 MiB + ≈4.0 MiB of assets + headroom). Assets are emitted only on pages that need them: KaTeX CSS/JS/fonts only where math was found, Mermaid only where a Mermaid fence was found. No asset is referenced from a page that does not use it.\n\n7. **ADR-0005's asset clause is amended, not replaced.** The transport, routing, templating, escaping, and security model of ADR-0005 remain in force. This ADR supersedes only these parts of it: \"Embed CSS and JavaScript with `include_str!`\" widens to the binary-safe asset table; \"no web font\" widens to bundled same-origin fonts; \"the `.deb` contains only `/usr/bin/papyrus` and the copyright file\" stays true but the copyright file now carries third-party sections. On acceptance, ADR-0005's Status line gains an amendment note pointing here; its frozen body is not edited.\n\n8. **`Cache-Control: no-store` is retained.** No new cache semantics, no `ETag`, no compression, no range requests. A page with diagrams therefore re-sends the Mermaid bundle on each navigation. This is accepted for a loopback single-user interface; serving vendor assets with a long-lived cache is a separate decision and would need its own ADR because it changes ADR-0005's header contract.\n\n9. **No source maps, no minified references to remote origins.** `.map` files are not embedded. A test asserts that no served asset is referenced from a page outside `/assets/`, that no served CSS contains `@import`, and that the only `url(` values in served CSS are same-origin font paths.\n\n10. **Existing offline-reference tests are retargeted, not deleted.** The `t24/t40l/t25l/t26k/t57k/t81l`-style \"no `url(`, no web font\" assertions scanned `app.css`; they keep scanning `app.css` and gain a sibling assertion that every `url(` in every served stylesheet resolves to an entry of the asset table."},{"heading":"Consequences","content":"**Positive:**\n\n- One mechanism replaces two hard-coded asset routes, and adding an asset stops being a code change in the router.\n- Binary bodies, fonts, and MIME types are supported without a dependency or a static-file server.\n- The supply chain is explicit: versioned directories, upstream URLs, digests, licences, and a documented update task.\n- The `.deb` stays a two-file package with one copyright document that satisfies Debian's notice requirement.\n- The build stays `cargo build`, offline and deterministic.\n\n**Negative:**\n\n- ≈4.0 MiB is embedded unconditionally in the binary even though most pages use none of it; only the *transfer* is conditional. The binary grows to ≈8.2 MiB and the `.deb` to ≈2.8 MiB.\n- Vendored pre-built JavaScript cannot be reviewed line by line by this project; trust rests on the upstream project, the pinned version, and the digest.\n- Every asset update is a manual, multi-file task (version directory, manifest, notices, tests).\n- `no-store` on a 3.4 MiB bundle is a real user-visible cost on diagram-heavy navigation.\n- The notice file becomes the place where a licence mistake ships to users; it needs review, not just editing.\n\n**Risks and mitigations:**\n\n- *Digest drift or a silently edited vendored file*: the manifest digest test fails the build.\n- *A bundled licence is incompatible or a notice is missing*: the release gate blocks; the inventory is short (two packages) and reviewed per update.\n- *Package-content test breaks*: the packaging test asserts the two-file docs set explicitly and is updated in the same change as `build-deb.sh`.\n- *Binary size regression*: 12 MiB budget asserted in the release check.\n- *A vendored bundle references a remote origin and is only caught in production*: CSP `default-src 'none'` blocks it at runtime, and the served-asset reference test catches it at build time."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Static asset table with `include_bytes!`, vendored versioned files (this ADR) | Selected | Keeps the single binary and `cargo build`, adds binary bodies and fonts, and makes the supply chain auditable. |\n| Ship assets in `/usr/share/papyrus/assets` and read them at runtime | Rejected | Breaks single-binary packaging (ADR-0002/ADR-0005), adds a runtime path and a traversal surface, and makes \"installed but unreadable\" a new failure mode. |\n| A Rust asset-embedding crate (`include_dir`, `rust-embed`) | Rejected | A new dependency for something 40 lines of `include_bytes!` already do; ADR-0005's no-new-dependency rule holds. |\n| Base64-inline the assets into the HTML | Rejected | +33 % size, no caching, template blow-up, CSP `style-src`/`data:` complications. |\n| Rebuild the assets from source with npm in the build | Rejected | Introduces a Node toolchain and network access into `cargo build`; violates ADR-0001/ADR-0004 and offline determinism. |\n| Pre-compress the embedded assets and serve `Content-Encoding: gzip` | Rejected for now | ADR-0005 rejects compression handling; it would add `Accept-Encoding` negotiation and a compressed-body path to the hand-written HTTP server. A later ADR may revisit it as the single biggest size win (≈1.5 MiB instead of 4 MiB transferred). |\n| Separate `THIRD-PARTY-NOTICES` file in the package | Rejected | Debian requires the licence inventory in `copyright` anyway; two files add a packaging step and a place for notices to go stale. |"},{"heading":"Open Questions","content":"- **Approve the 12 MiB binary budget** (current 4.2 MiB)? Recommended: yes; a tighter budget forces choosing between Mermaid and a single-file diagram subset.\n- **Should vendor assets get a long-lived cache header?** Current decision: no, keep `no-store`. Recommended follow-up only if diagram-heavy navigation proves painful.\n- **Is a pinned Mermaid minor version enough, or is a documented \"review on security advisory\" cadence required?** Recommended: a release-checklist item, not an automated mechanism."},{"heading":"Downstream constraints","content":"1. No module may serve a file from disk for the browser; every byte comes from `ASSETS`.\n2. Asset paths are exact strings; no prefix matching, directory listing, range request, or path join is added.\n3. Every embedded asset has a manifest entry with digest and licence, and the digest test passes.\n4. The package contains no runtime asset directory; the docs set stays one copyright file.\n5. Vendored files are byte-identical to upstream unless a documented `.patch` accompanies them.\n6. `Cargo.toml` gains no dependency; the build gains no toolchain step and no network access.\n7. Existing \"no remote reference\" tests keep passing, retargeted as described in decision 10; specification wording about \"no web font\" is revised by the business analyst / tech writer."},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-01.003.md`, `NFR-03.001.md`, `NFR-05.001.md`, `NFR-06.001.md`, `NFR-06.002.md`.\n- `docs/requirements/business/REQ-06.017.md` — bundled, offline rendering assets.\n- `docs/architecture/adr/ADR-0001-implementation-language-rust.md`, `ADR-0004-repository-root-single-crate-layout.md`.\n- `docs/architecture/adr/ADR-0002-distribution-format-amd64-deb-packages.md`, `ADR-0003-supported-debian-release-target-forky-only.md` — one binary per package.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — asset, transport, CSP, and header baseline (partially amended here).\n- `docs/architecture/adr/ADR-0025-bundled-katex-client-side-math-rendering.md`, `ADR-0026-mermaid-only-offline-diagram-rendering.md` — the consumers of these assets.\n- Implementation: `src/browser/assets.rs` (new), `src/browser/vendor/`, `src/browser/http.rs`, `src/browser/mod.rs`, `scripts/build-deb.sh`, `packaging/deb/usr/share/doc/papyrus/copyright`.\n- Tests: `tests/browser_cli.rs` (offline asset scans, CSP, packaging), `tests/search_browser_smoke.rs`."}]},{"id":"ADR-0028","title":"Browser Shell: Shared List Layout, Content-Width Contract, and Collapsible Navigation","status":"Accepted (2026-11-15) — owner decision 2026-11-15: one shared shell and list layout, server-side `PageWidth` width contract, `localStorage` navigation persistence (default expanded), and the mockup full-width class only (preview route out of scope); amended 2026-11-15 by architecture review at TASK-141 blocker resolution (decision 2 column order and slot table, new decision 9; no status change), explicit owner confirmation pending; revised 2026-11-16 (decision 4 collapsed grid track corrected after measurement; no status change).","sections":[{"heading":"Date","content":"2026-11-15"},{"heading":"Context","content":"REQ-06.016 requires every browser list view — tasks, milestones, releases, decisions, and every document type including audit records and technical specifications — to use one shared list layout with fixed header, row/column structure, and action placement, with family-specific fields in designated slots and no bespoke list template. REQ-06.015 requires the 1040 px cap to stay for ordinary pages, to be lifted for the backlog kanban board and UI-mockup previews, and to allow diagram/visualization content to use full width inside otherwise-capped pages; it also requires a control on every page that collapses and expands the left navigation, reclaims its width, persists across navigation, and defaults to expanded.\n\nCurrent shape:\n\n- Seven templates: `list.html`, `view.html`, `edit.html`, `error.html`, `document_list.html`, `document_detail.html`, `document_edit.html`. `list.html` and `document_list.html` are near-duplicates; `browser::render` (4.7 k lines) builds per-family list markup with its own headers, counts, and action cells.\n- `app.css` hard-codes the cap in one rule: `.app { max-width: 1040px; margin: 0 auto; padding: 0 24px 56px; }`, and the sidebar is a fixed `210px` grid column (`.layout { grid-template-columns: 210px minmax(0, 1fr); }`).\n- `app.js` (68 lines of logic) contains a sidebar toggle that exists only below 480 px; `data-collapsed` lives on the type list, the state is not persisted, and the toggle is hidden at wider widths.\n- The backlog kanban board (REQ-06.013) and a UI-mockup preview route do not exist yet; REQ-06.015 names both as uncapped surfaces, so the width contract has to be defined before they are built.\n- ADR-0005 fixes: no cookies or sessions, JavaScript as optional progressive enhancement, embedded assets, `Cache-Control: no-store`, `X-Frame-Options: DENY`, and a CSP without `'unsafe-inline'` for scripts. ADR-0020 fixes registry-derived navigation and list routes and states that no new asset is introduced.\n\nForces: one layout for a type set that changes at runtime (ADR-0017, ADR-0020); no template engine (ADR-0005); no per-family render branches for lists; the nav state must survive navigation without a server, a session, or a cookie; and `X-Frame-Options: DENY` plus `frame-ancestors 'none'` mean an embedded mockup preview is a separate decision, not a side effect of a width class."},{"heading":"Decision","content":"1. **A new `browser::shell` module owns page chrome.** It produces the document skeleton (head, header, nav, `\u003cmain\u003e`, footer), the width class, and the nav toggle. Templates are reduced to: `shell.html` (chrome with `{{sidebar}}` and `{{main}}` slots), `list.html` (the single shared list layout), `view.html`, `edit.html`, `error.html`. `document_list.html` is deleted; its content model becomes slots in the shared list. `view.html`/`edit.html` keep their typed field sets — REQ-06.016 mandates a uniform **list** layout only, and collapsing detail/edit forms is out of scope.\n\n2. **One shared list layout with a server-built column plan.** `browser::list` builds, per list page:\n\n   ```rust\n   pub struct ListPlan { pub heading: String, pub count_note: String, pub columns: Vec\u003cColumn\u003e, pub rows: Vec\u003cRow\u003e, pub empty: Option\u003cEmptyState\u003e }\n   pub struct Column { pub key: \u0026'static str, pub label: \u0026'static str, pub class: \u0026'static str }\n   pub struct Row { pub id: String, pub title: String, pub href: String, pub cells: Vec\u003cString\u003e, pub labels: Vec\u003cString\u003e, pub references: Vec\u003cString\u003e, pub actions: Vec\u003c(String, String)\u003e, pub children: Vec\u003cRow\u003e }\n   ```\n\n   - The fixed column order for every family is: ID, Title, Status, family slot(s), Created, Updated, Actions. Only the *labels and presence* of the family slot(s) vary, and they come from the descriptor plus the presentation table (ADR-0020), never from a per-family template or a `match` on slug.\n   - Family slots are declared data: task → `Milestone`, `Assignee`; milestone → `Release`; release → none; decision → `Type`; requirement/nfr → `Group`; audit → `Audit type`; rule → `Applicability`; ui-mockup → `Task`, `Specs`; generic document → none (ID, Title, Status, Created, Updated, Actions).\n   - Slot keys are reserved-key safe: a declared slot key may not be `id`, `title`, `status`, `created`, `updated`, or `actions`, and may not repeat inside one family. Structural columns are fixed, so a slot can never duplicate or reorder one.\n   - The Title cell carries the record's labels and references below the link, rendered by the shared list from escaped values. They are general front-matter metadata, not family data, so they are structural (never a slot) and identical for every family.\n   - Grouped families (requirements/NFR) use the hierarchical row variant (`Row::children`): the group row plus its member rows in the same table body, not a second template.\n   - Action placement is fixed: the last cell, in the order `View`, `Edit`, and any family action that already exists. Archive/delete/create controls stay at page level (unchanged).\n   - Archived records remain excluded because indexing is enabled-only and active-only (ADR-0020 decision 7); the layout never sees them.\n\n   *Revision (2026-11-15, architecture review at TASK-141 blocker resolution): the fixed order previously read `ID, Title, Status, family slot(s), Updated, Actions`, the slot table declared release → `Status`, and the row carried no title, labels, or references. The order now includes `Created`, release declares no slot, and the row carries the title plus labels/references in the Title cell, because REQ-06.004 is a must-have requirement whose acceptance criteria require the browser list to show the same front-matter values as the CLI, including `created_date`, `labels`, and `references`. Dropping them would have required a business-requirement change, not an architecture decision. Resolved question 3 is satisfied structurally by this order instead of by ad-hoc per-family slots. No other part of decision 2 changed.*\n\n3. **The width decision is made on the server, per route.** `routes.rs` gains a route property:\n\n   ```rust\n   pub enum PageWidth { Capped, Full }\n   ```\n\n   `Capped` is the default for every route. `Full` is set only for the backlog kanban board route (when REQ-06.013 lands) and the UI-mockup preview route (when it exists). The shell renders `class=\"app app--full\"` for `Full` and `class=\"app\"` for `Capped`. Client JavaScript never changes the page width class, so no-JS behaviour and server tests agree.\n\n   Inside a `Capped` page, a full-width-eligible region (rendered diagram figure, and later an embedded mockup) uses a `.bleed` block: `width: 100%`, with its own `overflow-x: auto` wrapper, so wide content scrolls inside the region and the page never gains a horizontal scrollbar. `Capped` pages keep `max-width: 1040px; margin: 0 auto; padding: 0 24px 56px` exactly as today.\n\n4. **Navigation collapse is a client-side, per-browser preference with no server state.**\n   - Markup: one `\u003cbutton class=\"nav-toggle\" type=\"button\" aria-expanded=\"true\" aria-controls=\"site-nav\"\u003e` in the shell header on **every** page, and `\u003cnav id=\"site-nav\"\u003e` for the existing sidebar.\n   - State: `localStorage` key `papyrus.nav` with values `\"collapsed\"`/`\"expanded\"`. Collapsed state sets `data-nav=\"collapsed\"` on `\u003chtml\u003e`; CSS then removes the sidebar from the grid (`grid-template-columns: minmax(0, 1fr)`), hides it from the accessibility tree (`hidden` attribute set by script), and drops the `.main` left border and padding, so the reclaimed width is real layout width, not a negative margin. A retained zero-width first track must not be used: the sidebar is `display: none` while collapsed, so the remaining grid item auto-places into that zero-width track and the content column collapses to 0 px; the reclaim comes from removing the sidebar item, zeroing the gap, and removing the main column border and padding (210 + 30 + 30 = 270 px).\n   - No flash of the wrong state: a new asset `/assets/nav-state.js` (≈15 lines) is loaded **synchronously in `\u003chead\u003e`**, reads the stored value, and sets `document.documentElement.dataset.nav` before first paint. `app.js` stays `defer` and only handles the toggle and the existing form guard.\n   - Default: expanded. When no stored value exists, the state is expanded at every viewport width; the current \"auto-collapse below 480 px\" behaviour is removed, because it competes with a persisted user preference and REQ-06.015 makes the collapsed state the user's choice. `localStorage` is the only persistence mechanism (constraint 5): no cookie, no server state, no configuration key.\n   - Degradation: with JavaScript disabled the button is not rendered (`\u003cnoscript\u003e`-style server-side omission is not possible without JS detection, so the button carries `hidden` and a two-line asset removes `hidden`), the nav is expanded and fully usable, and any `localStorage` throw (private mode, quota, disabled storage) is caught and ignored, leaving in-memory state for the session.\n   - Rejected alternatives: a cookie (ADR-0005 forbids cookies and sessions, and it would make the server stateful per client), server-side state in the project or user config (a write path, a concurrency surface, and per-user state in a project file), a query parameter on every link (breaks persistence across navigation and deep links), and a CSS-only checkbox (state cannot survive navigation).\n\n   *Revision (2026-11-16): the collapsed grid previously read `grid-template-columns: 0 minmax(0, 1fr)`. That mechanism is defective and was proven so by measurement: with the sidebar `display: none`, `.main` auto-places into the zero-width first track and its rendered width becomes 0 px at 600, 720 and 1440 px. The collapsed state now uses a single track, `grid-template-columns: minmax(0, 1fr)`, which is what the shipped implementation does. No other part of decision 4 changed.*\n\n5. **CSP is unchanged by this ADR.** The nav script is an external same-origin asset, so `script-src 'self'` covers it; the toggle uses class/attribute changes only, so `style-src 'self'` is untouched. Only ADR-0025 (`font-src`) and ADR-0026 (`style-src 'unsafe-inline'` for Mermaid's SVG `\u003cstyle\u003e`) relax the policy, and only for their stated reasons.\n\n6. **No new dependency, template engine, or client framework.** Lists are rendered server-side into the same `{{name}}` placeholder templates; the two scripts are classic scripts; the CSS is the existing stylesheet plus new rules.\n\n7. **UI-mockup previews are out of scope here; only the mockup full-width class is defined.** REQ-06.015 presupposes a mockup preview surface; none exists, and the stored review packages contain their own HTML/CSS/JS (ADR-0005 and the mockup specification currently forbid serving the package at all). This ADR fixes only the `PageWidth::Full` classification and the `.app--full` class that a mockup preview will use, and records the binding constraint: any future preview route must serve the package as a **sandboxed, opaque-origin document** (`sandbox` without `allow-same-origin`, its own CSP, `X-Frame-Options`/`frame-ancestors` adjusted only for that route), because serving an author-supplied HTML package same-origin would give it access to the browser write API. That route requires its own ADR before implementation and is not part of this decision.\n\n8. **Accessibility and browser support are part of the contract.** The toggle is keyboard operable with a visible focus ring, `aria-expanded` and `aria-controls` stay in sync, the collapsed nav is removed with `hidden` rather than only visually hidden, and the layout is verified at the existing 320/480/720 px breakpoints and in Firefox 100+, Edge 130+, and Safari 18+ (NFR-05.001).\n\n   The shared list is part of the same contract: every header cell keeps `scope=\"col\"`, every row action link carries an accessible name that includes the record ID (`aria-label=\"View {id}\"`, `aria-label=\"Edit {id}\"`), because twenty identical \"View\" links are ambiguous to screen-reader and voice users, and the grouped child rows expose their parent through `data-child-of` plus a visual indent that is not colour-only.\n\n9. **The migration to the shared layout is dispatched by declared data, and its reference family is the milestone list.**\n\n   - The reference family for the first migration is `milestone` (`/?type=milestone`): it is a real list route with a populated and an empty state, it carries one family slot (`Release`), it is the browser side of the REQ-06.004 parity surface, and it is the only family whose list is both a `\u003cul\u003e` row list and a parity target. The task family cannot be the reference: `GET /?type=task` is the REQ-06.013 kanban board, and the task family has no list route to migrate.\n   - While both list paths exist, `list_page` chooses the shared builder or the legacy builder from a declared presentation field, `list_layout: ListLayout { Shared, Legacy }` (default `Legacy`). No `match` on a slug or handler is introduced for the migration. TASK-142 sets every family to `Shared` and deletes the field together with the legacy builders in the same change, so no transitional branch can survive.\n   - The task family has no shared-list surface and gets none from this ADR. REQ-06.013 owns the backlog view; the task slots stay declared for a future task list, which requires its own decision."},{"heading":"Consequences","content":"**Positive:**\n\n- REQ-06.016 becomes structural: a new document type or family cannot get its own list markup, because the only list template is shared and the only variation is declared slot data.\n- Deleting `document_list.html` and the per-family list builders removes a recurring source of \"this list forgot the archive filter / forgot the action cell\" defects.\n- The width rule is one enum on the route plus two CSS classes, which is testable per route instead of asserted by eye.\n- The nav preference is per browser, survives navigation, costs one small asset, and adds no server state, cookie, or write path.\n- Removing the automatic sub-480 px collapse eliminates a state the user could not control.\n\n**Negative:**\n\n- `browser::render` loses about a dozen list builders, which is a large mechanical refactor with visual-diff risk on every list page.\n- The shared column plan flattens family-specific presentation: e.g. the requirement list's per-group counts and the ui-mockup's `Specs` cell must be expressed as slot content, which may be visually narrower than today.\n- A blocking head script is a new (small) render-blocking cost on every page and a new asset that must work before `app.js`.\n- Removing the automatic narrow-viewport collapse means a phone-width first load shows the expanded nav until the user collapses it.\n- The `.bleed` breakout technique must be checked against every supported browser; `100vw` interacts badly with scrollbars if used naively, hence the `overflow-x: auto` wrapper rule.\n\n**Risks and mitigations:**\n\n- *List regression across ~10 families*: characterization tests per family (header labels, column order, action cells, ordering, archived exclusion) captured before the refactor and replayed after it.\n- *A family silently keeps bespoke markup*: a test enumerates every enabled descriptor and asserts the list route returns markup produced by the shared layout (a `data-list-layout=\"shared\"` marker plus the same header sequence).\n- *Nav state and layout fight each other*: one test loads a page with `data-nav=\"collapsed\"` preset, navigates, and asserts the sidebar is absent and the main column is wider; a second runs with JavaScript disabled and asserts the nav is present.\n- *Width class applied too broadly*: a route-level test asserts `Capped` for every list/detail/edit route and `Full` only for the kanban and preview routes.\n- *Grouped-list flattening breaks the requirement hierarchy*: the hierarchical row variant is required by a test on the requirement list (group row plus member rows, same table)."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| One shell + one shared list layout, server-side width enum, `localStorage` nav state (this ADR) | Selected | Satisfies both requirements with no new dependency, no server state, and no CSP change. |\n| Keep per-family list templates and \"harmonise\" their CSS | Rejected | REQ-06.016 explicitly rejects \"consistent headers and columns\" in favour of one shared layout. |\n| Render lists client-side from the JSON API | Rejected | Violates the no-JS-required posture of ADR-0005 and adds a client rendering layer. |\n| Collapse state in a cookie | Rejected | ADR-0005 forbids cookies and sessions; it also makes layout server state per client. |\n| Collapse state in project configuration | Rejected | Per-user UI state in a project file, plus a new write path and concurrency surface. |\n| Collapse state in a URL query parameter | Rejected | Does not persist across navigation; requires rewriting every link. |\n| CSS-only collapse (checkbox hack) | Rejected | State cannot survive navigation, which REQ-06.015 requires. |\n| Set the width class from JavaScript | Rejected | Breaks no-JS equality and makes the route contract untestable server-side. |\n| Serve the mockup preview inside the same page markup | Rejected | Same-origin script execution from an author-supplied package; violates ADR-0005's security model and the mockup specification's \"never served\" rule. |"},{"heading":"Resolved questions (owner, 2026-11-15)","content":"1. **Navigation persistence** — decided: `localStorage` under `papyrus.nav`, default expanded at every viewport width; no automatic narrow-viewport collapse (decision 4).\n2. **UI-mockup scope** — decided: this ADR fixes the mockup full-width class (`PageWidth::Full` / `.app--full`) only; the preview route is out of scope and needs its own ADR (decision 7).\n3. **Family-specific fields in the shared list** — decided: every field that exists today is kept as a declared slot; visual trimming is a design decision, not a structural one.\n4. **Toggle position** — a design refinement (header, left of the brand, always visible); it carries no architectural consequence."},{"heading":"Amendment (2026-11-15) — TASK-141 blocker resolution","content":"Resolved by architecture review while TASK-141 was blocked on two contract questions and no owner was available. This section and the revision notes inside decisions 2 and 9 take effect immediately so implementation can start; explicit owner confirmation is requested, and if it is refused the amendment is withdrawn in favour of a superseding ADR.\n\n- **OQ-1 — reference family: milestone list (confirmed against the refiner's recommendation).** `/?type=milestone` is the only family that is simultaneously a real list route, a populated *and* empty state, a family slot carrier (`Release`), a `\u003cul\u003e` → `\u003ctable\u003e` migration, and the browser side of the REQ-06.004 parity surface. The task family is not eligible: `/?type=task` is the REQ-06.013 board and no task list route exists. The milestone list is not grouped and has no status filter, so the grouped row variant and the filter path are proven by `ListPlan` unit tests in TASK-141 and first exercised end-to-end by migrating requirements/NFRs first in TASK-142.\n- **OQ-2 — `created_date` stays, as a structural column: option (a).** The fixed order becomes `ID, Title, Status, family slot(s), Created, Updated, Actions`. The alternative (keep the order, relax parity to Updated-only on lists) was rejected because REQ-06.004 is a must-have requirement whose acceptance criteria require the browser *list* to show the same front-matter values as the CLI, including `created_date`, `labels`, and `references`; relaxing it is a business-requirement change, not an architecture one. `labels` and `references`, which today survive only in an ad-hoc metadata line, are carried in the Title cell so list parity does not regress when the list builders are deleted.\n- **OQ-3 — release declares no family slot.** `Status` is the fixed Status column for every family; declaring it as a slot produced two status cells. Reserved-key validation (decision 2) prevents the class of error, not just this instance. No data is lost: the release list shows `planned`/`released` from the same `record.status` the slot would have read.\n- **Task family has no shared-list surface.** REQ-06.016 governs list views; the task family's browser view is the REQ-06.013 board. TASK-142 therefore treats tasks as a board-regression check, not a list migration.\n- **Mockup brief changes.** The pending shell/shared-list mockup must show the seven-column order above, the Title-cell tag line, and the row action cell with per-row accessible names. The mockup gate is unchanged: AC2/AC3 work still waits for the approved MOCK id.\n- **Not changed by this amendment:** decisions 1, 3, 4, 5, 6, 7, 8; `PageWidth`; CSP; the navigation model; the archive-exclusion rule.\n\n**Precedence while the feature specification is stale.** `docs/specifications/browser-shell-shared-list-layout-and-page-width.md` still states the pre-amendment column order and leaves OQ-1..OQ-3 open (this review had no write access to `docs/specifications/`). This ADR governs until that specification is updated; the required specification edits are listed in TASK-141.\n\n**Ticket text to apply (TASK-141).** The reference family is `milestone` (not `task`); AC2/DoD#4 use the header sequence `ID, Title, Status, family slot(s), Created, Updated, Actions`; the parity assertion is `created` **and** `updated` in the row cells plus `labels`/`references` in the title cell; the transitional dispatch is the `list_layout` presentation field. TASK-142 migrates requirements/NFRs first, then ui-mockup, then the flat document families, then config-defined types, and treats the task family as a board-regression check only."},{"heading":"Amendment (2026-11-16) — collapsed grid track correction","content":"The collapsed-layout mechanism in decision 4 was wrong and is corrected; the status stays `Accepted` because no shipped behaviour is changed and the defective detail was never released.\n\n- **Correction — the collapsed grid has one track, not two.** `grid-template-columns: 0 minmax(0, 1fr)` is replaced by `grid-template-columns: minmax(0, 1fr)`. Measurement disproved the two-track form: with the sidebar `display: none`, `.main` auto-places into the retained zero-width first track and renders 0 px wide at 600, 720 and 1440 px. A zero-width first track is therefore not a valid way to reclaim the sidebar's width.\n- **Width reclaim is unchanged as a contract.** The 270 px comes from removing the sidebar item (210 px), zeroing the gap, and removing the `.main` left border and padding (30 + 30 px); the reclaim is real layout width, not a negative margin.\n- **Not changed by this amendment:** decisions 1, 2, 3, 5, 6, 7, 8, 9; `PageWidth`; CSP; the navigation model; the archive-exclusion rule; the status.\n- **Precedence.** The shipped implementation already uses the single-track form; this amendment brings the ADR in line with it. `docs/specifications/browser-shell-shared-list-layout-and-page-width.md` is corrected separately by the tech writer."},{"heading":"Downstream constraints","content":"1. `document_list.html` and any per-family list builder must not survive; every list view renders through the shared layout, including config-defined types.\n2. Family variation is declared data (descriptor + presentation table); no `match` on a slug and no per-family template may be added for a list.\n3. `PageWidth` is decided server-side per route; JavaScript may not change the page width class.\n4. The 1040 px cap stays on every route except the kanban board and the mockup preview; a new uncapped route requires an amendment to this ADR.\n5. Nav state is stored only in `localStorage` under `papyrus.nav`; no cookie, no server state, no config key.\n6. The nav toggle must work without JavaScript (expanded, visible, usable) and must not rely on inline styles or inline scripts (CSP unchanged).\n7. An in-page full-width region must never cause page-level horizontal scrolling; wide content scrolls inside its own container.\n8. A mockup preview route may not be added under this ADR; it needs its own decision covering sandboxing, CSP, and `X-Frame-Options`.\n9. ADR-0020 downstream constraint 5 (\"no new asset or dependency\") is amended by this ADR: one small same-origin script asset is added; the no-dependency and no-template-engine rules stand.\n10. The structural column set of a shared list is fixed at `id`, `title`, `status`, family slot(s), `created`, `updated`, `actions`. No family adds, removes, or reorders a structural column, and no slot key may be a reserved key (`id`, `title`, `status`, `created`, `updated`, `actions`) or repeat.\n11. Labels and references are rendered for every family in the Title cell by the shared list from escaped values. They are never a slot and never a per-family template concern.\n12. While two list paths exist, the choice between them is the declared presentation `list_layout` field. A `match` on a slug or handler for a list, even transitional, violates constraint 2.\n13. The task family has no shared-list surface while REQ-06.013 owns the backlog view. Adding a task list requires its own decision; the declared task slots do not imply one.\n14. Every list row action link carries a record-specific accessible name; a bare repeated `View`/`Edit` label is not conformant.\n15. Seven columns at 320 px must not introduce page-level horizontal scrolling: the shared table scrolls inside its own container, on the same principle as constraint 7. The exact treatment (scroll container or stacked rows) is the mockup's decision, not a per-family one."},{"heading":"References","content":"- `docs/requirements/business/REQ-06.016.md` — one shared list layout for every artifact family.\n- `docs/requirements/business/REQ-06.015.md` — content width and navigation visibility.\n- `docs/requirements/business/REQ-06.013.md` — the kanban board that must render uncapped.\n- `docs/requirements/business/REQ-06.009.md`, `REQ-06.012.md`, `REQ-06.014.md` — shared header, record layout, config-defined list views.\n- `docs/requirements/business/REQ-05.007.md` — archived records never listed.\n- `docs/requirements/business/REQ-06.004.md` — CLI/browser metadata parity; source of the `Created` column and the Title-cell l
