  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:12px; } header h1 { font-size:17px; margin:0; } header .sub { color:var(--muted); font-size:13px; } header .back { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; } header .back:hover { text-decoration:underline; }

  .tag.status-refused { border-color:#e6c2c0; background:#f8eaea; color:#b0443f; } .tag.status-deprecated { border-color:#d8d8d3; background:#f0f0ee; color:#6b6b66; } .tag.status-superseded { border-color:#c3d0e2; background:#eaf0f7; color:#4a6fa5; }

<script id="data" type="application/json">{"adrs":[{"id":"ADR-0001","title":"Implementation Language — Rust","status":"Accepted","sections":[{"heading":"Date","content":"2026-11-01"},{"heading":"Context","content":"Papyrus is a project-level backlog and documentation manager delivered as a command-line tool. The NFR-03 group (\"Implementation and Distribution\") records validated constraints for implementation and distribution. **NFR-03.001** requires that the Papyrus application be implemented in Rust. This is a firm, decided constraint.\n\nThe available toolchain in the verified environment includes Rust 1.99.1, Cargo, and rustup. Node.js and Python 3 are available as auxiliary build/release tooling only and are not runtime dependencies of the distributed CLI."},{"heading":"Decision","content":"- Implement Papyrus in **Rust** as the sole implementation language (NFR-03.001).\n- Use **Cargo** for dependency management, reproducible builds, and the testing workflow.\n- Rust 1.99.1 (via rustup) is the pinned baseline toolchain for builds.\n- Node.js and Python 3, where used, remain build-time/auxiliary tooling only and are never runtime dependencies of the distributed CLI."},{"heading":"Consequences","content":"**Positive:**\n\n- A single compiled Rust binary keeps runtime dependencies minimal and startup fast.\n- Cargo provides reproducible builds, dependency management, and a testing workflow.\n- Rust's type system and ownership model support long-term maintainability and safety.\n\n**Negative:**\n\n- Rust compile times and a learning curve increase development cost.\n\n**Risks and mitigations:**\n\n- *Dependency drift*: audit Rust crate licenses and transitive dependencies during release review.\n- *Toolchain pinning*: keep the Rust toolchain version recorded and reproducible across builds."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Python implementation | Rejected | Violates NFR-03.001; adds a runtime interpreter dependency and packaging complexity. |\n| Go implementation | Rejected | Violates NFR-03.001. |\n| Shell/Node.js CLI | Rejected | Violates NFR-03.001; not suitable for a structured backlog/documentation manager. |"},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-03.md` — Implementation and Distribution group.\n- `docs/requirements/non-functional/NFR-03.001.md` — Implement Papyrus in Rust.\n- Verified environment: Rust 1.99.1, Cargo, rustup."}]},{"id":"ADR-0002","title":"Distribution Format — amd64 `.deb` Packages for Debian Trixie, Forky, and Later Releases","status":"Superseded by ADR-0003","sections":[{"heading":"Date","content":"2026-11-01"},{"heading":"Context","content":"Papyrus is a project-level backlog and documentation manager delivered as a command-line tool. The NFR-03 group (\"Implementation and Distribution\") records validated constraints for implementation and distribution. **NFR-03.002** requires that Papyrus be distributed as `.deb` packages for the amd64 architecture on Debian Trixie, Forky, and later Debian releases.\n\nThe distribution target is amd64 Debian `.deb` packages. The available tooling in the verified environment includes `dpkg-deb`, Node.js (for browser UI assets at build time only), and Python 3 (auxiliary build/release tooling).\n\nNFR-03.002 contains an explicit open question: the phrase \"later Debian releases\" does not specify a terminal release boundary or which future releases must be verified. This ADR records the decision as stated and captures that open question rather than resolving it silently."},{"heading":"Decision","content":"- Distribute Papyrus as **amd64 `.deb` packages** targeting **Debian Trixie, Forky, and later Debian releases** (NFR-03.002).\n- Build the Debian package artifacts with the available `dpkg-deb` tooling; package metadata and control files are maintained as part of the release process.\n- Node.js is available for browser UI asset tooling at build time only; it is not a runtime dependency of the distributed CLI.\n- Python 3 is available as auxiliary build/release tooling; it is not a runtime dependency of the distributed CLI."},{"heading":"Consequences","content":"**Positive:**\n\n- `.deb` packaging for amd64 is straightforward with `dpkg-deb` and matches the required distribution format.\n\n**Negative:**\n\n- Debian package metadata (control fields, dependencies, versioning) must be maintained and validated per release.\n- Each claimed supported Debian release requires installation and verification work.\n\n**Risks and mitigations:**\n\n- *Unbounded \"later releases\" claim*: until the open question is resolved, only Trixie and Forky are advertised as supported; additional releases require explicit verification before being claimed (see Open Questions).\n- *glibc/toolchain compatibility*: verify the built binary runs on each claimed release's glibc; prefer a conservative baseline.\n- *Dependency drift*: audit Rust crate licenses and transitive dependencies during release review."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| AppImage / Flatpak / tarball distribution | Rejected | Violates NFR-03.002, which requires amd64 `.deb` packages. |\n| Additional architectures (arm64, etc.) | Out of scope | NFR-03.002 specifies amd64 only; not added without a requirement change. |"},{"heading":"Open Questions","content":"- **NFR-03.002 — \"later Debian releases\" boundary.** The phrase does not specify a terminal release boundary or which future releases must be verified. This ADR does not resolve it. Follow-up: define a supported-release list and verification matrix (install + smoke test on each claimed release) before advertising support beyond Debian Trixie and Forky. Tracked against NFR-03.002's Verification Method."},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-03.md` — Implementation and Distribution group.\n- `docs/requirements/non-functional/NFR-03.002.md` — Distribute Papyrus as a Debian Package.\n- Verified environment: `dpkg-deb`, Node.js, Python 3.\n- Approval note: Distribution format decision approved by the user on 2026-11-02; status changed from Proposed to Accepted. Open question on \"later Debian releases\" boundary remains unresolved (see Open Questions)."}]},{"id":"ADR-0003","title":"Supported Debian Release Target — Forky Only (amd64 `.deb`)","status":"Accepted","sections":[{"heading":"Date","content":"2026-11-02"},{"heading":"Context","content":"Papyrus is a project-level backlog and documentation manager delivered as a command-line tool. The NFR-03 group (\"Implementation and Distribution\") records validated constraints for implementation and distribution. **NFR-03.002** requires that Papyrus be distributed as `.deb` packages for the amd64 architecture on Debian Trixie, Forky, and later Debian releases.\n\n**ADR-0002** (Accepted) advertised support for Debian Trixie, Forky, and later releases. During refinement of TASK-4 it was determined that Debian Trixie cannot be easily tested in the available environment. To avoid claiming support that is not verified, Papyrus narrows its advertised and verified support to **Debian Forky only** (amd64 `.deb`). Debian Trixie and any other Debian release are **not** claimed or verified as supported.\n\nThis ADR **supersedes ADR-0002**. ADR-0002's body remains frozen; only its status transitions to `Superseded` once this ADR is accepted.\n\nNFR-03.002 still states \"Debian Trixie, Forky, and later Debian releases\" and therefore does not yet match this decision. Amending NFR-03.002 is out of architect scope and is tracked as an open item for the requirements-engineer (see Open Questions)."},{"heading":"Decision","content":"- Advertise and verify support for **Debian Forky only**, delivered as amd64 `.deb` packages (supersedes ADR-0002).\n- Do **not** claim or verify support for Debian Trixie or any other Debian release.\n- Only releases that are explicitly installed and smoke-tested may be advertised as supported; at this time that set is Forky alone.\n- Build the Debian package artifacts with the available `dpkg-deb` tooling; package metadata and control files are maintained as part of the release process."},{"heading":"Consequences","content":"**Positive:**\n\n- The advertised support set matches what can actually be verified in the available environment, avoiding unverified support claims.\n- Verification matrix is reduced to a single, testable release.\n\n**Negative:**\n\n- Users on Debian Trixie or other releases are not covered by the supported-release commitment.\n- Future releases require explicit verification work before being added to the supported set.\n\n**Risks and mitigations:**\n\n- *Support drift*: any future addition to the supported set requires an explicit verification pass and a follow-up ADR/requirement update.\n- *glibc/toolchain compatibility*: verify the built binary runs on Debian Forky's glibc; prefer a conservative baseline.\n- *Dependency drift*: audit Rust crate licenses and transitive dependencies during release review."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Trixie + Forky (as ADR-0002) | Superseded | Trixie cannot be easily tested in the available environment; unverified support is not claimed. |\n| Forky only | Accepted (this ADR) | Matches the verifiable environment; avoids unverified support claims. |\n| All Debian releases | Rejected | Unbounded, unverifiable claim; violates the verification discipline. |"},{"heading":"Open Questions","content":"- **NFR-03.002 amendment (requirements-engineer).** NFR-03.002 still requires amd64 `.deb` on Debian Trixie, Forky, and later Debian releases. It must be amended to Debian Forky only to match this ADR. This is out of architect scope; tracked as an open item for the requirements-engineer.\n- **\"later Debian releases\" boundary.** No future release is claimed; adding one requires explicit verification and a requirement/ADR update."},{"heading":"References","content":"- `docs/architecture/adr/ADR-0002-distribution-format-amd64-deb-packages.md` — superseded by this ADR.\n- `docs/requirements/non-functional/NFR-03.md` — Implementation and Distribution group.\n- `docs/requirements/non-functional/NFR-03.002.md` — Distribute Papyrus as a Debian Package (to be amended).\n- Verified environment: `dpkg-deb`, Node.js, Python 3."}]},{"id":"ADR-0004","title":"Repository Root Single-Crate Layout for the Papyrus Rust Crate","status":"Accepted","sections":[{"heading":"Date","content":"2026-11-02"},{"heading":"Context","content":"Papyrus is a single Rust command-line tool and the repository is the project itself; it is not a multi-application monorepo. **NFR-03.001** requires that Papyrus be implemented in Rust, and **ADR-0001** selects Rust with Cargo as the implementation language and build system. The **TASK-1 specification** (`docs/specifications/rust-cli-and-debian-package-baseline.md`) requires a minimal single-crate layout (`src/main.rs` + `src/lib.rs`), explicitly excludes a multi-crate workspace, and assumes any move to a workspace or to module boundaries beyond that minimal split requires a new ADR.\n\n`AGENTS.md` lists generic default write scopes such as `apps/rust/**`, `apps/backend/**`, and `apps/webFrontend/**` for multi-application projects. No requirement, specification, or ADR mandates an `apps/` subdirectory for Papyrus, and Papyrus has no other application components that would justify one. The current repository already places `Cargo.toml`, `src/`, `tests/`, `rust-toolchain.toml`, `scripts/`, and `packaging/` at the repository root, and both `build-deb.sh` and `docs/packaging.md` reference a root-level build producing `target/release/papyrus`.\n\nThis ADR formalizes that the root-level single-crate placement is deliberate rather than incidental, so that the layout is not silently \"corrected\" into an `apps/` directory and so that any future relocation is treated as an explicit architectural change."},{"heading":"Decision","content":"- Place the Papyrus Rust crate at the **repository root**: `Cargo.toml`, `src/` (with `src/main.rs` + `src/lib.rs`), `tests/`, `rust-toolchain.toml`, and build/packaging assets (`scripts/`, `packaging/`, `build-deb.sh`) all live at the repository root.\n- Keep Papyrus as a **single crate** with binary and library targets; do **not** introduce a Cargo workspace and do **not** nest the crate under an `apps/\u003cname\u003e/` directory.\n- Treat the generic `apps/**` write scopes in `AGENTS.md` as **not applicable** to Papyrus; Papyrus-specific code and build artifacts live at the repository root.\n- Any future relocation of the crate into `apps/\u003cname\u003e/` (or any other directory), or conversion to a multi-crate workspace, **requires a new ADR and an accompanying refactor**. Ad-hoc moves are not permitted."},{"heading":"Consequences","content":"**Positive:**\n\n- Matches the minimal single-crate layout required by the TASK-1 specification and ADR-0001 without added indirection.\n- Cargo commands (`cargo build`, `cargo test`) run from the repository root, matching existing build and packaging references (`target/release/papyrus`, `build-deb.sh`, `docs/packaging.md`).\n- Avoids an unnecessary directory level and keeps the project navigable as the project itself.\n\n**Negative:**\n\n- Contributors familiar with the generic multi-app convention must be aware that Papyrus does not use an `apps/` directory; its write scope is the repository root.\n- If Papyrus is later absorbed into a larger multi-application repository, relocation and path updates will be required (mitigated by requiring a new ADR and refactor).\n\n**Risks and mitigations:**\n\n- *Accidental relocation*: guard against silent moves by treating the root layout as an accepted decision; any change requires a new ADR.\n- *Scope confusion*: document in architecture/AGENTS context that the generic `apps/**` scopes do not apply to Papyrus."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Repository root single crate (this ADR) | Accepted | Matches the TASK-1 minimal layout and ADR-0001; simplest; consistent with existing root-level build/packaging references. |\n| Nest under `apps/rust/` or `apps/papyrus/` | Rejected | No requirement or ADR mandates an `apps/` directory for Papyrus; adds path indirection and breaks existing build/packaging references without benefit. |\n| Cargo workspace with multiple crates | Rejected | Violates the TASK-1 assumption of a minimal single-crate layout; out of scope and requires a new ADR. |"},{"heading":"References","content":"- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — Rust + Cargo implementation language.\n- `docs/specifications/rust-cli-and-debian-package-baseline.md` — TASK-1 spec (minimal single-crate layout, no workspace).\n- `docs/requirements/non-functional/NFR-03.001.md` — Implement Papyrus in Rust.\n- `AGENTS.md` — generic default write scopes (`apps/rust/**`, etc.), not binding for Papyrus.\n- `build-deb.sh`, `docs/packaging.md` — root-level build references (`target/release/papyrus`).\n- Approval note: accepted per explicit user request on 2026-11-02; index regeneration left to the caller."}]},{"id":"ADR-0005","title":"Embedded Dependency-Free HTTP Server and Server-Rendered Browser UI","status":"Accepted — approved by explicit user confirmation on 2026-11-04 (TASK-28). Body frozen per ADR lifecycle.","sections":[{"heading":"Date","content":"2026-11-03"},{"heading":"Context","content":"TASK-6 delivers the first increment of `papyrus browser`: an offline, project-local web interface over business-requirement and non-functional-requirement records. The behavior contract is `docs/specifications/browser-requirements.md`, traced to REQ-06.002, BR-004, NFR-01.002, NFR-01.003, NFR-02.002, NFR-04.002, and NFR-05.001.\n\nThe browser content inventory is delivered incrementally toward NFR-01.002 (\"all Papyrus content\"): this ADR fixes the transport, asset delivery, rendering, module boundaries, and security baseline that every later increment reuses; each increment adds document types and routes without changing this baseline. The module and route structure is intentionally extensible so a new document type is added by one module/route entry rather than a redesign.\n\nADR-0001 selects Rust and ADR-0004 fixes the repository-root single crate. The TASK-6 specification additionally forbids a web framework, an async runtime, a templating engine, a Markdown renderer, a second crate/application, and any new runtime dependency. Those constraints leave an unresolved architectural question: how the HTTP interface is built, how UI assets are delivered, and what security posture applies. The answer is cross-cutting because later browser increments (TASK-11, TASK-15, TASK-19, TASK-23 … TASK-27) and packaging (TASK-7, binary-only `.deb`) inherit it.\n\nThe alternatives considered were a Rust web framework (for example axum or actix-web), an async runtime (tokio), a template engine (askama or tera), externally served assets, an external web server or CGI, and a WebView/Tauri shell. Each adds dependencies, runtime files, or a second execution model that conflicts with the offline, dependency-free, single-binary packaging requirement."},{"heading":"Decision","content":"- Implement the browser as a **blocking HTTP/1.1 server** using only `std::net::TcpListener`, `std::net::TcpStream`, and `std::io`. No web framework, async runtime, or new dependency.\n- Serve **exactly one request per connection** with `Connection: close`; handle each accepted connection on its own `std::thread`; cap concurrent connections at 16; reject the 17th immediately with `503`; use 5-second read and write timeouts; support only `GET`, `HEAD`, and `POST`; reject `Transfer-Encoding`, keep-alive, pipelining, TLS, HTTP/2, WebSocket, and compression.\n- Route against a **fixed route table** after single-pass percent-decoding. Request paths are never joined to filesystem paths. Record IDs are validated and resolved by exact match against active directory listings.\n- Render **server-side HTML** from templates embedded with `include_str!` (`src/browser/templates/*.html`) using a fixed `{{name}}` placeholder syntax. Substitution is a single pass over the template; substituted values are never re-scanned, so a value containing `{{...}}` is emitted literally, and unknown placeholders are left untouched. Escaped values are escaped at render time; internal fragments (sidebar, breadcrumb, section, metadata, form) are pre-escaped raw fragments. There is no template engine and no expression evaluation.\n- Embed CSS and JavaScript with `include_str!` (`src/browser/app.css`, `src/browser/app.js`). No CDN, web font, icon font, image, remote `@import`, or remote `url(...)`. JavaScript is optional progressive enhancement (dirty-form guard and narrow-viewport sidebar toggle); every page works without it.\n- Provide a minimal read/write **JSON API** (`GET /api/requirements`, `GET /api/doc/{id}`, `POST /api/doc/{id}`) using `serde_json`, backed by the same record access as the HTML routes.\n- Adopt the security posture fixed by the specification: no authentication, authorization, accounts, sessions, cookies, or TLS; loopback bind by default; non-loopback bind allowed but warned about; `Host` and `Origin` validation plus strict `Content-Type` checks as the CSRF and DNS-rebinding mitigation; HTML escaping, CSP, `X-Frame-Options: DENY`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, and `Cache-Control: no-store`; no outbound network access; no absolute filesystem paths in responses.\n- Keep the module boundaries inside the single crate: `browser::http` (protocol parsing/writing), `browser::records` (record indexing, parsing, validation, atomic persistence), `browser::render` (templates and escaping), and `browser::mod` (option resolution, server lifecycle, routing, handlers, JSON shaping). Configuration keys and their validation live in `config`; project-directory enforcement stays in `context`. Configuration *loading* orchestration currently resides in `commands` (`crate::commands::load_effective_config`) and is a deferred refactor — this ADR fixes key ownership and validation, not the call site.\n- Compile all assets into the binary so the `.deb` contains only `/usr/bin/papyrus` and the copyright file; no runtime asset directory is required."},{"heading":"Consequences","content":"**Positive:**\n\n- The browser works fully offline and needs no runtime dependency, external server, asset directory, or network fetch (NFR-01.003).\n- The package stays a single binary plus copyright, matching ADR-0002/ADR-0003 packaging and TASK-7 verification.\n- No new supply-chain surface or license audit is introduced beyond the existing dependencies.\n- The fixed route table and record-ID resolution avoid path traversal and keep the security model auditable.\n- The single-crate layout and module split remain consistent with ADR-0004.\n\n**Negative:**\n\n- HTTP parsing, header handling, and response writing are maintained in-project rather than delegated to a framework; protocol defects are our responsibility.\n- Concurrency is limited to 16 blocking threads with no keep-alive; this is adequate for a single-user loopback interface but not for multi-user or high-throughput use.\n- Rendering is hand-rolled: the `{{name}}` substitution and raw-fragment allowlist must be maintained carefully, and there is no template engine safety net.\n- No authentication or TLS means a non-loopback bind exposes an unauthenticated read/write interface to the network; the warning is the only guard.\n- Browser-version support (NFR-05.001) is verified at markup/asset level, not by driving real GUI browsers.\n\n**Risks and mitigations:**\n\n- *Protocol and request-smuggling defects*: covered by the contract tests in `tests/browser_cli.rs` (request limits, duplicate `Content-Length`, `Transfer-Encoding`, method/status matrix).\n- *XSS and injection*: render-time escaping, `serde_json` for JSON, CSP without `'unsafe-inline'`, and no inline scripts or event handlers.\n- *DNS rebinding and CSRF*: strict `Host`/`Origin` validation and `Content-Type` enforcement; no session or credential exists to protect.\n- *Resource exhaustion*: request-line, target, header, body, connection, and timeout caps.\n- *Per-request re-reads*: every request re-reads configuration and record files from disk (specification section 3.18); per-record config re-reads and duplicate record parsing in `browser::records` are accepted for this increment and tracked as performance follow-ups.\n- *Deferred follow-ups (tracked, not implemented here)*: config loading moved out of `commands`; per-record config re-reads and duplicate record parsing; template placeholder hardening tests; test temp-directory hygiene (older suites use `std::env::temp_dir()`); manpage/README over-promising (\"both backlog and documentation stores\"); NFR-01.002 scope clarification; NFR-05.001 real-browser (GUI) verification. Owners implied by affected area.\n- *Future scale or feature pressure*: introducing a framework, async runtime, template engine, or external asset pipeline requires a new ADR; this ADR is the baseline those changes must supersede."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Blocking `std::net` server, embedded templates/assets (this ADR) | Selected for TASK-6 | Meets offline, dependency-free, single-binary, and single-crate constraints; smallest operational surface. |\n| Web framework (axum, actix-web, warp) | Rejected | Adds dependencies and an async runtime; conflicts with the TASK-6 no-new-dependency constraint. |\n| Template engine (askama, tera, handlebars) | Rejected | Adds a dependency and build complexity; the placeholder set is small and fixed. |\n| External web server or CGI | Rejected | Requires a second runtime/process and runtime files; not offline/self-contained. |\n| WebView/Tauri desktop shell | Rejected | Adds a platform UI stack and packaging surface far beyond the local-browser requirement. |\n| Markdown rendering in the browser | Rejected | Out of scope for this increment; displaying stored text literally is the specified behavior. |"},{"heading":"References","content":"- `docs/specifications/browser-requirements.md` — TASK-6 behavior contract, HTTP routes, security, assets, browser support.\n- `docs/specifications/search-browser-milestone-packaging-and-verification.md` — TASK-7 packaging and embedded-asset verification.\n- `docs/requirements/non-functional/NFR-01.002.md`, `NFR-01.003.md`, `NFR-02.001.md`, `NFR-02.002.md`, `NFR-04.001.md`, `NFR-04.002.md`, `NFR-05.001.md`.\n- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — Rust and Cargo.\n- `docs/architecture/adr/ADR-0004-repository-root-single-crate-layout.md` — single-crate layout.\n- Implementation: `src/browser/mod.rs`, `src/browser/http.rs`, `src/browser/records.rs`, `src/browser/render.rs`, `src/browser/templates/`, `src/browser/app.css`, `src/browser/app.js`.\n- Tests: `tests/browser_cli.rs`, `tests/search_browser_smoke.rs`.\n- Status note: implemented and verified in TASK-6/TASK-7; accepted by explicit user confirmation on 2026-11-04 (TASK-28)."}]},{"id":"ADR-0006","title":"Optimistic Concurrency and Atomic Record Writes for Browser Edits","status":"Proposed","sections":[{"heading":"Date","content":"2026-11-03"},{"heading":"Context","content":"The TASK-6 browser is the first Papyrus surface that writes requirement records while the CLI can also edit the same files. The browser has no session, no lock manager, and no database; records are plain UTF-8 Markdown files inside the project directory (NFR-04.001, NFR-04.002). The behavior contract is `docs/specifications/browser-requirements.md` sections 7.10–7.12.\n\nThe problem is twofold: a save must not silently overwrite a file changed after the edit form was rendered, and a crash or concurrent read must never observe a partially written record. The alternatives considered were advisory file locking, a single-writer queue or daemon, last-write-wins, a lock file, and moving records into a database. Locking and daemons add lifecycle and stale-lock failure modes; last-write-wins loses data; a database violates the text-file and single-crate constraints."},{"heading":"Decision","content":"- Use **optimistic concurrency without locking**. The version token is `\"\u003cmtime-seconds\u003e.\u003cmtime-nanos\u003e.\u003clength\u003e\"` of the record file at render/read time. It is opaque to clients and is exposed as the `version` member of the JSON record and as a hidden `version` form field.\n- On `POST`, a missing or malformed version token is `400`; a token that differs from the current on-disk token is `409 Conflict` with no write; a matching token proceeds to the write.\n- Write records **atomically within their own directory**: create `\u003cid\u003e.md.tmp` with `create_new(true)` (retrying with a numeric suffix on collision), write UTF-8 bytes, call `sync_all`, copy the original file's permissions, rename the temporary file over the target, sync the directory on a best-effort basis, and remove the temporary file on every failure path so the original file is left untouched.\n- Accept and document the residual race: the version check and the rename are not one atomic operation. This is acceptable for a single-user loopback interface. It is not a multi-writer guarantee.\n- Save-then-reread: a successful form save returns `303 See Other` and the follow-up `GET` re-reads the file from disk; a successful JSON save re-reads and returns the updated record. The server keeps no cached record content between requests.\n- Resolve record IDs by exact, case-sensitive match against the active directory listing and never concatenate request values into a path. Route every read and write path (record directory, record file, temporary file) through `Context::ensure_within` against the canonical project directory. Symlink escapes are rejected before any content is read or written.\n- Preserve unknown and editor-added `## ` sections content-identically, preserve the original section order, keep the first heading as `# \u003cID\u003e \u003ctitle\u003e`, and terminate the file with a single LF newline."},{"heading":"Consequences","content":"**Positive:**\n\n- No lock manager, lock file, daemon, or stale-lock recovery is needed; the CLI and browser can coexist without a shared process.\n- A crash or failed write leaves the original file intact and removes the temporary file on the handled failure paths.\n- Permissions, unknown sections, and section order survive an edit.\n- The version token gives users a clear `409` recovery path instead of silent data loss.\n- All writes remain project-local text files (NFR-04.001) and pass the project-directory boundary check (NFR-04.002).\n\n**Negative:**\n\n- The token is metadata-based (`mtime`, nanoseconds, length). A concurrent change that preserves both the timestamp and the length can go undetected; the token is not a content hash.\n- The check-then-rename window is a real race. Two writers can both pass the check before either renames, and the later rename wins.\n- There is no merge, conflict resolution, or three-way diff; a stale save is rejected and the user must reload and retype.\n- Atomic rename is only as strong as the underlying filesystem; network filesystems and unusual mount options are not covered.\n- The temporary file naming scheme assumes the record directory is writable; a read-only directory fails the save rather than degrading.\n\n**Risks and mitigations:**\n\n- *Token collision*: acceptable for the single-user loopback scope; if stronger guarantees are needed, a content hash or file-generation counter requires a new ADR.\n- *Residual check-then-rename race*: explicitly documented in the specification and accepted for this increment; multi-writer or network-filesystem use is out of scope.\n- *Partial writes*: `create_new` + `sync_all` + same-directory rename + cleanup on failure; tests in `tests/browser_cli.rs` cover atomicity, permission preservation, and temporary-file cleanup.\n- *Path escape or traversal*: exact-stem resolution plus `Context::ensure_within` on every path; symlink-escape tests are part of the TASK-6 suite.\n- *Lost unknown sections*: the parser/serializer preserves unknown `## ` sections and their order; tests cover this."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Optimistic concurrency with a metadata version token and atomic rename (this ADR) | Selected for TASK-6 | No locking lifecycle, works across CLI and browser, protects against partial writes, and is sufficient for a single-user loopback interface. |\n| Advisory file locking (`flock`/lock file) | Rejected | Adds stale-lock handling, platform differences, and a second failure mode; unnecessary for the single-user scope. |\n| Single-writer queue or daemon | Rejected | Adds a process, lifecycle, and IPC surface; conflicts with the dependency-free single-binary model. |\n| Last-write-wins | Rejected | Silently loses concurrent edits. |\n| Database-backed records | Rejected | Violates text-file persistence (NFR-04.001) and the single-crate/single-binary constraints. |\n| Content-hash version token | Deferred | Stronger than metadata, but more work per request; can be adopted later via a new ADR if the token proves insufficient. |"},{"heading":"References","content":"- `docs/specifications/browser-requirements.md` — TASK-6 sections 5 (JSON API), 7 (editing contract), and 9 (security).\n- `docs/requirements/non-functional/NFR-04.001.md` — text-file persistence.\n- `docs/requirements/non-functional/NFR-04.002.md` — project-directory boundary.\n- `docs/requirements/non-functional/NFR-02.002.md` — input sanitization.\n- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — Rust and Cargo.\n- `docs/architecture/adr/ADR-0004-repository-root-single-crate-layout.md` — single-crate layout.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — server and UI context.\n- Implementation: `src/browser/records.rs` (`version_token`, `valid_version_token`, `apply_edit`, `write_atomic`), `src/browser/mod.rs` (`form_post`, `api_post`), `src/context.rs` (`ensure_within`).\n- Tests: `tests/browser_cli.rs` (edit round-trip, stale version, atomic write, permissions, symlink escape).\n- Status note: implemented and verified in TASK-6/TASK-7; this ADR is `Proposed` pending explicit user acceptance."}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const treeEl = document.getElementById("tree");
const detailEl = document.getElementById("detail");
const filterEl = document.getElementById("filter");
const nodes = {};

const esc = value => String(value).replace(/[&<>\"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
const statusWord = status => (String(status || "").trim().split(/\s+/)[0] || "").toLowerCase();

function inline(source) {
  const codes = [];
  let text = esc(source).replace(/`([^`]+)`/g, (_match, code) => {
    codes.push(code);
    return "\u0000" + (codes.length - 1) + "\u0000";
  });
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) =>
    /^(https?:|#|\/|\.{0,2}\/)/.test(href) || !href.includes(":") ? '<a href="' + href + '">' + label + "</a>" : label);
  return text.replace(/\u0000(\d+)\u0000/g, (_match, index) => "<code>" + codes[Number(index)] + "</code>");
}

const isUl = line => /^\s*[-*]\s+/.test(line);
const isOl = line => /^\s*\d+[.)]\s+/.test(line);
const isTable = line => line.trim().startsWith("|");
const isFence = line => /^\s*(```|~~~)/.test(line);
const isHeading = line => /^#{3,6}\s/.test(line);
const splitRow = line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
const isSeparator = cells => cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
const startsBlock = line => !line.trim() || isHeading(line) || isUl(line) || isOl(line) || isTable(line) || isFence(line);

function renderMarkdown(source) {
  const lines = String(source || "").split("\n");
  const output = [];
  let index = 0;
  while (index < lines.length) {
    const line = lines[index];
    if (!line.trim()) { index++; continue; }
    if (isFence(line)) {
      const marker = /^\s*(```|~~~)/.exec(line)[1];
      const language = line.trim().slice(marker.length).trim();
      const code = [];
      index++;
      while (index < lines.length && !lines[index].trim().startsWith(marker)) code.push(lines[index++]);
      if (index < lines.length) index++;
      output.push("<pre><code" + (language ? ' class="language-' + esc(language) + '"' : "") + ">" + esc(code.join("\n")) + "</code></pre>");
      continue;
    }
    const heading = /^(#{3,6})\s+(.*)$/.exec(line);
    if (heading) {
      const level = Math.min(heading[1].length + 1, 6);
      output.push("<h" + level + ">" + inline(heading[2]) + "</h" + level + ">");
      index++;
      continue;
    }
    if (isTable(line)) {
      const rows = [];
      while (index < lines.length && isTable(lines[index])) rows.push(splitRow(lines[index++]));
      const hasHeader = rows.length > 1 && isSeparator(rows[1]);
      const body = hasHeader ? rows.slice(2) : rows;
      let table = '<div class="table-wrap"><table>';
      if (hasHeader) table += "<thead><tr>" + rows[0].map(cell => "<th>" + inline(cell) + "</th>").join("") + "</tr></thead>";
      table += "<tbody>" + body.map(row => "<tr>" + row.map(cell => "<td>" + inline(cell) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
      output.push(table);
      continue;
    }
    if (isUl(line) || isOl(line)) {
      const tag = isUl(line) ? "ul" : "ol";
      const marker = isUl(line) ? /^\s*[-*]\s+/ : /^\s*\d+[.)]\s+/;
      const items = [];
      while (index < lines.length && marker.test(lines[index])) items.push(lines[index++].replace(marker, ""));
      output.push("<" + tag + ">" + items.map(item => "<li>" + inline(item) + "</li>").join("") + "</" + tag + ">");
      continue;
    }
    const paragraph = [line.trim()];
    index++;
    while (index < lines.length && !startsBlock(lines[index])) paragraph.push(lines[index++].trim());
    output.push("<p>" + inline(paragraph.join(" ")) + "</p>");
  }
  return output.length ? output.join("") : '<p class="empty">—</p>';
}

function leafButton(adr) {
  const button = document.createElement("button");
  button.className = "leaf";
  button.dataset.id = adr.id;
  button.dataset.search = (adr.id + " " + adr.title + " " + adr.status).toLowerCase();
  const dot = document.createElement("span");
  dot.className = "dot " + statusWord(adr.status);
  dot.title = adr.status;
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = adr.id;
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = adr.title;
  button.append(dot, badge, label);
  button.addEventListener("click", () => select(adr.id));
  nodes[adr.id] = adr;
  return button;
}

function renderTree() {
  const fragment = document.createDocumentFragment();
  for (const adr of DATA.adrs) fragment.appendChild(leafButton(adr));
  treeEl.appendChild(fragment);
}

function renderDetail(adr) {
  const status = statusWord(adr.status);
  let content = '<div class="rid">' + esc(adr.id) + "</div>" + "<h2>" + esc(adr.title) + "</h2>" +
    '<div class="tags"><span class="tag status-' + esc(status) + '">' + esc(adr.status) + "</span></div>";
  for (const section of adr.sections) content += "<h3>" + esc(section.heading) + "</h3>" + renderMarkdown(section.content);
  detailEl.innerHTML = content;
}

function select(id) {
  document.querySelectorAll(".leaf.active").forEach(button => button.classList.remove("active"));
  const button = document.querySelector('.leaf[data-id="' + CSS.escape(id) + '"]');
  if (button) button.classList.add("active");
  if (nodes[id]) renderDetail(nodes[id]);
}

function applyFilter() {
  const query = filterEl.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".leaf").forEach(leaf => {
    const hit = !query || leaf.dataset.search.includes(query);
    leaf.classList.toggle("hidden", !hit);
    if (hit) shown++;
  });
  let note = document.getElementById("no-results");
  if (!note) {
    note = document.createElement("p");
    note.id = "no-results";
    note.className = "empty";
    note.textContent = "No matching decisions.";
    treeEl.parentNode.appendChild(note);
  }
  note.classList.toggle("hidden", shown > 0);
}

filterEl.addEventListener("input", applyFilter);
renderTree();
if (!DATA.adrs.length) {
  const empty = document.createElement("p");
  empty.className = "empty";
  empty.textContent = "No decision records yet.";
  treeEl.appendChild(empty);
}
const accepted = DATA.adrs.filter(adr => /^Accepted/i.test(adr.status)).length;
document.getElementById("counts").textContent = DATA.adrs.length + " decisions · " + accepted + " accepted";
if (DATA.adrs.length) select(DATA.adrs[0].id);
</script>
</body>
</html>
