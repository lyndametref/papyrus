  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:12px; } header h1 { font-size:17px; margin:0; } header .sub { color:var(--muted); font-size:13px; } header .back { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; } header .back:hover { text-decoration:underline; }

  .tag.status-refused { border-color:#e6c2c0; background:#f8eaea; color:#b0443f; } .tag.status-deprecated { border-color:#d8d8d3; background:#f0f0ee; color:#6b6b66; } .tag.status-superseded { border-color:#c3d0e2; background:#eaf0f7; color:#4a6fa5; }

<script id="data" type="application/json">{"adrs":[{"id":"ADR-0001","title":"Implementation Language — Rust","status":"Accepted","sections":[{"heading":"Date","content":"2026-11-01"},{"heading":"Context","content":"Papyrus is a project-level backlog and documentation manager delivered as a command-line tool. The NFR-03 group (\"Implementation and Distribution\") records validated constraints for implementation and distribution. **NFR-03.001** requires that the Papyrus application be implemented in Rust. This is a firm, decided constraint.\n\nThe available toolchain in the verified environment includes Rust 1.99.1, Cargo, and rustup. Node.js and Python 3 are available as auxiliary build/release tooling only and are not runtime dependencies of the distributed CLI."},{"heading":"Decision","content":"- Implement Papyrus in **Rust** as the sole implementation language (NFR-03.001).\n- Use **Cargo** for dependency management, reproducible builds, and the testing workflow.\n- Rust 1.99.1 (via rustup) is the pinned baseline toolchain for builds.\n- Node.js and Python 3, where used, remain build-time/auxiliary tooling only and are never runtime dependencies of the distributed CLI."},{"heading":"Consequences","content":"**Positive:**\n\n- A single compiled Rust binary keeps runtime dependencies minimal and startup fast.\n- Cargo provides reproducible builds, dependency management, and a testing workflow.\n- Rust's type system and ownership model support long-term maintainability and safety.\n\n**Negative:**\n\n- Rust compile times and a learning curve increase development cost.\n\n**Risks and mitigations:**\n\n- *Dependency drift*: audit Rust crate licenses and transitive dependencies during release review.\n- *Toolchain pinning*: keep the Rust toolchain version recorded and reproducible across builds."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Python implementation | Rejected | Violates NFR-03.001; adds a runtime interpreter dependency and packaging complexity. |\n| Go implementation | Rejected | Violates NFR-03.001. |\n| Shell/Node.js CLI | Rejected | Violates NFR-03.001; not suitable for a structured backlog/documentation manager. |"},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-03.md` — Implementation and Distribution group.\n- `docs/requirements/non-functional/NFR-03.001.md` — Implement Papyrus in Rust.\n- Verified environment: Rust 1.99.1, Cargo, rustup."}]},{"id":"ADR-0002","title":"Distribution Format — amd64 `.deb` Packages for Debian Trixie, Forky, and Later Releases","status":"Superseded by ADR-0003","sections":[{"heading":"Date","content":"2026-11-01"},{"heading":"Context","content":"Papyrus is a project-level backlog and documentation manager delivered as a command-line tool. The NFR-03 group (\"Implementation and Distribution\") records validated constraints for implementation and distribution. **NFR-03.002** requires that Papyrus be distributed as `.deb` packages for the amd64 architecture on Debian Trixie, Forky, and later Debian releases.\n\nThe distribution target is amd64 Debian `.deb` packages. The available tooling in the verified environment includes `dpkg-deb`, Node.js (for browser UI assets at build time only), and Python 3 (auxiliary build/release tooling).\n\nNFR-03.002 contains an explicit open question: the phrase \"later Debian releases\" does not specify a terminal release boundary or which future releases must be verified. This ADR records the decision as stated and captures that open question rather than resolving it silently."},{"heading":"Decision","content":"- Distribute Papyrus as **amd64 `.deb` packages** targeting **Debian Trixie, Forky, and later Debian releases** (NFR-03.002).\n- Build the Debian package artifacts with the available `dpkg-deb` tooling; package metadata and control files are maintained as part of the release process.\n- Node.js is available for browser UI asset tooling at build time only; it is not a runtime dependency of the distributed CLI.\n- Python 3 is available as auxiliary build/release tooling; it is not a runtime dependency of the distributed CLI."},{"heading":"Consequences","content":"**Positive:**\n\n- `.deb` packaging for amd64 is straightforward with `dpkg-deb` and matches the required distribution format.\n\n**Negative:**\n\n- Debian package metadata (control fields, dependencies, versioning) must be maintained and validated per release.\n- Each claimed supported Debian release requires installation and verification work.\n\n**Risks and mitigations:**\n\n- *Unbounded \"later releases\" claim*: until the open question is resolved, only Trixie and Forky are advertised as supported; additional releases require explicit verification before being claimed (see Open Questions).\n- *glibc/toolchain compatibility*: verify the built binary runs on each claimed release's glibc; prefer a conservative baseline.\n- *Dependency drift*: audit Rust crate licenses and transitive dependencies during release review."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| AppImage / Flatpak / tarball distribution | Rejected | Violates NFR-03.002, which requires amd64 `.deb` packages. |\n| Additional architectures (arm64, etc.) | Out of scope | NFR-03.002 specifies amd64 only; not added without a requirement change. |"},{"heading":"Open Questions","content":"- **NFR-03.002 — \"later Debian releases\" boundary.** The phrase does not specify a terminal release boundary or which future releases must be verified. This ADR does not resolve it. Follow-up: define a supported-release list and verification matrix (install + smoke test on each claimed release) before advertising support beyond Debian Trixie and Forky. Tracked against NFR-03.002's Verification Method."},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-03.md` — Implementation and Distribution group.\n- `docs/requirements/non-functional/NFR-03.002.md` — Distribute Papyrus as a Debian Package.\n- Verified environment: `dpkg-deb`, Node.js, Python 3.\n- Approval note: Distribution format decision approved by the user on 2026-11-02; status changed from Proposed to Accepted. Open question on \"later Debian releases\" boundary remains unresolved (see Open Questions)."}]},{"id":"ADR-0003","title":"Supported Debian Release Target — Forky Only (amd64 `.deb`)","status":"Accepted","sections":[{"heading":"Date","content":"2026-11-02"},{"heading":"Context","content":"Papyrus is a project-level backlog and documentation manager delivered as a command-line tool. The NFR-03 group (\"Implementation and Distribution\") records validated constraints for implementation and distribution. **NFR-03.002** requires that Papyrus be distributed as `.deb` packages for the amd64 architecture on Debian Trixie, Forky, and later Debian releases.\n\n**ADR-0002** (Accepted) advertised support for Debian Trixie, Forky, and later releases. During refinement of TASK-4 it was determined that Debian Trixie cannot be easily tested in the available environment. To avoid claiming support that is not verified, Papyrus narrows its advertised and verified support to **Debian Forky only** (amd64 `.deb`). Debian Trixie and any other Debian release are **not** claimed or verified as supported.\n\nThis ADR **supersedes ADR-0002**. ADR-0002's body remains frozen; only its status transitions to `Superseded` once this ADR is accepted.\n\nNFR-03.002 still states \"Debian Trixie, Forky, and later Debian releases\" and therefore does not yet match this decision. Amending NFR-03.002 is out of architect scope and is tracked as an open item for the requirements-engineer (see Open Questions)."},{"heading":"Decision","content":"- Advertise and verify support for **Debian Forky only**, delivered as amd64 `.deb` packages (supersedes ADR-0002).\n- Do **not** claim or verify support for Debian Trixie or any other Debian release.\n- Only releases that are explicitly installed and smoke-tested may be advertised as supported; at this time that set is Forky alone.\n- Build the Debian package artifacts with the available `dpkg-deb` tooling; package metadata and control files are maintained as part of the release process."},{"heading":"Consequences","content":"**Positive:**\n\n- The advertised support set matches what can actually be verified in the available environment, avoiding unverified support claims.\n- Verification matrix is reduced to a single, testable release.\n\n**Negative:**\n\n- Users on Debian Trixie or other releases are not covered by the supported-release commitment.\n- Future releases require explicit verification work before being added to the supported set.\n\n**Risks and mitigations:**\n\n- *Support drift*: any future addition to the supported set requires an explicit verification pass and a follow-up ADR/requirement update.\n- *glibc/toolchain compatibility*: verify the built binary runs on Debian Forky's glibc; prefer a conservative baseline.\n- *Dependency drift*: audit Rust crate licenses and transitive dependencies during release review."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Trixie + Forky (as ADR-0002) | Superseded | Trixie cannot be easily tested in the available environment; unverified support is not claimed. |\n| Forky only | Accepted (this ADR) | Matches the verifiable environment; avoids unverified support claims. |\n| All Debian releases | Rejected | Unbounded, unverifiable claim; violates the verification discipline. |"},{"heading":"Open Questions","content":"- **NFR-03.002 amendment (requirements-engineer).** NFR-03.002 still requires amd64 `.deb` on Debian Trixie, Forky, and later Debian releases. It must be amended to Debian Forky only to match this ADR. This is out of architect scope; tracked as an open item for the requirements-engineer.\n- **\"later Debian releases\" boundary.** No future release is claimed; adding one requires explicit verification and a requirement/ADR update."},{"heading":"References","content":"- `docs/architecture/adr/ADR-0002-distribution-format-amd64-deb-packages.md` — superseded by this ADR.\n- `docs/requirements/non-functional/NFR-03.md` — Implementation and Distribution group.\n- `docs/requirements/non-functional/NFR-03.002.md` — Distribute Papyrus as a Debian Package (to be amended).\n- Verified environment: `dpkg-deb`, Node.js, Python 3."}]},{"id":"ADR-0004","title":"Repository Root Single-Crate Layout for the Papyrus Rust Crate","status":"Accepted","sections":[{"heading":"Date","content":"2026-11-02"},{"heading":"Context","content":"Papyrus is a single Rust command-line tool and the repository is the project itself; it is not a multi-application monorepo. **NFR-03.001** requires that Papyrus be implemented in Rust, and **ADR-0001** selects Rust with Cargo as the implementation language and build system. The **TASK-1 specification** (`docs/specifications/rust-cli-and-debian-package-baseline.md`) requires a minimal single-crate layout (`src/main.rs` + `src/lib.rs`), explicitly excludes a multi-crate workspace, and assumes any move to a workspace or to module boundaries beyond that minimal split requires a new ADR.\n\n`AGENTS.md` lists generic default write scopes such as `apps/rust/**`, `apps/backend/**`, and `apps/webFrontend/**` for multi-application projects. No requirement, specification, or ADR mandates an `apps/` subdirectory for Papyrus, and Papyrus has no other application components that would justify one. The current repository already places `Cargo.toml`, `src/`, `tests/`, `rust-toolchain.toml`, `scripts/`, and `packaging/` at the repository root, and both `build-deb.sh` and `docs/packaging.md` reference a root-level build producing `target/release/papyrus`.\n\nThis ADR formalizes that the root-level single-crate placement is deliberate rather than incidental, so that the layout is not silently \"corrected\" into an `apps/` directory and so that any future relocation is treated as an explicit architectural change."},{"heading":"Decision","content":"- Place the Papyrus Rust crate at the **repository root**: `Cargo.toml`, `src/` (with `src/main.rs` + `src/lib.rs`), `tests/`, `rust-toolchain.toml`, and build/packaging assets (`scripts/`, `packaging/`, `build-deb.sh`) all live at the repository root.\n- Keep Papyrus as a **single crate** with binary and library targets; do **not** introduce a Cargo workspace and do **not** nest the crate under an `apps/\u003cname\u003e/` directory.\n- Treat the generic `apps/**` write scopes in `AGENTS.md` as **not applicable** to Papyrus; Papyrus-specific code and build artifacts live at the repository root.\n- Any future relocation of the crate into `apps/\u003cname\u003e/` (or any other directory), or conversion to a multi-crate workspace, **requires a new ADR and an accompanying refactor**. Ad-hoc moves are not permitted."},{"heading":"Consequences","content":"**Positive:**\n\n- Matches the minimal single-crate layout required by the TASK-1 specification and ADR-0001 without added indirection.\n- Cargo commands (`cargo build`, `cargo test`) run from the repository root, matching existing build and packaging references (`target/release/papyrus`, `build-deb.sh`, `docs/packaging.md`).\n- Avoids an unnecessary directory level and keeps the project navigable as the project itself.\n\n**Negative:**\n\n- Contributors familiar with the generic multi-app convention must be aware that Papyrus does not use an `apps/` directory; its write scope is the repository root.\n- If Papyrus is later absorbed into a larger multi-application repository, relocation and path updates will be required (mitigated by requiring a new ADR and refactor).\n\n**Risks and mitigations:**\n\n- *Accidental relocation*: guard against silent moves by treating the root layout as an accepted decision; any change requires a new ADR.\n- *Scope confusion*: document in architecture/AGENTS context that the generic `apps/**` scopes do not apply to Papyrus."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Repository root single crate (this ADR) | Accepted | Matches the TASK-1 minimal layout and ADR-0001; simplest; consistent with existing root-level build/packaging references. |\n| Nest under `apps/rust/` or `apps/papyrus/` | Rejected | No requirement or ADR mandates an `apps/` directory for Papyrus; adds path indirection and breaks existing build/packaging references without benefit. |\n| Cargo workspace with multiple crates | Rejected | Violates the TASK-1 assumption of a minimal single-crate layout; out of scope and requires a new ADR. |"},{"heading":"References","content":"- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — Rust + Cargo implementation language.\n- `docs/specifications/rust-cli-and-debian-package-baseline.md` — TASK-1 spec (minimal single-crate layout, no workspace).\n- `docs/requirements/non-functional/NFR-03.001.md` — Implement Papyrus in Rust.\n- `AGENTS.md` — generic default write scopes (`apps/rust/**`, etc.), not binding for Papyrus.\n- `build-deb.sh`, `docs/packaging.md` — root-level build references (`target/release/papyrus`).\n- Approval note: accepted per explicit user request on 2026-11-02; index regeneration left to the caller."}]},{"id":"ADR-0005","title":"Embedded Dependency-Free HTTP Server and Server-Rendered Browser UI","status":"Accepted — approved by explicit user confirmation on 2026-11-04 (TASK-28). Body frozen per ADR lifecycle.","sections":[{"heading":"Date","content":"2026-11-03"},{"heading":"Context","content":"TASK-6 delivers the first increment of `papyrus browser`: an offline, project-local web interface over business-requirement and non-functional-requirement records. The behavior contract is `docs/specifications/browser-requirements.md`, traced to REQ-06.002, BR-004, NFR-01.002, NFR-01.003, NFR-02.002, NFR-04.002, and NFR-05.001.\n\nThe browser content inventory is delivered incrementally toward NFR-01.002 (\"all Papyrus content\"): this ADR fixes the transport, asset delivery, rendering, module boundaries, and security baseline that every later increment reuses; each increment adds document types and routes without changing this baseline. The module and route structure is intentionally extensible so a new document type is added by one module/route entry rather than a redesign.\n\nADR-0001 selects Rust and ADR-0004 fixes the repository-root single crate. The TASK-6 specification additionally forbids a web framework, an async runtime, a templating engine, a Markdown renderer, a second crate/application, and any new runtime dependency. Those constraints leave an unresolved architectural question: how the HTTP interface is built, how UI assets are delivered, and what security posture applies. The answer is cross-cutting because later browser increments (TASK-11, TASK-15, TASK-19, TASK-23 … TASK-27) and packaging (TASK-7, binary-only `.deb`) inherit it.\n\nThe alternatives considered were a Rust web framework (for example axum or actix-web), an async runtime (tokio), a template engine (askama or tera), externally served assets, an external web server or CGI, and a WebView/Tauri shell. Each adds dependencies, runtime files, or a second execution model that conflicts with the offline, dependency-free, single-binary packaging requirement."},{"heading":"Decision","content":"- Implement the browser as a **blocking HTTP/1.1 server** using only `std::net::TcpListener`, `std::net::TcpStream`, and `std::io`. No web framework, async runtime, or new dependency.\n- Serve **exactly one request per connection** with `Connection: close`; handle each accepted connection on its own `std::thread`; cap concurrent connections at 16; reject the 17th immediately with `503`; use 5-second read and write timeouts; support only `GET`, `HEAD`, and `POST`; reject `Transfer-Encoding`, keep-alive, pipelining, TLS, HTTP/2, WebSocket, and compression.\n- Route against a **fixed route table** after single-pass percent-decoding. Request paths are never joined to filesystem paths. Record IDs are validated and resolved by exact match against active directory listings.\n- Render **server-side HTML** from templates embedded with `include_str!` (`src/browser/templates/*.html`) using a fixed `{{name}}` placeholder syntax. Substitution is a single pass over the template; substituted values are never re-scanned, so a value containing `{{...}}` is emitted literally, and unknown placeholders are left untouched. Escaped values are escaped at render time; internal fragments (sidebar, breadcrumb, section, metadata, form) are pre-escaped raw fragments. There is no template engine and no expression evaluation.\n- Embed CSS and JavaScript with `include_str!` (`src/browser/app.css`, `src/browser/app.js`). No CDN, web font, icon font, image, remote `@import`, or remote `url(...)`. JavaScript is optional progressive enhancement (dirty-form guard and narrow-viewport sidebar toggle); every page works without it.\n- Provide a minimal read/write **JSON API** (`GET /api/requirements`, `GET /api/doc/{id}`, `POST /api/doc/{id}`) using `serde_json`, backed by the same record access as the HTML routes.\n- Adopt the security posture fixed by the specification: no authentication, authorization, accounts, sessions, cookies, or TLS; loopback bind by default; non-loopback bind allowed but warned about; `Host` and `Origin` validation plus strict `Content-Type` checks as the CSRF and DNS-rebinding mitigation; HTML escaping, CSP, `X-Frame-Options: DENY`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, and `Cache-Control: no-store`; no outbound network access; no absolute filesystem paths in responses.\n- Keep the module boundaries inside the single crate: `browser::http` (protocol parsing/writing), `browser::records` (record indexing, parsing, validation, atomic persistence), `browser::render` (templates and escaping), and `browser::mod` (option resolution, server lifecycle, routing, handlers, JSON shaping). Configuration keys and their validation live in `config`; project-directory enforcement stays in `context`. Configuration *loading* orchestration currently resides in `commands` (`crate::commands::load_effective_config`) and is a deferred refactor — this ADR fixes key ownership and validation, not the call site.\n- Compile all assets into the binary so the `.deb` contains only `/usr/bin/papyrus` and the copyright file; no runtime asset directory is required."},{"heading":"Consequences","content":"**Positive:**\n\n- The browser works fully offline and needs no runtime dependency, external server, asset directory, or network fetch (NFR-01.003).\n- The package stays a single binary plus copyright, matching ADR-0002/ADR-0003 packaging and TASK-7 verification.\n- No new supply-chain surface or license audit is introduced beyond the existing dependencies.\n- The fixed route table and record-ID resolution avoid path traversal and keep the security model auditable.\n- The single-crate layout and module split remain consistent with ADR-0004.\n\n**Negative:**\n\n- HTTP parsing, header handling, and response writing are maintained in-project rather than delegated to a framework; protocol defects are our responsibility.\n- Concurrency is limited to 16 blocking threads with no keep-alive; this is adequate for a single-user loopback interface but not for multi-user or high-throughput use.\n- Rendering is hand-rolled: the `{{name}}` substitution and raw-fragment allowlist must be maintained carefully, and there is no template engine safety net.\n- No authentication or TLS means a non-loopback bind exposes an unauthenticated read/write interface to the network; the warning is the only guard.\n- Browser-version support (NFR-05.001) is verified at markup/asset level, not by driving real GUI browsers.\n\n**Risks and mitigations:**\n\n- *Protocol and request-smuggling defects*: covered by the contract tests in `tests/browser_cli.rs` (request limits, duplicate `Content-Length`, `Transfer-Encoding`, method/status matrix).\n- *XSS and injection*: render-time escaping, `serde_json` for JSON, CSP without `'unsafe-inline'`, and no inline scripts or event handlers.\n- *DNS rebinding and CSRF*: strict `Host`/`Origin` validation and `Content-Type` enforcement; no session or credential exists to protect.\n- *Resource exhaustion*: request-line, target, header, body, connection, and timeout caps.\n- *Per-request re-reads*: every request re-reads configuration and record files from disk (specification section 3.18); per-record config re-reads and duplicate record parsing in `browser::records` are accepted for this increment and tracked as performance follow-ups.\n- *Deferred follow-ups (tracked, not implemented here)*: config loading moved out of `commands`; per-record config re-reads and duplicate record parsing; template placeholder hardening tests; test temp-directory hygiene (older suites use `std::env::temp_dir()`); manpage/README over-promising (\"both backlog and documentation stores\"); NFR-01.002 scope clarification; NFR-05.001 real-browser (GUI) verification. Owners implied by affected area.\n- *Future scale or feature pressure*: introducing a framework, async runtime, template engine, or external asset pipeline requires a new ADR; this ADR is the baseline those changes must supersede."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Blocking `std::net` server, embedded templates/assets (this ADR) | Selected for TASK-6 | Meets offline, dependency-free, single-binary, and single-crate constraints; smallest operational surface. |\n| Web framework (axum, actix-web, warp) | Rejected | Adds dependencies and an async runtime; conflicts with the TASK-6 no-new-dependency constraint. |\n| Template engine (askama, tera, handlebars) | Rejected | Adds a dependency and build complexity; the placeholder set is small and fixed. |\n| External web server or CGI | Rejected | Requires a second runtime/process and runtime files; not offline/self-contained. |\n| WebView/Tauri desktop shell | Rejected | Adds a platform UI stack and packaging surface far beyond the local-browser requirement. |\n| Markdown rendering in the browser | Rejected | Out of scope for this increment; displaying stored text literally is the specified behavior. |"},{"heading":"References","content":"- `docs/specifications/browser-requirements.md` — TASK-6 behavior contract, HTTP routes, security, assets, browser support.\n- `docs/specifications/search-browser-milestone-packaging-and-verification.md` — TASK-7 packaging and embedded-asset verification.\n- `docs/requirements/non-functional/NFR-01.002.md`, `NFR-01.003.md`, `NFR-02.001.md`, `NFR-02.002.md`, `NFR-04.001.md`, `NFR-04.002.md`, `NFR-05.001.md`.\n- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — Rust and Cargo.\n- `docs/architecture/adr/ADR-0004-repository-root-single-crate-layout.md` — single-crate layout.\n- Implementation: `src/browser/mod.rs`, `src/browser/http.rs`, `src/browser/records.rs`, `src/browser/render.rs`, `src/browser/templates/`, `src/browser/app.css`, `src/browser/app.js`.\n- Tests: `tests/browser_cli.rs`, `tests/search_browser_smoke.rs`.\n- Status note: implemented and verified in TASK-6/TASK-7; accepted by explicit user confirmation on 2026-11-04 (TASK-28)."}]},{"id":"ADR-0006","title":"Optimistic Concurrency and Atomic Record Writes for Browser Edits","status":"Accepted — approved by explicit user confirmation on 2026-11-04 (TASK-29). Body frozen per ADR lifecycle.","sections":[{"heading":"Date","content":"2026-11-03"},{"heading":"Context","content":"The TASK-6 browser is the first Papyrus surface that writes requirement records while the CLI can also edit the same files. The browser has no session, no lock manager, and no database; records are plain UTF-8 Markdown files inside the project directory (NFR-04.001, NFR-04.002). The behavior contract is `docs/specifications/browser-requirements.md` sections 7.10–7.12.\n\nScope note: this ADR governs edits made through the browser. The CLI (`src/requirement.rs`: `create`, `create_group`, `edit`, `deprecate`, `restore`) writes the same record files in the same directories, but its write path is non-atomic (`fs::write` / `fs::rename` with no temporary file or `sync_all`), carries no version token, and `edit` re-renders the document from parsed fields, so it does not preserve unknown `## ` sections or section order. The two surfaces can therefore race, and a CLI edit can silently overwrite a browser edit or drop editor-added sections. Reconciling the CLI with this contract (atomic writes, optimistic concurrency, section preservation) is deferred to a follow-up task and is not part of this ADR. All paths on both surfaces still pass through `Context::ensure_within` (NFR-04.002).\n\nThe problem is twofold: a save must not silently overwrite a file changed after the edit form was rendered, and a crash or concurrent read must never observe a partially written record. The alternatives considered were advisory file locking, a single-writer queue or daemon, last-write-wins, a lock file, and moving records into a database. Locking and daemons add lifecycle and stale-lock failure modes; last-write-wins loses data; a database violates the text-file and single-crate constraints."},{"heading":"Decision","content":"- Use **optimistic concurrency without locking**. The version token is `\"\u003cmtime-seconds\u003e.\u003cmtime-nanos\u003e.\u003clength\u003e\"` of the record file at render/read time. It is opaque to clients and is exposed as the `version` member of the JSON record and as a hidden `version` form field.\n- On `POST`, a missing or malformed version token is `400`; a token that differs from the current on-disk token is `409 Conflict` with no write; a matching token proceeds to the write.\n- Write records **atomically within their own directory**: create `\u003cid\u003e.md.tmp` with `create_new(true)` (retrying with a numeric suffix on collision), write UTF-8 bytes, call `sync_all`, copy the original file's permissions, rename the temporary file over the target, sync the directory on a best-effort basis, and remove the temporary file on every handled failure path so the original file is left untouched. (A crash can still leave a temporary file behind; see Risks.)\n- Accept and document the residual race: the version check and the rename are not one atomic operation. This is acceptable for a single-user loopback interface. It is not a multi-writer guarantee.\n- Save-then-reread: a successful form save returns `303 See Other` and the follow-up `GET` re-reads the file from disk; a successful JSON save re-reads and returns the updated record. The server keeps no cached record content between requests.\n- Resolve record IDs by exact, case-sensitive match against the active directory listing and never concatenate request values into a path. Route every read and write path (record directory, record file, temporary file) through `Context::ensure_within` against the canonical project directory. Symlink escapes are rejected before any content is read or written.\n- Preserve unknown and editor-added `## ` sections content-identically, preserve the original section order, keep the first heading as `# \u003cID\u003e \u003ctitle\u003e`, and terminate the file with a single LF newline."},{"heading":"Consequences","content":"**Positive:**\n\n- No lock manager, lock file, daemon, or stale-lock recovery is needed; the CLI and browser can coexist without a shared process.\n- A crash or failed write leaves the original file intact and removes the temporary file on the handled failure paths.\n- Permissions, unknown sections, and section order survive an edit.\n- The version token gives users a clear `409` recovery path instead of silent data loss.\n- All writes remain project-local text files (NFR-04.001) and pass the project-directory boundary check (NFR-04.002).\n\n**Negative:**\n\n- The token is metadata-based (`mtime`, nanoseconds, length). A concurrent change that preserves both the timestamp and the length can go undetected; the token is not a content hash.\n- The check-then-rename window is a real race. Two writers can both pass the check before either renames, and the later rename wins.\n- There is no merge, conflict resolution, or three-way diff; a stale save is rejected and the user must reload and retype.\n- Atomic rename is only as strong as the underlying filesystem; network filesystems and unusual mount options are not covered.\n- The temporary file naming scheme assumes the record directory is writable; a read-only directory fails the save rather than degrading.\n\n**Risks and mitigations:**\n\n- *Token collision*: acceptable for the single-user loopback scope; if stronger guarantees are needed, a content hash or file-generation counter requires a new ADR.\n- *Residual check-then-rename race*: explicitly documented in the specification and accepted for this increment; multi-writer or network-filesystem use is out of scope.\n- *Partial writes*: `create_new` + `sync_all` + same-directory rename + cleanup on every handled failure path; tests in `tests/browser_cli.rs` cover atomicity, permission preservation, and temporary-file cleanup. A process crash or kill between `create_new` and the rename can leave `\u003cid\u003e.md.tmp` or `\u003cid\u003e.md.tmp.\u003cn\u003e` files in the record directory; they are inert (not indexed or served) and the original file stays intact, but they are not removed automatically. Cleanup is manual or a future startup sweep; deferred.\n- *Path escape or traversal*: exact-stem resolution plus `Context::ensure_within` on every path; symlink-escape tests are part of the TASK-6 suite.\n- *Lost unknown sections*: the parser/serializer preserves unknown `## ` sections and their order; tests cover this.\n- *CLI non-atomicity*: as noted in Context, CLI record writes are not atomic and not version-checked; they can race with browser edits and drop unknown sections. Mitigation is documentation of the limitation plus a follow-up task to align CLI writes with this contract.\n- *Duplicate parsing*: record reading uses `records::parse_doc`, the CLI uses `requirement::parse_document`, and writing uses `apply_edit`; the three implementations can drift. Mitigation is shared tests and a future refactor to a single parser/serializer.\n- *Per-request config re-reads*: every request re-reads the effective configuration from disk (browser-requirements.md section 3.18); this is expected for the no-cache, no-session model and is not a defect."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Optimistic concurrency with a metadata version token and atomic rename (this ADR) | Selected for TASK-6 | No locking lifecycle, works across CLI and browser, protects against partial writes, and is sufficient for a single-user loopback interface. |\n| Advisory file locking (`flock`/lock file) | Rejected | Adds stale-lock handling, platform differences, and a second failure mode; unnecessary for the single-user scope. |\n| Single-writer queue or daemon | Rejected | Adds a process, lifecycle, and IPC surface; conflicts with the dependency-free single-binary model. |\n| Last-write-wins | Rejected | Silently loses concurrent edits. |\n| Database-backed records | Rejected | Violates text-file persistence (NFR-04.001) and the single-crate/single-binary constraints. |\n| Content-hash version token | Deferred | Stronger than metadata, but more work per request; can be adopted later via a new ADR if the token proves insufficient. |"},{"heading":"References","content":"- `docs/specifications/browser-requirements.md` — TASK-6 sections 5 (JSON API), 7 (editing contract), and 9 (security).\n- `docs/requirements/non-functional/NFR-04.001.md` — text-file persistence.\n- `docs/requirements/non-functional/NFR-04.002.md` — project-directory boundary.\n- `docs/requirements/non-functional/NFR-02.002.md` — input sanitization.\n- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — Rust and Cargo.\n- `docs/architecture/adr/ADR-0004-repository-root-single-crate-layout.md` — single-crate layout.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — server and UI context.\n- Implementation: `src/browser/records.rs` (`version_token`, `valid_version_token`, `apply_edit`, `write_atomic`), `src/browser/mod.rs` (`form_post`, `api_post`), `src/context.rs` (`ensure_within`). CLI write path (non-atomic, out of scope of this contract): `src/requirement.rs` (`create`, `create_group`, `edit`, `deprecate`, `restore`).\n- Tests: `tests/browser_cli.rs` (edit round-trip, stale version, atomic write, permissions, symlink escape). Unit tests in `src/browser/records.rs` cover token shape, section preservation, and validation.\n- Status note: implemented and verified in TASK-6/TASK-7; accepted by explicit user confirmation on 2026-11-04 (TASK-29)."}]},{"id":"ADR-0007","title":"YAML Front Matter as the Single Record Metadata Source","status":"Superseded by ADR-0012 on 2026-11-11 — the front-matter-as-single-source and patch decisions carry over unchanged, but this ADR's Backlog.md key-set, Backlog-compatible serialization, storage-ID values, and lazy conversion to the Backlog.md layout contradict NFR-04.004 (adopted 2026-11-11) and REQ-01.005 (single Papyrus ID space). Body frozen; ADR-0012 restates the metadata contract without them, ADR-0010 owns the layout, and ADR-0013 owns the write path.","sections":[{"heading":"Date","content":"2026-11-08 (status: Superseded, 2026-11-11)"},{"heading":"Context","content":"REQ-05.010 (front matter on every managed Markdown record), REQ-05.011 (metadata maintained by every command, lazy per-record migration on first read and first write), REQ-06.003 (browser page describing record types and lifecycles), REQ-06.004 (CLI and browser read front matter and write it back), REQ-01.005 (two ID spaces with translation), and NFR-04.003 (task and milestone interoperability with Backlog.md) are recorded. The behavior contract is the requirement files; this ADR fixes how record metadata is represented and where it lives.\n\nCurrent implementation shape (verified in `src/` and the corpus):\n\n- Every record module (`requirement`, `task`, `milestone`, `release`, `decision`, `glossary`, `rule`, `ui_spec`, `ui_mockup`, `audit`, `tech_spec`) owns its own heading parser, `## ` section parser, renderer, and `fs::write` call. Metadata such as task `status`, `assignee`, `milestone`, `labels`, `dependencies`, milestone `release`, and audit `type` is stored as `## ` sections of the Markdown body.\n- `browser::records::parse_doc` treats line 1 of every file as the `# \u003cID\u003e \u003ctitle\u003e` heading and knows nothing about front matter. Its `apply_*_edit` functions rebuild the file as `# heading` + preamble + `## ` sections, so a leading front-matter block would be destroyed (and is currently misparsed as the heading).\n- The corpus starts in three shapes: (a) no Markdown record under `docs/` carries front matter today (144 `.md` files, zero leading `---` blocks); (b) `backlog/tasks/*.md` already carry the complete Backlog.md key set; (c) `backlog/milestones/*.md` carry only `id` and `title`.\n- `yaml_serde` 0.10 is already a runtime dependency (config load and init), so YAML parsing needs no new crate.\n- Accepted ADR bodies are immutable (\"Body frozen per ADR lifecycle\"), and ADR files live under `docs/architecture/adr/`; decision records are therefore a managed record type whose body cannot be re-rendered from a model.\n\nThe forces are: one metadata source per field (no double storage), lossless preservation of everything a command does not change, the same values in CLI and browser, Backlog.md round-trip for tasks and milestones, a single visible migration instead of an indefinite mixed corpus, and no new runtime dependency or second storage format."},{"heading":"Decision","content":"1. **A YAML front-matter block is mandatory for every Markdown record created or migrated by Papyrus.** The block starts at byte 0 of the file, opens with a line containing exactly `---`, and closes with a line containing exactly `---` followed by a blank line before the body. Nothing precedes it. Records created by Papyrus always carry it; existing records gain it on first read or first write (decision 9), so a record that has never been read or written may still lack it, and the corpus converges record by record.\n\n2. **Field map.** Every record type carries the general keys, in this canonical order:\n\n   `id`, `title`, `created_date`, `updated_date`, `labels`, `references`\n\n   Type-specific keys are added after the general keys:\n\n   | Record type | Additional front-matter keys | Source requirement |\n   |---|---|---|\n   | Task | `status`, `assignee` (YAML list), `milestone`, `dependencies`, `ordinal`, `documentation`, `type` — the complete Backlog.md key set | REQ-05.010, NFR-04.003 |\n   | Milestone | `release` (additive over Backlog.md's `id` and `title`) | REQ-05.010, NFR-04.003 |\n   | Release | none (general keys only; REQ-03.002 defines no stored release state) | REQ-05.010 |\n   | Decision | `superseded_by` (optional) | REQ-05.010 |\n   | Audit record | `type` | REQ-05.010 |\n   | Business requirement, NFR, glossary, UI spec, tech spec, business rule | none | REQ-05.010 |\n   | UI mockup | not applicable — HTML, excluded (decision 11) | REQ-05.008, REQ-05.010 |\n\n   For tasks and milestones, the `id` value is the Backlog.md storage ID (`TASK-18`, `m-0`), not the Papyrus display ID (`TASK-018`, `MS-001`); the same applies to reference-valued keys `milestone` and `dependencies`. ADR-0008 owns that mapping.\n\n3. **Front matter is authoritative and is the only metadata store.** Values are never mirrored into a `## ` section. The following body sections are retired as metadata carriers: task `## Status`, `## Assignee`, `## Milestone`, `## Labels`, `## Dependencies`; milestone `## Release`; audit `## Audit Type`. New files never write them; a write to an existing file removes them after moving their values into front matter. Body sections that express document content are retained unchanged: `## Description`, `## User Story`, `## Group`, `## Acceptance Criteria`, `## Comments`, `## Implementation Notes`, `## Definition`, `## Rationale`, `## Applicability`, `## Requirements` (business-rule traceability, not general references), `## View`, `## Content`, `## Decision`, `## Context`, `## Consequences`.\n\n4. **The `# \u003cID\u003e \u003ctitle\u003e` heading policy differs by record family (product-confirmed).**\n   - Tasks and milestones: no `#` heading. The Backlog.md body has none and NFR-04.003 requires the Backlog.md body shape. ADR-0008 owns the exact body layout.\n   - All other Markdown record types: the `# \u003cID\u003e \u003ctitle\u003e` line is retained as the body title line because accepted ADR bodies are frozen and cannot lose it, because existing readers, search excerpts, and the documentation indexes rely on it, and because a human opening the file benefits from it. It is *not* an independent metadata source: readers take `id` and `title` from front matter; every writer regenerates the heading from the front-matter values so the two cannot diverge. For record types whose `id` is a Papyrus ID, the heading shows the Papyrus ID (ADR-0008 decision 4).\n   - Frozen ADR bodies keep their existing heading and sections; the added block is the only change made to an existing decision file.\n\n5. **One shared front-matter implementation owns all parsing and serialization.** A `src/record/frontmatter` module (layout fixed by ADR-0009) provides:\n   - detection of the leading block and separation of `{ raw_front_matter, body }`;\n   - a parse result that keeps key order, raw scalar text, and unknown keys;\n   - typed accessors for the general keys and per-type extras declared in one key registry;\n   - serialization that emits the canonical key order and Backlog-compatible quoting, and a **patch** operation that rewrites only the changed keys while preserving unknown keys, key order, and comments.\n   No record module and no browser code may hand-format a `---` block, re-serialize an untouched block, or parse front matter with ad-hoc string splitting.\n\n6. **YAML handling uses the existing `yaml_serde` dependency.** Reading parses the block with `yaml_serde`; writing serializes only scalar/list values under Papyrus control and patches them into the existing block text. A full document re-serialization that would reorder or requote foreign keys is prohibited because it breaks NFR-04.003 round trips.\n\n7. **Timestamp format.** `created_date` and `updated_date` are quoted ISO-8601 UTC strings at second precision: `'YYYY-MM-DDTHH:MM:SSZ'` (matching observed Backlog.md values). `created_date` is written once at creation and never changed by a later command. `updated_date` is refreshed by every write path (create, edit, archive, restore, deprecate, supersede, browser save). A save that changes nothing does not refresh it because no write happens. A small in-project UTC formatter is used; no new time-formatting dependency is added (ADR-0001 toolchain, ADR-0005 dependency baseline).\n\n8. **Reading is front-matter-first with fallbacks.** Parsing order for a record field: front-matter key → legacy `## ` section → heading → default. This keeps unmigrated files readable during the change and makes Backlog.md files readable immediately. For tasks and milestones, ID resolution accepts both ID spaces and normalizes before comparison (ADR-0008 decision 4).\n\n9. **Existing records are migrated lazily, per record, on first read and first write (product decision, revised 2026-11-08).** There is no bulk pass and no dedicated migration command: the first read or first write of a managed Markdown record adds the block to that file if it lacks one, and the corpus converges record by record. Migration is idempotent: once a record carries front matter, neither a later read nor a later write re-runs it.\n   - **Scope.** Only files claimed by a record descriptor are migrated (decision 15). The managed record types are: task, milestone, release, decision, business requirement, non-functional requirement, glossary term, UI specification, technical specification, business rule, audit record. Prose Markdown that is not a managed record (`docs/specifications/`, `docs/domain-model/`, `docs/business-processes/`, `README.md`, workflow docs) and UI mockups/HTML are excluded.\n   - **Bodies are untouched.** A frozen ADR body keeps its heading, sections, and prose; only the block is inserted. Task and milestone files already in the Backlog.md storage shape keep their bodies and every marker comment byte-identical; records whose front matter is already complete are not rewritten at all. A task or milestone still in the legacy Papyrus shape (heading plus `## ` metadata sections) is converted to the storage shape on its first read or first write, which is a body change beyond the block; ADR-0008 decision 8 owns that case, and it is the only migration path allowed to alter a task/milestone body.\n   - **Metadata-only and idempotent.** Migration is expressed as a front-matter-only patch through the shared patcher (ADR-0009); it never re-renders a body. A record that already carries front matter is a byte-identical no-op on both read and write, and this is part of the acceptance test. Lazy migration on a read path must not corrupt or partially write the file if the patch cannot be applied; the read-path write implications are recorded in Consequences.\n   - **Values with no stored source.** `created_date` is taken from the record's own date section where the type has one (decision `## Date`), otherwise from the file's modification time; `updated_date` is the migration time for every file whose block is created or extended. This is best-effort provenance, not a historical claim, and is documented as such.\n   - **Ordering relative to the shared envelope (ADR-0009).** Lazy migration runs only after the shared reader/patcher and the task/milestone ID translation exist, because the migration must not contain a second parser and because task/milestone blocks carry storage IDs. Task and milestone conversion additionally requires Stage 2 identity (ADR-0009 decision 8); document record types need only Stage 1. There is no within-pass ordering because there is no pass.\n   - **Reviewable.** A dry run and a per-file inventory (path, action, resulting keys) remain available as a reporting and verification aid over the descriptor-claimed corpus, but they are not a prerequisite bulk step; the corpus converges record by record as records are read or written. The inventory is the evidence that the descriptor set covers the intended corpus and nothing more. No migration command is required for convergence.\n\n10. **`id`, `created_date`, and `updated_date` are exempt from the \"every field is a create/update option\" rule of REQ-05.011.** `id` is generated and stable (REQ-01.005), the timestamps are automatic; every other front-matter key for a type is exposed as a create option and an update option on that type's commands. `ordinal` is an opaque non-negative integer with a create option, an update option, and a default derived from the current maximum. A key that a command never changes still has to be *preserved*, which is the patch contract in 5.\n\n11. **UI mockups are excluded from front matter (product decision).** REQ-05.008 fixes mockup metadata as HTML comments (`mockup-id`, `status`, `task`, `specs`, `refs`) inside the HTML file, and REQ-05.010 scopes front matter to Markdown. An unwrapped `---` block at the top of an HTML file is invalid markup and would be rendered as text; wrapping it in an HTML comment creates a format no generic YAML reader accepts. Mockup HTML files therefore carry no front matter and keep REQ-05.008 as their single metadata source. This exclusion is final for this ADR, not provisional.\n\n12. **Decision `status` and decision `type` (`adr`/`bdr`) stay in the document core (product decision: no change).** ADR status is a lifecycle value with free-text rationale (\"Accepted — approved by explicit user confirmation on 2026-11-04 (TASK-28)\") that cannot be moved without editing frozen bodies, and `type` is already derived from the ID prefix. Deprecation state stays expressed by directory placement and mockup status stays in HTML comments. The key registry in 5 remains extensible: moving either later is a registry entry plus a section-retirement rule, not a redesign.\n\n13. **Backfilling front matter is a metadata-only change and is permitted on frozen records.** Adding a block above an existing record body — including an Accepted ADR — does not modify the body it governs. It therefore does not require superseding the ADR and does not violate the ADR immutability rule, which freezes Context, Decision, and Consequences. `id` is backfilled from the existing record ID (heading or filename) so stability under REQ-01.005 holds; for tasks and milestones the backfilled `id` is the storage ID (ADR-0008). Lazy migration of decision 9 is performed under this rule.\n\n14. **Decision `created_date` and `references` are additive to the existing sections (product decision).** For decisions, `## Date` and `## References` remain part of the body and are neither replaced nor moved: front matter for decisions is additive. `created_date` does not replace or duplicate the ADR `## Date` line, and neither section becomes an editable metadata source. New decisions write `created_date` and `## Date` from one clock value so they agree; existing files keep the frozen prose. Readers use front matter first and fall back to the section.\n\n15. **Non-record Markdown is out of scope for front matter.** A file is a record only when a record descriptor claims its directory and filename/ID pattern. Documentation that is not a managed record type (`docs/index.html` sources, prose specifications unless a descriptor claims them, domain-model prose, business-process descriptions, workflow documentation, `README.md`) is not migrated and never gains front matter implicitly. The migration inventory from decision 9 is the evidence that the descriptor set covers the intended corpus and nothing more."},{"heading":"Consequences","content":"**Positive:**\n\n- One metadata source: CLI list/view, browser list/detail, and search read the same keys, satisfying REQ-06.004 without a synchronization layer.\n- Field-preserving writes are expressible as a patch, which is the only way to satisfy \"preserve untouched front matter\" and Backlog.md round-trip in the same writer.\n- No new dependency: `yaml_serde` is already used.\n- `created_date`/`updated_date` become real record data instead of file mtime or nothing, removing the current `SystemTime`-based task sort/list approximations.\n- Migration is per record and idempotent, so the corpus converges record by record as records are read or written; readers still need the legacy fallback for unread records, and the fallback can be deleted only after convergence is verified.\n- Provenance of approximated values (`created_date` from file mtime) is recorded once per record, at that record's first migration, instead of being silently invented on every first edit.\n\n**Negative:**\n\n- Every record module's parser, renderer, and writer is affected; this is a cross-cutting change, not a per-type feature.\n- The heading exception (decision 4) leaves `title` present twice for document records; it is bounded, writer-enforced, and justified by frozen ADR bodies.\n- YAML quoting must match Backlog.md closely enough for its reader; hand-rolled serialization of changed keys has to be tested against Backlog.md, not only against our own parser.\n- Body sections disappear from files that users may have hand-edited; a user who wrote `## Status` manually loses that section on the next Papyrus write (its value moves to front matter).\n- Migration now happens on the read and write paths: a read can trigger a write (adding front matter, or converting a legacy task/milestone body), which has implications for read-only filesystems, file permissions, atomicity on the read path, and concurrency (see Risks). There is no single reviewable corpus-wide diff; convergence is observed per record.\n- `created_date` for pre-existing documents is approximate (file mtime) and will be visibly earlier or later than the real creation date in some files.\n- Tasks already carrying a complete Backlog.md block are intentionally not rewritten, so the migration is not uniform across task and document files.\n\n**Risks and mitigations:**\n\n- *Divergent quoting/order breaking Backlog.md*: round-trip tests in both directions are the acceptance gate for NFR-04.003 (ADR-0008 defines the contract).\n- *Front matter destroyed by a writer that re-renders the file*: the patch contract plus a test that an untouched file byte-compares equal after a no-op edit; ADR-0009 makes the shared writer the only write path.\n- *Unknown/foreign keys dropped*: the parse result keeps unknown keys and their order; a patch never rebuilds the block.\n- *Timestamp drift or non-UTC values*: single formatter, single clock call per write, frozen `created_date`.\n- *Lazy migration damaging a body*: migration is patcher-only, idempotent, with byte-identity tests on task/milestone bodies already in Backlog.md shape, before/after diffs for converted legacy bodies, and an idempotency test; no body regeneration path exists. A read-path migration that cannot be applied safely must leave the file untouched and report the error rather than partially write.\n- *Lazy migration touching the wrong files*: the descriptor set (decision 15) keeps non-record documentation out; the dry-run inventory is the evidence that the descriptor set covers the intended corpus and nothing more. A file is migrated only when a managed record type claims it.\n- *Read-path writes and read-only media*: a first read may need to write front matter (or convert a legacy body). On a read-only filesystem, or when the process lacks write permission, the migration cannot complete; the reader must surface the error and must not report a migrated record. Callers that only intend to read should be prepared for a write failure. Atomicity on the read path follows ADR-0006 (create_new + sync_all + same-directory rename); a failed migration leaves the original file byte-identical. Concurrency: two processes reading the same unmigrated record concurrently may both attempt to migrate it; the atomic write plus version/lock contract serializes them, and the second writer observes the already-migrated file and becomes a no-op. An in-flight reader that loaded the pre-migration bytes is not silently upgraded.\n- *Search behavior change*: front matter becomes part of indexed text, so searches can now match metadata values; this is consistent with \"searchable text is whole persisted record text\" and must be stated in the search specification.\n- *Approximate `created_date` mistaken for truth*: documented as best-effort in the specification and never recomputed by later writes."},{"heading":"Open questions (product decisions, not decided here)","content":"1. Resolved (user decision 2026-11-08): migration covers only files claimed by a Papyrus managed record type — task, milestone, release, decision, business requirement, non-functional requirement, glossary term, UI specification, technical specification, business rule, audit record. Prose Markdown that is not a managed record (`docs/specifications/`, `docs/domain-model/`, `docs/business-processes/`, `README.md`, workflow docs) and UI mockups/HTML are out of scope. Migration mode is now lazy per record on first read and first write (user decision 2026-11-08, revised); there is no dedicated `papyrus migrate` subcommand. Non-blocking for the architecture."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| YAML front matter as the only metadata store, parsed by one shared module (this ADR) | Selected | Meets REQ-05.010/05.011/06.004, is what Backlog.md already does, and needs no new dependency. |\n| Keep metadata in `## ` sections and mirror it into front matter | Rejected | Two sources that can diverge; violates \"metadata is not duplicated\". |\n| Front matter as a read-only cache regenerated from the body on every write | Rejected | A hand-edited or Backlog-edited front matter value would be lost; breaks round-trip. |\n| TOML or JSON metadata block | Rejected | Not Backlog.md-compatible; NFR-04.003 fails. |\n| One metadata block per record type with a per-type parser | Rejected | Repeats the current duplication and guarantees drift between CLI and browser. |\n| Remove all `#` headings and rely on front matter only | Rejected | Impossible for frozen ADR bodies and costly for existing docs/indexers; the heading is retained as a writer-generated body title line (4). |\n| Lazy upgrade on first read and first write (this ADR, revised 2026-11-08) | Selected | Corpus converges record by record as records are read or written; readers keep the legacy fallback only until convergence; idempotent, no dedicated command, and no single large diff. Satisfies REQ-05.011 as revised. |\n| One-time bulk migration of the whole corpus (earlier product decision) | Rejected by product decision 2026-11-08 | Requires a clean git tree and produces a large single diff; a later-upgraded project still needs the same pass. Lazy per-record migration achieves the same end state without a dedicated command and keeps readers robust to both shapes. |\n| Migrate only metadata-bearing files, leave read-only docs alone | Rejected | Creates an unpredictable corpus where \"has front matter\" does not mean \"is a record\"; descriptor scope (15) is the explicit boundary instead. |\n| YAML front matter in HTML mockups, wrapped in an HTML comment | Rejected by product decision | Non-standard format that neither generic YAML tools nor browsers handle; REQ-05.008 HTML metadata stays authoritative. |"},{"heading":"References","content":"- `docs/requirements/business/REQ-05.010.md` — Record Metadata in YAML Front Matter.\n- `docs/requirements/business/REQ-05.011.md` — Maintain Record Metadata Through All Commands.\n- `docs/requirements/business/REQ-06.003.md` — Describe Managed Artifacts and Their Lifecycles in the Browser.\n- `docs/requirements/business/REQ-06.004.md` — Use Front-Matter Metadata in CLI and Browser Views.\n- `docs/requirements/business/REQ-01.005.md` — Assign Stable Record IDs (two ID spaces, translation).\n- `docs/requirements/non-functional/NFR-04.003.md` — Backlog.md task and milestone interoperability.\n- `docs/requirements/business/REQ-05.008.md` — UI mockup metadata in HTML content.\n- `docs/architecture/adr/ADR-0006-optimistic-concurrency-and-atomic-record-writes.md` — existing write contract and its deferred CLI alignment.\n- `docs/architecture/adr/ADR-0008-adopt-backlog-md-on-disk-layout-for-tasks-and-milestones.md` — Backlog.md layout, storage IDs, and ID translation.\n- `docs/architecture/adr/ADR-0009-shared-record-envelope-and-unified-write-path.md` — single parse/patch/write implementation and migration staging.\n- Implementation: `src/browser/records.rs` (`parse_doc`, `apply_*_edit`), `src/task.rs` (`parse_task`, `render_task`), `src/milestone.rs`, `src/decision.rs`, `src/audit.rs`, `src/rule.rs`, `src/requirement.rs`; configuration parsing already using `yaml_serde` in `src/commands.rs` and `src/init.rs`.\n- Corpus evidence: `backlog/tasks/task-18 - ....md` (complete Backlog.md block), `backlog/milestones/m-0 - ....md` (`id`, `title` only), `docs/**/*.md` (no front matter before migration)."}]},{"id":"ADR-0008","title":"Adopt the Backlog.md On-Disk Layout for Task and Milestone Records","status":"Superseded by ADR-0010 on 2026-11-11 — NFR-04.004 (adopted 2026-11-11) renounces Backlog.md compatibility and REQ-01.005 now defines a single Papyrus ID space, so the Backlog.md on-disk layout, the storage IDs, and the display/storage translation this ADR decided no longer apply. Body frozen; see ADR-0010 for the native layout, ADR-0011 for the one-way import, and ADR-0012/ADR-0013 for the metadata and write-path restatement.","sections":[{"heading":"Date","content":"2026-11-08 (status: Superseded, 2026-11-11)"},{"heading":"Context","content":"NFR-04.003 requires Papyrus task and milestone files to be readable, listable, and updatable by Backlog.md without loss of the fields Backlog.md requires. Milestone files may carry the general front-matter keys and `release` beyond `id` and `title`; those additive keys must be accepted and preserved by Backlog.md. REQ-05.010's traceability records the originating instruction verbatim: \"insure the compatibility with task and milestone from backlog md, only acceptable discrpency is the addition of releases for milestone. check the files created with backlog md in @backlog/ and how the folder is structured and implement the same behavior in papyrus\".\n\nADR-0007 decides that front matter carries the metadata and that existing records are migrated lazily, per record, on first read and first write. This ADR decides the surrounding on-disk contract, because front matter alone does not make the files interchangeable: path, filename, ID derivation, body shape, status vocabulary, and configuration precedence all differ today.\n\nA first draft of this ADR proposed adopting Backlog.md task and milestone IDs directly (`TASK-18`, `m-0`) as Papyrus IDs. The user reversed that: Papyrus keeps its documented ID format (`TASK-001`, `MS-001`, configured prefix plus `id_padding`) and **translates** to and from Backlog.md storage IDs at the storage boundary (REQ-01.005). Decision 4 below is that translation, and it supersedes the earlier draft's decision 4.\n\nObserved Backlog.md state in this repository (the only in-project evidence available):\n\n- Layout: `backlog/tasks/\u003ctask-N\u003e - \u003cslug\u003e.md`, `backlog/milestones/\u003cm-N\u003e - \u003cslug\u003e.md`, `backlog/docs/`, `backlog/drafts/`, `backlog/archive/tasks/`, `backlog/archive/milestones/`, `backlog/archive/drafts/`, plus `backlog/config.yml` and `backlog/.locks/`.\n- Task filename stem: lowercase prefix, unpadded number, ` - ` separator, slugified title. Front-matter `id` is the uppercase prefix and the unpadded number (`id: TASK-18` while the file is `task-18 - ....md`).\n- Milestone filename stem and front-matter `id` are the same lowercase form (`m-0`); front matter carries only `id` and `title`. Milestone numbering starts at `m-0`.\n- Task references are written in storage form: `milestone: m-12`, `dependencies: [TASK-31, TASK-35]`.\n- Task body carries no `#` heading and uses marker comments: `\u003c!-- SECTION:DESCRIPTION:BEGIN --\u003e`/`END`, `\u003c!-- AC:BEGIN --\u003e` with numbered items `- [ ] #1 ...`, `\u003c!-- DOD:BEGIN --\u003e`, `\u003c!-- SECTION:PLAN:BEGIN --\u003e`, `\u003c!-- SECTION:NOTES:BEGIN --\u003e`, `\u003c!-- COMMENTS:BEGIN --\u003e`.\n- `backlog/config.yml` defines `task_prefix: \"task\"`, `default_status: \"To Do\"`, `statuses: [\"To Do\", \"Initiated\", \"Refined\", \"Implemented\", \"Validated\", \"Done\"]`, `date_format: yyyy-mm-dd`.\n- Backlog.md has no release file format.\n- Existing task numbers are not contiguous (18, 19, 20, 26, 48–60), and milestones are contiguous from 0 to 12.\n\nObserved Papyrus state in `src/`:\n\n- Tasks are written as `\u003cTASK_PREFIX\u003e-\u003cpadded number\u003e.md` with a `# \u003cID\u003e \u003ctitle\u003e` heading and `## Status`, `## Milestone`, `## Assignee`, `## Labels`, `## Dependencies`, `## Acceptance Criteria`, `## Comments` sections. Milestones are written as `\u003cMS-001\u003e.md` with `## Release`.\n- Archived records go to `backlog/tasks/archived/` and `backlog/milestones/archived/`.\n- `papyrus.config.yml` defaults are `task_prefix: \"TASK\"`, `milestone_prefix: \"MS\"`, `id_padding: 3`, `statuses: [\"ToDo\", ...]`, `default_status: \"ToDo\"`.\n- Consequence today: Papyrus cannot resolve a Backlog.md-created task at all. `browser::records::build_index` and `task::view` require a stem of `\u003cPREFIX\u003e-\u003cdigits\u003e`; `task-18 - Complete-...` does not match, and `TASK-18.md` does not exist. NFR-04.003 currently fails in both directions.\n\nThe forces are: Backlog.md must operate on the same files with no conversion step and no parallel store (NFR-04.001, NFR-04.003); Papyrus must keep its documented, configurable ID format and stable IDs (REQ-01.005); IDs must survive archive, restore, and title changes; and the two conventions must not become two identities for one record."},{"heading":"Decision","content":"1. **For task and milestone *storage*, the Backlog.md on-disk contract is authoritative.** Papyrus writes and reads the Backlog.md path, filename, front-matter field set, and body layout. Papyrus-specific metadata is limited to the milestone key `release` (plus the general keys, which are additive and tolerated per NFR-04.003); no other extra key, heading, or section is added to task or milestone files. Record *identity* is not adopted from Backlog.md: it is translated (decision 4).\n\n2. **Paths.**\n   - Active tasks: `\u003cbacklog_directory\u003e/tasks/`.\n   - Active milestones: `\u003cbacklog_directory\u003e/milestones/`.\n   - Archived tasks: `\u003cbacklog_directory\u003e/archive/tasks/`.\n   - Archived milestones: `\u003cbacklog_directory\u003e/archive/milestones/`.\n   - Releases keep their Papyrus-only path (`\u003cbacklog_directory\u003e/releases/`) because Backlog.md has no equivalent.\n   - Legacy read support: `tasks/archived/` and `milestones/archived/` are still read so existing Papyrus archives stay visible; on first read or first write a legacy archive is converted to the Backlog.md archive path and is never written back to the legacy path.\n\n3. **Filename and stem resolution.**\n   - `\u003clowercase storage prefix\u003e-\u003cn\u003e - \u003cslug\u003e.md`, where `\u003cn\u003e` is the storage number without padding and the slug is the title reduced to Backlog.md's convention (lowercase words joined by `-`, punctuation dropped).\n   - The `- \u003cslug\u003e` suffix is cosmetic. A record is resolved by its storage prefix and number, never by slug; a stale slug is not a conflict.\n   - Title edits do not rename the file. Renaming would move the file a browser session or an in-flight edit is addressing, and would invalidate the ADR-0006 version token path; the front-matter `title` is authoritative and Backlog.md resolves by `id`.\n   - Reading accepts every form either tool has produced: case-insensitive prefix match, unpadded or zero-padded number, optional ` - \u003cslug\u003e` suffix. The ID is the front matter `id` when present, otherwise the stem-derived ID, normalized per decision 4.\n\n4. **Two ID spaces, one record identity (supersedes the earlier draft's \"adopt Backlog.md IDs\").**\n\n   | Record type | Papyrus ID (display and input) | Backlog.md ID (storage) | Number relation |\n   |---|---|---|---|\n   | Task | `TASK-001` — configured `task_prefix`, zero-padded to `id_padding` | file stem `task-1`; front-matter `id: TASK-1` (uppercase, unpadded) | display number = storage number + 0 |\n   | Milestone | `MS-001` — configured `milestone_prefix`, padded | file stem and front-matter `id: m-0` (lowercase, unpadded) | display number = storage number + 1 |\n   | Release | `REL-001` — Papyrus only | none | not applicable |\n\n   The relation is an affine per-type translation, not a lookup table:\n   - **storage → display:** `prefix(display) + zero-pad(storage_number + offset, id_padding)`.\n   - **display → storage:** strip the display prefix (case-insensitive), parse the number, subtract the offset, render as `\u003cstorage prefix\u003e-\u003cn\u003e` unpadded; the front-matter `id` form keeps Backlog.md's own casing per type as observed above.\n   - **Offsets are fixed constants per type in the record descriptor:** `0` for tasks (both tools number tasks from 1) and `1` for milestones (Backlog.md numbers milestones from `m-0`, Papyrus milestone IDs start at `MS-001`; `m-0` → `MS-001`, `m-12` → `MS-013`). They are not configuration keys and are not configurable, because a user-tunable offset could silently renumber every displayed ID.\n   - **Display width (resolved 2026-11-08).** When a storage number's digit count exceeds `id_padding`, the display ID uses the wider number; padding is a minimum, never truncated or errored. No re-padding on disk and no error is raised.\n   - **The mapping is derived, never persisted.** There is no mapping file, no sidecar, and no extra front-matter key. The storage ID in the filename and front matter is the only persisted identity; the display ID is computed on every read. Nothing can drift out of sync, and no migration must maintain a table.\n   - **Bijection and stability.** Within one type the translation is monotone and injective (same prefix, same offset, padding is display-only), so translate-then-translate-back returns the original value for every existing record. IDs are never renumbered by archive, restore, deprecate, supersede, or title change; a create only ever allocates a number not present in either space (including archived files).\n   - **What is shown and where.** CLI `list`/`view` (plain text and `--json`), browser list and detail views, browser URLs, and validation messages use the Papyrus ID. The storage ID is never presented as the record identity; where a diagnostic needs it, it is labelled separately (`storage id: task-18 — file: ...`). Reference values (`milestone:`, `dependencies:`) are stored in storage form and translated for display, input validation, and cross-record resolution.\n   - **Input accepts display IDs only (resolved 2026-11-08).** Papyrus commands accept only the Papyrus display format; a Backlog.md storage ID (`task-18`, `m-0`, `TASK-18`) supplied as input is rejected with a hint naming the equivalent Papyrus ID (`TASK-018`, `MS-001`). Storage IDs are never accepted as command input.\n   - **Generation is symmetric.** On create, Papyrus allocates the next storage number for the type (after the current maximum in both active and archived locations) and derives the display ID from it; the number is written once and never recomputed.\n   - **Consequence for existing projects.** Display numbers follow storage numbers, so this repository's existing records appear as `TASK-018` … `TASK-060` and `MS-001` … `MS-013` (from `task-18` … `task-60` and `m-0` … `m-12`). The documented `TASK-001` example describes a project whose first task has storage number 1; it is not a promise that the first *visible* record is 001.\n\n5. **Front matter.** Tasks carry exactly the Backlog.md key set and order (ADR-0007): `id`, `title`, `status`, `assignee`, `created_date`, `updated_date`, `labels`, `milestone`, `dependencies`, `references`, `documentation`, `type`, `ordinal`; `assignee` is a YAML list. Milestones carry `id`, `title`, the general Papyrus keys `created_date`, `updated_date`, `labels`, `references`, and `release`, matching REQ-05.010 and NFR-04.003. For tasks and milestones the `id` value, and every `milestone:`/`dependencies:` value, is the storage form from decision 4.\n\n6. **Body.** No `#` heading. Task bodies preserve Backlog.md's marker comments and section order; a newly created task is written with `## Description` (SECTION markers) and `## Acceptance Criteria` (AC markers, numbered items). Edits patch only the affected lines and never regenerate the body from a model, so markers, numbering, notes, plan, definition of done, comments, and unknown sections survive. Milestone bodies keep `## Description` in Backlog.md's plain form.\n\n7. **Status vocabulary and layered configuration.** When `\u003cbacklog_directory\u003e/config.yml` exists it is read (never written) and is authoritative for the storage layer: `statuses`, `default_status`, the storage `task_prefix`, `date_format`, and numbering. `papyrus.config.yml` is authoritative for the presentation layer (`task_prefix` casing, `milestone_prefix`, `id_padding`) and for every non-task record type. The two layers must describe the same type set: a load-time validation rejects a configuration whose task/milestone display prefixes are missing or cannot map one-to-one onto the storage prefixes. If no Backlog.md configuration exists, Papyrus uses its own prefixes for both layers and still writes unpadded storage numbers so the files stay Backlog.md-compatible. Status values are validated against the Backlog.md list, so Papyrus must not write `ToDo` into a project configured with `To Do`.\n\n8. **Existing records are converted lazily, per record, on first read and first write (ADR-0007 decision 9), not by a bulk pass.** Conversion happens on first access of each legacy Papyrus task/milestone file (`tasks/TASK-018.md`, `milestones/MS-001.md`) and legacy archive (`tasks/archived/`, `milestones/archived/`): it moves the record to the Backlog.md path with the storage filename and storage `id`, and adds any missing front-matter keys. It is ID-preserving: the storage number is taken from the existing Papyrus number (offset applied), the display ID is unchanged before and after. A dry run and a per-file inventory remain available as a reporting and verification aid, but they are not a prerequisite bulk step. Conflicts in decision 9 are detected and reported per record; the conversion refuses to proceed past a conflict rather than choosing a winner.\n\n   Two input shapes must be distinguished, because they do not permit the same guarantee:\n   - **Already in the Backlog.md storage shape** (this repository's tasks and milestones): the block is added or extended, timestamp keys are added, and the body, marker comments, and section order stay byte-identical. A task whose front matter is already complete is not rewritten at all.\n   - **Legacy Papyrus shape** (heading, `## Status`/`## Assignee`/`## Milestone`/`## Labels`/`## Dependencies` sections, no markers): converting such a file to the storage shape necessarily changes the body — the heading is dropped, the retired metadata sections are removed after their values move to front matter, and `## Description`/`## Acceptance Criteria` are mapped into Backlog.md's marker sections with every unknown section and free-text block appended verbatim, in file order. This is the only migration path permitted to alter a task/milestone body, it happens on first read or first write, and it is reported per file in the dry-run inventory so the change is reviewable. Confirmed (REQ-05.011, user decision 2026-11-08): the byte-identical guarantee applies to bodies already in Backlog.md shape; legacy bodies are converted with a reported per-file diff.\n\n9. **Conflicts and duplicates are detected, reported, and never resolved silently.** Every comparison normalizes both sides first (case-insensitive prefix, padding-insensitive number, offset applied). Caused cases and their outcomes:\n\n   | Situation | Meaning | Outcome |\n   |---|---|---|\n   | Two files resolve to the same storage ID (`task-18 - a.md`, `task-18 - b.md`; or `TASK-018.md` and `task-18 - ....md`) | Same record written twice | Duplicate: listing shows one entry flagged invalid, `view` by that ID fails with the candidate paths, writes refuse, the lazy conversion stops on that record and reports it. Never merged, never deleted. |\n   | Front-matter `id` and filename disagree after normalization (`task-18 - x.md` with `id: TASK-19`) | Corrupt or hand-edited file | Read succeeds using the front-matter `id` (canonical, decision 3); the record is flagged invalid and writes refuse until fixed. |\n   | Two files, different numbers, same slug | Distinct records that happen to share a title | Not a conflict; slug is never identity. |\n   | A legacy Papyrus file and a Backlog.md file with different numbers but the same title | Possibly the same work tracked twice | Distinct records; the migration reports the pair for a human decision; no automatic equivalence, no merge, no renumber. |\n   | A visible ID requested that maps to no storage file | Unknown record | Normal not-found error, listing the expected storage path once for diagnosis. |\n   | A number already used in the other ID space | Already a record | Create allocates past every number in both spaces, active and archived. |\n\n   No conflict path deletes, overwrites, or renumbers a record; each reports the paths and the two IDs so a human resolves it.\n\n10. **Interoperability and translation are verified empirically, not assumed.** The NFR-04.003 gate is extended to cover identity: Backlog.md creates `task-61` → Papyrus lists it as `TASK-061` and `view TASK-061` opens it; Papyrus creates `TASK-062` → Backlog.md lists `task-62` with the same title; `milestone: m-12` displays as `MS-013` and `view MS-013` resolves it; `dependencies: [TASK-31]` displays as `TASK-031`. `release` on milestones and the additive general keys must be proven tolerated by Backlog.md's reader before the change is accepted, and the same verification runs on records migrated lazily on first read and first write.\n\n11. **Backlog.md `docs` and `drafts` remain Backlog-owned.** Papyrus does not read or write those directories unless a later requirement makes them managed record types. They are also outside the migration.\n\n12. **IDs are immutable in both spaces.** No operation renumbers, re-pads into the file, or changes the storage prefix of an existing record. A configuration change to display prefix or padding changes the *display* of all records at once and is an explicit, documented action with no write to disk; the storage IDs, and therefore the bijection, are untouched."},{"heading":"Consequenc
