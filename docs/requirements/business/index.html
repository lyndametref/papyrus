e fixed `open -\u003e closed` lifecycle and the release section the fixed `planned -\u003e released` lifecycle.\nThe decision section shows `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded` with the documented transitions.\nEvery front-matter-backed document section shows the main `active -\u003e archived` storage lifecycle and the custom statuses declared for that type; the UI mockup section shows `pending -\u003e approved -\u003e archived`.\nBacklog.md `docs` and `drafts` records and project configuration files are not described by the page.\nEach section provides a good description of its artifact on top of its lifecycle and existing status.\nEach section shows the artifact's effective `enabled` state, ID prefix, and storage folder; the task section also shows the configured task statuses, and each document section shows its declared custom statuses.\nA document type added by configuration is described by the shared document lifecycle and its configured prefix and folder, without requiring curated description text.\nDescription text is curated static content shipped with the browser and does not depend on requirement files, record content, configuration, or an internet connection.\nConfiguration values on this page are read-only; changing them is done through the browser configuration view (REQ-06.008)."},{"id":"REQ-06.004","title":"Use Front-Matter Metadata in CLI and Browser Views","criticality":"Must have","userStory":"As a project contributor, I want the command line and the browser to show record information from the front matter so that both views present the same values and I do not have to look inside the file.","description":"CLI list and view output, in plain text and in JSON, and the browser list and detail views read record metadata from the front matter defined in REQ-05.010. Both views show the same metadata values for the same record. They show at least `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, plus the type-specific keys that apply to the record type. For a document record, they show its front-matter `status` value as stored, including a custom status declared for its type (REQ-07.001, REQ-07.002); a configured status value is displayed verbatim and is never renamed or replaced by a display label. The browser keeps its current editable field set; `created_date` and `updated_date` are read-only there, and `status` is not an editable field because it is lifecycle- and configuration-owned (REQ-05.011). When the browser saves an edit to a metadata-backed field, it writes the new value into the front matter and preserves the remaining front-matter fields and the rest of the file.","criteria":"CLI list and view output show front-matter metadata values for the viewed or listed record, in plain text and in JSON.\nBrowser list and detail views show the same front-matter metadata values as the CLI for the same record.\nBoth views show at least `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, and the type-specific front-matter keys of the record type.\nBoth views show a document record's `status` value as stored, including a custom status declared for its type, and the value is identical in the CLI and in the browser.\nA configured custom status value is displayed verbatim; the view does not rename or map it to another label.\nThe browser's editable field set stays as it is today, with `created_date` and `updated_date` read-only and `status` not editable.\nA browser save of a metadata-backed field writes the new value to the front matter.\nA browser save preserves the other front-matter fields and the remainder of the file.\nA browser save does not copy metadata back into the document core."},{"id":"REQ-06.005","title":"Browser Skills Page for Agent Workflow Configuration","criticality":"Should have","userStory":"As an agent or developer configuring Papyrus for a new project via AI workflow, I want a browser page that lists available skills/tools for using Papyrus so that I can configure the workflow correctly.","description":"Browser mode should include a dedicated, navigable page listing the skills and workflows agents use to configure and operate Papyrus on a new project. The page presents agent-facing instructions that account for the effective `papyrus.config.yml` (prefixes, `id_padding`, statuses, enabled document/decision types, directories, and paths) so that generated instructions are precise for the configured project. The page is served by the local web interface and is reachable from its navigation. Its route, navigation entry, and format are design decisions left to implementation, consistent with REQ-06.003.","criteria":"The local web interface serves a page listing all available Papyrus agent skills/workflows.\nEach skill entry includes instructions on how to use Papyrus for agents (not end users).\nSkill content is derived from or parameterized by the effective project configuration (`papyrus.config.yml`), including configured prefixes, `id_padding`, statuses, enabled document/decision types, and directories, so instructions match the project.\nThe page is accessible via browser mode and navigable within the local web interface.\nSkills cover, at minimum: new project setup/init, backlog/task/milestone/release management, requirements and documentation management, search, browser usage, and release/audit workflows.\nThe page does not require an internet connection (NFR-01.003).\nThe set of skills/workflows covered and the page route/navigation entry are documented; content format (list vs. copyable snippets) is a design decision."},{"id":"REQ-06.006","title":"Display NFR Atomic Requirements Under Their Group in the Browser","criticality":"Should have","userStory":"As a project contributor, I want non-functional atomic requirements displayed under their group in the browser like business requirements so that navigation is consistent.","description":"In browser mode, non-functional atomic requirements are currently shown under \"Other requirements\" at the bottom of the page. They shall be displayed under their owning group entry, matching the grouping used for business requirements. The owning group is derived by the browser from the requirement ID prefix (`REQ-XX.YYY` → `REQ-XX`, `NFR-XX.YYY` → `NFR-XX`) and the group record's title; the requirement file format is not changed and non-functional atomic files gain no `Group` section.","criteria":"The browser lists non-functional atomic requirements under their group entry rather than under a catch-all \"Other requirements\" section.\nGrouping is consistent with the grouping used for business requirements.\nGrouping is derived from the requirement ID prefix in the browser for both requirement families; no `Group` field is added to non-functional atomic requirement files.\nA group heading shows the group record's title (for example `NFR-04 Persistence`); when the group record is missing, the group number is used.\nEmpty groups are handled gracefully: a group with no atomic requirements still renders as an entry with no children.\nEvery atomic requirement appears under exactly one group and none is dropped."},{"id":"REQ-06.007","title":"Limit Browser Console Verbosity","criticality":"Should have","userStory":"As a project contributor, I want the browser command to be quiet in the console unless debugging is enabled so that normal operation is not noisy.","description":"The browser is very verbose in the console. A `--debug` option shall show received requests; otherwise only errors shall be output to the console. `--debug` is an option of the `browser` command only; it is not a global option and is not accepted by any other command. With `--debug`, each received request is logged as one line with method, path, response status, and duration; request headers and bodies are not logged, so record content does not leak into the console.","criteria":"By default, the browser command outputs only errors to the console.\nWith `--debug`, received requests are logged to the console.\n`--debug` is a browser-command-only flag; no other command and no global option accepts it.\nEach logged request is one line containing the method, path, response status, and duration.\nRequest headers and bodies are not logged.\nErrors are output whether or not `--debug` is set."},{"id":"REQ-06.008","title":"Provide a Browser Configuration View","criticality":"Should have","userStory":"As a project contributor, I want to modify the current project configuration from the browser so that settings can be changed without the CLI.","description":"The browser shall provide a configuration view to modify the current project configuration. It uses `papyrus config get/set` to update configuration so that eventual folder moves are properly performed (REQ-01.002). No folder outside the project may be defined (NFR-04.002). The view shows effective values, including values that come from built-in defaults, and marks which keys are explicitly set in `papyrus.config.yml`. Editable keys are exactly the keys `papyrus config set` accepts: the view applies the same keys, validation, and precedence as the CLI and cannot store a value the CLI would reject. No configuration key is treated as secret in the current configuration, and the view does not read or display environment variables (`PAPYRUS_DIR`, `PAPYRUS_CONFIG`, `NO_COLOR`) as editable values.","criteria":"The local web interface serves a configuration view for the current project.\nEditing configuration uses `papyrus config get/set` so folder moves are performed.\nNo path outside the project directory can be defined.\nThe view shows effective configuration values, including defaults, and indicates which keys are explicitly set in `papyrus.config.yml`.\nEditable keys are exactly those `papyrus config set` accepts; the view cannot persist a key or value the CLI rejects, and precedence matches the CLI (REQ-01.003).\nThe view treats no configuration key as secret in the current configuration and never reads or displays environment-variable values as editable configuration.\nChanging an artifact folder from this view performs the full folder move defined in REQ-01.002."},{"id":"REQ-06.009","title":"Set Browser Page Title Branding","criticality":"Could have","userStory":"As a project contributor, I want the browser page title to emphasize the project name so that the project context is clear.","description":"The browser page title shall show the project name in big bold letters and the \"Papyrus\" mention in smaller letters (currently the opposite). The rule applies to the visible title in the shared page header on every page of the local web interface. The \"P\" mark keeps its current size and styling; only the typography of the project name and the \"Papyrus\" mention changes.","criteria":"The browser page title renders the project name in big bold letters.\nThe \"Papyrus\" mention is rendered in smaller letters.\nThe branding applies to the shared header of every browser page.\nThe \"P\" mark keeps its current size.\nThe project name shown is the configured project name (REQ-01.002)."},{"id":"REQ-06.010","title":"Present Dependencies as Links in the Browser","criticality":"Should have","userStory":"As a project contributor, I want dependencies in the browser to be clickable links so that I can open them and return with the browser back button.","description":"Every dependency shall be presented as a link in the browser so that the user can open it and return via the browser back button. The rule covers every record reference the browser renders that resolves to a Papyrus record: task dependencies, a task's milestone, `references` values, and a sub-requirement's owning group. A reference that does not resolve to an existing record is rendered as plain text rather than as a link, and no error is shown. Links are generated in the page and work offline.","criteria":"Dependency references rendered in the browser are hyperlinks.\nMilestone, `references`, and owning-group values rendered in the browser are hyperlinks under the same rule.\nActivating a link navigates to the referenced record's view; the browser back button returns to the originating page.\nA reference that does not resolve to an existing record is rendered as plain text and does not raise an error.\nLinks are generated locally and require no network access (NFR-01.003)."},{"id":"REQ-06.011","title":"Adjust Glossary Landing Page Display","criticality":"Could have","userStory":"As a project contributor, I want the glossary landing page to show labels as tags without dates or references so that it stays concise.","description":"In the glossary landing page, created and updated dates are removed, labels are shown as a list of tags, and references are not shown. \"Tags\" means the taglist presentation used for labels in single record views (REQ-06.012). The change is limited to the glossary landing (list) page; glossary detail views follow REQ-06.012, and other document types are unchanged.","criteria":"The glossary landing page omits created and updated dates.\nLabels are shown as a list of tags on the glossary landing page, using the same taglist presentation as REQ-06.012.\nReferences are not shown on the glossary landing page.\nGlossary detail views are unchanged by this requirement and follow REQ-06.012.\nOther document-type landing pages are unchanged."},{"id":"REQ-06.012","title":"Define Single Record View Layout","criticality":"Should have","userStory":"As a project contributor, I want single record views to have a consistent summary card layout so that key metadata is easy to find.","description":"In all single record views, the summary card at the beginning shows only the record ID, created date, and updated date; a sub-requirement additionally shows its owning group there. Dependencies and references are listed at the end as collapsible sections when relevant, meaning a section appears only when the record has at least one such value. Labels are shown as a taglist under the title. Collapsible sections use native HTML disclosure elements so they work without JavaScript and in the supported browsers (NFR-05.001). The layout applies to every managed Markdown record type that has a single record view; UI mockup views are HTML records and are outside this requirement.","criteria":"The summary card shows only the record ID, created date, and updated date.\nA sub-requirement shows its owning group in the summary card, and nothing else is added to the card.\nDependencies and references appear at the end of the view as collapsible sections, each shown only when the record has at least one such value.\nLabels are shown as a taglist under the title.\nCollapsible sections use native HTML disclosure elements and work with JavaScript disabled.\nThe layout applies to every managed Markdown record type with a single record view; UI mockup HTML views are excluded."},{"id":"REQ-06.013","title":"Present the Backlog as a Per-Milestone Kanban Board","criticality":"Should have","userStory":"As a project contributor, I want the browser Backlog view to show tasks as a kanban board inside each milestone, with the release boundary marked by a bold separator, so that I can see how work is distributed across statuses, milestones, and releases at a glance.","description":"The browser Backlog view keeps milestones as expandable and collapsible sections. Inside an expanded milestone, that milestone's tasks are presented as a kanban board: one column per task status, laid out horizontally, with the columns therefore grouped horizontally within the milestone. Columns follow the configured task status list exactly, in configured order, and statuses with no tasks keep their column visible. Milestones that belong to a release appear under that release; milestones that belong to no release are grouped before the first release. Each release boundary is marked by a bold separator that names the release, so the boundary does not depend on colour. Tasks that belong to no milestone appear in their own expandable section after all milestone sections. Cards are ordered by ascending task ID within a column, consistent with the existing browser list ordering, and each card links to the task record view.\n\nA task's status is changed by dragging its card into another status column, or with an equivalent status control on the card that does not require dragging. Either action persists the status immediately to the task record; the board is not a staging area with a separate save step. A change that cannot be persisted leaves the card in its original column and reports the failure to the user. Changing status from the board changes only the status value and preserves every other field of the task. Archived tasks and milestones remain excluded from the board, as in the rest of the browser backlog views. Presentation details not fixed here — card contents beyond the task link, column widths, and separator styling — remain design decisions.","criteria":"The Backlog view keeps milestones as expandable and collapsible sections, and expanding a milestone shows its tasks as a kanban board with one column per task status.\nBoard columns reflect all configured task statuses, in configured order, and remain visible when they contain no tasks.\nEach release boundary is marked by a bold separator that identifies the release and does not rely on colour alone.\nMilestones assigned to a release appear under that release, and milestones assigned to no release are grouped before the first release.\nTasks that belong to no milestone appear in their own expandable section, placed after all milestone sections.\nEach task card shows the task ID and title and links to the task record view.\nCards appear in ascending task ID order within a column.\nA task's status is changed by dragging its card into another status column, and each card also offers an equivalent status control that performs the same change without dragging.\nA status change made on the board is persisted to the task record and is still shown after the view is reloaded.\nA status change that cannot be persisted leaves the card in its original status column and reports the failure to the user.\nA status change made on the board changes only the task's status and preserves all other task fields.\nArchived tasks and milestones are not shown on the board."},{"id":"REQ-06.014","title":"Display Config-Defined Document Types in the Browser","criticality":"Should have","userStory":"As a project contributor, I want the browser to serve any document type declared in configuration so that a document type added for the CLI is also usable in the local web interface.","description":"The local web interface serves list, detail, and edit views for every enabled document type declared in `document_types`, not only for the default types shipped with Papyrus. A document type added by configuration (REQ-07.002) becomes available in the browser without a code change, using the same navigation, list, detail, and edit behavior as the default document types.\n\nViews use the document type's configured folder and prefix, the record metadata projection of REQ-06.004, and the single-record layout of REQ-06.012. Every listed record shows its `status` value as stored, including a custom status (REQ-07.001). The list view offers a status filter whose options are exactly `active` plus the type's declared custom statuses, in configured order; selecting a value lists only the records carrying that value, and a filter value outside that set is rejected rather than applied as an unfiltered or guessed match. The `archived` value is not offered because archived records are not listed (REQ-05.007), so a type that declares no custom statuses offers only `active`.\n\nA config-defined type uses the generic content model (REQ-07.004), so its edit view offers title, description, labels, and references; `status` is not editable there because it is lifecycle- and configuration-owned (REQ-05.011). Archived records are hidden and unreachable, and the same page is returned for an archived record and an unknown address (REQ-05.007). A disabled type has no views, and its records are not listed or reachable. Where a document type has a field set beyond the generic model, that field set continues to apply to the default type.","criteria":"The browser serves a list view and a detail view for every enabled document type declared in `document_types`.\nA document type added by configuration gains its browser views without a code change.\nA config-defined type offers an edit view with title, description, labels, and references.\nViews use the type's configured folder and prefix.\nEach listed record shows its `status` value as stored, including a configured custom status.\nThe list view offers a status filter whose options are exactly `active` plus the type's declared custom statuses in configured order; selecting a value lists only records carrying that value.\nA type that declares no custom statuses offers only `active` in the status filter, and `archived` is never an option because archived records are not listed.\nA status filter value outside the offered set is rejected rather than applied (NFR-02.002).\n`status` is not an editable field in the browser (REQ-05.011).\nDetail views use the metadata projection of REQ-06.004 and the layout of REQ-06.012.\nArchived records are not listed, are not reachable, and return the same page as an unknown address.\nA disabled document type has no views, and its records are neither listed nor reachable.\nThe views require no network access (NFR-01.003)."}]},{"id":"REQ-07","title":"Artifact Categories and Config-Defined Document Types","userStory":"As a project maintainer, I want every artifact to belong to a known category and document commands to come from configuration so that lifecycles are predictable and a new document type needs no code change.","description":"This group covers the three artifact categories Papyrus manages (backlog, decision, document), the split between configurable and fixed lifecycles — including the document main status and configurable custom statuses — the `document_types` map whose keys are document slugs and CLI command names, the dynamic `papyrus \u003cdocument-slug\u003e` command family, and the generic content model applied to document types added through configuration. It also fixes how slugs and document status lists are validated so that a configured document type can never shadow a built-in command or introduce an invalid status value.","children":[{"id":"REQ-07.001","title":"Organize Artifacts into Three Categories","criticality":"Must have","userStory":"As a project contributor, I want every artifact to belong to a known category so that I know which lifecycle applies and what configuration can change.","description":"Papyrus manages exactly three artifact categories:\n\n- **backlog** — tasks, milestones, and releases.\n- **decision** — decision records.\n- **document** — every document type declared under `document_types`, including the default entries and any entry added by the user.\n\nEach record type belongs to exactly one category.\n\nStatus models differ by category. Task statuses are configurable through `statuses` and `default_status` (REQ-01.002). Within the backlog category, the milestone and release lifecycles are fixed: a milestone is `open` then `closed`, and a release is `planned` then `released`. Decision records use the fixed Nygard statuses `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded` (REQ-04.001). Document types have a **main status** plus optional **custom statuses**, described below.\n\n**Main status.** Every document type has the main status `active` or `archived`, and these are the only statuses that affect storage location. An `active` record is stored in the document type's configured folder; an `archived` record is stored in the `archived/` subfolder of that folder and carries `status: archived` (REQ-05.007). For a front-matter-backed record, `archive` is the only operation that produces the `archived` state; UI mockups set the equivalent HTML state through their own lifecycle (REQ-05.008).\n\n**Custom statuses.** A document type may declare additional statuses in `document_types.\u003cslug\u003e.statuses` (REQ-07.002), optionally with a configured initial value in `document_types.\u003cslug\u003e.default_status`. Custom statuses are front-matter values only: they cause no file move, define no folder per status, introduce no new lifecycle, and change nothing about which records are listed, whether a record can be archived or deleted, or where a record is stored. A record carrying a custom status is an active record in the type folder and remains archivable. When no `default_status` is configured, a new document record starts `active`.\n\n**Status list invariants.** Every document type's declared status list includes `active` and `archived`. Those two values are fixed: configuration cannot remove, rename, or redefine them, and a custom status may not reuse either value. Custom statuses are available only for front-matter-backed document types. UI mockups keep their state in HTML metadata with `pending`, `approved`, and `archived` (REQ-05.008) and declare no custom statuses.\n\n**Setting a status from the CLI.** `papyrus \u003cdocument-slug\u003e status \u003cid\u003e \u003cvalue\u003e` sets a record's front-matter `status` to a declared custom status or to `active`. It changes only the status value and refreshes `updated_date`. This command never archives: the value `archived` is rejected with a validation outcome (exit code 4, REQ-01.004) that names `archive` as the only way to archive a record, and no file is moved. An archived record is likewise rejected with a validation outcome (exit code 4) that names the record as archived; `status` changes nothing on it and never moves it back. UI mockups have no `status` command; their lifecycle is governed by REQ-05.008.\n\n**Archiving a record with a custom status.** Archiving such a record sets `status` to `archived` and moves the file into the `archived/` subfolder (REQ-05.007). The previous custom status is not retained: no front-matter field or metadata stores the value that the record had before archiving, and documents have no restore command.\n\nConfiguration cannot add, remove, or rename a category, and cannot change a fixed lifecycle (milestone, release, or decision) or the document main statuses. Declaring document custom statuses is configuration of front-matter values, not a change to those fixed lifecycles.\n\nThe decision status `deprecated` and the document state `archived` are different terms for different categories: a decision is never `archived`, and a document is never `deprecated`.","criteria":"Papyrus manages exactly three artifact categories: backlog, decision, and document.\nTasks, milestones, and releases belong to the backlog category; decision records belong to the decision category; every document type declared under `document_types` belongs to the document category.\nEach record type belongs to exactly one category.\nTask statuses are configurable through `statuses` and `default_status` (REQ-01.002); document types may additionally declare custom statuses through `document_types.\u003cslug\u003e.statuses` and an optional `document_types.\u003cslug\u003e.default_status`.\nThe milestone lifecycle is fixed to `open -\u003e closed` and the release lifecycle is fixed to `planned -\u003e released`; neither is affected by any `statuses` or `default_status` configuration.\nDecision records use only `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded`.\nEvery document type has the main status `active` or `archived`; an active record is stored in the type folder and an archived record is stored in that folder's `archived/` subfolder with `status: archived` (REQ-05.007).\nA document type's declared statuses always include `active` and `archived`; configuration cannot remove, rename, or redefine them, and a custom status cannot reuse either value.\nA custom status is a front-matter value only: setting it moves no file and creates no per-status folder.\nA record carrying a custom status remains in the active storage location, is still listed, and can still be archived and deleted.\nA new document record starts `active` when no `default_status` is configured, and starts at the configured `default_status` when one is.\n`papyrus \u003cdocument-slug\u003e status \u003cid\u003e \u003cvalue\u003e` sets a declared custom status or `active` in the front matter, changes only the status, and refreshes `updated_date`.\n`papyrus \u003cdocument-slug\u003e status \u003cid\u003e archived` is rejected with a validation outcome (exit code 4) that names `archive` as the only way to archive, and no file is moved.\n`papyrus \u003cdocument-slug\u003e status \u003cid\u003e \u003cvalue\u003e` on an archived record is rejected with a validation outcome (exit code 4) that names the record as archived; no status change and no file move occur.\nArchiving a record that carries a custom status sets `status: archived`, moves the file to the `archived/` subfolder, and does not retain the previous custom status value anywhere.\nUI mockups declare no custom statuses and have no `status` command; their state remains `pending`, `approved`, or `archived` in HTML metadata (REQ-05.008).\nConfiguration cannot add, remove, or rename a category and cannot change a fixed lifecycle or the document main statuses.\nA decision is never described as archived, and a document is never described as deprecated."},{"id":"REQ-07.002","title":"Configure Document Types and Slugs","criticality":"Must have","userStory":"As a project maintainer, I want to declare document types in the configuration file so that I can add, rename, disable, or remove a document type without changing Papyrus.","description":"`document_types` is a map keyed by **document slug**. The slug is the configuration key, the CLI command name (`papyrus \u003cdocument-slug\u003e`, REQ-07.003), and the identifier used for that document type elsewhere. No separate `document-slug` attribute exists, because the map key already carries that role.\n\nEach entry declares `prefix` (ID prefix), `directory` (folder relative to `doc_directory`), and `enabled`, and may declare `statuses` (the document type's custom statuses, REQ-07.001) and `default_status` (the status a new record of that type starts at). `directory` is the type's own folder; archived records are stored in an `archived/` subfolder of it (REQ-05.007).\n\nEntries are fully ordinary. The default entries seeded by `papyrus init` have no reserved status: any entry can be renamed, removed, disabled, or given a different prefix or folder, and new entries can be added by editing `papyrus.config.yml` or with `papyrus config set`. A project initialized with `papyrus init` writes the default set:\n\n- `req` — `REQ`, `requirements/business/`\n- `nfr` — `NFR`, `requirements/non-functional/`\n- `glossary` — `GLO`, `glossary/`\n- `rule` — `RUL`, `business-rules/`\n- `ui-spec` — `UI`, `specifications/ui/`\n- `ui-mockup` — `MOCK`, `specifications/ui/mockups/`\n- `audit` — `AUD`, `audit-records/`\n- `tech-spec` — `TECH`, `technical/`\n- `use-case` — `UC`, `use-cases/`\n- `test-case` — `TC`, `test-cases/`\n- `test-report` — `TR`, `test-reports/`\n\nAll default entries are enabled unless the interactive walkthrough (REQ-01.006) disables an artifact. `deploy` is not part of the default set; a project may still add it, like any other user-defined type, by declaring a `deploy` entry.\n\nConfiguration loading validates every entry. A slug must be usable as a command name: non-empty, composed of ASCII letters, digits, `-`, and `_`, not starting with `-`, and free of whitespace, control characters, and path separators. A slug must not equal a built-in command name — `init`, `config`, `task`, `milestone`, `release`, `decision`, `search`, `browser`, `import`, `help`, or `version` — so a configured document type can never shadow a built-in command; the comparison is case-insensitive, so `Config` is rejected as well as `config`. Each entry must have a non-empty `prefix` and a `directory` that is relative and stays inside the project directory (NFR-04.002). A `prefix` must be unique across all configured document types, including disabled entries. Two enabled entries must not declare the same `directory`. Values that fail these rules are rejected as configuration errors and are never silently cleaned or normalized (NFR-02.002).\n\nA `document_types` mapping that declares the same slug key twice is invalid configuration and is rejected; a repeated key is never resolved by keeping the first or the last occurrence.\n\n`statuses`, when present, must be a non-empty list with no duplicates and must include `active` and `archived` exactly once. Those two values are fixed: configuration cannot remove, rename, or replace them, and a custom status is any other value in the list. Every declared status follows the same character rules as a slug: non-empty, ASCII letters, digits, `-`, and `_`, not starting with `-`, with no whitespace, control characters, or path separators. `default_status`, when present, must be one of the declared statuses and must not be `archived`, so a new record never starts archived. A `statuses` declaration on the default UI mockup type `ui-mockup` is rejected, because that type keeps its state in HTML metadata and declares no custom statuses (REQ-05.008).\n\n`statuses` is a list-valued configuration key. `papyrus config set document_types.\u003cslug\u003e.statuses active,archived,custom` writes it from a comma-separated value and stores it as a YAML flow sequence (REQ-01.002). Commas are separators with no escape form, so a status value can never contain a comma — which the status character rules already exclude — and an empty value is rejected rather than written as an empty list. The configuration that would result is validated before it is persisted, so an invalid list is refused and nothing is written.\n\nA violating configuration is rejected with a validation outcome (REQ-01.004) that names the offending slug or key. Validation is fail-closed and there is no partially valid document-type set: every command refuses to run while the effective configuration is invalid, with two repair surfaces. `papyrus config get|set|unset|list` loads the configuration tolerantly, validates the configuration that would result from the change, and refuses an invalid write. `papyrus init --force` replaces the configuration file with the generated default set. A user can therefore always repair a broken configuration through Papyrus itself.\n\nAdding an entry adds a document type and its command; disabling an entry removes its CLI command and browser views while leaving existing files untouched; removing an entry stops managing those records without deleting files.","criteria":"`document_types` is keyed by document slug, and the slug is the CLI command name for that document type.\nNo separate `document-slug` configuration attribute exists.\nEvery entry declares `prefix`, `directory`, and `enabled`, and may declare `statuses` and `default_status`.\n`papyrus init` writes the default document-type set listed in this requirement, all enabled unless the interactive walkthrough (REQ-01.006) disables an artifact; `deploy` is not in that set.\n`deploy` can still be added as an ordinary user-defined document type.\nThe default entries have no reserved status: any entry can be renamed, removed, disabled, or given a different prefix or folder by editing the configuration.\nA new document type can be added by editing `papyrus.config.yml` or with `papyrus config set`, without a code change.\nA slug is validated at configuration load: it is non-empty, uses only ASCII letters, digits, `-`, and `_`, does not start with `-`, and contains no whitespace, control character, or path separator; a violating value is rejected and not silently cleaned or normalized (NFR-02.002).\nA slug equal to `init`, `config`, `task`, `milestone`, `release`, `decision`, `search`, `browser`, `import`, `help`, or `version` is rejected with a validation outcome naming the conflict, and the comparison is case-insensitive, so a slug such as `Config` or `SEARCH` is rejected too.\nEach entry must have a non-empty `prefix` and a `directory` that is relative and inside the project directory (NFR-04.002); a violating entry is rejected at configuration load.\nA `prefix` declared by more than one entry is rejected at configuration load, including when one of those entries is disabled.\nTwo enabled entries that declare the same `directory` are rejected at configuration load; disabled entries do not take part in this check.\nA `statuses` list is rejected at configuration load when it is empty, contains duplicates, omits `active` or `archived`, or contains a value that violates the slug character rules.\n`papyrus config set document_types.\u003cslug\u003e.statuses \u003cvalue\u003e` accepts a comma-separated value such as `active,archived,custom` and stores it as a YAML flow sequence; `config get` returns the same values in the same order.\nAn empty value for `statuses` is rejected with a validation outcome and nothing is written; commas are separators with no escape form, so a value containing a comma can only be written by editing `papyrus.config.yml` directly.\nA `statuses` value written by `config set` is validated as the resulting configuration before it is persisted: a list that violates these rules is refused with a validation outcome and nothing is written.\n`active` and `archived` are always declared for a document type and cannot be removed, renamed, or replaced by configuration; every other value in the list is a custom status.\nA `default_status` that is not one of the declared statuses, or that is `archived`, is rejected at configuration load.\nA `statuses` declaration on the `ui-mockup` entry is rejected at configuration load, because UI mockups keep their state in HTML metadata (REQ-05.008).\nA `document_types` mapping that declares the same slug key twice is rejected as invalid configuration, and neither occurrence is silently preferred.\nAn invalid configuration blocks every command with a validation outcome (REQ-01.004); no partially valid document-type set is used.\nThe repair surfaces for an invalid configuration are `papyrus config get|set|unset|list`, which load tolerantly, validate the resulting configuration, and refuse an invalid write, and `papyrus init --force`, which replaces the file with the generated default set.\nA disabled entry has no CLI command and no browser view, and its existing files are untouched.\nRemoving an entry stops managing its records and deletes no file.\nThe non-functional requirement family is addressed by its slug `nfr`; the former `nfreq` command name is not retained as an alias."},{"id":"REQ-07.003","title":"Dispatch Config-Defined Document Commands","criticality":"Must have","userStory":"As a project contributor, I want to run `papyrus \u003cdocument-slug\u003e` for any configured document type so that every document type is managed with a consistent command family.","description":"For every enabled `document_types` entry, Papyrus exposes a command named by its slug. Every document type — built-in default entries and user-added entries alike — has the **baseline command family**:\n\n- `papyrus \u003cdocument-slug\u003e create \u003ctitle\u003e [--description \u003ctext\u003e] [--label \u003clabel\u003e...] [--reference \u003cvalue\u003e...]`\n- `papyrus \u003cdocument-slug\u003e list`\n- `papyrus \u003cdocument-slug\u003e view \u003cid\u003e`\n- `papyrus \u003cdocument-slug\u003e edit \u003cid\u003e [--title \u003ctitle\u003e] [--description \u003ctext\u003e] [--label \u003clabel\u003e...] [--reference \u003cvalue\u003e...] [--editor]`\n- `papyrus \u003cdocument-slug\u003e archive \u003cid\u003e`\n- `papyrus \u003cdocument-slug\u003e delete \u003cid\u003e [--force]`\n\nThe baseline is a lower bound, not the complete verb set of every type. Front-matter-backed document types additionally accept `papyrus \u003cdocument-slug\u003e status \u003cid\u003e \u003cvalue\u003e` (REQ-07.001); UI mockups keep their state in HTML metadata and have no `status` command (REQ-05.008). A built-in typed document type may declare additional verbs beyond the baseline, and those verbs are documented by that type's requirement. In this release, the built-in typed types add `create-group`, plus the `--group` option on requirement creation, for business and non-functional requirements (REQ-05.001, REQ-05.002), and `supersede` for UI mockups (REQ-05.008). A config-defined generic document type offers the baseline family only (REQ-07.004).\n\nThere is no `deprecate` and no `restore` command for documents: `archive` replaces `deprecate`, and archiving has no inverse command (REQ-05.007). `delete` permanently removes a record, archiving an active record first, and asks for confirmation unless `--force` is given (REQ-05.007).\n\nThe command tree is built from the effective configuration when Papyrus starts. Adding a valid entry to `papyrus.config.yml` is therefore enough to obtain a working command: the same Papyrus binary exposes `papyrus \u003cnew-slug\u003e`, and `papyrus --help` lists the new slug, without a rebuild and without per-type code. `papyrus --help` lists every enabled document slug alongside the built-in commands, and `papyrus \u003cdocument-slug\u003e --help` shows the baseline verbs plus any additional verbs of that type. Global options (`--json`, `--dir`, `--config`, `--no-color`) apply to these commands exactly as to other commands (REQ-01.004).\n\nBuilt-in commands are never shadowed. A configuration whose slug equals a built-in command name is rejected at configuration load (REQ-07.002), so at invocation a slug always resolves to a document type. An unknown slug, or the slug of a disabled entry, is a usage error with no fallback to another command. Command outcomes use the common exit codes of REQ-01.004.","criteria":"Every enabled `document_types` entry has a `papyrus \u003cdocument-slug\u003e` command.\nThe command family of every document type includes at least the baseline verbs `create`, `list`, `view`, `edit`, `archive`, and `delete`.\nFront-matter-backed document types also accept `status \u003cid\u003e \u003cvalue\u003e`; UI mockups do not.\nA built-in typed document type may provide verbs and options beyond the baseline: `create-group` and `--group` for business and non-functional requirements (REQ-05.001, REQ-05.002), and `supersede` for UI mockups (REQ-05.008).\n`create` requires a title and accepts optional description, labels, and references.\n`edit` accepts title, description, labels, references, and `--editor`.\nNo `deprecate` and no `restore` command exists for documents.\n`delete` permanently removes a record, archives an active record first, and requires confirmation unless `--force` is given.\nAfter a valid entry is added to `papyrus.config.yml`, the same Papyrus binary exposes `papyrus \u003cnew-slug\u003e`, lists the slug in `papyrus --help`, and runs its baseline verbs, with no rebuild.\n`papyrus --help` lists every enabled document slug, and `papyrus \u003cdocument-slug\u003e --help` lists the baseline verbs plus any additional verbs of that type.\nGlobal options apply to document commands and `--json` output includes errors.\nAn unknown slug or a disabled entry's slug produces a usage error (exit code 2) and does not execute another command.\nA slug that collides with a built-in command never shadows it, because the configuration is rejected at load (REQ-07.002).\nOutcomes use exit codes 0, 1, 2, 3, and 4 as defined in REQ-01.004."},{"id":"REQ-07.004","title":"Provide a Generic Content Model for Config-Defined Document Types","criticality":"Must have","userStory":"As a project contributor, I want a document type added through configuration to have a usable content model so that I can create and edit its records without new code or a per-type schema.","description":"A document type that exists only because it was declared in `document_types` has no type-specific fields in this release. Its records use the same generic content model as technical specifications: a required title, an optional description that forms the document body, and the general front-matter fields `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, and `status` (REQ-05.010). Labels and references are repeatable and are supplied through `--label` and `--reference` on create and edit.\n\nThe `status` of an active record is `active` or one of the type's declared custom statuses (REQ-07.001, REQ-07.002), and it becomes `archived` only through archiving. A new record starts at the type's configured `default_status`, or at `active` when none is configured. Status is not set by a create or edit option: it is lifecycle- and configuration-owned and changes only through `papyrus \u003cdocument-slug\u003e status` and `archive` (REQ-05.011).\n\nRecords are created with an ID built from the entry's `prefix` and `id_padding` (REQ-01.005), stored under `doc_directory` plus the entry's `directory`, and archived into the `archived/` subfolder of that folder (REQ-05.007). The generic model has no per-type field schema and no template file, so declaring the entry is the whole setup. A config-defined type has the baseline command family and no additional verbs (REQ-07.003).\n\nThe baseline command family is the same for every document type. Built-in default types keep their existing type-specific content, fields, and additional verbs, and the generic model adds no field to them and does not replace their documented fields (REQ-05.001 to REQ-05.014).","criteria":"A document type added through `document_types` can create a record with a required title and optional description.\nRecords of a config-defined type carry the general front-matter fields `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, and `status`.\nA config-defined record contains no type-specific field beyond those general fields: no additional front-matter key and no type-specific body section appears.\nLabels and references are supplied through repeatable `--label` and `--reference` options on create and edit.\nRecord IDs use the entry's `prefix` and the configured `id_padding`.\nRecords are stored under `doc_directory` plus the entry's `directory`, and archive into that folder's `archived/` subfolder.\nA config-defined type is usable in create, list, view, edit, archive, and delete with only `prefix`, `directory`, and `enabled` declared (plus optional `statuses` and `default_status`); no field schema, template file, or other per-type artifact is needed.\nA new record starts at the type's configured `default_status`, or at `active` when none is configured.\n`status` is not accepted as a create or edit option; it changes only through `papyrus \u003cdocument-slug\u003e status` and `archive`.\nA config-defined type offers the baseline command family and no additional verbs.\nDefault document types keep their existing type-specific fields and additional verbs; the generic model adds no field to them."}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const treeEl = document.getElementById("tree");
const detailEl = document.getElementById("detail");
const filterEl = document.getElementById("filter");
const nodes = {};

function leafButton(leaf) {
  const button = document.createElement("button");
  button.className = "leaf";
  button.dataset.id = leaf.id;
  button.dataset.search = (leaf.id + " " + leaf.title).toLowerCase();
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = leaf.id;
  const label = document.createElement("span");
  label.textContent = leaf.title;
  button.append(badge, label);
  button.addEventListener("click", () => select(leaf.id));
  nodes[leaf.id] = leaf;
  return button;
}

function renderTree() {
  const fragment = document.createDocumentFragment();
  for (const group of DATA.groups) {
    const wrapper = document.createElement("div");
    wrapper.className = "group";
    wrapper.dataset.group = group.id;
    const head = document.createElement("button");
    head.className = "group-head";
    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = "▾";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = group.id;
    const label = document.createElement("span");
    label.textContent = group.title;
    head.append(caret, badge, label);
    head.addEventListener("click", () => wrapper.classList.toggle("collapsed"));
    wrapper.appendChild(head);
    const list = document.createElement("ul");
    list.className = "leaves";
    for (const leaf of group.children) list.appendChild(leafButton(leaf));
    wrapper.appendChild(list);
    fragment.appendChild(wrapper);
  }
  treeEl.appendChild(fragment);
}

function addField(label, value, className) {
  const heading = document.createElement("h3");
  heading.textContent = label;
  const text = document.createElement("p");
  text.className = value ? (className || "") : "empty";
  text.textContent = value || "—";
  detailEl.append(heading, text);
}

function renderDetail(leaf) {
  const isReq = leaf.id.startsWith("REQ-");
  const id = document.createElement("div");
  id.className = "rid";
  id.textContent = leaf.id;
  const title = document.createElement("h2");
  title.textContent = leaf.title;
  detailEl.replaceChildren(id, title);
  const tags = document.createElement("div");
  tags.className = "tags";
  if (isReq) {
    const criticality = document.createElement("span");
    criticality.className = "tag" + (leaf.criticality === "Must have" ? " must" : "");
    criticality.textContent = leaf.criticality || "—";
    tags.appendChild(criticality);
  }
  const type = document.createElement("span");
  type.className = "tag";
  type.textContent = isReq ? "Business requirement" : "Non-functional requirement";
  tags.appendChild(type);
  detailEl.appendChild(tags);
  if (isReq) {
    addField("User Story", leaf.userStory, "story");
    addField("Description", leaf.description);
    const criteria = (leaf.criteria || "").split("\n").map(line => line.replace(/^[-*]\s+/, "")).filter(Boolean).join("\n");
    addField("Acceptance Criteria", criteria);
  } else {
    addField("Description", leaf.description);
    addField("Rationale", leaf.rationale);
    addField("Verification Method", leaf.verification);
  }
}

function select(id) {
  document.querySelectorAll(".leaf.active").forEach(button => button.classList.remove("active"));
  const button = document.querySelector('.leaf[data-id="' + CSS.escape(id) + '"]');
  if (button) button.classList.add("active");
  if (nodes[id]) renderDetail(nodes[id]);
}

function applyFilter() {
  const query = filterEl.value.trim().toLowerCase();
  document.querySelectorAll(".group").forEach(group => {
    let shown = 0;
    group.querySelectorAll(".leaf").forEach(leaf => {
      const hit = !query || leaf.dataset.search.includes(query);
      leaf.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    group.classList.toggle("hidden", shown === 0);
    if (query && shown) group.classList.remove("collapsed");
  });
}

filterEl.addEventListener("input", applyFilter);
renderTree();
const leafCount = DATA.groups.reduce((n, group) => n + group.children.length, 0);
if (!leafCount) {
  const empty = document.createElement("p");
  empty.className = "empty";
  empty.textContent = "No requirements yet.";
  treeEl.appendChild(empty);
}
document.getElementById("counts").textContent = leafCount + " requirements";
const first = DATA.groups.find(group => group.children.length)?.children[0];
if (first) select(first.id);
</script>
</body>
</html>
