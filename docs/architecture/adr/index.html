ckup metadata as HTML comments inside the HTML file, and an unwrapped `---` block at the top of an HTML file is invalid markup. Mockup HTML files carry no front matter and keep REQ-05.008 as their single metadata source.\n\n12. **Decision `status` and decision `type` (`adr`/`bdr`) stay in the document core.** ADR status carries free-text rationale and cannot move without editing frozen bodies; `type` is already derived from the ID prefix. The key registry remains extensible: moving either later is a registry entry plus a section-retirement rule.\n\n13. **Backfilling front matter is a metadata-only change and is permitted on frozen records**, including Accepted ADRs, because it does not modify the governed body. `id` is backfilled from the existing record identity (front matter, heading, or file name) so REQ-01.005 stability holds. Adoption under decision 9 runs on this rule.\n\n14. **Decision front matter is additive to `## Date` and `## References`.** Those sections remain part of the body and are neither replaced nor moved; `created_date` does not duplicate the `## Date` line, and neither section becomes an editable metadata source. New decisions write `created_date` and `## Date` from one clock value.\n\n15. **Non-record Markdown is out of scope.** A file is a record only when a descriptor claims its directory and filename/ID pattern. Documentation that is not a managed record type never gains front matter implicitly."},{"heading":"Consequences","content":"**Positive:**\n\n- One metadata source serves CLI, browser, search, and the import; REQ-06.004's \"same values\" becomes structural.\n- Field-preserving writes are expressible as a patch, which is the only way to satisfy \"preserve untouched front matter\" and it is shared by CLI, browser, adoption, and import.\n- The contract no longer depends on another tool's key set or serialization, so Papyrus can evolve its metadata without a compatibility gate.\n- The ID value in front matter is the only identity, which removes a whole class of translation bugs and documentation ambiguity.\n- Adoption remains cheap and observable: per record, idempotent, and reviewable through the inventory.\n\n**Negative:**\n\n- The corpus temporarily contains records with and without front matter; readers keep the legacy fallback until convergence.\n- A task or milestone that still carries legacy `## Status`-style sections loses them on its next write (values move to front matter); the file's shape changes once.\n- Removing Backlog.md serialization compatibility means Papyrus can no longer guarantee that another tool reads its front matter; that is the accepted product direction (NFR-04.004).\n- Adoption writes on read, so read-only media or missing permissions surface as errors on read.\n\n**Risks and mitigations:**\n\n- *Front matter destroyed by a writer that re-renders the file*: the patch contract, the single writer (ADR-0013), and a byte-identity test on no-op edits.\n- *Unknown keys dropped*: the parse result keeps unknown keys and order; a patch never rebuilds the block.\n- *Duplicate storage of a field*: a retired section is removed only when its values moved to front matter; a write that cannot move a value keeps the section and reports.\n- *Timestamp drift or non-UTC values*: one formatter, one clock value per write, frozen `created_date`.\n- *Adoption damaging a body*: adoption is front-matter-only; frozen ADR bodies are byte-identical apart from the block; legacy task/milestone sections are retired through explicit patch operations, never by re-rendering.\n- *ID/file-name divergence*: flagged invalid, reads from front matter, writes refused (ADR-0010 decision 4).\n- *Approximate `created_date` mistaken for truth*: documented as best-effort and never recomputed."},{"heading":"Downstream constraints","content":"1. Remove every rule that treats the Backlog.md key set, Backlog.md quoting, or a Backlog.md round trip as a contract: no key-set validation against `backlog/config.yml`, no compatibility tests as an acceptance gate, no \"Backlog-compatible\" wording in help, man page, or specifications.\n2. `id`, `milestone`, `dependencies`, `references`, `superseded_by` are Papyrus IDs everywhere: parsing, serialization, validation, display, JSON, links. Tests must assert that no surface prints or accepts a storage ID.\n3. Adoption must remain front-matter-only: delete the legacy-to-Backlog body conversion path and the lazy Backlog-layout relocation together with their tests and fixtures (ADR-0013 stage plan).\n4. New or changed record types are added by a descriptor plus a key-registry entry, never by a new parser or serializer.\n5. `docs/specifications/migrate-document-record-types-to-front-matter-lazily-on-first-read-and-first-write.md`, `docs/specifications/migrate-tasks-and-milestones-to-the-backlog-md-layout.md`, `docs/specifications/expose-front-matter-metadata-options-on-all-record-commands.md`, and `docs/specifications/render-one-metadata-projection-in-cli-and-browser-views.md` must be revised where they state Backlog.md storage IDs, offsets, or body conversion."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Papyrus-owned front matter, Papyrus IDs, patch writer, lazy front-matter-only adoption (this ADR) | Selected | Meets REQ-05.010/05.011, REQ-01.005 and NFR-04.004 together, and keeps the proven patch architecture. |\n| Keep ADR-0007 as-is and only change code | Rejected | An Accepted ADR that mandates Backlog.md storage IDs and serialization would still contradict the requirements; the ADR corpus must not contain accepted decisions the product has renounced. |\n| Remove front matter and keep `## ` sections as metadata | Rejected | Two sources that diverge; contradicts REQ-05.010 and the browser metadata contract. |\n| Front matter as a read-only cache regenerated from the body | Rejected | Hand-edited values would be lost; contradicts \"front matter is authoritative\". |\n| Bulk one-time adoption of the whole corpus | Rejected by product decision 2026-11-08 | Large single diff, needs a clean tree, and a later-upgraded project needs the same pass anyway. |\n| TOML/JSON metadata block | Rejected | Not what REQ-05.010 asks for; needs new parsing and alienates Markdown tooling. |\n| Keep the legacy task/milestone body conversion as a Papyrus-native cleanup | Rejected | It exists only to reach the Backlog.md shape, which is renounced; it is also the only path that rewrites a task body. |"},{"heading":"References","content":"- `docs/requirements/business/REQ-05.010.md` — field map and record format.\n- `docs/requirements/business/REQ-05.011.md` — metadata maintenance and lazy adoption; Backlog clauses removed.\n- `docs/requirements/business/REQ-01.005.md` — single Papyrus ID space.\n- `docs/requirements/business/REQ-06.004.md` — front-matter metadata in CLI and browser.\n- `docs/requirements/non-functional/NFR-04.004.md` — compatibility renounced; import is the only bridge.\n- `docs/architecture/adr/ADR-0007-yaml-front-matter-as-single-record-metadata-source.md` — superseded by this ADR.\n- `docs/architecture/adr/ADR-0010-papyrus-native-on-disk-record-layout.md` — file layout and identity.\n- `docs/architecture/adr/ADR-0011-one-way-backlog-md-import.md` — how Backlog.md records enter Papyrus.\n- `docs/architecture/adr/ADR-0013-shared-record-envelope-without-a-storage-layer.md` — module and write-path structure.\n- Implementation: `src/record/frontmatter.rs`, `src/record/patch.rs`, `src/record/migrate.rs`, `src/record/document.rs`."}]},{"id":"ADR-0013","title":"Shared Record Envelope and Single Write Path Without a Storage Layer","status":"Accepted — approved by explicit user confirmation on 2026-11-11","sections":[{"heading":"Date","content":"2026-11-11 (status: Accepted, 2026-11-11)"},{"heading":"Context","content":"ADR-0012 makes Papyrus-owned YAML front matter the single metadata source and requires patch-based, field-preserving writes and lazy front-matter adoption. ADR-0010 makes the on-disk layout Papyrus-native with one ID space. ADR-0011 adds a one-way import that must produce ordinary Papyrus records. ADR-0006 fixes optimistic concurrency and atomic writes for browser edits.\n\nADR-0009 (Accepted) established the right structure — one shared record module, one patch API, one writer for CLI and browser, one metadata projection, and a staged delivery — but it is entangled with the storage-identity layer that NFR-04.004 and REQ-01.005 remove: `record::identity` is defined as a two-way display/storage translator, descriptors declare a storage ID pattern and directory, the store translates IDs on the way in and out, Stage 2 exists only to build that translation, and Stage 4 exists only to move records into the Backlog.md layout. Leaving ADR-0009 Accepted would keep a contradicting instruction in force, and its body is frozen, so this ADR supersedes it and restates the envelope with the storage layer removed.\n\nThe starting codebase already contains the shared module (`src/record/{frontmatter,document,patch,store,identity,descriptor,migrate,view}.rs`) plus fourteen legacy per-type modules and two browser write paths. The no-drift rule of ADR-0009 decision 7 is only partly enforced: `src/task.rs` and `src/milestone.rs` still resolve three directory locations each and still allocate numbers through the storage-offset identity code, and `src/record/migrate.rs` still contains the legacy-to-Backlog body conversion and relocation.\n\nForces: one writer so preservation is testable once; CLI/browser parity; single ID space; atomic writes and version tokens; staged delivery on a live corpus; no new dependencies (ADR-0005); and no second parser for the import."},{"heading":"Decision","content":"1. **One shared record module inside the single crate** (ADR-0004, ADR-0005), `src/record/`:\n   - `record::frontmatter` — detect, parse, patch, and serialize the leading YAML block; owns the key registry (general keys plus per-type keys) from ADR-0012.\n   - `record::document` — lossless envelope: front matter plus ordered body units (optional heading line, preamble lines, `## ` sections with raw bodies). Section text and unknown content stay as raw lines, never re-rendered.\n   - `record::patch` — the only mutation API: `SetFrontMatter`, `ClearFrontMatter`, `SetSection`, `ClearSection`, `SetHeadingTitle`, plus explicit section-move operations for adoption. Applying an empty patch, or a patch whose values equal the current ones, returns byte-identical text.\n   - `record::identity` — **Papyrus identity only**: parse and format an ID under a configured prefix and `id_padding`, validate a reference value, and allocate the next number of a family from the records present in every active, archived and deprecated location (ADR-0010 decision 5). It has no storage prefix, no offset, and no translation function.\n   - `record::store` — record location from configuration, safe path resolution (`Context::ensure_within`), read, atomic write (`create_new` + `sync_all` + same-directory rename + cleanup from ADR-0006), version token, archive/restore and deprecate/restore moves.\n   - `record::relocate` — the single implementation of a configured folder move (ADR-0010 decision 8): plan, pre-check, move, rollback, used by `config set` and therefore by the browser configuration view.\n   - `record::descriptor` — the record-type registry.\n   - `src/import/` — the Backlog.md source adapter (enumerate, map, plan, report). It may read and interpret Backlog.md files, but it must express every write as a `record::store` call and every target file as a `record::document`/`record::patch` result. It may not format front matter or write files itself.\n\n2. **Every record module becomes a descriptor, not a serializer.** A descriptor declares: its configured ID prefix key, its configured directory key, its native file-name form, its extra front-matter keys, its known body sections and their order, and its validation rules. No module keeps a `render_*` function that assembles a whole file. The only exceptions are UI mockups (HTML, outside front-matter scope per ADR-0012) and the import's body-section mapping, which must be expressed as patch/section operations.\n\n3. **The browser uses the same reader, patcher and identity.** `browser::records::parse_doc` and the `apply_*_edit` functions are replaced by `record::document` + `record::patch` + `record::identity`. Metadata edits (title, status, milestone, assignee, labels, dependencies, references, release, audit type, `superseded_by`) become front-matter patches; free-text edits remain section patches. Title edits patch front matter and, where the type keeps one, the heading line, in one write. Browser routes, form values and links carry the Papyrus ID; no other ID form is accepted.\n\n4. **One write path for both surfaces.** All CLI writes use `record::store::write_atomic`; no module calls `fs::write` on a record file. The browser keeps the ADR-0006 contract: a stale or malformed version token is `409`/`400` before any write. The CLI does not gain version tokens but does gain atomicity and section preservation, discharging the ADR-0006 deferred follow-up without changing ADR-0006. A write that changes no byte does not happen, so `updated_date` is not refreshed by a no-op.\n\n5. **One projection for both views, with one identity.** A single `RecordView` exposes the Papyrus ID, the ordered `metadata` map as stored (whose `id` is the same Papyrus ID), and the typed document fields. CLI `list`/`view` text and `--json`, browser list/detail JSON, and browser HTML render from it. There is no storage-ID field and no second identity anywhere; any existing `--json` field that exposed a storage ID is removed as a documented breaking change, and `metadata.id` carries the Papyrus ID.\n\n6. **The front-matter key registry is the only metadata extension point.** Adding a key to a record type is a registry entry plus a section-retirement rule, not a new serializer.\n\n7. **Strict no-drift rule.** From this ADR onward no record parsing, metadata formatting, ID formatting, path resolution, or record writing may be added outside `src/record/`. Existing module-local code is removed as each type migrates. A grep-based check is part of review: no `fs::write` on a record path, no `format!(\"---` outside `src/record/`, no ID formatting outside `record::identity`, and no remaining `to_storage_id`/`to_display_id`/offset/storage-prefix symbols.\n\n8. **Delivery is staged; the corpus stays readable at every stage.** Each stage is independently mergeable and testable.\n   - **Stage 1 — envelope.** `record::frontmatter` + `document` + `patch` + `store` read both legacy (no front matter) and new shapes. Largely present.\n   - **Stage 2 — native identity and location.** Replace the translation identity with Papyrus-only identity and allocation; descriptors resolve directories from configuration; tolerant stem resolution (`\u003cPREFIX\u003e-\u003cdigits\u003e[-slug]`); read aliases for `tasks/archived/` and `milestones/archived/`; delete storage prefixes, offsets, `to_storage_id`, `to_display_id`, the `backlog/config.yml` reader, and slug-based identity. Remove the milestone `+1` offset and the `m-0` base from allocation and tests.\n   - **Stage 3 — document front-matter adoption.** Lazy per-record adoption for document record types on first read and first write, built only on `record::patch`, with dry run and per-file inventory (ADR-0012 decision 9). Requires Stage 1 only.\n   - **Stage 4 — task and milestone adoption.** Front-matter-only adoption for tasks and milestones, including retirement of legacy `## Status`-style sections on write. The legacy-to-Backlog body conversion, the Backlog-layout relocation, and the \"byte-identical Backlog body\" guarantee are deleted with their tests, because the target shape no longer exists (NFR-04.004). Requires Stages 1 and 2.\n   - **Stage 5 — relocation.** `record::relocate` and its integration into `config set` and the browser configuration view (REQ-01.002, REQ-06.008): whole-folder move, pre-flight conflict detection, rollback, containment.\n   - **Stage 6 — import.** `papyrus import backlog` (ADR-0011) on top of Stages 1, 2, 4 and 5.\n   - **Stage 7 — removal and enforcement.** Delete the legacy per-type parsers/writers and the browser write path; enforce the decision 7 checks.\n   - **Stage 8 — verification.** Adoption idempotency and byte identity; no Backlog-shaped write anywhere; single-ID surfaces in CLI text, `--json`, browser JSON, browser HTML and URLs; import fidelity and excluded scope; relocation atomicity and conflict behaviour; search still indexing whole persisted text (now including front matter) as documented.\n   A stage may not be reordered past its prerequisites; Stages 3 and 4 may run in parallel; Stage 6 must not ship before Stage 2 (otherwise imported records would carry translated identities), and **Stage 2 must not ship without Stage 6 in the same release** whenever an upgrade path from a Backlog.md-layout store exists, because Stage 2 makes those records invisible (ADR-0010 decision 11).\n\n9. **One clock per write.** Every write path obtains one UTC timestamp and uses it for `updated_date` (and `created_date` at creation); no module calls the clock separately for the same write.\n\n10. **Deletions are part of the decision, not cleanup.** The following are removed rather than left dormant: the storage-identity translation and its constants, the `backlog/config.yml` layering, the legacy-to-Backlog body conversion and relocation, the Backlog.md round-trip verification suites, storage-ID diagnostics and JSON fields, and any documentation that declares Backlog.md compatibility."},{"heading":"Consequences","content":"**Positive:**\n\n- \"Preserve everything the operation does not change\" is one tested property instead of fourteen untested behaviours, shared by CLI, browser, adoption and import.\n- CLI and browser cannot disagree about metadata or identity because there is one reader, one identity function and one projection.\n- The concrete removal list makes the renunciation enforceable: any surviving storage-ID code path fails review mechanically.\n- The relocation routine is written once and serves both REQ-01.002 and REQ-06.008.\n- Imported records are ordinary records from the moment they are written, because the import cannot bypass the writer.\n\n**Negative:**\n\n- This remains the largest refactor in the change: every record type's read and write path is touched, and the work is spread over several tickets.\n- Stage ordering constrains planning: no user-visible import before Stage 2, no import at all before Stage 6.\n- The shared envelope must model each type's structure (heading or not, section order, markers) without becoming a Markdown engine.\n- Removing `--json` storage-ID fields is a breaking API change for any external consumer.\n- Search behaviour changes again: front matter is indexed, so metadata values become searchable.\n\n**Risks and mitigations:**\n\n- *Refactor regression*: migrate one record type at a time with its existing tests unchanged plus new patch tests (no-op byte identity, unknown-key preservation, unknown-section preservation).\n- *Two writers during the transition*: the decision 7 checks are mechanical; the import is explicitly bound to `record::store`.\n- *Stage 2 incomplete while Stage 4 runs*: Stage 4 must not start before Stage 2 lands, or task front matter could still carry a translated identity.\n- *Identity bypass in a new surface*: `record::identity` is the only ID code; tests assert CLI/browser output and browser URLs never contain a non-Papyrus ID.\n- *Relocation data loss*: pre-flight plan, rollback, and tests for destination conflict, permission failure, and cross-device fallback.\n- *Adoption on the read path*: read-only media and concurrency implications are unchanged from ADR-0007/ADR-0012 and must be tested (error reported, file left byte-identical, concurrent second reader a no-op).\n- *Search regression*: indexing is whole-file text; the specification must state that metadata values are searchable."},{"heading":"Downstream constraints","content":"1. No new module may parse, format, locate, or write a record outside `src/record/`; `src/import/` may only read Backlog.md sources and build a plan.\n2. `record::identity` exposes Papyrus ID parse/format/validate/allocate only. Any patch that adds a translation function is rejected.\n3. Descriptors name configuration keys, not paths; the configured roots are the only source of locations.\n4. Descriptor and configuration must stay in agreement: an enabled type without a prefix or directory is a load-time validation error (this replaces the ADR-0008 layered-config validation).\n5. `record::store` remains the only record writer, and the ADR-0006 version-token contract is unchanged for browser writes.\n6. `record::relocate` is the only folder-move implementation and is invoked by `config set`; the browser may not move folders.\n7. Existing `--json` and browser JSON consumers must be re-tested after the storage-ID fields are removed; specification updates for `papyrus(1)` and `docs/specifications/browser-*.md` are owned by `business-analyst`/`tech-writer`.\n8. Stage order is a planning constraint: Stage 2 before Stages 4 and 6; Stage 1 before everything; verification (Stage 8) is a gate on the release that claims NFR-04.004."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Shared envelope, single writer, Papyrus-only identity, staged removal (this ADR) | Selected | Keeps the structure that made preservation testable and drops only the storage layer that the requirements remove. |\n| Keep ADR-0009 in force and treat the translation as dead code | Rejected | The ADR would still mandate translation, Stage 2 and Stage 4 in the Backlog.md layout; accepted decisions must not contradict requirements. |\n| Add front-matter and identity code to each of the fourteen modules | Rejected | Guarantees drift across CLI, browser, adoption and import. |\n| Keep the browser serializer and give the CLI a separate one | Rejected | Two writers already disagree; REQ-06.004 requires identical values and identical preservation. |\n| A standalone import script outside the crate | Rejected | A second writer with untested preservation; the wrapper-script form is allowed only as a thin delegate (ADR-0011). |\n| A Markdown/AST library | Rejected | New dependency, and re-rendering would not preserve unknown content byte-identically (ADR-0005). |\n| Store records in a database or index cache | Rejected | Violates NFR-04.001 text-file persistence and would be a parallel store. |\n| Delete only the two conflicting ADRs' decisions and leave the code | Rejected | Leaves accepted decisions unenforceable and the code contradicting the requirements. |"},{"heading":"References","content":"- `docs/architecture/adr/ADR-0009-shared-record-envelope-and-unified-write-path.md` — superseded by this ADR.\n- `docs/architecture/adr/ADR-0010-papyrus-native-on-disk-record-layout.md` — layout, identity, allocation, relocation.\n- `docs/architecture/adr/ADR-0011-one-way-backlog-md-import.md` — import contract built on this writer.\n- `docs/architecture/adr/ADR-0012-papyrus-owned-front-matter-metadata.md` — metadata contract.\n- `docs/architecture/adr/ADR-0006-optimistic-concurrency-and-atomic-record-writes.md` — atomic writes and version tokens.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — module boundaries and no new dependencies.\n- `docs/requirements/business/REQ-05.011.md`, `REQ-06.004.md`, `REQ-01.005.md`, `REQ-01.002.md`, `REQ-06.008.md`.\n- `docs/requirements/non-functional/NFR-04.004.md`, `NFR-04.001.md`, `NFR-04.002.md`.\n- Implementation: `src/record/*`, `src/task.rs`, `src/milestone.rs`, `src/browser/records.rs`, `src/commands.rs`, `src/init.rs`."}]},{"id":"ADR-0014","title":"Dependency-Free TTY Key Input for the Cursor-Driven Init Artifact List","status":"Superseded by ADR-0015 (2026-11-13). Body frozen.\n\n**Resolution note (2026-11-13):** this proposal was superseded before it was ever validated. It never reached `Accepted` at any point, it was never implemented, and it must not be implemented. The in-process `tcgetattr`/`tcsetattr` FFI route described below is refused; the `stty` cbreak route in `docs/architecture/adr/ADR-0015-cursor-driven-init-list-via-stty-raw-mode.md` is the accepted decision for REQ-01.006 / TASK-104. Read this ADR as the record of a rejected alternative only: no decision item, downstream constraint, or implementation instruction in its body is in force.","sections":[{"heading":"Date","content":"2026-11-13 (status: Superseded, 2026-11-13)"},{"heading":"Context","content":"REQ-01.006 requires the `papyrus init` walkthrough to present the artifact set as a single cursor-driven list: exactly one highlighted selectable row, Up/Down and `k`/`j` navigation, Space toggling the highlighted row, Enter confirming, a redraw after every keypress, clamped navigation, core rows (task, milestone, release) never highlighted, and end of input confirming the current state and continuing. The specification (`docs/specifications/interactive-init-walkthrough-for-artifact-activation.md`, TASK-104 revision) fixes the behavior but deliberately leaves one architecture question open: section 2 requires per-keypress input, and the validation section states that a raw/cbreak mode entry failure must \"follow the architecture decision for TASK-104\".\n\nThe delivered behavior in `src/init.rs` (`build_config_interactive`) renders a static list and then reads one line of space-separated tokens. That is the conformance defect: a line-oriented read cannot see individual keypresses, cannot move a highlight, and is the typed-token activation REQ-01.006 rejects.\n\nForces:\n\n- **Dependency baseline.** ADR-0001 selects Rust and Cargo, ADR-0005 fixes the dependency-free, single-binary, offline posture, and ADR-0004 fixes the repository-root single crate. The crate depends only on `clap`, `serde`, `serde_json`, and `yaml_serde`; no terminal crate and no `libc` crate is present or permitted without a new ADR.\n- **Platform.** ADR-0003 narrows support to Debian Forky on amd64, whose C library is glibc; no Windows/macOS terminal abstraction is required, and the glibc Linux `termios` layout is a single, stable target.\n- **Toolchain.** Rust edition 2024 with `rust-version` 1.99.1: `unsafe extern` blocks are mandatory, and `IsTerminal`, `offset_of!`, and `OwnedFd` are in `std`.\n- **No new user surface.** REQ-01.006 forbids a new CLI flag or environment variable, so key input follows the existing `std::io::IsTerminal` check on stdin.\n- **Phase hand-off.** Interactive mode runs only when stdin is a terminal; the non-interactive/CI path must not change and must not read stdin. The prefix and folder prompts after the list stay line-based (`BufRead::read_line`) on the same stdin, so input buffered during the list must not be lost.\n- **Terminal hygiene.** The terminal must never be left in a modified mode: not on Enter, not on end of input, not on Ctrl-C, not on an I/O error, not on panic.\n- **Testability without a dev-dependency.** Selection, navigation, and toggling must be testable in-process; the real keyboard path is a thin adapter verified on a real TTY (TASK-104 DoD).\n\nA parallel draft for this ticket proposed changing the terminal mode out-of-process with `stty`. That option is viable and is recorded under Alternatives Considered with the reasons it was not selected; this ADR merges both drafts into one decision."},{"heading":"Decision","content":"1. **The cursor-driven list is the only activation input.** `build_config_interactive` no longer reads a token line. The list state machine consumes decoded keys only; the prefix and folder prompts after it stay line-based.\n\n2. **Terminal access uses a minimal in-crate FFI to the C library std already links.** Two symbols are declared in a `#[cfg(target_os = \"linux\")]` module and used only from `src/term.rs`:\n\n   ```rust\n   #[repr(C)]\n   struct Termios {\n       c_iflag: u32, c_oflag: u32, c_cflag: u32, c_lflag: u32,\n       c_line: u8,\n       c_cc: [u8; 32],\n       c_ispeed: u32, c_ospeed: u32,\n   }\n   unsafe extern \"C\" {\n       fn tcgetattr(fd: i32, t: *mut Termios) -\u003e i32;\n       fn tcsetattr(fd: i32, act: i32, t: *const Termios) -\u003e i32;\n   }\n   ```\n\n   The layout is the glibc Linux generic `struct termios` (`NCCS` 32, 60 bytes, `c_cc` at offset 17, in/out speed at offset 52) and is asserted by a unit test (`size_of` plus `offset_of!`). Neither a `libc` crate nor a terminal crate is added; nothing changes in `Cargo.toml`. The symbols resolve against the libc that std already links, which is not a Cargo dependency. Non-Linux targets return `io::ErrorKind::Unsupported`, which takes the fallback in decision 6.\n\n3. **Mode: cbreak-like with signal characters disabled.** From the snapshot taken by `tcgetattr` on fd 0, clear `ICANON`, `ECHO`, `ISIG`, and `IEXTEN` in `c_lflag`, and clear `IXON` and `ICRNL` in `c_iflag`; keep `OPOST` (so `\\n` still becomes `\\r\\n`), set `VMIN = 1` and `VTIME = 0`, and apply with `TCSANOW`. Rationale:\n\n   - `ICANON` off with `VMIN = 1` makes one keypress available per read.\n   - `ECHO` off means Papyrus owns rendering, so the highlight is the only feedback.\n   - `ISIG` off makes Ctrl-C (`0x03`), Ctrl-D (`0x04`), Ctrl-\\ and Ctrl-Z arrive as bytes, so the reader can restore the terminal and exit deterministically instead of dying mid-mode; Ctrl-\\ and Ctrl-Z are treated as no-ops for the short lifetime of the list.\n   - `IXON` off prevents Ctrl-S from silently freezing output while the list is active.\n   - `ICRNL` off makes Enter arrive as `\\r`; the decoder maps both `\\r` and `\\n` to `Key::Enter`, so the choice is not observable.\n   - `OPOST` stays enabled: `stty raw`-style full raw mode would staircase every `\\n` and is deliberately not used.\n\n4. **Restoration is guaranteed by RAII plus an explicit early release.** `TerminalKeys::enter()` snapshots termios and returns a guard; `Drop` restores it best-effort and is idempotent through an `active` flag. The `KeySource` trait exposes `fn finish(\u0026mut self)` (default no-op) which the terminal source implements as the same restore, and the list phase calls `keys.finish()` immediately after confirmation, **before** the first line prompt, so the prefix/folder prompts run in canonical mode with echo. The release profile does not set `panic = \"abort\"`, so `Drop` also runs during unwinding: `?` returns and panics both restore. The modified-mode window is limited to the list itself.\n\n5. **Key layer is artifact-agnostic, reads the same stream as the prompts, and is injectable.** `src/term.rs` owns:\n\n   ```rust\n   pub enum Key { Up, Down, Enter, Eof, Interrupt, Char(char), Unknown }\n\n   pub trait KeySource {\n       fn next_key(\u0026mut self, input: \u0026mut dyn BufRead) -\u003e io::Result\u003cKey\u003e;\n       fn finish(\u0026mut self) {}\n   }\n\n   pub struct TerminalKeys { /* saved termios + active flag */ }  // TerminalKeys::enter() -\u003e io::Result\u003cSelf\u003e\n   pub struct EofKeys;                                            // always yields Key::Eof\n   ```\n\n   Decoding reads one byte at a time through `BufRead::fill_buf`/`consume` on the caller's reader, retrying `ErrorKind::Interrupted`; an empty buffer is `Key::Eof`. This is why the input is passed to `next_key` instead of the source owning a handle: the list and the later line prompts share **one** buffered reader, so type-ahead typed after Enter is not lost at the hand-off, and the real path never opens a second stdin handle. The byte map:\n\n   | Input | Key |\n   |---|---|\n   | `\\r` (0x0D), `\\n` (0x0A) | `Enter` |\n   | `ESC [ A`, `ESC O A` | `Up` |\n   | `ESC [ B`, `ESC O B` | `Down` |\n   | `0x03` | `Interrupt` |\n   | `0x04`, empty buffer | `Eof` |\n   | printable ASCII | `Char(c)` |\n   | anything else, including other CSI/SS3 finals and non-ASCII bytes | `Unknown` |\n\n   SS3 (`ESC O A/B`) covers tmux/putty. A bare `ESC` consumes the following byte, so that one keypress is swallowed (documented limitation; no timer). `Key` carries no artifact knowledge: the list maps `Char(' ')` to toggle and `Char('k')`/`Char('j')` to movement, and `Unknown` only triggers a redraw.\n\n6. **Failure to enter the mode confirms the current state and continues.** If `tcgetattr` or `tcsetattr` fails (including the non-Linux `Unsupported` case), `run_init` prints one warning line to stderr, renders the list once in plain mode, and runs the list loop against `EofKeys`. EOF already means \"confirm the current state and continue\", so no new fallback semantics are invented and no extra text-line prompt is added: the defaults stay selected, the walkthrough proceeds to the canonical prefix/folder prompts, and nothing blocks. Interactive detection stays `std::io::stdin().is_terminal()`; no flag or environment variable is introduced.\n\n7. **Ctrl-C aborts with exit code 130; Ctrl-D/EOF confirms and continues.**\n\n   - Because `ISIG` is off, Ctrl-C arrives as `0x03` and is mapped to `Interrupt`. The list phase restores the terminal first, then returns a new `AppError::Interrupted` (`code()` 130, message `interrupted`); `main` already exits with `err.code()` and, in `--json`, prints the error object.\n   - The interrupt is raised while the list phase runs, before `Config::validate()`, before directory creation, and before the `papyrus.config.yml` write, so no configuration file and no artifact directories are produced.\n   - Ctrl-\\ and Ctrl-Z are bytes under `ISIG` off and are ignored, never treated as confirmation or as signals.\n   - The prefix/folder prompts remain canonical, where Ctrl-C keeps its default SIGINT disposition and the kernel already terminates with 130. Exit status 130 is therefore uniform across the walkthrough; only the mechanism differs.\n\n8. **Rendering is a full redraw of the list, with ANSI only on a terminal.** Frames use a `\u003e` cursor marker and `[x]`/`[ ]` markers, no colour, and core rows carry a fixed active marker plus an \"always active\" note but no cursor position. When stdout is a terminal, a frame is drawn by moving the cursor up over the previous frame and erasing each line (`\\r\\x1b[{n}A`, `\\x1b[2K`); when it is not, a complete fresh copy of the list is appended per keypress. The mode is decided once by `std::io::stdout().is_terminal()` in `run_init` and passed down as a plain `ansi: bool`, so no `Write` implementation needs `IsTerminal`, no terminal database or `TERM` inspection is required, and captured output is free of escape sequences.\n\n9. **Module boundaries inside the single crate.**\n\n   - `src/term.rs` — `Key`, `KeySource`, `TerminalKeys` with the FFI and termios guard, `EofKeys`, and the byte decoder. It knows nothing about artifacts or configuration.\n   - `src/init.rs` — `run_init`, `run_init_with_io` (signature unchanged), the new `run_init_with_io_and_keys`, `build_config_interactive`, the list loop (key → action, frame), and the prompt helpers.\n   - `src/init/list.rs` — private submodule with `ArtifactList`: ordered rows (core, then decision types, then document types in schema order), the selectable-row index, `up`/`down` with clamping, `toggle`, and `render`. No IO, no knowledge of `term`.\n\n   `run_init_with_io_and_keys\u003cR: BufRead, W: Write\u003e(dir, opts, reader: \u0026mut R, writer: \u0026mut W, keys: \u0026mut dyn KeySource, ansi: bool)` takes the key source as a trait object so the terminal source owns no reader borrow and the test source can be a scripted sequence. `run_init_with_io` keeps its current signature and becomes a thin chooser: interactive → `TerminalKeys::enter()` or the `EofKeys` fallback; non-interactive → `EofKeys` with `ansi = false` and no stdin reads. Existing callers and tests of `run_init_with_io` are unaffected.\n\n10. **Tests.** Deterministic coverage is in-process and needs no terminal: unit tests in `src/init/list.rs` for the state machine (initial selection, movement, clamping, toggling, core rows unreachable, rendering) and for the `Termios` layout assertion in `src/term.rs`; an integration test that calls `run_init_with_io_and_keys` with a scripted `KeySource` and a byte buffer writer, asserting the written `papyrus.config.yml` and the emitted frames (including a confirm followed by piped prompt answers, to prove the buffering hand-off). A `#[ignore]`d test drives the real binary under `script(1)` (util-linux) as an optional PTY gate; the real-TTY walkthrough is manual DoD evidence recorded in TASK-104. The FFI behavior itself has no deterministic automated test; the guarded window is small and the layout is asserted.\n\n11. **No new dependency, flag, or environment variable**, and no change to activation semantics: defaults all active, core artifacts always active, inactive types written with `enabled: false`, rows ordered core → decision types → document types."},{"heading":"Consequences","content":"**Positive:**\n\n- REQ-01.006 is implementable with no dependency change: the ADR-0005 baseline exists untouched and the `.deb` payload stays a single binary.\n- Every interactive `init` runs in-process: no subprocess per run, no dependency on an external binary, and precise `errno` from the two calls.\n- The terminal-state contract is structural: `finish()` before the line prompts plus idempotent `Drop` means no return path can leave the terminal modified.\n- The list state machine is IO-free and the interactive flow is testable in-process without a PTY.\n- Sharing one buffered reader between the list and the prompts removes a whole class of type-ahead loss and keeps the non-interactive path untouched.\n- Ctrl-C, Ctrl-D, and a failed mode change all have one documented, non-blocking behavior; exit 130 is uniform across the walkthrough.\n\n**Negative:**\n\n- The crate gains `unsafe` FFI and a hand-declared, platform-specific `termios` layout; that is the maintenance price of avoiding a crate.\n- Only Linux is implemented; other platforms always take the `EofKeys` fallback (acceptable under ADR-0003, but not portable).\n- The decoder is hand-written: arrows are covered in CSI and SS3 form, a bare `ESC` swallows one keypress, and non-ASCII input is ignored.\n- `ISIG` off makes Ctrl-Z/Ctrl-\\ inert during the list, and an externally delivered `SIGTERM`/`SIGKILL` during the list can still leave the terminal non-canonical.\n- Exit code 130 is a new user-visible code; it is conventional, but the requirement's error table must acknowledge it.\n- Aborting on Ctrl-C is a deliberate behavior change from \"Enter keeps defaults\"; users who pressed Ctrl-C to escape a hung prompt now abort `init` (with nothing written).\n\n**Risks and mitigations:**\n\n- *Termios layout drift or wrong constants*: one module, `#[repr(C)]` matching the documented glibc layout, a size/offset assertion, and the PTY/manual gate; a layout change requires a new ADR.\n- *Terminal left in cbreak mode*: `finish()` before the prompts, idempotent `Drop`, no `panic = \"abort\"`, and a window limited to the list. External `SIGTERM`, `SIGHUP`, `SIGQUIT`, `SIGPIPE`, `SIGSTOP`, or a crash during the list remain accepted residual risks; the recovery action is `stty sane`, stated in the warning only if a restore attempt fails.\n- *Swallowed or reordered input at the hand-off*: the list and the prompts share one `BufRead`; the decoder never creates a second reader; the integration test covers confirm-then-piped-line.\n- *Escape-sequence misparse*: the decoder consumes at most two bytes after `0x1B`, ignores unmatched sequences, and tests cover `ESC [ A`, `ESC O B`, and a truncated sequence.\n- *Wrong confirmation/activation pair*: one state machine feeds both the rendered frame and the written configuration; the end-to-end assertion is on `papyrus.config.yml`.\n- *Dependency creep*: the ADR forbids `libc` and terminal crates; review checks `Cargo.toml` and that `unsafe` exists only in `src/term.rs`.\n- *`--json init` on a TTY*: the walkthrough still writes to stdout ahead of the JSON document (pre-existing, out of scope; tracked as a residual issue for the requirement owner).\n- *Non-TTY capture under plain mode*: output grows with keypresses; bounded by the artifact set and accepted."},{"heading":"Downstream constraints","content":"1. **No dependency change.** `Cargo.toml` must not gain `libc`, `crossterm`, `termion`, `ratatui`, `console`, or any other crate. The only foreign symbols are the two in decision 2.\n2. **`unsafe` is confined to `src/term.rs`**, each block carries a `// SAFETY:` comment, and `term` exposes safe functions only (`enter`, `next_key`, `finish`).\n3. **Restoration on every path**: `finish()` after the list and before the first line prompt, idempotent `Drop`, and no `return` between entering the mode and the list loop that bypasses the guard.\n4. **No new CLI flag or environment variable**; interactive detection remains `std::io::stdin().is_terminal()`; ANSI output is gated on `stdout().is_terminal()` and must not appear in captured output.\n5. **`run_init_with_io` keeps its signature**; the non-interactive path performs no stdin reads and writes the same defaults as today. New behavior is reachable only through `run_init_with_io_and_keys`.\n6. **List semantics fixed by REQ-01.006**: initial highlight on the first selectable row (`adr`), navigation over selectable rows only, clamped at both ends, Space toggles only the highlighted row, core rows never highlighted or toggled, rows ordered core → decision types → document types, defaults all active, Enter and EOF both confirm the displayed state.\n7. **`term` stays artifact-agnostic**; no artifact name, configuration key, or prompt text may appear in `src/term.rs`.\n8. **Exit code 130**: `AppError::Interrupted` is raised only for the interrupt key in the list phase, maps to `code()` 130, and is not reused for other aborts; existing codes 1, 3, 4 are unchanged.\n9. **Tests**: injected-`KeySource` unit and integration tests are required in the default `cargo test`. The PTY test is `#[ignore]`d and environment-dependent (`script` from util-linux, a usable PTY); real-TTY verification is manual DoD evidence in TASK-104. Do not add a dev-dependency to obtain a PTY.\n10. **Requirement and specification coordination** (owned by `requirements-engineer`/`business-analyst`, not by this ADR): REQ-01.006's error behavior should acknowledge exit code 130 for Ctrl-C, and `docs/specifications/interactive-init-walkthrough-for-artifact-activation.md` \"Validation and error behavior\" may cite ADR-0014 as the resolved mode-failure decision. No behavioral change to the specification is required.\n11. **Ticket evidence**: TASK-104 must state which paths were verified (injected source, PTY gate, real TTY) and that Ctrl-C aborts with 130, Ctrl-D confirms and continues."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Inline `tcgetattr`/`tcsetattr` FFI with an RAII termios guard (this ADR) | Selected | Per-keypress input with zero new dependencies, no subprocess, exact `errno` and exact saved state; Linux-only in line with ADR-0003. |\n| `stty` cbreak via `std::process::Command` (`stty -icanon -echo -isig -ixon min 1 time 0`, saved with `stty -g`) | Rejected | Viable and avoids `unsafe`, but adds a subprocess per interactive run and a second executable dependency, transports the saved state as an opaque string, and adds spawn/status/parse failure modes plus a third fallback prompt for the same effect; the crate's only other external command is an optional `git init`. |\n| `libc` crate | Rejected | A Cargo dependency for two symbols, against ADR-0005's baseline. |\n| `crossterm`/`termion`/`ratatui`/`console`/`ncurses` | Rejected | New dependency and a large cross-platform surface for one bounded list on one platform. |\n| Append-only redraw only (no ANSI, ever) | Rejected | Readable in logs, but repeats the whole list per keypress on a real terminal, which is exactly where the highlight must be stable; the TTY-gated ANSI path gives both readability and a usable cursor. |\n| ANSI redraw without a non-TTY fallback | Rejected | Escape sequences would pollute logs whenever stdin is a TTY and stdout is redirected. |\n| Full raw mode / `cfmakeraw` | Rejected | Also clears `OPOST`, so every `\\n` staircases; more mode change than the list needs. |\n| Change the terminal mode and also keep typed tokens as a key source | Rejected | REQ-01.006 rejects typed-token activation outright. |\n| Per-artifact `Activate? [Y/n]` prompts | Rejected | Replaced by the maintainer decision of 2026-11-11. |\n| Read keys from a second `/dev/tty` handle | Rejected | Two handles over one terminal complicate ordering and lose the shared-buffer hand-off; stdin is already the terminal in interactive mode. |\n| Map Ctrl-C to `AppError::Runtime` / exit 1 | Rejected | Makes a user abort look like a runtime failure and diverges from the 130 the kernel produces for Ctrl-C during the line prompts. |\n| Install signal handlers to restore the terminal on SIGTERM/SIGHUP/SIGTSTP | Rejected | Broader `unsafe` surface than the rest of the feature; residual risk is documented and the recovery action is `stty sane`. |\n| PTY-based automated test built on `/dev/ptmx` FFI | Rejected | More unsafe test code than the feature itself for a path already covered by a manual real-TTY gate; `script(1)` is used behind `#[ignore]` instead. |\n| Fail `init` when the terminal mode cannot be changed | Rejected | Turns a presentation requirement into a hard runtime dependency and blocks initialization on minimal systems. |"},{"heading":"References","content":"- `docs/requirements/business/REQ-01.006.md` — cursor-driven artifact list, TTY-only execution, no new flag or environment variable.\n- `docs/requirements/business/REQ-01.001.md`, `REQ-01.002.md`, `REQ-01.007.md` — init behavior, configuration access, `id_padding`.\n- `docs/specifications/interactive-init-walkthrough-for-artifact-activation.md` — §2 presentation contract, §3 prompts, \"Validation and error behavior\".\n- `docs/business-rules/BR-016-configuration-keys-and-precedence.md` — activation via `enabled` flags and core artifacts.\n- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — Rust and Cargo.\n- `docs/architecture/adr/ADR-0003-supported-debian-release-target-forky-only.md` — Debian Forky/amd64 only.\n- `docs/architecture/adr/ADR-0004-repository-root-single-crate-layout.md` — single-crate module layout.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — dependency-free baseline, no new dependency.\n- Implementation: `src/term.rs`, `src/init.rs`, `src/init/list.rs`, `src/error.rs` (`AppError::Interrupted`), `src/main.rs` (exit-code propagation); defect at `src/init.rs` `build_config_interactive`.\n- Tests: `src/term.rs` and `src/init/list.rs` unit tests, `tests/init_interactive.rs`, `tests/init_tty.rs` (`#[ignore]`, `script(1)`).\n- Platform reference: glibc `bits/termios-struct.h` (`NCCS` 32, 60-byte `struct termios`) and `bits/termios-c_lflag.h` (`ISIG` 0x1, `ICANON` 0x2, `ECHO` 0x8, `IEXTEN` 0x8000)."}]},{"id":"ADR-0015","title":"Cursor-Driven Init Artifact List via `stty` Cbreak Mode and a KeySource Seam","status":"Accepted (2026-11-13). Acceptance follows the user's explicit instruction of 2026-11-13 to implement REQ-01.006 (TASK-104) along this route. This decision supersedes ADR-0014, the competing in-process `termios` FFI proposal, which is recorded as `Superseded` and must not be implemented.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"REQ-01.006 and `docs/specifications/interactive-init-walkthrough-for-artifact-activation.md` section 2 require `papyrus init \u003cproject_name\u003e` to present artifact activation as one cursor-driven vertical list: one highlighted selectable row, Up/Down and `k`/`j` navigation with clamping, Space toggling the highlighted row, Enter confirming, a full redraw on every keypress, and end-of-input confirming and continuing. The shipped `src/init.rs` (`build_config_interactive`) still prints a static `[x]` block and reads one line of space-separated artifact names, which is the presentation REQ-01.006 rejects. Supplying single keypresses requires leaving the terminal's canonical line discipline for the duration of the list.\n\nForces at play:\n\n- **Dependency baseline.** ADR-0001 selects Rust, ADR-0004 fixes the single-crate repository layout, and ADR-0005 fixes the dependency-free, single-binary, offline posture with no new crate or runtime dependency. DoD/TASK-104 additionally forbids any new crate dependency. Rust `std` exposes `IsTerminal` but no termios/console-mode API, so any in-process mode change needs either a crate or `unsafe` FFI against the C library.\n- **Packaging baseline.** ADR-0002 ships only `/usr/bin/papyrus` plus the copyright file; ADR-0003 targets Debian forky only. The `.deb` dependency set must not grow.\n- **Testability.** The list logic must be driven from tests without a terminal (TASK-104 scope item 10, acceptance criterion 12), while the real keyboard path stays a thin adapter.\n- **Captured output.** Acceptance criteria are checked on captured output, and the terminal may be a pipe or a captured log; redraw must be readable there without assuming terminal capabilities.\n- **Ctrl-C and terminal hygiene.** Ctrl-C during the list must exit without writing `papyrus.config.yml` and without leaving the terminal in a modified input mode (acceptance criterion 14).\n- **No new user surface.** No new CLI flag, environment variable, or configuration key may be introduced, and `--force`, `--no-git`, and the configuration schema are unchanged.\n\nTerminology: the file name uses \"raw mode\" in the colloquial sense. The decision selects **cbreak** — non-canonical input with echo and signal generation disabled — not `stty raw`, which also disables output post-processing.\n\n**Relationship to ADR-0014.** A second Proposed ADR covering the same question — `ADR-0014-dependency-free-tty-key-input-for-interactive-init.md` — records an in-process `tcgetattr`/`tcsetattr` FFI route. The two proposals are mutually exclusive for the same code path and both remain Proposed; this ADR records the `stty` alternative and its justification, and is numbered 0015 only because the 0014 number was already taken. The choice between them is a user decision, and no implementation may adopt either route until one of the two is Accepted and the other resolved (refused or superseded). **Resolution (2026-11-13):** the user selected this route for REQ-01.006 / TASK-104; this ADR is Accepted and ADR-0014 is Superseded without having been accepted."},{"heading":"Decision","content":"1. **Terminal mode is changed out-of-process with `stty` from Debian `coreutils`, never in-process.** At the start of the list phase only, and only when `std::io::stdin().is_terminal()` is true, Papyrus runs `stty` through `std::process::Command` with this exact argument vector:\n\n   ```\n   stty -icanon -echo -isig -ixon min 1 time 0\n   ```\n\n   - `-icanon` makes each byte available immediately instead of after a newline.\n   - `-echo` stops the terminal echoing keystrokes; Papyrus renders every visible effect itself.\n   - `-isig` makes Ctrl-C, Ctrl-\\ and Ctrl-Z arrive as bytes instead of generating SIGINT/SIGQUIT/SIGTSTP, which is what makes decision 7 possible and keeps job control from suspending a process whose terminal is modified.\n   - `-ixon` prevents Ctrl-S from silently freezing the session.\n   - `min 1 time 0` makes a blocking read wait for exactly one byte rather than returning early.\n   - `raw` is deliberately not used: it also clears output post-processing (`opost`), so `\\n` would no longer produce a carriage return and the list would staircase.\n\n   `stty` is invoked with `Stdio::inherit()` for stdin. `Command::output()` would otherwise attach `/dev/null` to stdin and `stty` would fail with \"Inappropriate ioctl for device\". The mode is applied to the terminal already attached to `stdin`; no `/dev/tty` handle is opened and no second stdin handle is created.\n\n2. **The previous settings are saved and restored by a guard.** Before changing the mode Papyrus captures `stty -g` output (same inherited stdin) and stores it in a `TerminalModeGuard`. The guard restores with `stty \u003csaved\u003e`:\n   - immediately when the list phase ends for any reason — Enter, end of input, Ctrl-C, or an I/O error — so the following prefix and folder prompts run under canonical line discipline;\n   - from `Drop`, so unwinding panics also restore (the crate does not set `panic = \"abort\"`; an abort or a fatal signal remains a residual risk, see decision 8).\n\n   A failed restore cannot be repaired in-process: Papyrus prints one line telling the user to run `stty sane`, ignores the restore status, and continues the walkthrough (the configuration state is already decided at that point).\n\n3. **Keys are parsed byte-wise from the same reader the later prompts use.** The parser reads from the existing `R: BufRead` in `build_config_interactive`, one byte per read call (`read_exact` on a one-byte buffer). It never constructs a second `BufReader` over stdin: any bytes the reader has already buffered stay in that same reader, so typeahead after the confirming Enter feeds the first prefix prompt instead of being lost.\n\n   The key map is fixed:\n\n   | Input | Meaning |\n   |---|---|\n   | `0x0A` (LF), `0x0D` (CR) | Enter — confirm and continue |\n   | `0x20` (space) | toggle the highlighted selectable row |\n   | `k`, `j` | move the highlight to the previous/next selectable row |\n   | `0x1B` followed by `[` `A` / `[` `B`, or `O` `A` / `O` `B` | Up / Down |\n   | `0x04` (Ctrl-D) | end of input — confirm the current state and continue |\n   | `0x03` (Ctrl-C) | interrupt (decision 7) |\n   | `read` returning `Ok(0)` | end of input — confirm and continue |\n   | `ErrorKind::Interrupted` (EINTR) | retry the read |\n   | anything else | ignore; redraw only |\n\n   A lone `0x1B` or an unrecognised escape sequence is an ignored key, never a confirmation: the parser reads at most two further bytes and discards what it cannot match. In cbreak mode Ctrl-D is an ordinary byte, not the canonical-mode end-of-file condition, so `0x04` is handled explicitly. Navigation clamps at the first and last selectable row and never enters the core rows; the list state machine is the only owner of cursor and activation state.\n\n4. **Redraw is append-only text.** Each redraw writes a blank separator line and then the complete list — core rows with their fixed marker and \"always active\" indication, then decision types, then document types in schema order — with the cursor marker on the highlighted row and `[x]`/`[ ]` on every selectable row. No ANSI cursor movement, clear-line, alternate-screen, or colour sequences are emitted:\n\n   - output stays readable when captured to a file or a test buffer, which is how the acceptance criteria are checked;\n   - no terminal database, `TERM` inspection, or capability probing is needed;\n   - no escape-sequence state can desynchronise the display.\n\n   The cost is repeated output; the list is bounded by the artifact set, so this is accepted.\n\n5. **Two seams keep the logic testable and the terminal handling thin.**\n   - `KeySource`: `fn next_key(\u0026mut self) -\u003e io::Result\u003cKey\u003e`. `ByteKeySource\u003c'a, R: BufRead\u003e` is the real adapter implementing decision 3; `ScriptedKeySource` yields a fixed key sequence and is used by unit tests. It also models terminal end-of-input and the interrupt key without a terminal.\n   - `TerminalMode`: `enter() -\u003e io::Result\u003cTerminalModeGuard\u003e` / `restore()`. `SttyTerminalMode` is the real adapter implementing decisions 1–2; a fake implementation returns a failure in tests to exercise decision 6.\n\n   The list state machine (`ArtifactList`) takes a `\u0026mut dyn KeySource`, a `\u0026mut W: Write`, and an initial activation map, and knows nothing about `stty`, files, or the OS. `run_init_with_io` keeps its current signature; the TTY branch constructs `SttyTerminalMode` and `ByteKeySource` around the caller-provided reader and writer, the non-TTY branch constructs neither.\n\n6. **If `stty` is unavailable or fails, `init` degrades instead of aborting.** Failure covers: the process cannot be spawned, a non-zero exit status from either `stty -g` or the mode change, unparsable saved settings, or a successful mode change that cannot be restored later. In that case Papyrus:\n   - restores whatever it managed to set (best effort), so the terminal is not left modified;\n   - prints one line stating that key navigation is unavailable in this environment;\n   - renders the list once with every row active and reads a line-based confirmation prompt where only Enter, empty input, or end of input confirms and continues into the unchanged prefix/folder prompts;\n   - never reinstates typed artifact tokens and never fails the walkthrough because of the terminal.\n\n   The degraded path therefore cannot deactivate types. A user who needs a different activation edits `papyrus.config.yml` or uses `config set` (REQ-01.002); this is a terminal-environment limitation, not a silent contract change, and REQ-01.006's rejection of typed-token activation still holds.\n\n7. **Ctrl-C is a byte-mapped interrupt with exit code 130, not a signal-based abort.**\n   - Because of `-isig`, Ctrl-C arrives as `0x03`. The list maps it to a new `AppError::Interrupted` variant whose `code()` is `130` and whose message is `interrupted`; `main` already exits with `err.code()` after printing the message (JSON-mode error object in `--json`).\n   - The interrupt is raised while `build_config_interactive` is still running, before `Config::validate()`, before any directory creation, and before the `papyrus.config.yml` write in `run_init_with_io`, so no configuration file and no project directories are produced.\n   - The `TerminalModeGuard` restores the terminal before the error propagates out of the list phase, so the shell prompt after exit is usable.\n   - Ctrl-\\ (`0x1C`) and Ctrl-Z (`0x1A`) are also bytes under `-isig` and are ignored, never treated as confirmation or as signals.\n   - The prefix and folder prompts stay line-based and canonical, so Ctrl-C there keeps the default SIGINT disposition and the kernel already terminates with 130. Exit status 130 is therefore uniform across the walkthrough; only the mechanism differs.\n\n8. **Residual signal and process-death risks are accepted and documented, not silently handled.** In-process signal handlers would require `libc`/`unsafe` FFI or a crate and are out of scope for this ADR (ADR-0005). Left uncovered:\n   - `SIGTERM`, `SIGHUP`, `SIGQUIT`, `SIGUSR1`, `SIGUSR2`, `SIGKILL`, and `SIGSTOP` delivered externally, or any crash/abort (`SIGSEGV`, `SIGABRT`), terminate the process without running `Drop`; the terminal then stays in cbreak with echo off until the user runs `stty sane`. `SIGKILL` and `SIGSTOP` can never be covered.\n   - An external `kill -TSTP` suspends the process with the terminal modified; there is no `SIGCONT` handler to re-apply and restore the mode.\n   - `SIGPIPE` while writing redraws to a closed stdout terminates the process with the terminal modified.\n   - The exposure window is bounded to the list phase — a keypress loop with no filesystem or network work — and every normal exit path restores, which is the mitigation this ADR relies on.\n   - Installations that need stronger guarantees (handler-based restore, or a `-isig`-based interrupt plus re-raise) require a new ADR that supersedes this one, because they change the dependency baseline.\n\n9. **`stty` does not violate ADR-0005: it is not a new dependency of Papyrus.** It is a binary provided by the Debian `coreutils` package, which is `Essential: yes` (Priority: required) and is present on every system that can run a login shell, including `debootstrap --variant=minbase`. Consequences:\n   - no crate, build-time, or dev dependency is added; `Cargo.toml` is unchanged;\n   - the `.deb` payload is unchanged (no bundled binary, no new `Depends` entry), consistent with ADR-0002 and ADR-0003;\n   - nothing is downloaded, so the offline posture (NFR-01.003) and the \"no runtime asset directory\" property of ADR-0005 are unaffected;\n   - the dependency is not fatal: decision 6 keeps `init` working when the binary is absent, unreadable, or fails, so `stty` is an optional enhancement rather than a hard requirement;\n   - the crate already invokes an external program (`git init`, optional) through `std::process::Command`, so out-of-process system helpers are an established pattern in this codebase.\n\n10. **Scope of the mechanism is exactly the init list.** No other command, prompt, or input path changes. No signal handler, ANSI escape, alternative screen buffer, or terminal-capability query is introduced. Windows and non-Debian platforms are out of scope (ADR-0003); the non-TTY path — no prompts, no `stdin` reads, all artifacts active, defaults written — stays byte-for-byte as today, and `stty` is never invoked there."},{"heading":"Consequences","content":"**Positive:**\n\n- REQ-01.006's cursor contract is implementable without a new crate, without `unsafe`, and without changing the packaging or dependency baseline.\n- `stty` is a single, auditable external call: the mode is a fixed argument vector, and the terminal state is captured and restored rather than assumed.\n- `-isig` turns Ctrl-C into a byte, which gives one deterministic interrupt path with exit code 130, terminal restoration before exit, and no partially written configuration.\n- The list logic is a pure state machine behind `KeySource`, so every acceptance criterion about cursor, toggling, clamping, and redraw is testable without a TTY, and the scripted tests cannot flake on terminal availability.\n- Append-only redraw keeps captured output self-describing, so CI evidence and manual TTY evidence look the same.\n- The fallback keeps `init` usable in stripped-down environments instead of turning a presentation requirement into a hard runtime dependency.\n\n**Negative:**\n\n- A subprocess is spawned and one process-boundary failure mode (spawn/exit status) must be handled.\n- `init` acquires a de facto POSIX-terminal assumption; the interactive list is unavailable where `stty` is missing, and the degraded path cannot deactivate types.\n- Append-only redraw grows output linearly with keypresses; acceptable for a bounded list, not a general TUI strategy.\n- Signal-based termination can still leave the terminal modified, and the only remedy is a user-side `stty sane`.\n- Ctrl-C handling now differs by phase (byte in the list, signal in the prompts), so the two paths must be tested separately even though both end at 130.\n- Typeahead entered after the confirming Enter is consumed by the following prefix/folder prompts; escape bytes typed there are ordinary characters, subject to the existing prompt validation.\n\n**Risks and mitigations:**\n\n- *Terminal left in cbreak mode*: a guard restores on every return path including unwinding panics; restore is attempted before exit code 130 propagates; the degraded path never changes the mode at all. Residual signal cases are listed in decision 8 and are accepted with a documented recoverable action.\n- *Swallowed or reordered input at the hand-off to line prompts*: the byte parser and the line prompts share one `BufRead`; the parser never creates a second reader or a second stdin handle; tests cover a confirm followed by a piped prefix line.\n- *Escape-sequence misparse*: the parser consumes at most two bytes after `0x1B`, ignores unmatched sequences, and treats a lone `ESC` as an ignored key; tests cover `ESC [ A`, `ESC O B`, and a truncated sequence.\n- *Missing or failing `stty`*: decision 6 detects spawn failure and non-zero status and falls back without writing anything unexpected; a fake `TerminalMode` test exercises it.\n- *Locked-down environments where `stty` exists but the ioctl fails*: same fallback, since the failure is a non-zero status.\n- *Confirmation/activation mismatch*: the state machine is the single source of both the rendered list and the written configuration; the end-to-end assertion is on `papyrus.config.yml` after Enter.\n- *Regression of the non-TTY path*: `stty` is called only inside the `is_terminal()` branch; the existing non-interactive init tests gate the change."},{"heading":"Downstream constraints","content":"1. `Cargo.toml` gains no dependency, and the `.deb` gains no payload file and no `Depends` entry. Any proposal to add `libc`, `crossterm`, `termion`, or a similar crate is rejected by this ADR and requires a new one.\n2. The `stty` invocation is exactly decision 1's argument vector plus the `-g` query and the saved-settings restore. No other `stty` subcommand, no shell interpolation, and no user-controlled argument may reach it.\n3. No `unsafe` block, FFI declaration, or signal handler is added for terminal handling.\n4. Mode changes happen only after `stdin` is confirmed to be a terminal, only for the duration of the list phase, and are undone before the prefix/folder prompts.\n5. `ArtifactList` must not perform I/O other than through its injected `KeySource` and `Write`; it must not call `std::io::stdin`, `std::process`, or the filesystem.\n6. `AppError::Interrupted` maps to exit code 130 and is raised only for the interrupt key in the list phase; it must not be reused for other aborts, and the existing codes 1, 3, 4 are unchanged.\n7. Interrupt (Ctrl-C, decision 7) is the only list-phase exit that leaves `papyrus.config.yml` unwritten and creates no artifact directories. End of input (decision 3) and `stty` failure (decision 6) both confirm the current state and continue through the prefix/folder prompts, and therefore do write the configuration.\n8. The degraded path may not introduce any typed artifact-token activation; REQ-01.006 stays in force in every environment.\n9. Interactive detection remains `std::io::stdin().is_terminal()` per the specification assumption; no `/dev/tty` probing, `TERM` inspection, or new flag is added.\n10. TTY verification (acceptance criterion 14, DoD 6) is manual evidence recorded in the ticket; automated coverage of the real `stty` path is limited to the mode-abstraction seam.\n11. The specification (`docs/specifications/interactive-init-walkthrough-for-artifact-activation.md` §2, §3.1, \"Validation and error behavior\") already allows a mode-entry failure to follow this ADR; no wording change is required by this decision, and the business analyst owns any later specification text."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| `stty` cbreak via `std::process::Command`, byte-wise parsing, append-only redraw, `KeySource`/`TerminalMode` seams (this ADR) | Selected | Meets single-keypress input with no crate, no `unsafe`, and no packaging change; `coreutils` is Essential; every failure mode has a non-fatal path. |\n| Direct `termios` FFI with `extern \"C\"` (`tcgetattr`/`tcsetattr`) | Rejected | No crate, but introduces `unsafe` and a hand-maintained, architecture-dependent `termios` layout; more review surface than one auditable subprocess for the same effect. |\n| `crossterm` / `termion` / `console` / `ncurses` crate | Rejected | New dependency against ADR-0005 and TASK-104 DoD 5, for one bounded list in one command. |\n| `stty raw` | Rejected | Also disables output post-processing, so `\\n` no longer returns the carriage and every redraw staircase-edges; more terminal behaviour is changed than the list needs. |\n| In-place redraw with ANSI cursor-up and clear-line sequences | Rejected | Requires capability assumptions, produces unreadable captured output, and adds escape-state handling that byte-wise redraw avoids. |\n| `tput`, `read -n1`, or a `bash`/`sh` helper for key reading | Rejected | Adds a shell interpreter and a second language to the runtime surface, and `read -n1` still needs a mode change from somewhere. |\n| Read from a second `/dev/tty` handle | Rejected | Two handles over one terminal complicate buffering and ordering, and `stdin` is already the terminal in interactive mode. |\n| Fail `init` when the terminal mode cannot be changed | Rejected | Turns a presentation requirement into a hard runtime dependency and blocks initialization on minimal systems. |\n| Keep line-based typed tokens or per-artifact `y`/`n` prompts | Rejected | Explicitly rejected by REQ-01.006 and the TASK-104 acceptance criteria. |\n| Install signal handlers to restore the terminal on SIGINT/SIGTERM/SIGTSTP | Rejected | Needs `libc`/`unsafe` or a crate, changing the dependency baseline; residual risk recorded in decision 8 instead. |\n| Full-screen/alternate-buffer TUI | Rejected | Escape-sequence and capability dependence, scrollback loss, and far more surface than one list needs. |"},{"heading":"References","content":"- `docs/requirements/business/REQ-01.006.md` — interactive cursor-driven init list.\n- `docs/requirements/business/REQ-01.001.md`, `REQ-01.002.md`, `REQ-01.003.md`, `REQ-01.007.md` — init behavior, configuration access, context selection, `id_padding`.\n- `docs/specifications/interactive-init-walkthrough-for-artifact-activation.md` — §1.2, §2, §3, §4, \"Validation and error behavior\".\n- `docs/business-rules/BR-016-configuration-keys-and-precedence.md` — activation via `enabled` flags and core artifacts.\n- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — Rust.\n- `docs/architecture/adr/ADR-0002-distribution-format-amd64-deb-packages.md` — `.deb` payload.\n- `docs/architecture/adr/ADR-0003-supported-debian-release-target-forky-only.md` — Debian forky only.\n- `docs/architecture/adr/ADR-0004-repository-root-single-crate-layout.md` — single crate.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — no new dependency, single binary, offline.\n- `docs/architecture/adr/ADR-0014-dependency-free-tty-key-input-for-interactive-init.md` — competing Proposed route for the same question (in-process FFI); only one of the two may be selected.\n- `docs/requirements/non-functional/NFR-01.003.md` — offline operation; `NFR-03.001.md` — Rust; `NFR-04.002.md` — project-directory boundary.\n- Implementation: `src/init.rs` (`run_init`, `run_init_with_io`, `build_config_interactive`), `src/error.rs` (`AppError`), `src/main.rs` (exit code propagation), `src/sanitize.rs` (prompt validation).\n- Backlog: TASK-104."}]},{"id":"ADR-0016","title":"Runtime Config-Derived Command Dispatch for Document Slugs","status":"Accepted (2026-11-13) — accepted by explicit user decision of 2026-11-13; amended 2026-11-15 by owner decision (decision 1 derive/builder split, decision 2 `BUILTIN_COMMANDS` names only, decision 4 `clap` `string` feature, decision 10's consequence count, downstream constraint 2, and downstream constraint 6) without status change.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"REQ-07.002 makes the `document_types` map key the document slug, and REQ-07.003 makes that slug the CLI command name: every enabled entry must expose `papyrus \u003cdocument-slug\u003e` with the baseline verb family `create`, `list`, `view`, `edit`, `archive`, `delete`. Front-matter-backed document types add `status \u003cid\u003e \u003cvalue\u003e` (REQ-07.001), a built-in typed type may add verbs of its own (`create-group`, `--group`, `supersede`), and UI mockups have no `status` verb. `papyrus --help` must list every enabled slug, `papyrus \u003cslug\u003e --help` must document that type's verbs, an unknown or disabled slug must be a usage error (exit code 2) with no fallback, and a configured slug can never shadow a built-in command.\n\nCurrent code shape:\n\n- `src/lib.rs` declares `Cli` and `Commands` with `clap` **derive** macros and dispatches with one `match` arm per variant. Twenty subcommands are compiled in, including eleven document-type variants (`Req`, `Nfreq`, `Glossary`, `UiSpec`, `TechSpec`, `Rule`, `UiMockup`, `Audit`, `UseCase`, `TestCase`, `TestReport`) that REQ-07.003 removes as static commands.\n- `Cli::parse()` calls clap's exiting parser, so parse errors bypass `AppError`, the project's exit-code mapping (0/1/2/3/4, REQ-01.004) and the `--json` error object.\n- Each document module owns its own `clap::Subcommand` enum (`ReqCmd`, `TechSpecCmd`, …) with type-specific verbs (`CreateGroup`, `Deprecate`, `Restore`, `Supersede`).\n- `--json`, `--dir`, `--config`, `--no-color` are `global = true` derive arguments. They are needed to *find* the configuration, yet the configuration is needed to *build* the command tree — a circular dependency that derive cannot express.\n- clap derive can only declare subcommands the compiler can see. A runtime entry set is not expressible; the only derive escape hatch is `allow_external_subcommands`, which disables per-subcommand `--help`, typed parsing, and help/usage listing.\n\nForces: no new dependency (ADR-0005); exit codes and JSON errors must stay exactly as documented in REQ-01.004; help must stay accurate for a set that changes per project; a failed configuration must fail closed (REQ-07.002); the built-in command surface must not regress; and the same built-in table must be reusable for validation (ADR-0019) and documentation (ADR-0021) so the three cannot drift."},{"heading":"Decision","content":"1. **One command tree is built at startup from the artifact registry** (`cli::tree(\u0026ArtifactRegistry) -\u003e clap::Command`, builder API). It is the single source of parsing, usage, and help. The builder and the derive macros are **split by surface**: `cli::tree` builds the root command and the global arguments (`--json`, `--dir`, `--config`, `--no-color`) with the builder API; `cli::tree::document_command` and `cli::tree::verb_command` build the entire document surface with the builder API; the built-in trees remain `clap` **derive** in `src/cli/builtin.rs` (`BuiltinCmd`, `ConfigCmd`, `InitArgs`) plus one `#[derive(Subcommand)]` enum per family in `src/task.rs`, `src/milestone.rs`, `src/release.rs`, `src/decision.rs`, `src/import.rs`, grafted onto the root with `BuiltinCmd::augment_subcommands(cmd)` and parsed with `BuiltinCmd::from_arg_matches`. `clap` remains the only parser and the only dependency.\n\n   *Revision (2026-11-15, owner decision): this decision previously stated that the derive macros were replaced by explicit builder construction for `Cli` and for *every* built-in subcommand. Converting the built-in trees to the builder API was considered and rejected by the owner, so the split above — builder for the root, the global arguments, and the whole document surface, derive for the built-in families — is the contract, not an interim state.*\n\n2. **Built-ins come from one static name list.** `cli::BUILTIN_COMMANDS` is a list of **names only** (`BuiltinEntry { name: \u0026'static str }`), not of `clap::Command`s and handlers. The names in that table (`init`, `config`, `task`, `milestone`, `release`, `decision`, `search`, `browser`, `import`, `help`, `version`) are the reserved names. Its consumers are the reserved-name validation of ADR-0019 (`src/config.rs`) and the pre-build slug-collision guard in `src/cli/tree.rs`; it is the single reserved-name source and remains **reserved for** the packaged man page (ADR-0021, still `Proposed` and deferred — not a delivered consumer). `help` and `version` stay clap-provided subcommands/options and are listed as reserved.\n\n   *Revision (2026-11-15, owner decision): this decision previously stated that the table listed, for every built-in, its name, its `clap::Command`, and its handler, and it named the packaged man page as a consumer. The delivered table holds names only; the man page does not exist (`docs/man/` is absent and ADR-0021 selects no option), so the two real consumers are configuration validation and the tree's collision guard.*\n\n3. **Two-phase startup, in fixed order.**\n\n   - **Phase 1 — context pre-scan.** A lexical scan of `argv` (not a parser) extracts only `--dir \u003cpath\u003e`, `--dir=\u003cpath\u003e`, `--config \u003cpath\u003e`, `--config=\u003cpath\u003e` and the corresponding `PAPYRUS_DIR`/`PAPYRUS_CONFIG` environment variables, and resolves the project directory and configuration path exactly per REQ-01.003. The scan stops at `--`. It never interprets subcommands, verbs, or any other option.\n   - **Phase 2 — configuration.** For every command except `init`, the selected configuration is loaded **and fully validated** (ADR-0019), then the registry is built (ADR-0017). A missing or invalid configuration aborts here with the documented outcome (exit 1 for not found, exit 4 for validation); no command tree is built from a partial type set.\n   - **Phase 3 — single parse.** `cli::tree` is built from the registry and `try_get_matches_from(argv)` parses the real invocation exactly once. Phase 1's result is discarded except for selecting the file.\n   - **Phase 4 — dispatch.** `match` on the resolved command: a built-in handler, or `Command::Document { slug, verb }`.\n\n   `papyrus init` skips phases 2–3's configuration load, because REQ-01.001 requires it to run without a configuration file.\n\n4. **Document commands are built by one function, not one type.** `cli::document_command(descriptor)` produces a `clap::Command` whose about line is `Manage \u003cslug\u003e documents.` and whose subcommands are the baseline verbs of REQ-07.003 (`create`, `list`, `view`, `edit`, `archive`, `delete`), plus `status \u003cid\u003e \u003cvalue\u003e` when the descriptor is front-matter-backed, plus any verb the descriptor declares as an extension. Every verb parses into one `DocumentInvocation { slug, verb: DocumentVerb, args: DocumentArgs }` value; `document::run(ctx, registry, invocation)` is the only handler. Type-specific verbs (REQ-05.001 `create-group`, REQ-05.002 `--group`, REQ-05.008 `supersede`) and the `status` presence rule are descriptor data, not a second handler (ADR-0017).\n\n   *Revision (2026-11-15, owner decision): this decision previously left the runtime-name mechanism unstated. The `clap` `string` feature (enabled together with `derive` in `Cargo.toml`) is what lets a builder-built document command own a runtime slug — `Command::new(descriptor.slug.clone())` takes an owned `String`, so no `'static` leak is needed — while `derive` stays enabled for the built-in family trees of decision 1.*\n\n5. **No dynamic escape hatch.** `allow_external_subcommands`, `ignore_errors`, `infer_subcommands`, `allow_missing_positional`, and trailing-argument passthrough are **not** used. A name that is not in the tree is not a command: clap emits `unrecognized subcommand` with the enabled command list and exits 2. A disabled entry is absent from the tree, so its slug behaves exactly like an unknown slug. There is no alias, abbreviation, case folding, or fuzzy match, and no path in the code may map an unknown slug onto a different command.\n\n6. **Built-in names cannot be shadowed, by construction and by validation.** `cli::tree` never inserts a document command whose slug equals a built-in name; ADR-0019 rejects such a configuration first, so the runtime check is a defensive assertion, not the control. This keeps REQ-07.002's guarantee independent of insertion order.\n\n7. **Help and error text a
