re generated from the tree.**\n   - `papyrus --help` lists built-ins and one line per enabled document type, derived from the registry in slug order.\n   - `papyrus \u003cslug\u003e --help` lists the baseline verbs, `status` where the type has it, and any declared extension for a built-in type.\n   - Unknown-slug, missing-verb, and malformed-option errors keep clap's plain-text stderr output and exit code 2 (REQ-01.004), unchanged from today.\n   - Application errors (`AppError`) keep the existing mapping (1/3/4) and the existing `--json` error object.\n   - `--json` from a document command behaves as for any other command because the flag is a global argument of the same tree.\n\n8. **`--version` and `--help` do not require a configuration file.** If no configuration is found, `papyrus --version` prints the version and exits 0; `papyrus --help` lists the built-in commands plus the default document-type set, annotated that no configuration was found, and exits 0. Rationale: these are global options, not command executions, and REQ-01.003's fail-closed rule governs commands. Without this exception a missing or broken configuration would leave the user unable to see which commands exist. Command execution remains fail-closed.\n\n9. **Startup work is bounded and observable.** The tree is built once per process in `O(built-ins + enabled types)`; no completion scripts, no per-request rebuilding, and no caching across processes. Building the tree is not allowed to perform I/O beyond the already-loaded configuration.\n\n10. **Removals are part of this decision.** The static document-type variants of `Commands`, their `clap::Subcommand` enums, and the `nfreq` command name are deleted, not retained as hidden aliases (REQ-07.002 and REQ-07.003 both forbid the alias). `req` and `nfr` keep working only because they are default `document_types` entries."},{"heading":"Consequences","content":"**Positive:**\n\n- REQ-07.003 becomes structural: adding an entry adds a command, a help line, and `--help` output with no code change.\n- Parsing, usage text, help, and validation all read the same sources — the derive declarations for the built-ins, `BUILTIN_COMMANDS` for reserved names, and the registry for the document surface — so the reserved-name list cannot drift from the real command set.\n- The circular dependency between global options and the command tree is resolved once, in one documented place, instead of being worked around per command.\n- Deleting eleven static document-type variants (the ten per-type modules plus the `nfreq` alias) removes a large block of near-duplicate code that REQ-07.003 makes obsolete anyway; the built-in family trees of decision 1 are derive-built and stay unchanged.\n- A `status` verb that exists only for front-matter-backed types makes the descriptor's status model (ADR-0017) visible in help without a second command builder.\n\n**Negative:**\n\n- Every invocation now loads and validates the configuration before argument parsing completes. A usage error in a project with an invalid configuration reports the configuration error (exit 4) rather than the usage error (exit 2).\n- `papyrus --help` in a project directory with an invalid configuration fails closed (exit 4); the built-ins-only rendering applies only when no configuration file exists.\n- Document help text is no longer a compile-time constant, so documentation tests and man-page generation for the document surface cannot simply embed it.\n- On the document surface, the derive macros' compile-time argument checking is replaced by builder construction: a wrong argument name is a runtime help-text defect, not a compile error. The built-in family trees keep derive's compile-time checking. Characterization tests are the mitigation.\n\n**Risks and mitigations:**\n\n- *Pre-scan diverges from clap*: the scan recognizes only the four documented forms and stops at `--`; a matrix test compares phase-1 resolution with the final parsed global values for `--dir`, `--dir=`, `--config`, `--config=`, env-only, and mixed forms.\n- *Behaviour change for existing scripts*: `papyrus nfreq …` now exits 2. This is required by REQ-07.002 and must appear in the release upgrade notes.\n- *Argument-name drift in command construction*: one table-driven test per built-in asserts that every documented option parses, one run of each document verb covers the builder-built document surface, and one test asserts the full help output per command.\n- *Config-before-parse hides usage errors*: documented in `papyrus(1)`; `papyrus --help` remains available when no configuration file exists.\n\n*Revision (2026-11-15, owner decision): the consequence bullets were aligned with the delivered split — the removed static surface is eleven document-type variants (ten per-type modules plus the `nfreq` alias), the lost compile-time argument checking and the non-constant help text apply to the document surface only, the built-in family trees keep derive, and help for the built-ins is generated from their derive declarations rather than from `BUILTIN_COMMANDS`.*"},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Builder tree built at startup from the registry (this ADR) | Selected | Only route that satisfies help listing, per-slug `--help`, exit 2, and zero per-type code, without a new dependency. |\n| Keep derive and add `allow_external_subcommands` | Rejected | No per-subcommand help, no listing in `--help`, option parsing becomes a second hand-written parser, and unknown-slug errors lose clap's exit-2 path. |\n| Pre-parse `argv[1]` by hand and forward the remainder to clap | Rejected | Duplicates option parsing and error formatting, and every new verb needs a second parser. |\n| Keep static commands and generate a wrapper per document type | Rejected | Requires code generation and a build step for a set that is meant to change at runtime; violates \"no per-type code\". |\n| Dispatch by shell wrapper scripts installed per type | Rejected | Packaging would need a script per type; ADR-0002/ADR-0003 ship one binary. |\n| Resolve the configuration inside each command handler instead of before parsing | Rejected | Then a document command cannot exist in the tree, so help and `--help` cannot be correct. |"},{"heading":"Open Questions","content":"- Should `papyrus --help` with an **invalid** configuration also fall back to the built-ins-only rendering (decision 8 covers only \"no configuration file\")? Current decision: fail closed with exit 4, so the user is told what to fix.\n- Should `papyrus \u003cslug\u003e \u003cid\u003e` be accepted as a shorthand for `view \u003cid\u003e` (REQ-07.003 leaves this open)? Current decision: no shorthand.\n- Should a top-level `papyrus help \u003cslug\u003e` be required in addition to `--help`? Current decision: only the clap-provided `help` subcommand and the `--help` flag."},{"heading":"Downstream constraints","content":"1. `src/lib.rs` must contain no `#[derive(Subcommand)]` command enum after this ADR; command-tree construction and parse dispatch live in `src/cli/`.\n2. `src/cli/builtin.rs` and the five built-in family modules (`src/task.rs`, `src/milestone.rs`, `src/release.rs`, `src/decision.rs`, `src/import.rs`) may declare `clap` derive commands and are the **only** such declarations. No module may build or inspect a `clap::Command` for a document type outside `src/cli/`, and `document::run` receives a `DocumentInvocation`, never an `ArgMatches`.\n\n   *Revision (2026-11-15, owner decision): this constraint previously read \"no module except `src/cli/` may construct or inspect a `clap::Command` or `ArgMatches`\", which the delivered derive/builder split of decision 1 contradicts, because the built-in family trees are declared outside `src/cli/`. The permission is now enumerated — the named modules may declare derive commands, document-type command construction stays inside `src/cli/`, and the document handler boundary is the `DocumentInvocation` value. Constraint 1 is read the same way: the `src/lib.rs` prohibition stands, while `src/cli/` owns command-tree construction and parse dispatch.*\n3. Document dispatch enters only through `document::run`; no `match slug` on string literals is permitted outside the registry (grep check).\n4. Exit codes 0/1/2/3/4 and the `--json` error object are unchanged.\n5. `status \u003cid\u003e \u003cvalue\u003e` never archives and never moves a file; `archive` is the only verb that produces `archived`, and the command tree must not offer `status` on a type without front-matter status (UI mockups).\n6. `BUILTIN_COMMANDS` is the only list of built-in command names; ADR-0019 consumes it for reserved-name validation, and ADR-0021 is reserved to consume it once a man-page option is selected (that ADR is still `Proposed` and deferred, so the man-page consumer is not delivered).\n\n   *Revision (2026-11-15, owner decision): this constraint previously read \"ADR-0019 and ADR-0021 must consume it\", which implied a delivered man-page consumer. The table carries names only; ADR-0019 consumes it today and ADR-0021 remains reserved, consistent with decision 2.*"},{"heading":"References","content":"- `docs/requirements/business/REQ-07.001.md` — document main status, custom statuses, and the `status` command.\n- `docs/requirements/business/REQ-07.002.md` — document slugs and reserved built-in names.\n- `docs/requirements/business/REQ-07.003.md` — dynamic command family, help listing, unknown/disabled slug.\n- `docs/requirements/business/REQ-01.003.md` — project and configuration selection, fail-closed.\n- `docs/requirements/business/REQ-01.004.md` — global options and exit codes.\n- `docs/architecture/adr/ADR-0004-repository-root-single-crate-layout.md` — single crate.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — no new dependency.\n- `docs/architecture/adr/ADR-0017-artifact-category-registry-and-type-descriptors.md` — the registry the tree is built from.\n- `docs/architecture/adr/ADR-0019-fail-closed-document-type-configuration-validation.md` — the validation that runs before parsing.\n- Implementation: `src/lib.rs`, `src/cli/` (new), `src/document.rs` (new), `src/registry.rs` (new), `src/main.rs`."}]},{"id":"ADR-0017","title":"Artifact Category Registry and Per-Type Behavior Descriptors","status":"Accepted (2026-11-13) — accepted by explicit user decision of 2026-11-13; amended 2026-11-15 by owner decision (decision 2 `verbs` row, decision 3, decision 4 CLI bullet, and downstream constraint 3) without status change; amended again 2026-11-15 by owner decision (decision 2 milestone verb set: `close` replaces `archive`, no `restore`; downstream constraint 3 milestone archive policy) without status change.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"REQ-07.001 fixes exactly three artifact categories — **backlog** (tasks, milestones, releases), **decision** (decision records), **document** (every type declared under `document_types`). Status models differ by category: task statuses are configurable through the top-level `statuses`/`default_status` (REQ-01.002); milestones are fixed `open -\u003e closed`; releases fixed `planned -\u003e released`; decisions use the five Nygard statuses; and every document type has a **main status** `active` or `archived` — the only statuses that affect storage location — plus optional **custom statuses** declared per type in `document_types.\u003cslug\u003e.statuses` with an optional `default_status`. Custom statuses are front-matter values only: no folder per status and no move on a status change. UI mockups keep `pending`/`approved`/`archived` in HTML metadata and declare no custom statuses.\n\nREQ-07.003 fixes the document **baseline** command family to `create`, `list`, `view`, `edit`, `archive`, `delete` for every document type, and adds `status \u003cid\u003e \u003cvalue\u003e` for front-matter-backed types (it never archives). The baseline is a lower bound: built-in typed types add verbs and arguments — `req`/`nfr` have `create-group` and a required `--group` on `create` (REQ-05.001, REQ-05.002), and `ui-mockup` has `supersede` (REQ-05.008). REQ-05.007 gives every document type a single archive/delete policy.\n\nCurrent code shape exposes four different partial models of the same idea:\n\n- `src/record/descriptor.rs` declares fourteen `RecordDescriptor` values (tasks, milestones, releases, decisions, and ten document types). It is a **compile-time** list; `descriptor_for_doc_type(key)` returns `None` for any slug that is not one of the ten compiled keys, so a config-defined type is invisible to the record layer.\n- `src/lib.rs` + one module per type (`src/req.rs`, `src/tech_spec.rs`, …) encode each type's verb set as its own `clap::Subcommand` enum and its own `match` dispatch.\n- `src/browser/records.rs` declares a `Category` enum with fifteen variants and per-variant `key()`, `config_key()`, and `descriptor_name()` mappings, plus `form_for_stem` branching on `Category`.\n- `src/browser/render.rs` branches on `Category` in the sidebar, page titles, list pages, detail pages, and edit forms.\n- `src/config.rs` holds `DocTypeEntry { prefix, directory, enabled }` with no status model, content model, id shape, or verb set. `deploy` is no longer a default entry (REQ-07.002) and survives only as an ordinary user-added type, but the code still seeds it by default.\n\nADR-0013 fixes the record envelope, the single write path (`record::store`), the single mutation API (`record::patch`), and makes the descriptor the only extension point for a record type. ADR-0010 fixes configuration-driven directories and Papyrus-only identity. ADR-0012 fixes the front-matter key registry. None of them covers a type that exists only because configuration declares it.\n\nForces: one structural model for CLI, record layer, search, and browser (otherwise five places drift); type-specific behavior must remain possible for built-in types without special-casing outside that model; config-defined types must require no code; the single write path and front-matter contract must not be weakened; the artifact categories and fixed lifecycles of REQ-07.001 must be expressible as data, not as ad-hoc `match` arms."},{"heading":"Decision","content":"1. **One registry, built at startup, describes every artifact type.** `src/registry.rs` exposes `ArtifactRegistry` with three category collections and one descriptor type. It is assembled from two sources, in this order:\n   - the static built-in descriptors (the built-in templates in `src/registry.rs` plus `record::descriptor` entries) for tasks, milestones, releases, and decisions;\n   - one runtime `TypeDescriptor` per `document_types` entry, derived mechanically from `DocTypeEntry` plus the static document descriptor of the same slug when one exists.\n\n   A slug that has no static descriptor resolves to the **generic** document descriptor (ADR-0018). The registry is the only object that maps a slug to behavior; no module may hold a second list of type names.\n\n2. **`TypeDescriptor` carries behavior, not presentation-only data.** At minimum: `slug` (the command name), `category` (`Backlog | Decision | Document`), `label` (curated for built-ins, derived for config-defined types), `prefix`, `directory` resolution (configuration key plus relative value), `enabled`, `status_model`, `verbs`, `content_model`, `frontmatter_keys`, `sections`, `id_shape`, and `archive_policy`.\n\n   | Field | Values | Source of truth |\n   |---|---|---|\n   | `category` | `Backlog`, `Decision`, `Document` | REQ-07.001 |\n   | `status_model` | `Fixed(\u0026[State])`, `TaskConfigurable { statuses, default }`, or `DocumentMain { main: [active, archived], custom: \u0026[State], default: State }` | REQ-07.001, REQ-01.002 |\n   | `verbs` | every descriptor in every category: task `create/list/view/edit/archive/restore/delete`; milestone `create/list/view/edit/close/delete`; release `create/list/view/edit/close`; decision `create/list/view/edit`; document `create/list/view/edit/archive/delete`, plus `status` where the type stores a front-matter status, plus declared extensions | REQ-02.001–004, REQ-03.001–002, REQ-04.001, REQ-07.003, REQ-05.001/002/008 |\n   | `content_model` | `Generic`, `Typed(\u0026'static TypedSchema)`, `HtmlMockup` | REQ-07.004, REQ-05.008 |\n   | `frontmatter_keys` | general keys plus per-type keys (`status` included only for a type that stores it) | REQ-05.010, ADR-0012 |\n   | `id_shape` | `Plain`, `Dotted`, `Grouped` | REQ-01.005, REQ-05.001/002 |\n   | `archive_policy` | `ArchivedFolder { state_field }` or `None` | REQ-05.007, REQ-04.002 |\n\n   *Revision (2026-11-15, owner decision): the `verbs` row previously described the field as the document baseline plus `status` plus extensions, which read as a document-only field. `verbs` exists on every descriptor in every category, and the delivered sets are the ones listed above (backlog and decision sets from REQ-02.001–004, REQ-03.001–002, and REQ-04.001). The same correction applies to decision 1's assembly sentence, which no longer refers to `cli::BUILTIN_COMMANDS` handlers because that table carries names only (ADR-0016 decision 2).*\n\n   *Revision (2026-11-15, owner decision): the milestone entry in the `verbs` row previously read `create/list/view/edit/archive/delete`. The milestone lifecycle is fixed to `open -\u003e closed` (REQ-03.001, REQ-07.001) and is delivered by `papyrus milestone close \u003cid\u003e`, which rewrites `status` and `updated_date` in place through the single write path; milestone archive and milestone restore do not exist. No other category's verb set in that row changes, and ADR-0022 decision 5 and ADR-0023 decision 2 record the same contract.*\n\n   Only tasks are `TaskConfigurable`. Milestones, releases, and decisions are `Fixed`. A document descriptor is `DocumentMain`: `active` and `archived` are always present and cannot be removed, renamed, or replaced; every other declared value is a custom status; `custom` is empty when the entry declares no `statuses`; `default` is the entry's `default_status` or `active`. The registry never stores a second copy of the status list — it reads it from the validated configuration (ADR-0019). Configuration cannot change a descriptor's category, fixed lifecycle, verbs, content model, or id shape (REQ-07.001).\n\n3. **The baseline verbs are a lower bound; `verbs` is a field of every descriptor, and document extensions are declared on a built-in descriptor.** `verbs` is **not** a document-only field: it is present on every descriptor in every category (decision 2), so a task, milestone, release, or decision descriptor states its own verb set. Within the `Document` category the baseline family `create`, `list`, `view`, `edit`, `archive`, `delete` remains a **lower bound** present on every descriptor; `status` is present only when the descriptor's status model stores a front-matter `status` (so every front-matter-backed document type, but not UI mockups). A built-in document descriptor may add a verb (`create-group`, `supersede`) and may add a required argument (`--group`), with its handler named by the descriptor. A config-defined descriptor has exactly the baseline plus `status`, and no extension point: REQ-07.004 forbids per-type schema and REQ-07.002 forbids per-type code. This is the owner's decision of 2026-11-13 (D1) on REQ-07.003's \"same command family\" wording: the shared family is the baseline, and the `req`/`nfr`/`ui-mockup` groups are unchanged.\n\n   *Revision (2026-11-15, owner decision): this decision previously presented the baseline verbs without stating that `verbs` is carried by every descriptor in every category; the field's scope and the conditional `status` rule are now explicit and the D1 rationale sentence is unchanged.*\n\n4. **One dispatch point per category, driven by the descriptor.**\n   - CLI: `cli::tree` inserts **document** verbs from the descriptor (ADR-0016), and the document handler receives the descriptor, never a slug literal. Backlog and decision commands are not tree-built: they are `clap` **derive** commands declared in their family modules (`src/task.rs`, `src/milestone.rs`, `src/release.rs`, `src/decision.rs`), and only their names come from `cli::BUILTIN_COMMANDS` — `cli::tree` grants them no descriptor-driven verb set.\n   - Record layer: `record::descriptor` keeps the static definitions and gains `Registry::descriptor(slug)`; `descriptor_for_doc_type` is replaced by a registry lookup so config-defined types are first-class readers/writers.\n   - Search and browser: both iterate `registry.enabled(category)` instead of a static list of keys.\n\n   *Revision (2026-11-15, owner decision): this decision previously said that `cli::tree` inserts \"the descriptor's verbs\", which is true only for the `Document` category. `src/cli/tree.rs` skips every non-document descriptor, so backlog and decision verbs come from their `clap` derive enums and `BUILTIN_COMMANDS` supplies only their names; the document surface is the only descriptor-driven one.*\n\n5. **The registry does not write, parse, or format records.** It supplies metadata only. Every read and write still goes through `record::document`, `record::patch`, `record::identity`, and `record::store` (ADR-0013 decisions 1–4, ADR-0012 decision 6). Archive, delete, and supersede are expressed as `PatchOp` sequences plus `record::store` moves (ADR-0022). A descriptor may not contain a `render_*`, `parse_*`, or `fs::write` path.\n\n6. **Adding a type is data.** A new `document_types` entry yields `category = Document`, `status_model = DocumentMain { main: [active, archived], custom: \u003cdeclared statuses or empty\u003e, default: \u003cdefault_status or active\u003e }`, `verbs = baseline + status`, `content_model = Generic`, `frontmatter_keys = general + status`, `id_shape = Plain`, `archive_policy = ArchivedFolder`, with `prefix` and `directory` from the entry. No match arm, no new module, and no new template is added for it.\n\n7. **Built-in types keep their typed behavior inside the registry, not beside it.** `req`/`nfr` (grouped ids, `create-group`, `--group`), `ui-spec` (`--view`), `rule` (`--rationale`, `--applicability`, requirement references), `audit` (`--type`), `tech-spec`/`use-case`/`test-case`/`test-report` (title/description/applicability), and `ui-mockup` (HTML metadata, `supersede`, no `status` verb and no custom statuses) are `Typed` descriptors. Their sections, keys, and required fields move from the per-type modules into their descriptor; the per-type modules shrink to validation and patch-building or disappear.\n\n8. **The registry is the only place that knows the category and status model of a type.** `ArtifactCategory` replaces `browser::records::Category` and its `key()/config_key()/descriptor_name()` mappings. Presentation strings for built-ins may stay in `browser::render`, but they are looked up by slug from a static table, not by a per-category match. The browser's per-type status filter and status display read `status_model` from the same place (ADR-0020).\n\n9. **Construction is fallible and total.** `ArtifactRegistry::build(\u0026Config)` returns an error if any invariant fails (missing prefix, unknown category, duplicate slug, disabled type with a command, verb/extension mismatch, a status model whose custom list is absent for a type that has one, a status verb on a type without front-matter status), and on success contains exactly the configured type set. Validation (ADR-0019) runs first; this constructor is the second gate and is also called in tests without a filesystem.\n\n10. **No new dependency, no new process model.** The registry is plain data built in-process; it introduces no cache, no index file, no background scan, and no serialization format."},{"heading":"Consequences","content":"**Positive:**\n\n- One model replaces four partial ones (`RecordDescriptor` list, per-type CLI enums, `browser::Category`, hard-coded `search::DOC_KEYS`), so a new type cannot appear in the CLI and be missing from the browser or search.\n- The status-model split of REQ-07.001 becomes testable data: one test asserts that only tasks use the top-level configurable statuses, that milestone/release/decision states are fixed, and that a document descriptor always includes `active` and `archived` while its custom statuses come from configuration.\n- Per-type behavior for built-ins stays available without weakening the generic path; a custom document status needs no code, only a validated list entry.\n- The browser and search refactors become mechanical iterations over the registry rather than hand-written per-type additions.\n\n**Negative:**\n\n- A larger upfront refactor than adding a `Generic` branch to the existing `Category` enum: fourteen modules, five browser files, and search are touched.\n- Descriptors gain fields that duplicate requirement knowledge (status models, verb sets). Drift is possible between a descriptor and its REQ; tests must assert the requirement-derived table.\n- Runtime descriptors mean fewer compile-time guarantees; a malformed descriptor is caught at startup (exit 4) instead of at build time. A document descriptor whose custom status list is taken from configuration makes the registry depend on the validated configuration, so the registry cannot be built before ADR-0019 validation.\n- Static `\u0026'static str` descriptors must become a mix of static and owned values, which changes function signatures across the record layer. Custom status lists are owned data, which is the main source of that change.\n\n**Risks and mitigations:**\n\n- *Regression while collapsing per-type modules*: migrate one type at a time behind characterization tests for output text, JSON, and files on disk; keep the typed descriptor path for built-ins.\n- *Type-specific validation lost in the generic path*: `TypedSchema` keeps required fields and field validators; a test per built-in asserts its create/edit rejections.\n- *Two registries during transition*: `record::descriptor` and `registry` must not both answer \"which types exist\"; a single accessor is the rule, and a grep check forbids `match` on slug literals outside `registry.rs`.\n- *Descriptor/requirement drift*: the status-model and verb tables are asserted against the requirement-derived expectations in one test fixture.\n- *Status list read twice*: the registry must expose the validated list by reference, not re-parse the configuration, or a `status` command could accept a value the validator rejects."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| One runtime registry composed from static built-ins plus config entries (this ADR) | Selected | Single model for CLI, record layer, search, and browser; keeps typed behavior for built-ins and zero code for config types. |\n| Extend `RecordDescriptor` with an enum of \"generic document\" and keep everything else static | Rejected | Leaves the static list authoritative, so config-defined types remain outside the record layer and every surface needs its own exception. |\n| Keep `browser::Category` and add a `Generic(String)` variant | Rejected | Pushes slug strings through render code and keeps per-type match arms; the browser and CLI would still disagree about type sets. |\n| Per-type code generation at build time from a fixed schema list | Rejected | Contradicts REQ-07.002 (\"no code change\"), needs a build step, and cannot see a project's configuration at build time. |\n| Descriptor per type with a trait object implementing create/edit/archive | Rejected | Pulls record formatting and writing back into the type layer, breaking ADR-0013 decisions 4 and 7. |\n| Model artifacts as a plugin registry loaded at runtime | Rejected | New dynamic-loading surface, packaging and security cost, no requirement. |"},{"heading":"Open Questions","content":"- Should extensions (`create-group`, `--group`, `supersede`) be expressible for a **config-defined** type later? Current decision: no.\n- Should the registry expose status states to the browser lifecycle page (REQ-06.003) directly, or through a presentation table? Current decision: status model from the registry, curated description text from a static built-in table."},{"heading":"Downstream constraints","content":"1. No module other than `src/registry.rs` may enumerate document-type keys or map a slug to behavior.\n2. `record::store` remains the only writer and `record::patch` the only mutation API; descriptors carry no I/O.\n3. Every descriptor's `archive_policy` follows REQ-05.007 and ADR-0022: tasks use `ArchivedFolder`; milestones, decisions, and releases use `ArchivePolicy::None`; document descriptors use `ArchivedFolder` (ADR-0023 decision 2).\n\n   *Revision (2026-11-15, owner decision): this constraint previously named only decisions as having no archive policy. Releases are the second family that never moves: their descriptor carries `ArchivePolicy::None` and `release close` rewrites `status` in place (ADR-0023 decision 2).*\n\n   *Revision (2026-11-15, owner decision): the milestone descriptor also carries `ArchivePolicy::None`; this constraint previously assigned `ArchivedFolder` to it. The milestone lifecycle is `open -\u003e closed` by `papyrus milestone close \u003cid\u003e`, which writes `status` and `updated_date` in place, and no milestone command archives or restores a milestone. The legacy `\u003cbacklog_directory\u003e/archive/milestones/` folder is a read/import location only, not a lifecycle archive destination (ADR-0023 decisions 2 and 4).*\n4. Descriptor fields must be derivable from REQ-07.001/002/003/004 and REQ-05.010; a field that cannot be traced to a requirement is not added.\n5. The per-type modules may keep validation and patch construction but must lose their `clap` enums, their dispatch `match`, and their directory/ID logic.\n6. A descriptor's custom status list is the validated configuration's list, read-only; no command may add, remove, or rename a status at runtime, and `archived` is never accepted as a custom value."},{"heading":"References","content":"- `docs/requirements/business/REQ-07.md`, `REQ-07.001.md`, `REQ-07.002.md`, `REQ-07.003.md`, `REQ-07.004.md`.\n- `docs/requirements/business/REQ-02.001.md`–`REQ-02.004.md`, `REQ-03.001.md`–`REQ-03.002.md`, `REQ-04.001.md` — task, milestone, release, and decision verb sets carried by `verbs`.\n- `docs/requirements/business/REQ-05.001.md`, `REQ-05.002.md`, `REQ-05.007.md`, `REQ-05.008.md`, `REQ-05.010.md`.\n- `docs/requirements/business/REQ-01.002.md`, `REQ-01.005.md`.\n- `docs/architecture/adr/ADR-0010-papyrus-native-on-disk-record-layout.md` — configured directories and identity.\n- `docs/architecture/adr/ADR-0012-papyrus-owned-front-matter-metadata.md` — front-matter key registry.\n- `docs/architecture/adr/ADR-0013-shared-record-envelope-without-a-storage-layer.md` — envelope, single writer, descriptor as extension point.\n- `docs/architecture/adr/ADR-0016-runtime-config-derived-command-dispatch.md` — how the registry becomes a command tree.\n- `docs/architecture/adr/ADR-0018-generic-document-content-model.md` — the generic content model for config-defined types.\n- Implementation: `src/registry.rs` (new), `src/record/descriptor.rs`, `src/lib.rs`, `src/search.rs`, `src/browser/records.rs`, `src/browser/render.rs`."}]},{"id":"ADR-0018","title":"Generic Document Content Model for Config-Defined Types","status":"Accepted (2026-11-13) — accepted by explicit user decision of 2026-11-13; amended 2026-11-15 by owner decision (decision 3 delivered delegation split) without status change.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"REQ-07.004 requires a document type that exists only because it was declared in `document_types` to be usable immediately: records use the same generic content model as technical specifications — required `title`, optional `description` forming the body, and the general front-matter fields `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, `status` (REQ-05.010). Labels and references are repeatable (`--label`, `--reference`). IDs come from the entry's `prefix` and `id_padding` (REQ-01.005), files live under `doc_directory` plus the entry's `directory`, archives under that folder's `archived/` (REQ-05.007). The requirement explicitly excludes a per-type field schema and a template file, and states that default document types keep their existing type-specific content (REQ-05.001–REQ-05.014).\n\nCurrent code shape: there is no generic writer. Every document type has its own module with its own sections, required fields, and create path (`src/tech_spec.rs` writes `## Description`; `src/glossary.rs` writes `## Definition`; `src/rule.rs` writes four sections; `src/requirement.rs` writes `## User Story`, `## Group`, `## Description`, and dotted IDs). `src/nfreq.rs` exists only as an alias module for the `nfreq` command name. The shared envelope (`record::document`, `record::patch`, `record::store`) already supports arbitrary bodies and is the only writer (ADR-0013), and front matter is the single metadata source with a key registry (ADR-0012), so a generic type needs no new parser.\n\nForces: a config-defined type must not require a code change (REQ-07.002/REQ-07.003); front matter and the patch contract must stay the single metadata mechanism; no new dependency and no templating (ADR-0005); the body must survive edits byte-identically outside the fields being changed (REQ-05.011); built-in types must not be re-shaped by the generic path (REQ-07.004); and the same model must serve the CLI and the browser edit view (REQ-06.014)."},{"heading":"Decision","content":"1. **The generic model is exactly seven front-matter fields plus one body section.** A config-defined document record has:\n   - front matter: `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, `status`;\n   - body: optional `## Description` (the `description` value), plus the standard `# \u003cID\u003e \u003ctitle\u003e` heading generated by the writer (ADR-0012 decision 5);\n   - no other required field, no user-defined key, no nested structure.\n\n   `title` is required and non-empty after sanitization; `description` is optional and may be empty.\n\n2. **`status` semantics: main status plus the type's declared custom statuses, and never a create or edit option.** For a config-defined type the front-matter `status` value is either\n   - `active` or `archived` — the **main status**, the only values that affect storage location: `archived` implies the file lives in the type's `archived/` subfolder, `active` implies the type's configured folder; or\n   - one of the **custom statuses** declared for that type in `document_types.\u003cslug\u003e.statuses` (REQ-07.001, REQ-07.002) — a front-matter value only, with no folder per status and no file move when it changes.\n\n   A new record starts at the type's `default_status` when one is configured, otherwise at `active`; `archived` is never a valid `default_status` (ADR-0019). `status` is therefore **not** a `create` or `edit` option (REQ-05.011 exempts it): it is lifecycle- and configuration-owned. It changes only through\n   - `papyrus \u003cslug\u003e status \u003cid\u003e \u003cvalue\u003e`, which accepts `active` or a declared custom status, changes only the front-matter value, refreshes `updated_date`, moves no file, rejects the value `archived` with a validation error naming `archive`, and rejects any record that is already archived; and\n   - `papyrus \u003cslug\u003e archive \u003cid\u003e`, which sets `archived` and moves the file (ADR-0022).\n\n   Because the status list comes from configuration, the generic handler validates `status` values against the registry's validated list (ADR-0019) and never against a hard-coded set. UI mockups have no front-matter status, no custom statuses, and no `status` verb (REQ-05.008).\n\n3. **One implementation, `src/document.rs`, parameterized by descriptor.** `document::run(ctx, registry, invocation)` is the single entry for every document type, and the `create | list | view | edit | archive | delete | status` handlers take a `TypeDescriptor` from the registry (ADR-0017). There is no `if slug == …` in this module. The delivered delegation split is:\n   - `ContentModel::Generic` — the handler performs every verb itself;\n   - `ContentModel::Typed(_)` — `create`, `create-group`, `list`, `view`, `edit`, and `supersede` are dispatched to the owning module through `TypedHandler`, while `archive`, `delete`, and `status` stay on the shared `document.rs` path;\n   - `ContentModel::HtmlMockup` — every verb, including `archive` and `delete`, is dispatched to the mockup module.\n\n   A mockup's `archive` and `delete` stay in the mockup module because the record is HTML with metadata in an embedded comment, not front matter; that module must perform the move through `record::store::archive_content` (destination written before the source is unlinked, ADR-0022 decision 2) and must not reimplement the shared front-matter patch path; the delegation is keyed on `ContentModel::HtmlMockup`, never on the `ui-mockup` slug, so `src/document.rs` introduces no slug literal; a mockup has no `status` verb.\n\n   *Revision (2026-11-15, owner decision): this decision previously stated that a typed descriptor delegates only its extension verbs and that the baseline verbs are handled here. The delivered split is broader on both sides — typed modules also own the content verbs `create`/`list`/`view`/`edit` and their extensions, and the mockup module owns `archive` and `delete` as well — so the per-verb ownership above replaces the earlier sentence.*\n\n4. **All file access goes through the shared record layer.** Reads use `record::document`; writes use `record::patch` and `record::store::write_atomic`; the path is `record::store::resolve_directory` with `Context::ensure_within` (NFR-04.002). `src/document.rs` may not format a `---` block, re-render a body, or call `fs::write`.\n\n5. **Identity is plain and allocated per type.** IDs are `\u003cPREFIX\u003e-\u003czero-padded sequence\u003e` with `id_padding` from configuration, allocated by `record::identity` over the type's active **and** archived locations (ADR-0010 decision 5). The generic model has no dotted or grouped shape; `Dotted`/`Grouped` remain properties of the `req`/`nfr` descriptors only. The prefix comes from the entry and is validated for non-emptiness by ADR-0019.\n\n6. **Labels and references are the only repeatable metadata.** `--label` and `--reference` append on create and edit; they are validated as values, stored as YAML lists, and never move into body sections (ADR-0012 decision 4). No generic `--field key=value` escape hatch is provided, because it would reintroduce an unvalidated per-type schema.\n\n7. **The body is created once and then patched.** `create` writes the front matter plus a single `## Description` section when a description is supplied. `edit` patches `title` in front matter and the heading line together, patches `description` in its section, and appends labels/references; it accepts no `status` option and never writes `status`. `--editor` edits the description section text only. A write that changes nothing performs no write (ADR-0013 decision 4).\n\n8. **Adoption is inherited, not special-cased.** Existing files in the type's directory whose stem matches `\u003cPREFIX\u003e-\u003cdigits\u003e` are claimable records and are adopted per record on first read/write exactly as any managed Markdown record (REQ-05.011, ADR-0012 decision 9). Because the claim rule is prefix-based, a directory with unrelated similarly prefixed files (a user-declared `deploy` type over a `DEP-…` folder, for example) becomes managed as soon as the entry exists; this is the intended effect of declaring the type and is documented as such.\n\n9. **No template file and no per-type schema, now or by indirection.** No file under a `templates/` directory, no front-matter key declaring a schema, no JSON/YAML schema entry, and no \"scaffold\" option. If either is wanted later it requires a new ADR and a requirement change, because both change what \"adding a type\" means.\n\n10. **Built-in types are untouched.** Each default slug that has a static typed descriptor keeps its own sections, required fields, id shape, and additional verbs (`req`, `nfr`, `glossary`, `rule`, `ui-spec`, `ui-mockup`, `audit`, `tech-spec`, `use-case`, `test-case`, `test-report`). The generic model applies only where no typed descriptor exists — any slug added by configuration, including a user-added `deploy` (REQ-07.002 no longer ships it as a default)."},{"heading":"Consequences","content":"**Positive:**\n\n- REQ-07.004 is satisfied by data and one handler: a new entry is usable for create/list/view/edit/archive/delete/status and for browser list/detail/edit with no code.\n- The model reuses the envelope and the writer that already carry the byte-identity and preservation guarantees, so there is no second writer to test.\n- The generic surface is small enough to test exhaustively (baseline verbs plus `status`, across declared and undeclared status lists).\n- Custom statuses need no code: declaring `statuses` on an entry gives the type its allowed values, and the generic handler enforces them.\n- Front matter stays the only metadata mechanism, so search, `--json`, browser views, and export keep working without special cases.\n\n**Negative:**\n\n- Config-defined documents are deliberately inexpressive: no user story, rationale, applicability, or custom sections through the CLI. Users must express such content in the description or add a built-in type later. Custom statuses add values, not structure.\n- Because the claim rule is prefix-based, a config-defined type pointed at a directory holding similarly prefixed prose files will adopt them as records on first read; the mitigation is documentation plus prefix uniqueness validation (ADR-0019), not a schema check.\n- The generic path cannot enforce a type-specific required field, so \"a test report must name a result\" is only possible for built-in typed descriptors.\n- A record's status vocabulary is configuration, so changing `statuses` later can leave existing records holding a value the type no longer declares; such records are read tolerantly (ADR-0022 decision 9) but cannot be written until the value is fixed.\n\n**Risks and mitigations:**\n\n- *Generic path drifts from `TypedSchema` paths*: both use the same patch operations and the same writer; a shared conformance test runs create/edit/view for one generic and one typed type against the same assertions.\n- *Accidental section loss on edit*: the edit path patches known sections only and preserves unknown sections; a test covers a record with a hand-added `## Notes` section.\n- *ID collision after re-enabling a type*: allocation scans active and archived locations and is independent of `enabled`, so disabling and re-enabling cannot reuse a number.\n- *Status value out of sync with configuration*: the handler validates against the registry's validated list at write time and rejects an undeclared value with a validation outcome; a test covers removing a status after records used it.\n- *Silent adoption of foreign files*: ADR-0019 validates prefix uniqueness across configured types and documents the claim rule; the reported inventory on adoption names every claimed file."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| One generic model (general keys + title + description, plus the type's configured status vocabulary) with a single handler (this ADR) | Selected | Exactly what REQ-07.004 states; no schema language, no template lifecycle, no per-type code. |\n| Reuse the technical-specification module as the generic handler | Rejected | Couples a config-defined type to one built-in type's code and makes REQ-07.004's \"no built-in schema reuse\" clause false in practice. |\n| Per-entry schema declared in `papyrus.config.yml` | Rejected by REQ-07.004 | Needs a schema language, validation, migration, and UI generation; explicitly excluded. |\n| Template file per type under the type directory | Rejected by REQ-07.004 | Adds a file lifecycle (create, edit, version) and a second source of body shape. |\n| Hard-code `active`/`archived` as the only document statuses | Rejected by REQ-07.001 | The owner added per-type custom statuses; a hard-coded set would reject a valid configuration and require code per new status. |\n| Free-form `--field key=value` metadata | Rejected | Unvalidated keys defeat the key registry (ADR-0012 decision 6) and the option rule (REQ-05.011). |\n| Store config-defined documents as HTML like UI mockups | Rejected | REQ-05.010 requires front matter for every managed Markdown record; mockups are the documented exception. |"},{"heading":"Open Questions","content":"- Should a config-defined type be allowed to declare a *display name* (separate from the slug) for the browser and help text? REQ-06.014 leaves this open; current decision: no, the slug is the name.\n- Should `description` be required instead of optional for the generic model? Current requirement: optional.\n- Should the generic list command gain a status filter to match the browser filter of REQ-06.014? Current requirement defines no document-list filters."},{"heading":"Downstream constraints","content":"1. `src/document.rs` is the only generic handler; it must not contain slug literals.\n2. The generic model writes exactly the seven front-matter keys of decision 1; adding a key is a registry change under ADR-0012 decision 6.\n3. `status` is never accepted as a `create`/`edit` option and is never written by those paths; only `status` and `archive` write it (REQ-05.011, REQ-07.001).\n4. A status value written by `status` must be `active` or a declared custom status of that type; `archived` is rejected there and produced only by `archive`.\n5. No template directory, schema key, or `--field` option may be introduced without a new ADR.\n6. Default typed types must keep their current sections, required fields, and additional verbs; REQ-07.004 forbids the generic model from changing them."},{"heading":"References","content":"- `docs/requirements/business/REQ-07.004.md` — generic content model.\n- `docs/requirements/business/REQ-07.001.md` — main status, custom statuses, `status` command.\n- `docs/requirements/business/REQ-07.002.md`, `REQ-07.003.md` — slug commands and the baseline verbs.\n- `docs/requirements/business/REQ-05.007.md` — archive state and location.\n- `docs/requirements/business/REQ-05.010.md`, `REQ-05.011.md` — front matter, `status` exemption, adoption.\n- `docs/requirements/business/REQ-01.005.md` — ID format and stability.\n- `docs/architecture/adr/ADR-0012-papyrus-owned-front-matter-metadata.md` — key registry and patch contract.\n- `docs/architecture/adr/ADR-0013-shared-record-envelope-without-a-storage-layer.md` — envelope and single writer.\n- `docs/architecture/adr/ADR-0017-artifact-category-registry-and-type-descriptors.md` — descriptor source for the handler.\n- `docs/architecture/adr/ADR-0022-document-lifecycle-state-and-archive-location.md` — `status` and `archived/`.\n- Implementation: `src/document.rs` (new), `src/record/document.rs`, `src/record/patch.rs`, `src/record/store.rs`, `src/record/identity.rs`."}]},{"id":"ADR-0019","title":"Fail-Closed Document-Type Configuration Validation","status":"Accepted (2026-11-13) — accepted by explicit user decision of 2026-11-13.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"REQ-07.002 requires every `document_types` entry to be validated at configuration load: the slug must be usable as a command name (non-empty, ASCII letters, digits, `-`, `_`, not starting with `-`, no whitespace, control characters, or path separators); the slug must not equal a built-in command name (`init`, `config`, `task`, `milestone`, `release`, `decision`, `search`, `browser`, `import`, `help`, `version`); the entry must have a non-empty `prefix` and a `directory` that is relative and inside the project directory. A violating configuration is rejected with a validation outcome naming the offending slug or key, and **Papyrus does not start with a partially valid document-type set**.\n\nCurrent code shape:\n\n- `Config::validate` (`src/config.rs`) checks `id_padding`, task/milestone/release prefixes, folder values, and each `document_types.\u003ckey\u003e.directory` through `sanitize::sanitize_path_string`. It does **not** check the slug, the entry prefix, or collisions with built-in command names, and it is not the only entry point: `load_effective_config` (`src/commands.rs`) calls it, but `config get/set/unset` each merge and validate separately.\n- `load_effective_value` deep-merges `Config::default()` with the file (`merge_yaml`). Because the default `document_types` map supplies all eleven default entries, **removing a default entry from the file is impossible**: the merge re-adds it. `enabled: false` is the only expressible form of \"not this type\", which contradicts REQ-07.002's \"removing an entry stops managing those records\". `deploy` is still seeded by `Config::default()` although REQ-07.002 removed it from the default set.\n- Status vocabulary is not validated at all: `DocTypeEntry` has no `statuses`/`default_status`, so there is no check that a document type's list is non-empty, unique, or contains the fixed `active` and `archived` values, no check that `default_status` is a declared value and is not `archived`, and no check that `ui-mockup` declares no statuses (REQ-07.001, REQ-07.002).\n- YAML duplicate keys are not detected: `document_types` with the same slug twice is currently resolved by the parser's last-wins behaviour, which REQ-07.002 forbids.\n- Validation failures surface as `AppError::Validation`, exit code 4 (REQ-01.004), with a message that names the offending key for some keys and not for others.\n- Sanitizers exist in `src/sanitize.rs` (`sanitize_path_string`, `sanitize_path_component`) and are applied in some paths, which risks silently normalizing a value instead of rejecting it.\n\nForces: NFR-02.002 requires every user-supplied value to be sanitized **and** rejected when it fails the criteria — no silent cleaning; NFR-04.002 requires every path to stay inside the canonical project directory with symlinks resolved, and rejects escapes; REQ-01.003 requires a missing or explicitly named-but-absent configuration to fail every command except `init`; REQ-01.002 requires `config set` to be the supported way to change configuration; and the command tree, the browser views, and the record layer must all consume the same validated set (ADR-0016, ADR-0017, ADR-0020).\n\nA typo in a slug therefore has two conflicting demands: the tool must refuse to run (REQ-07.002), and the user must be able to repair it with `papyrus config set` (REQ-01.002). The owner decided on 2026-11-13 (D4) that both hold through two repair surfaces, and decision 10 records the resulting constraint."},{"heading":"Decision","content":"1. **One validation function, one failure outcome.** `Config::validate` remains the single validator; it is extended with a document-type section and reused by every loader. Failure is always `AppError::Validation` (exit 4), and the message names every offending key in the form `document_types.\u003cslug\u003e.\u003cfield\u003e` (or `document_types.\u003cslug\u003e` for a slug-level violation), in `BTreeMap` order, so the outcome is deterministic and one startup attempt reports all violations rather than only the first.\n\n2. **Slug grammar is reject-only, exactly as specified.**\n   - non-empty;\n   - every character is ASCII `A-Z`, `a-z`, `0-9`, `-`, or `_`;\n   - the first character is not `-`;\n   - no whitespace, control character, path separator (including `\\`), or `..` segment.\n\n   No trimming, lowercasing, or normalization is performed: `\" Req\"`, `\"req \"`, and `\"REQ\"` are rejected or accepted on their own merits, never repaired. This is NFR-02.002's \"rejected rather than silently cleaned\" applied to configuration.\n\n3. **Reserved names come from one constant.** `cli::BUILTIN_COMMANDS` (ADR-0016) is the only list of built-in command names; validation compares each slug against it and rejects a match. The comparison is **case-insensitive** (`Req` is rejected as well as `req`), because a case-variant slug would make help text, documentation, and diagnostics ambiguous even though clap's matching is case-sensitive. REQ-07.002 requires this case-insensitive comparison, so a slug such as `Config` or `SEARCH` is rejected.\n\n4. **Duplicate keys are a parse error, not a merge.** The configuration file is read with a loader that detects a repeated mapping key, and a repeated `document_types.\u003cslug\u003e` (or any repeated key) is rejected with a validation outcome naming the key. Neither the first nor the last occurrence is silently kept, because either choice makes the effective type set depend on file order. The check happens on the raw file before defaults are merged, so a duplicate cannot be hidden by the merge.\n\n5. **Prefix constraints.** `prefix` must be non-empty after no normalization at all; it must contain no whitespace, control character, path separator, or `..`; and it must be unique among all configured document types, **including disabled ones**. Prefix uniqueness is what makes the record claim rule (`\u003cPREFIX\u003e-\u003cdigits\u003e`) and ID allocation unambiguous (ADR-0018 decision 7); uniqueness across disabled entries prevents a later re-enable from creating a duplicate. REQ-07.002 requires this uniqueness across all configured document types, including disabled entries.\n\n6. **Directory constraints.** `directory` must be non-empty, relative, free of traversal segments and backslashes, and its resolved path must pass `Context::ensure_within` against the canonical project directory (NFR-04.002) — including after symlink resolution. Duplicate directories among **enabled** entries are rejected, as required by REQ-07.002, because two enabled types sharing a folder make listing, archive location, and ID resolution ambiguous. The check is performed at load and again on every resolution through `record::store`; load-time validation is not treated as a substitute for the runtime boundary check.\n\n7. **Status lists are validated as a closed vocabulary.** For each entry:\n   - `statuses`, when present, must be a non-empty list with no duplicates and must contain `active` and `archived` exactly once. Those two values are fixed: configuration cannot remove, rename, or replace them, and a custom status may not reuse either value.\n   - Every declared status, including the two fixed ones, follows the slug character rule of decision 2 (non-empty, ASCII letters/digits/`-`/`_`, not starting with `-`, no whitespace, control character, or path separator). The same reject-only discipline applies: no trimming or case folding.\n   - `default_status`, when present, must be one of the declared statuses and must not be `archived`, so a new record never starts archived.\n   - A `statuses` declaration on `ui-mockup` is rejected, because that type keeps its state in HTML metadata and declares no custom statuses (REQ-05.008).\n   - The main statuses are not configurable: `active` and `archived` are accepted only as the fixed members of the list, and there is no key that renames or redefines them.\n\n8. **The default set is a file-level default, not a per-entry merge.** `document_types` is replaced wholesale when present in `papyrus.config.yml`:\n   - key absent → the built-in default set applies (REQ-01.003: defaults apply to a key absent from a file that was found);\n   - key present → exactly the listed entries exist, with no default entry re-added.\n\n   This is a change to `load_effective_value`'s merge behaviour for this one key. It is what makes REQ-07.002's \"removing an entry\" expressible at all, and it keeps `disabled` as the non-destructive option.\n\n9. **`config set` materializes before it edits.** Because of decision 8, a `config set document_types.\u003cslug\u003e.\u003cfield\u003e` against a file with no `document_types` key would otherwise drop the default set. The write path therefore builds the full effective `document_types` map first, applies the single change, validates the **result**, and writes the whole map. The write is refused if the result is invalid, so the configuration file never contains a state that the loader rejects.\n\n10. **Fail-closed startup, with two repair surfaces (owner decision of 2026-11-13).** Every command except `init` aborts before dispatch when validation fails (ADR-0016 phase 2). The repair surfaces are:\n    - `papyrus config get|set|unset|list`, which load the configuration **tolerantly** — `document_types` is not validated on entry, so a broken slug or status list cannot lock the user out of the command that fixes it — apply the requested change, validate the **resulting** configuration with the full validator (decisions 1–7), and only then write. An invalid result is refused (exit 4) and nothing is written.\n    - `papyrus init --force`, which replaces the file with the generated default set.\n\n    Repair mode is not a bypass: it never executes record operations, never builds a command tree or registry from an invalid set, and never relaxes NFR-02.002 or NFR-04.002 for the key it edits. The changed key goes through the same slug/prefix/directory/status sanitization and rejection rules, the resulting map still passes `Context::ensure_within`, and the tolerant load is limited to reading the pre-existing invalid entries — never to writing one. The browser configuration view is not a repair surface: it cannot start when the configuration is invalid, so repair is CLI-only.\n\n11. **Validation precedes registry construction and is repeated there.** `ArtifactRegistry::build` re-asserts the invariants it depends on (unique slug, unique prefix, non-empty resolved directory, no built-in collision, a document status list that contains `active` and `archived` and a `default` that is a declared, non-`archived` value) and returns an error rather than assuming the validator ran. This is defence in depth for tests, for the tolerant repair load, and for any future loader.\n\n12. **No partially valid set is ever observable.** There is no \"best effort\" mode, no skipping of invalid entries, no warning-then-continue, and no environment flag to bypass validation. A type either exists and is valid or the process does not start.\n\n13. **Diagnostics are actionable.** A rejected entry reports the slug, the field, the offending value, and the rule it violated (for example `document_types.req.directory: value must be relative and stay inside the project directory: ../shared`). The same message is used by the CLI and by `config list`'s validation report so a fix can be made from either surface."},{"heading":"Consequences","content":"**Positive:**\n\n- A malicious or accidental slug cannot shadow a built-in command, escape the project directory, or inject terminal control characters; the guarantee is enforced at load and independent of dispatch order.\n- Whole-map semantics make \"remove a type\" and \"disable a type\" distinct and both expressible, which is what REQ-07.002 promises.\n- One validator with one outcome and one aggregated message shortens the repair loop: one attempt reports every invalid entry.\n- Prefix and directory uniqueness eliminate two classes of ambiguous record resolution before they can occur.\n- The status vocabulary is validated once, so a `status` command can never accept a value the type does not declare and `archived` can never be smuggled in as a custom status.\n- Duplicate-slug rejection removes an order-dependent configuration defect that no user could see in the file.\n\n**Negative:**\n\n- The whole-map semantics is a behaviour change for existing projects: a file that lists three document types now really has three, not eleven. Projects that relied on the merge gain types back only by re-adding entries or running `init --force`, and a project that relied on the seeded `deploy` entry must now declare it.\n- Case-insensitive reserved-name matching, prefix uniqueness across all entries including disabled ones, and duplicate-directory rejection among enabled entries are required by REQ-07.002; a configuration violating any of them is rejected at load.\n- `config set` now rewrites the whole `document_types` map, producing a larger diff than a single-key edit and discarding comments in that section (the current writer already re-serializes YAML).\n- The repair mode of decision 10 is a deliberate, narrowly scoped hole in \"fail closed\": the tolerant load and the validated write are two different code paths and must stay visibly distinct.\n\n**Risks and mitigations:**\n\n- *Upgrade breakage*: a project whose configuration was only valid because defaults were merged now fails at load, and a project that used the seeded `deploy` entry loses that command. Mitigation: the release note documents both, the error names each missing entry, and `init --force` regenerates the default set.\n- *Validator/loader divergence*: `config get/set/unset` currently validate independently; they must call the same function, and a test asserts the same message from both surfaces. A second test asserts that repair mode rejects an invalid resulting configuration and writes nothing.\n- *Stricter rules reject valid projects*: no longer an open question; REQ-07.002 now requires case-insensitive reserved-name matching, prefix uniqueness across all entries, and duplicate-directory rejection among enabled entries.\n- *Status list read from the wrong source*: repair mode must validate the resulting list, not the file's existing list, or a `status` command could later accept a stale value; the test matrix covers add, remove, and redefine attempts.\n- *Path check bypass via a symlinked subdirectory*: `ensure_within` is applied at load and at every resolution, and a test covers a symlink inside `doc_directory` pointing outside the project."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| One aggregated, reject-only validator; whole-map `document_types`; repair mode limited to `config` (this ADR) | Selected | Satisfies REQ-07.002 and NFR-02.002/04.002 together, keeps removal expressible, and leaves a recovery path. |\n| Warn on invalid entries and skip them | Rejected | Violates \"no partially valid document-type set\" and hides a configuration defect behind a runtime surprise. |\n| Sanitize slugs (trim, lowercase, replace separators) | Rejected | NFR-02.002 requires rejection, not silent cleaning; normalization would also change command names behind the user's back. |\n| Keep per-entry merge and express removal as `enabled: false` only | Rejected | Contradicts REQ-07.002's \"removing an entry stops managing those records\"; a disabled entry still reserves its prefix and still appears in lifecycle views as unmanaged. |\n| Fail closed everywhere including `config` | Rejected by the owner decision of 2026-11-13 (D4) | Simplest rule, but makes an invalid configuration unrecoverable through Papyrus itself; the owner chose the two repair surfaces. |\n| Validate lazily in each command | Rejected | Guarantees divergence between CLI, browser, and record layer, and allows a command to start on an invalid set. |"},{"heading":"Open Questions","content":"None. The questions raised by decisions 3, 5, and 6 are settled by REQ-07.002, which requires case-insensitive reserved-name matching, prefix uniqueness across all configured document types including disabled entries, and rejection of duplicate directories among enabled entries."},{"heading":"Downstream constraints","content":"1. `Config::validate` is the only validator; `config get/set/unset/list` must not carry a private copy.\n2. `cli::BUILTIN_COMMANDS` is the only reserved-name list.\n3. `load_effective_value` must not merge `document_types` per entry; the key is wholesale.\n4. No command may start on an unvalidated `document_types` set; the registry constructor re-asserts the invariants.\n5. Every message must name `document_types.\u003cslug\u003e` and the offending field.\n6. Repair mode may not write an entry that fails decisions 2–7 and may not relax NFR-02.002/NFR-04.002; the tolerant load reads, it never permits.\n7. A status list is validated only here; the registry and the `status` command consume the validated list and never re-parse the file."},{"heading":"References","content":"- `docs/requirements/business/REQ-07.002.md` — slug, prefix, directory, status lists, duplicate keys, reserved names, fail-closed and repair surfaces.\n- `docs/requirements/business/REQ-07.001.md` — main status, custom statuses, `status` command.\n- `docs/requirements/business/REQ-05.011.md` — `status` exemption from the option rule.\n- `docs/requirements/business/REQ-01.002.md` — `config set` as the configuration edit surface.\n- `docs/requirements/business/REQ-01.003.md`, `REQ-01.004.md` — configuration selection and exit codes.\n- `docs/requirements/non-functional/NFR-02.002.md` — sanitize and reject input.\n- `docs/requirements/non-functional/NFR-04.002.md` — project-directory boundary.\n- `docs/architecture/adr/ADR-0010-papyrus-native-on-disk-record-layout.md` — configuration-driven paths and containment.\n- `docs/architecture/adr/ADR-0016-runtime-config-derived-command-dispatch.md` — built-in name table and startup order.\n- `docs/architecture/adr/ADR-0017-artifact-category-registry-and-type-descriptors.md` — registry construction invariants.\n- `docs/architecture/adr/ADR-0018-generic-document-content-model.md` — prefix-based claim rule.\n- Implementation: `src/config.rs`, `src/commands.rs`, `src/sanitize.rs`, `src/context.rs`, `src/cli/` (new)."}]},{"id":"ADR-0020","title":"Registry-Derived Browser Views for Config-Defined Document Types","status":"Accepted (2026-11-13) — accepted by explicit user decision of 2026-11-13.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"REQ-06.014 requires the local web interface to serve list, detail, and edit views for **every enabled document type declared in `document_types`**, not only the types shipped with Papyrus. A type added by configuration must become available with no code change, using the same navigation, list, detail, and edit behavior as the default types; views use the type's configured folder and prefix, the metadata projection of REQ-06.004, and the layout of REQ-06.012. Archived records are hidden and unreachable and return the same page as an unknown address (REQ-05.007); a disabled type has no views and its records are neither listed nor reachable. Every listed record shows its `status` as stored — including a custom status declared for the type — and the list view offers a status filter whose options are exactly `active` plus the type's declared custom statuses in configured order, with `archived` never offered because archived records are not listed (REQ-06.014). `status` is not editable in the browser (REQ-05.011). REQ-06.003 additionally requires the lifecycle page to describe every document type declared in configuration, enabled or not, grouped by the three artifact categories.\n\nCurrent code shape, which is entirely closed against new types:\n\n- `src/browser/records.rs` defines `enum Category` with fifteen variants, each with `key()`, `config_key()`, and `descriptor_name()`, plus `parse_*`/`form_for_stem` branches. `record_directory` resolves a type's folder from `descriptor_for(name)`, which returns `None` for any slug that is not one of the eleven compiled document descriptors, and does not consult `enabled` for non-mockup types, so a disabled type is still browsable today.\n- `src/browser/mod.rs` routes with a hand-written chain: one `if path == \"/api/\u003cplural\u003e\"` block per built-in type, `/?type=\u003ckey\u003e` for list pages through `category_from_query` (unknown value → `400`), and one universal detail route `/doc/{id}` plus `/doc/{id}/edit`. Per-type \"not found\" pages are selected by `matches_doc_type_id` for four tech-spec/use-case/test-case/test-report keys.\n- `src/browser/render.rs` is 4.4k lines with per-category page titles, sidebar sections, list pages, detail pages, and ten `apply_*_edit`-style form handlers in `records.rs`; `build_sidebar` hard-codes the three requirement entries, the backlog group, and a fixed tuple list of document types.\n- `src/browser/templates/` holds the shared page fragments; there is no generic document template.\n- ADR-0005 fixes the transport, the \"route against a fixed route table after single-pass percent-decoding\", the rule that request paths are never joined to filesystem paths, exact-match ID resolution, the security headers, and the embedded-template renderer. ADR-0006 fixes optimistic concurrency and atomic writes for browser saves. ADR-0013 decision 3 requires the browser to use `record::document` + `record::patch` + `record::identity`.\n\nForces: no new dependency, template engine, or asset (ADR-0005); no per-type code for config-defined types (REQ-06.014); identical 404 for archived and unknown (REQ-05.007); the existing CLI metadata projection must be the same one the browser renders (REQ-06.004); existing built-in pages must not regress; and the route table must stay auditable and traversal-safe."},{"heading":"Decision","content":"1. **The registry (ADR-0017) is the only source of the browser's type set.** Navigation, list pages, detail routing, edit forms, the lifecycle page, and the JSON API iterate `ArtifactRegistry`: `enabled(Document)` for navigable views, `all(Document)` for the lifecycle and configuration pages. No module may hold a second list of document-type keys.\n\n2. **The route table is assembled once at startup from the registry; its semantics are unchanged from ADR-0005.** The table is still fixed for the process lifetime, matched by exact string comparison after single-pass percent-decoding, never joined to a filesystem path, and served through the same handler/security/chrome pipeline. What changes is only that the table's document entries are produced by iterating the registry instead of being written by hand. The universal `/doc/{id}` and `/doc/{id}/edit` routes are kept: detail addressing stays ID-based, and the ID's owner is resolved by prefix through `registry::resolve_id`.\n\n3. **One canonical list route and one canonical API route per type, plus the existing built-in aliases.** `/?type=\u003cslug\u003e` remains the list route for every type. The JSON API gains one canonical endpoint `/api/docs/\u003cslug\u003e` for every type. The existing `/api/requirements`, `/api/glossary`, `/api/tech-specs`, and the other built-in endpoint names remain as aliases so no existing consumer breaks; new code must use the canonical form. An unknown or disabled `type`/`\u003cslug\u003e` is `404`, not `400`: a type that has no views is indistinguishable from an address that does not exist, which is the same rule REQ-05.007 applies to archived records. Changing the current `400` is a deliberate, documented status-code change.\n\n4. **`Category` is deleted; `Form` becomes a descriptor property.** `ArtifactCategory` (`Backlog | Decision | Document`) comes from the registry. The requirement/group distinction that `Category::Req`/`Category::Nfr` and `Form` encode today moves into the `req`/`nfr` descriptors as `form: Requirement | Group` and `id_shape: Grouped` (group records plus dotted member records); `Dotted` remains the member-only shape. This agrees with ADR-0018 decision 5 and TASK-105 encoding decision D1, so the list page still renders groups and requirements separately without branching on a slug.\n\n5. **Two generic view families cover every document type; typed types keep field-specific forms.**\n   - Generic (`content_model = Generic`, ADR-0018): one `document_list.html`, one `document_detail.html`, one `document_edit.html` rendering title, description, labels, and references from the shared `RecordView`. The list and detail views render `status` read-only for every document type; the edit form never offers a status field. The list view's status filter is built from the descriptor's status model (ADR-0017): `active` plus the declared custom statuses in configured order, with no `archived` option.\n   - Typed built-ins: keep their existing field sets and forms, but their handlers are selected by descriptor, not by a `match` on the id's prefix or on a category enum.\n   - Presentation strings (page titles, curated descriptions, field labels) are looked up by slug from a static built-in table; a config-defined slug gets a title-cased label from its slug and the shared document description required by REQ-06.003.\n\n6. **Status filtering is a validated projection, never a free-form query.** A list request's `status` filter accepts only `active` or a custom status declared for that type; any other value (including `archived` and an undeclared value) is rejected rather than applied as an unfiltered or guessed match, and a type with no custom statuses offers only `active`. Filtering compares the stored front-matter value exactly, so a record whose value is no longer declared remains visible under `active`-only listing rules but is never silently rewritten.\n\n7. **Indexing is enabled-only and active-only.** `build_index` receives a descriptor and returns an empty index when the descriptor is disabled; it reads only the descriptor's active directory, never `archived/`, and claims files by the descriptor's prefix and id shape. A disabled type therefore has no views and its files are neither listed nor reachable, satisfying REQ-06.014 without a separate check in every handler.\n\n8. **Archived and unknown share one 404.** Because `archived/` is never indexed and is never a resolvable directory, `view`/`edit` of an archived ID and of an unknown ID render the same response for their type. The per-type not-found pages are reduced to one generic document not-found page plus the existing built-in pages that a requirement names.\n\n9. **The lifecycle page is generated, not enumerated.** REQ-06.003's page renders three category groups; backlog and decision sections are built from their descriptors; one section per `document_types` entry (enabled and disabled) shows the main statuses `active -\u003e archived`, any custom statuses the entry declares as front-matter values that do not change location (UI mockups `pending -\u003e approved -\u003e archived`), the entry's effective `enabled`, prefix, and folder, and curated text for built-ins or the shared generic text otherwise. Configuration values remain read-only there.\n\n10. **Writes keep the ADR-0006 and ADR-0013 contracts unchanged.** A browser save for a config-defined type parses and patches through `record::document`/`record::patch`, writes through `record::store::write_atomic`, carries the version token, returns `409` on a stale token, and refreshes `updated_date` once per write.\n\n11. **No new dependency, asset, or template engine.** The generic templates use the existing `{{name}}` single-pass renderer and escaping, are embedded with `include_str!`, and are served from the same binary (ADR-0005)."},{"heading":"Consequences","content":"**Positive:**\n\n- REQ-06.014 becomes structural: an enabled `document_types` entry gains list, detail, edit, navigation, and API access with no code change.\n- Deleting `Category` and the per-type not-found chains removes a large class of \"forgot to add the new type here\" defects.\n- The browser and CLI consume the same registry and the same `RecordView`, so REQ-06.004's \"same metadata values\" stays structural.\n- Disabled and archived visibility rules are enforced in one place (index construction) rather than in each handler.\n\n**Negative:**\n\n- The route table is no longer readable as a literal list in `mod.rs`; auditing it requires reading the registry builder.\n- The `400 → 404` change for unknown `?type=` values is a small behaviour change for any external consumer that relied on the status code.\n- Generic document pages are plainer than built-in ones (no type-specific sections); this is the intended consequence of REQ-07.004's generic model.\n- The status filter is a second per-type surface: it must be built from the descriptor rather than a template literal, or a type could offer a filter value it does not declare.\n- `status` being read-only in the browser while a CLI `status` verb exists is intentional but asymmetric; the browser stays a metadata viewer for lifecycle fields.\n- Refactoring 4.4k lines of `render.rs` carries regression risk for pages that have nothing to do with config-defined types.\n\n**Risks and mitigations:**\n\n- *Regression in existing pages*: characterize each built-in page (status, headings, form fields) before refactoring, then produce the same output through the descriptor path; keep the per-type output tests.\n- *Path safety regression*: routing still never joins a path; the descriptor's folder comes from configuration and is re-checked with `Context::ensure_within`; a test asserts a `directory` that escapes the project cannot render a page.\n- *Duplicate/ambiguous slugs*: impossible after ADR-0019 validation; the registry builder asserts it.\n- *Edit-form drift*: one conformance test runs create → list → detail → edit → archive for a generic type and asserts the record file, the metadata projection, and the archived visibility.\n- *Status filter drift*: a test per document type asserts that the offered filter values equal `active` plus the declared custom statuses, that `archived` is absent, and that an out-of-set value is rejected.\n- *Status value edited in the browser by mistake*: the edit form has no status control, and a save that carried one would be rejected as an unknown field rather than written."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Registry-derived route table and two generic view families (this ADR) | Selected | The only way to satisfy REQ-06.014 with no per-type code while keeping ADR-0005's transport and security decisions. |\n| Keep the static route table and add a `Generic(String)` category | Rejected | Still one navigation entry, one list path, and one form per type; the browser set would drift from the CLI set. |\n| Serve config-defined types only through the JSON API, not HTML | Rejected | REQ-06.014 requires list, detail, and edit views. |\n| Server-side rendering from a data-driven generic page for **all** types, dropping typed forms | Rejected | Would regress the built-in field sets that REQ-05.x and REQ-06.004 require. |\n| Client-side routing/JS for dynamic types | Rejected | Violates the no-JS-required posture of ADR-0005 and adds an asset. |\n| Generate one template per type at startup | Rejected | Runtime template synthesis outside the fixed renderer, with no benefit over one generic template. |"},{"heading":"Open Questions","content":"- Is the browser navigation grouped by the three categories, with document types flat inside the document group (current decision), or fully flat? REQ-06.014 leaves this open.\n- Should an unknown `?type=` be `404` (current decision) or keep the current `400`?\n- Should a config-defined type be able to declare a display name or icon for navigation? Current requi
