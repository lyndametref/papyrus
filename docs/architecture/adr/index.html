rement defines none.\n- Should the canonical API form be `/api/docs/\u003cslug\u003e` (current decision) or `/api/\u003cslug\u003e`? The former avoids colliding with built-in endpoint names."},{"heading":"Downstream constraints","content":"1. `browser::records::Category` must not survive this ADR; no handler may branch on a document slug.\n2. List and detail views must render from `RecordView`; a browser-only metadata projection is prohibited (REQ-06.004, ADR-0013 decision 5).\n3. `archived/` must never be indexed or resolvable; disabled types must produce no navigation entry, no list, no detail, no edit, and no API response.\n4. `status` is displayed but never edited in the browser; no form field and no save path may write it.\n5. Routing keeps ADR-0005's exact-match, no-path-join, single-request-per-connection model; no new asset or dependency is introduced.\n6. Built-in page output must be preserved; the refactor is judged by characterization tests, not by visual similarity."},{"heading":"References","content":"- `docs/requirements/business/REQ-06.014.md` — browser views for config-defined types.\n- `docs/requirements/business/REQ-06.003.md` — lifecycle/artifact description page.\n- `docs/requirements/business/REQ-06.004.md`, `REQ-06.012.md` — metadata projection and record layout.\n- `docs/requirements/business/REQ-05.007.md` — archived visibility and 404 equivalence.\n- `docs/requirements/business/REQ-07.001.md`, `REQ-07.002.md` — main status, custom statuses, status-list configuration.\n- `docs/requirements/business/REQ-05.011.md` — `status` exemption from the option rule.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — server, routes, templates, security posture.\n- `docs/architecture/adr/ADR-0006-optimistic-concurrency-and-atomic-record-writes.md` — version tokens and atomic writes.\n- `docs/architecture/adr/ADR-0013-shared-record-envelope-without-a-storage-layer.md` — shared reader/patcher.\n- `docs/architecture/adr/ADR-0017-artifact-category-registry-and-type-descriptors.md` — the registry consumed here.\n- `docs/architecture/adr/ADR-0018-generic-document-content-model.md` — generic field set.\n- Implementation: `src/browser/mod.rs`, `src/browser/records.rs`, `src/browser/render.rs`, `src/browser/templates/`, `src/registry.rs` (new)."}]},{"id":"ADR-0021","title":"Man Page Strategy for a Dynamic Command Surface","status":"Proposed — **deferred by the project owner on 2026-11-13; remains an open release risk for NFR-03.003.** No option is selected. NFR-03.003 as written cannot be satisfied by a command surface whose command names are project configuration, and the requirement owners have recorded that gap in REQ-07.003 rather than amending the NFR.","sections":[{"heading":"Date","content":"2026-11-13"},{"heading":"Context","content":"NFR-03.003 requires Papyrus to \"provide a man page for every command\", to include those man pages in the Debian package, to keep **Markdown sources under `docs/man/`**, to generate roff at build time, and to install the result to the standard man paths in the `.deb`.\n\nREQ-07.002/REQ-07.003 change what \"every command\" means. The command set is now `built-ins + one command per enabled `document_types` entry`, and the entry set is per project and editable at runtime: a project may rename `req`, disable `glossary`, or add a command that exists in no other project.\n\nObserved state:\n\n- `docs/man/` does not exist. The only man-page-shaped content is rendered inside `README.md` as `\u003cpre\u003e` blocks: a `papyrus(1)` section (line 19) and a `papyrus-config(5)` section (line 1327). There is no roff source and no generator.\n- `scripts/build-deb.sh` stages only `/usr/bin/papyrus` and `/usr/share/doc/papyrus/copyright`; nothing is installed under `/usr/share/man`. `packaging/deb/` mirrors that layout.\n- ADR-0002/ADR-0003 restrict the package to Debian Forky amd64 and ADR-0005 keeps the binary dependency-free; ADR-0001 allows Node.js/Python 3 as **build-time** tooling only.\n- ADR-0016 replaces the static clap enum with a tree built from the artifact registry, so built-in help text is generated at runtime from `cli::BUILTIN_COMMANDS`; document-type help is generated per project.\n- The packages are installed machine-wide (`/usr/share/man`), while the command set is project-local. A man page for a command that does not exist in the reader's project is wrong; a man page missing for a command that does exist is also wrong.\n\nThe impossibility is precise: **a packaged static man page cannot describe a runtime, project-specific command name.** Something in NFR-03.003's scope has to be defined: either \"every command\" means every built-in command plus the document command family (with per-slug documentation produced per project), or the package must ship a page per default slug and accept that pages for renamed/disabled slugs exist and that user-added slugs have none.\n\nREQ-07.003 now records the consequence explicitly: NFR-03.003 covers built-in commands, config-defined slugs have no man page in this release, and that gap is carried as a release risk without amending the NFR. NFR-03.003 itself is unchanged and still asks for \"a man page for every command\".\n\nForces: NFR-03.003 is a validated requirement and may only be amended by `requirements-engineer`; packaging must stay reproducible and offline; no new runtime dependency; man pages are also development input and must not silently drift from the CLI; the release cannot claim NFR-03.003 compliance as written while document slugs have no page; and the owner has deferred the choice, so no implementation may assume one."},{"heading":"Decision","content":"1. **No option is selected.** The project owner deferred this decision on 2026-11-13. Nothing in this ADR authorises a man-page implementation, a new command, or a packaging change, and no agent may treat any candidate below as chosen. The ADR records the constraints, the candidate options, and their consequences so the decision can be taken later without re-analysis.\n\n2. **What is decided regardless of the option.**\n   - The gap is real and must be carried as a release risk: a machine-wide package cannot contain a page for a project-defined command name, so NFR-03.003's literal reading and REQ-07.002/REQ-07.003 cannot both hold for user-added slugs.\n   - Any chosen option must keep man-page sources as Markdown under `docs/man/` and generate roff at build time, because that construction is what NFR-03.003 mandates independently of scope.\n   - No option may add a runtime dependency, a runtime asset directory, or a network fetch (ADR-0005). Build-time tooling remains limited to what ADR-0001/ADR-0002 permit.\n   - Man pages must not be generated by re-rendering clap help: clap's about lines carry no semantics, exit codes, or examples, so a generated page would be a stub and would still need hand maintenance.\n   - `README.md` cannot remain a second maintained copy of `papyrus(1)`/`papyrus-config(5)`; whichever option is chosen, the packaged pages are the reference and the README points to them.\n\n3. **Mechanics required by any option that ships Markdown sources** (common groundwork, not a selection):\n   - sources `docs/man/papyrus.1.md`, `docs/man/papyrus-config.5.md`, and — if a family page is chosen — `docs/man/papyrus-document.1.md`;\n   - an in-repo, stdlib-only `scripts/md2man.py` (Python 3, build-time only) supporting `NAME`, `SYNOPSIS`, `DESCRIPTION`, `COMMANDS`, `OPTIONS`, `EXIT STATUS`, `FILES`, `ENVIRONMENT`, `EXAMPLES`, `SEE ALSO` and emitting `TH`/`SH`/`SS`/`TP`/`PP`/`IP`/`.B`/`.I`;\n   - output under `target/man/man1` and `target/man/man5`, gzipped with `gzip -9n`;\n   - `scripts/build-deb.sh` staging `usr/share/man/man1/*.1.gz` and `usr/share/man/man5/*.5.gz`, with `packaging/deb/` mirroring the tree;\n   - a build-time `groff -man -Tutf8` (or `man --warnings`) pass that fails on warnings, and a packaging test that unpacks the `.deb` and asserts each committed page is installed.\n\n4. **Candidate options (none selected).**\n\n   | # | Option | What ships | Consequence |\n   |---|---|---|---|\n   | A | Three pages: `papyrus(1)`, `papyrus-config(5)`, `papyrus-document(1)` describing the baseline verbs, `status`, archive/delete, the generic content model, and the eleven default slugs | Full coverage of every command that exists in every project; no page for a user-added slug | Smallest maintenance surface; `man papyrus-\u003ccustom\u003e` does not exist; NFR-03.003's literal reading is not met for configured slugs |\n   | B | A + one stub page per default slug (`papyrus-req(1)` … `papyrus-test-report(1)`) generated at build time from the static default table | Literal coverage of the default set | Pages for renamed or disabled slugs describe commands absent from that project; user-added slugs still uncovered; more pages to keep in sync |\n   | C | A + `papyrus help --man`, which renders a roff page for the **effective** project command set (built-ins plus enabled slugs) to stdout, with optional `--output` inside the project only | Every command a given project actually has is documentable on demand, generated from the registry so it cannot drift | A second, runtime rendering path; the generated page is not in the package and must be produced per project; adds a `help --man` surface (no new top-level command) |\n   | D | Built-ins only; no document-family page and no per-slug mechanism | Minimal | Leaves the document command family undocumented in the package and does not address NFR-03.003 for those commands at all |\n\n   Options A and C can be combined; B and C can be combined; D is the fallback that concedes the gap for the whole family. The earlier draft's recommendation (A + C) is retained only as a recorded recommendation for the future decision, not as a decision.\n\n5. **What the future acceptance must state.** The accepting ADR or amendment must say (a) whether NFR-03.003 is narrowed to built-ins plus the document family, or left literal with per-slug pages, (b) whether per-project generation is provided, and (c) which `text/roff` verification gates the release. Until then, no man-page work may start, and the release notes must not claim NFR-03.003 compliance for configured slugs."},{"heading":"Consequences","content":"**Positive (of any option that follows decision 3's groundwork):**\n\n- Man pages stop being a copy of the README and become maintainable Markdown with a build step, an install path, and a build-time verification — which is what NFR-03.003 asks for independently of the scope question.\n- A packaged page cannot describe a command the binary lacks, because the page describes built-ins (static) and the document *family* (not individual slugs).\n- No new runtime dependency, and the build keeps working offline on Forky.\n\n**Negative (of deferring):**\n\n- NFR-03.003 remains unsatisfied as written for configured document slugs, and the release must carry that as a known risk rather than a completed requirement.\n- `docs/man/` stays empty and `scripts/build-deb.sh` keeps shipping no man pages, so the packaging gap grows the longer the decision is deferred.\n- Every further change to the command surface (a new baseline verb, a new extension verb) leaves the future man pages further behind; the inventory test of decision 3 cannot run until the sources exist.\n\n**Negative (specific to the candidate options):**\n\n- Option A: `man papyrus-\u003ccustom\u003e` does not exist, so a user-added slug is documented only in `papyrus-document(1)`.\n- Option B: pages exist for slugs a project may have renamed or disabled, and user-added slugs remain uncovered.\n- Option C: a second, runtime rendering path to maintain, and the generated page is not in the package.\n- Option D: the whole document family is undocumented in the package.\n- All options: build complexity grows by one script, one directory, and one verification step, and `groff` becomes a required build-time tool.\n\n**Risks and mitigations (pending the decision):**\n\n- *Scope decided implicitly by implementation*: no man-page work may start before the option is accepted; this ADR is the record that the choice is open.\n- *Drift between `BUILTIN_COMMANDS` and the man page*: the inventory test fails the build once the sources exist; until then the risk is that the first implementation hard-codes a stale command list.\n- *Generated page unreadable*: the converter must handle a fixed subset, and every page is rendered during packaging with `groff` warnings failing the build.\n- *README removal loses content*: the Markdown sources must be derived from the README sections before removal, and the README keeps a pointer.\n- *Release compliance claimed too early*: the release notes must state that NFR-03.003 is not met for configured slugs, matching REQ-07.003's recorded risk."},{"heading":"Alternatives Considered","content":"The candidates are listed in decision 4 and none is selected. The options rejected on their merits, independently of the deferred scope question, are:\n\n| Option | Outcome | Reason |\n|---|---|---|\n| Generate man pages at runtime into `docs/man/` automatically on first use | Rejected | Writes on read paths, mutates the project without a command, and duplicates content that belongs to the package. |\n| Generate `papyrus(1)` from clap's help at build time | Rejected | Clap help has no prose for semantics, exit codes, or examples; the page would be a stub and still need hand maintenance. |\n| Document document commands only in `--help`, with no man pages | Rejected by NFR-03.003 | The requirement explicitly forbids deferring the man page. |\n| `pandoc` or `go-md2man` as the converter | Rejected | Adds an unverified build dependency on Forky; a standard-library converter is smaller and auditable. |\n| Leave the decision to the implementation task | Rejected | The scope question changes what NFR-03.003 means, so it is an owner decision, not an implementation detail. |"},{"heading":"Open Questions","content":"- **Owner decision required (deferred 2026-11-13)**: option A, B, C, D, or a combination — and, with it, whether NFR-03.003 is narrowed or kept literal.\n- Should `papyrus help --man`, if chosen, be named `papyrus man`? An unselected option; `help --man` would avoid adding a reserved name.\n- Should the README keep a rendered copy of `papyrus(1)` for browsing on the web? Current lean: no, pointer only.\n- Should the inventory test compare against `cli::BUILTIN_COMMANDS` at build time (a generator) or at test time (a check)? Deferred with the option."},{"heading":"Downstream constraints","content":"1. No man-page implementation may start until the owner accepts an option; this ADR does not authorise one.\n2. If an option shipping Markdown sources is accepted, `docs/man/` becomes the only man-page source and no other file may be converted into a packaged page.\n3. If accepted, `scripts/build-deb.sh` must install the pages and a packaging test must assert them; a package without them fails NFR-03.003 verification.\n4. Any chosen option must keep the build offline and dependency-free at runtime.\n5. Until the decision is recorded, releases must not claim NFR-03.003 compliance for config-defined document slugs, and the release notes must say so."},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-03.003.md` — man page requirement (unchanged; the scope gap is recorded in REQ-07.003 as a release risk).\n- `docs/requirements/business/REQ-07.002.md`, `REQ-07.003.md` — dynamic command names.\n- `docs/architecture/adr/ADR-0001-implementation-language-rust.md` — build-time tooling boundary.\n- `docs/architecture/adr/ADR-0002-distribution-format-amd64-deb-packages.md`, `ADR-0003-supported-debian-release-target-forky-only.md` — packaging target.\n- `docs/architecture/adr/ADR-0016-runtime-config-derived-command-dispatch.md` — command inventory and generated help.\n- `docs/architecture/adr/ADR-0017-artifact-category-registry-and-type-descriptors.md` — registry used by `help --man`.\n- Implementation: `docs/man/` (new), `scripts/md2man.py` (new), `scripts/build-deb.sh`, `packaging/deb/`, `README.md`, `tests/` (packaging and inventory checks)."}]},{"id":"ADR-0022","title":"Document Lifecycle State and Archive Location","status":"Accepted (2026-11-13) — accepted by explicit user decision of 2026-11-13; amended 2026-11-14 by owner decision (decision 3 revision note and decision 12) without status change; amended 2026-11-15 by owner decision (milestone lifecycle) without status change.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"REQ-05.007 (rewritten in this change set) replaces the document lifecycle `active -\u003e deprecated` with a **main status** `active` or `archived`, stores the state in the front-matter `status` field, moves an archived file into an `archived/` subfolder of the type's configured directory, removes every restore command for documents, and states that a `deprecated/` folder left by an earlier version is not read as archived and is not migrated. REQ-07.001 adds **custom statuses**: each document type may declare additional statuses in `document_types.\u003cslug\u003e.statuses`, optionally with a `default_status`; a custom status is a front-matter value only — no folder per status, no file move, no effect on listing, archiving, or deletion — and `papyrus \u003cslug\u003e status \u003cid\u003e \u003cvalue\u003e` sets `active` or a declared custom status but never archives. REQ-07.001 also fixes the milestone (`open -\u003e closed`) and release (`planned -\u003e released`) lifecycles, and REQ-05.010 now requires `status` in milestone, release, and front-matter document records. REQ-04.002 keeps decisions out of it: decisions have no archive command or archive state and use the five Nygard statuses.\n\nCurrent code and ADRs contradict the new state:\n\n- `src/record/descriptor.rs` resolves a `deprecated` directory (`resolve_deprecated_directory`) for document types, and the browser and record layer read it.\n- `src/record/store.rs` exposes deprecate/restore moves; every document module has `Deprecate`/`Restore` verbs; `src/browser` has deprecate/restore handlers.\n- ADR-0010 decision 2 lists `\u003cdoc_directory\u003e/\u003ctype directory\u003e/deprecated/` as the idle location, and decision 7 states \"archive, restore, deprecate, restore are moves, not rewrites\" with restore as a first-class operation. Decision 5's allocation rule already scans the deprecated location.\n- ADR-0012's field map gives milestones only `release`, releases no additional keys, and document types no keys; `status` is absent for all three.\n- ADR-0012 decision 6 declares the front-matter key registry the only metadata extension point (a registry entry plus a section-retirement rule), which is the mechanism available for adding `status`.\n- `nfr`/task/milestone records keep their own `status` semantics: tasks configurable (REQ-01.002), milestones `open|closed`, releases `planned|released`; only documents lose restore.\n\nForces: one identity and one file name across state changes (REQ-01.005); no data loss on failure; the on-disk location must remain derivable from configuration (ADR-0010 decision 2); writes must stay on the single path (`record::store`, ADR-0013 decision 4); archive must not delete; legacy `deprecated/` content must not be silently presented as archived; and the state value must be visible in the same `RecordView` projection used by CLI, JSON, and browser (ADR-0013 decision 5)."},{"heading":"Decision","content":"1. **`status` is a registry key for three record families, with two different state models.** ADR-0012 decision 6 is used: the key registry gains `status` for\n   - milestone: fixed states `open | closed`;\n   - release: fixed states `planned | released`;\n   - every front-matter-backed document type (built-in or config-defined): **main status** `active | archived`, plus the type's **custom statuses** declared in configuration.\n\n   For a document type the registry entry is `main = [active, archived]`, `custom = \u003cdeclared statuses other than the two main ones, in configured order\u003e`, `default = \u003cdefault_status or active\u003e`. `active` and `archived` are always present and cannot be removed, renamed, or replaced; a custom value may not reuse either. A built-in document type with no configured `statuses` therefore has exactly the two main states, and a config-defined type without `statuses` behaves the same way.\n\n   Key order is unchanged: general keys first, then `status`, then the type's other keys. UI mockups keep their status in HTML metadata, gain no front-matter key, and declare no custom statuses (REQ-05.008). Decisions keep `status` in the document core (ADR-0012 decision 12).\n\n2. **Archive is one operation on one record: patch `status`, then relocate.** `record::store::archive(id, descriptor)`:\n   1. builds the patched text with `record::patch` (`SetFrontMatter(\"status\", \"archived\")`, plus the UI-mockup HTML metadata write and `superseded_by` back-reference where the descriptor requires it);\n   2. writes that text to the destination path `\u003cactive dir\u003e/archived/\u003cfile name\u003e` using the ADR-0006 atomic write sequence (temporary file, `sync_all`, rename);\n   3. removes the source file only after the destination write succeeded.\n\n   If step 2 fails the source is untouched and the command fails. If step 3 fails, both copies exist; the command reports a runtime error naming both paths, and the existing duplicate detection makes the record unreadable-for-write until a human removes one. No path in this sequence truncates or rewrites the source in place, so an interruption never loses content.\n\n3. **`archive` is idempotent in effect, accepts an active record whatever its status value, and discards the custom value.** Archiving an already-archived record is a no-op success (no write, no `updated_date` change). Archiving a record that carries a custom status is the ordinary case: the patch sets `status` to `archived`, the custom value is not copied anywhere, and no separate field records it (REQ-05.007, REQ-07.001). A record stored in the active folder while its `status` reads `archived` is not an archive-time error: it is auto-relocated to `archived/` on read per decision 12; `archive` on such a record is a no-op success once relocation has occurred.\n\n   *Revision (2026-11-14, owner decision): the archived-in-active-folder case was previously a validation error refusing writes and reporting; it is now auto-relocated on read (decision 12). The original wording is superseded by this revision; the ADR remains Accepted.*\n\n4. **`status \u003cid\u003e \u003cvalue\u003e` changes the front-matter value only, and never archives.** `document::status`:\n   - accepts `active` or a custom status declared for that type, and rejects any other value, including `archived`, with a validation error (exit 4) that names `archive` as the only way to archive;\n   - rejects an archived record with a validation error (exit 4) naming the record as archived, changing nothing and moving nothing;\n   - patches `status` and refreshes `updated_date` in one write through `record::store::write_atomic`; it performs no move, creates no folder, and leaves the file in the active directory;\n   - is not offered on a type without a front-matter status (UI mockups), which keep their lifecycle in HTML metadata (REQ-05.008).\n\n   Custom statuses therefore never enter the archive logic: an active record with a custom status is indistinguishable from an `active` record for storage, listing, archiving, and deletion.\n\n5. **There is no restore for documents.** `record::store` loses its document restore operation, every document descriptor loses the `restore` verb, and no CLI, browser, or API path can move an archived document back. Only tasks keep archive/restore, because REQ-01.005 requires task IDs to survive that cycle.\n\n   *Revision (2026-11-15, owner decision): milestones no longer keep archive/restore. The milestone lifecycle is fixed to `open -\u003e closed` by `papyrus milestone close \u003cid\u003e`; the archive and restore verbs and the milestone archive location are removed. Only tasks keep archive/restore, because REQ-01.005 requires task IDs to survive that cycle. `close` writes `status` and `updated_date` in place and does not move the record.*\n\n6. **`archived/` is the only recognized inactive location.** Directory resolution gains `resolve_archived_directory`; `resolve_deprecated_directory` and every read alias for `deprecated/` are deleted. A `deprecated/` folder is therefore invisible to listing, view, search, and the browser, exactly as REQ-05.007 states, and is never migrated, moved, or rewritten. Its files remain on disk until a human moves them. Orphaned `deprecated/` folders stay inert: no inventory, listing, or migration command is provided (decision 12).\n\n7. **Delete is archive-then-unlink.** `delete` on an active document performs decision 2's archive, then removes the archived file; on an already-archived document it removes the file directly. Confirmation and `--force` are CLI concerns (REQ-05.007), not store concerns. Allocation stays `max(number present) + 1` over active and archived locations and never recomputes, so a gap is left where a file was removed. Reuse of the highest deleted number when the highest-numbered record is deleted is accepted behavior and is documented; no persisted high-water mark is introduced (decision 12; ADR-0010 decision 5 unchanged).\n\n8. **Supersession is a lifecycle transition expressed the same way.** `ui-mockup supersede \u003cold\u003e \u003cnew\u003e` sets the old mockup's HTML status to `archived`, records the back-reference, and moves it to `archived/`, using decision 2's sequence. It does not introduce a second archive mechanism.\n\n9. **Reading a non-conforming `status` is tolerant and non-destructive.** A front-matter `status` outside the descriptor's declared vocabulary — a value removed from `statuses` after records used it, or a hand-edited string — is preserved verbatim, the record is flagged in list/view diagnostics, and a write that would normalize it is refused until the value or the configuration is fixed. A record in that state is still an ordinary active record for storage and for `archive`; only `status` writes are refused. Papyrus never silently rewrites a state value on read and never adds an undeclared value to the vocabulary.\n\n10. **Visibility follows location, and the status value is a filter, not a visibility switch.** List, search, and browser index only the active directory; the `archived/` directory is never indexed and is not resolvable by ID for viewing (REQ-05.007, REQ-06.014). A custom status does not hide a record: it remains listed and is selectable through the browser's status filter, whose options are `active` plus the declared custom statuses. `--json` reports `status` for every reachable record, so an API consumer sees the value it is reading.\n\n11. **Clause-level supersession, explicitly scoped.** On acceptance this ADR supersedes:\n    - ADR-0010 decision 2's `\u003ctype directory\u003e/deprecated/` idle location and decision 7's deprecate/restore move rule, for document types only;\n    - ADR-0012's field-map rows for milestone, release, and front-matter document types, which gain `status`.\n\n    ADR-0010's layout, identity, allocation and configuration-driven path decisions, and ADR-0012's metadata, patch, adoption and serialization decisions, remain in force. Because both ADRs are `Accepted` and their bodies are frozen, a consolidation ADR that restates the layout and field-map contract without the deprecated clauses is **outstanding** and is flagged in the ADR corpus audit; until it exists, this ADR is the authoritative delta and the old clauses must not be implemented.\n\n12. **Read-path auto-relocate and settled defaults.** Owner decisions of 2026-11-14, recorded here so the ADR stays Accepted:\n    - **Auto-relocate on read.** When a read path (list, view, search, browser resolution, or any ID lookup) encounters a file in the active directory whose `status` reads `archived`, Papyrus auto-relocates that file to `archived/` using decision 2's sequence: write the destination via the ADR-0006 atomic write, then unlink the source. On success the read returns the archived record. On failure (destination write or source unlink fails) the source remains intact and the read returns a read-only record together with a validation outcome describing the failure; no source write occurs and no partial state is left. This is the only permitted write during a read path. It replaces the prior \"refuse writes and report\" behavior for the archived-in-active-folder case.\n    - **Deleted IDs.** Allocation stays `max(number present) + 1` over active and archived locations with no recomputation; reuse of the highest deleted number when the highest-numbered record is deleted is accepted behavior and is documented. No persisted high-water mark is introduced (ADR-0010 decision 5 unchanged).\n    - **Orphaned `deprecated/` folders.** They stay inert: not read, migrated, inventoried, or reported. No inventory command is provided; a human moves the files. Consistent with decision 6."},{"heading":"Consequences","content":"**Positive:**\n\n- One lifecycle operation (`archive`) replaces deprecate and restore for ten document types, removing an entire class of state-transition bugs and roughly half of each document module's command surface.\n- The state is in front matter and the location follows only from the main status, so a record's lifecycle is visible in the same projection used everywhere (REQ-06.004).\n- Custom statuses are configuration data with no storage consequence, so a type can gain a vocabulary without a folder, a migration, or a new lifecycle.\n- The archive sequence never destroys content: the destination is written before the source is removed.\n- The `deprecated/` decision is explicit and testable: the directory is not read, so an upgrade cannot half-migrate a corpus.\n\n**Negative:**\n\n- Existing projects with documents in `deprecated/` lose access to them through Papyrus until a human moves the files and edits their metadata; the release notes must say so (REQ-05.007 already accepts this).\n- Removing restore is a user-visible capability loss; it is a deliberate product decision, not an implementation gap.\n- Archive now performs a content change, so a record's bytes and `updated_date` change on archive; any test or user expectation of \"move only\" must change.\n- Two operations (write + unlink) are not atomic together; the residual duplicate state is handled by reporting, not by a transaction.\n- Reading a record whose `status` is `archived` but whose file is still in the active folder now writes during the read (auto-relocate); callers must tolerate a validation outcome instead of a hard error on failure.\n- A custom status is lost on archive and cannot be restored; a record that was `in-review` before archiving reads `archived` afterwards with no history. This is the owner's decision (no retained field), not an omission.\n- `status` writes are refused on a record whose stored value is no longer declared, so a configuration change can leave records needing a manual fix.\n\n**Risks and mitigations:**\n\n- *Data loss between write and unlink*: impossible by ordering; a test kills the process between steps and asserts the source still exists.\n- *Residual duplicates*: detected by the existing duplicate rule, reported with both paths, writes refused; documented in the upgrade notes.\n- *Legacy `deprecated/` visibility regression*: the requirement accepts it; the upgrade note names the folder and the manual recovery steps.\n- *Status/key drift*: the key registry is the only place `status` is declared; one test asserts the three state models and that decisions and mockups are excluded.\n- *`archive` mistaken for a custom-status transition*: `status` rejects `archived` and names `archive`, `archive` discards the custom value; two tests cover both directions.\n- *Location/status disagreement*: a file whose `status` is `archived` but which sits in the active folder is auto-relocated on read (decision 12); a read-path write occurs and must be tested for failure handling (source intact, read-only record plus validation outcome on failure).\n- *Read-path write*: auto-relocate performs a write during a read; tests kill the process between destination write and source unlink and assert the source survives and the read returns the validation outcome.\n- *Status vocabulary shrink*: removing a value from `statuses` leaves records that read but cannot be written; the validator cannot detect it (it only sees configuration), so the diagnostics and the release note carry it."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| `status` in front matter (main + custom) plus `archived/`, archive = write-destination-then-unlink, no restore (this ADR) | Selected | Matches REQ-05.007/REQ-05.010/REQ-07.001, keeps one file and one ID, and never loses content on failure. |\n| Keep `deprecated/` as the folder name and change only the command verbs | Rejected | Contradicts REQ-05.007's `archived/` location and its explicit \"deprecated/ is not read as archived\". |\n| Rename the file into `archived/` first and patch `status` afterwards | Rejected | A failure between the two leaves an `status: active` record in the archive folder, which decision 3 would then have to special-case. |\n| Store the state only in front matter and leave files in place | Rejected | REQ-05.007 requires the move; listing would need a per-file state filter and archive would become O(scan). |\n| Give every custom status its own folder | Rejected | REQ-07.001 states custom statuses are front-matter values only, with no folder per status and no move. |\n| Keep the pre-archive custom value in a second field | Rejected by REQ-07.001 | The requirement states the previous value is not retained anywhere, and a second field would need its own lifecycle. |\n| Model custom statuses as a second configurable lifecycle for documents | Rejected | REQ-07.001 keeps the main statuses fixed and makes only the custom vocabulary configurable; a configurable lifecycle would make archive/delete behavior depend on configuration. |\n| Keep restore for documents as a hidden command | Rejected | REQ-05.007 states no Papyrus command returns an archived document to `active`. |\n| Migrate `deprecated/` automatically on first read | Rejected | REQ-05.007 explicitly forbids migration; a bulk move would also rewrite a corpus without review. |"},{"heading":"Open Questions","content":"- Should a configuration change that removes a declared custom status be detected and reported as an inventory of affected records (read-only check), or left to the first failed write?\n- Should `archived/` be excluded from `git` via `.gitignore` or kept under version control? Current behaviour: kept, like every other record."},{"heading":"Downstream constraints","content":"1. `deprecated/` must not appear in any descriptor, resolver, browser route, search path, or documentation after this ADR.\n2. Document descriptors have no `restore` verb; `record::store` exposes `archive` and `delete` only for documents.\n3. Milestone and release descriptors declare `status` with their fixed state lists; document descriptors declare the main statuses plus the validated custom list and default; decisions and UI mockups must not.\n4. `archive` must use `record::patch` and the ADR-0006 atomic write; no module may move a record file with `fs::rename` alone.\n5. ADR-0010 and ADR-0012 must not be implemented where they contradict decisions 1, 2, 6, and 8 until the consolidation ADR lands.\n6. Only `archive` writes `archived`, only `supersede` writes it for mockups, and `status` rejects it; no other command may produce the value.\n7. `status` performs no move, creates no folder, and is refused on an archived record.\n8. Auto-relocate on read uses decision 2's sequence and is the only permitted write during a read path; on failure the source stays intact and the read returns a read-only record with a validation outcome.\n9. No command inventories or migrates orphaned `deprecated/` folders."},{"heading":"References","content":"- `docs/requirements/business/REQ-05.007.md` — archive state, location, delete, no restore, `deprecated/` not read.\n- `docs/requirements/business/REQ-05.010.md`, `REQ-05.011.md` — `status` in front matter and metadata maintenance.\n- `docs/requirements/business/REQ-05.008.md` — UI mockup HTML metadata and supersession.\n- `docs/requirements/business/REQ-04.002.md` — decisions have no archive state.\n- `docs/requirements/business/REQ-07.001.md` — main status, custom statuses, `status` command, fixed lifecycles per category.\n- `docs/requirements/business/REQ-07.002.md` — `statuses`/`default_status` configuration and validation.\n- `docs/requirements/business/REQ-01.005.md` — ID stability across archive.\n- `docs/architecture/adr/ADR-0006-optimistic-concurrency-and-atomic-record-writes.md` — atomic write sequence.\n- `docs/architecture/adr/ADR-0010-papyrus-native-on-disk-record-layout.md` — layout, allocation, identity; deprecated clauses superseded here.\n- `docs/architecture/adr/ADR-0012-papyrus-owned-front-matter-metadata.md` — key registry and field map; `status` rows superseded here.\n- `docs/architecture/adr/ADR-0013-shared-record-envelope-without-a-storage-layer.md` — patch API and single writer.\n- `docs/architecture/adr/ADR-0017-artifact-category-registry-and-type-descriptors.md` — `archive_policy` and `status_model` fields.\n- `docs/architecture/adr/ADR-0019-fail-closed-document-type-configuration-validation.md` — status-list validation.\n- Implementation: `src/record/store.rs`, `src/record/descriptor.rs`, `src/record/patch.rs`, `src/record/migrate.rs`, `src/*.rs` (deprecate/restore removal), `src/browser/records.rs`."}]},{"id":"ADR-0023","title":"Consolidated Record Layout and Front-Matter Field Map","status":"Accepted (2026-11-13) — accepted by explicit user decision of 2026-11-13; amended 2026-11-15 by owner decision (decision 2 release archive location) without status change; amended again 2026-11-15 by owner decision (decision 2 milestone archive location, decision 3, decision 4 legacy alias qualification, downstream constraint 2, and the decision 9 supersession bullet) without status change.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"Two accepted ADRs still state the on-disk layout and the front-matter field map with clauses the product has since removed:\n\n- **ADR-0010** (native record layout) lists `\u003cdoc_directory\u003e/\u003ctype directory\u003e/deprecated/` as the idle location for document records (decision 2) and defines \"archive, restore, deprecate, restore are moves\" (decision 7), with allocation scanning deprecated locations (decision 5).\n- **ADR-0012** (front-matter metadata) maps milestones to `release` only, releases to no additional key, and document types to no additional key (decision 2), so it cannot express the `status` field that REQ-05.010 now requires for milestones, releases, and front-matter documents (decision 10's option rule is likewise silent on the document `status` exemption).\n\nREQ-05.007 replaced the document lifecycle `active -\u003e deprecated` with `active -\u003e archived`, moved the inactive location to `archived/`, removed every document restore command, and made `deprecated/` unread and unmigrated. REQ-05.010/REQ-05.011 added `status` to milestone, release, and front-matter document records and exempted the document `status` from the create/update-option rule. REQ-07.001 added per-type custom statuses that are front-matter values only. REQ-07.002/REQ-07.003 made document types configuration-defined. ADR-0022 recorded the lifecycle delta (status model, archive operation, no restore) but explicitly left a consolidation ADR outstanding: two accepted ADRs cannot keep contradicting the requirements, and an implementer reading ADR-0010 or ADR-0012 alone would build a `deprecated/` folder and restore commands.\n\nThe owner decided on 2026-11-13 to consolidate rather than patch further: one ADR restates the layout and the field map as they are now in force, and the two obsolete records become Superseded. Their still-valid decisions are restated here and remain authoritative through this ADR; their bodies stay frozen and are not edited.\n\nForces: one identity, one file, one name (ADR-0010 decision 1); configuration-driven paths with project-directory containment (NFR-04.002); atomic, non-destructive moves (ADR-0006); a single writer and patch API (ADR-0013); one metadata source per field (ADR-0012); adoption without a bulk migration (REQ-05.011); fixed milestone/release/decision lifecycles and configurable task/document status vocabularies (REQ-07.001); and no clause left in the corpus that an implementer could follow into a defect."},{"heading":"Decision","content":"1. **This ADR is the single authoritative statement of the on-disk layout and the front-matter field map.** It supersedes ADR-0010 and ADR-0012. ADR-0022 remains Accepted and in force for the lifecycle *operations* (status semantics, archive sequence, `status` command, delete, no restore); this ADR consolidates the layout and metadata contract that ADR-0022 amended. Nothing here overrides ADR-0011 (import), ADR-0006 (atomic write and version token), or ADR-0013 (envelope, patch, single writer).\n\n2. **Layout: configuration-driven active and archive locations.**\n\n   | Record family | Active location | Archive location |\n   |---|---|---|\n   | Task | `\u003cbacklog_directory\u003e/tasks/` | `\u003cbacklog_directory\u003e/archive/tasks/` |\n   | Milestone | `\u003cbacklog_directory\u003e/milestones/` | none — never moved by a milestone command; its state is the front-matter status (`open` or `closed`) |\n   | Release | `\u003cbacklog_directory\u003e/releases/` | none — the record is never moved; its state is the front-matter status |\n   | Decision (ADR, BDR) | `\u003cdecision_directory\u003e/` | none — the record is never moved; its state is the `## Status` line, which keeps it in the ADR index |\n   | Document, any configured type (`req`, `nfr`, `glossary`, `rule`, `ui-spec`, `ui-mockup`, `audit`, `tech-spec`, `use-case`, `test-case`, `test-report`, and every user-added slug) | `\u003cdoc_directory\u003e/\u003ctype directory\u003e/` | `\u003cdoc_directory\u003e/\u003ctype directory\u003e/archived/` |\n\n   `backlog_directory`, `decision_directory`, and `doc_directory` are relative to the project directory; a document type's `directory` is relative to `doc_directory`. Descriptors name configuration keys, never literal paths. Every resolved path passes `Context::ensure_within` before any read or write (NFR-04.002), including after symlink resolution. UI mockups are HTML records under their configured `ui-mockup` directory; they use the same active/`archived/` layout and keep their state in HTML metadata (decision 5).\n\n   A release has `ArchivePolicy::None`: `release close` rewrites `status` from `planned` to `released` in place through the single write path, and no `archive/releases/` path is resolved by any code path or descriptor.\n\n   *Revision (2026-11-15, owner decision): the Release row previously listed `\u003cbacklog_directory\u003e/archive/releases/` as its archive location. Releases never move — the descriptor carries `ArchivePolicy::None` and the record's state is its front-matter `status`, so the row and the sentence above now record the delivered contract.*\n\n   A milestone likewise has no archive location and no milestone command moves the record: `papyrus milestone close \u003cid\u003e` rewrites `status` from `open` to `closed` and refreshes `updated_date` in place through the single write path (REQ-03.001, ADR-0022 decision 5), and the milestone descriptor carries `ArchivePolicy::None`. The legacy `\u003cbacklog_directory\u003e/archive/milestones/` folder is a **read/import location only**: the milestone resolver still reads it, and the one-way Backlog.md import writes archived source milestones there (ADR-0011). No milestone command archives, restores, migrates, or relocates a record into or out of that folder, and no milestone command creates it; the import is the only writer that creates archived milestone records there. A milestone file under that folder remains readable legacy data: this ADR introduces no migration, relocation, or deletion of it, and no command archives or restores a milestone.\n\n   *Revision (2026-11-15, owner decision): the Milestone row previously listed `\u003cbacklog_directory\u003e/archive/milestones/` as its archive location. Milestones never move — `papyrus milestone close \u003cid\u003e` writes `status` and `updated_date` in place, and the milestone archive and restore verbs were removed (ADR-0022 decision 5). The row and the paragraph above now record the delivered contract, including the legacy read/import exception for `\u003cbacklog_directory\u003e/archive/milestones/`.*\n\n3. **`archived/` is the only inactive location for document records.**\n   - A `deprecated/` folder is **not** read, listed, searched, indexed by the browser, migrated, moved, or renamed. Its files stay exactly where they are until a human acts outside Papyrus. No code path may resolve it, and no descriptor may name it.\n   - No Papyrus command returns an archived document to `active`; there is no document restore. Only tasks keep archive/restore, because REQ-01.005 requires task IDs to survive that cycle. Milestones have no archive or restore: their lifecycle is fixed `open -\u003e closed` and `papyrus milestone close \u003cid\u003e` closes them in place (REQ-03.001, ADR-0022 decision 5).\n   - Archive and delete follow ADR-0022: archive patches `status` to `archived` and writes the destination before removing the source; delete archives an active record first and then removes the file; decisions have no archive or restore operation (REQ-04.002).\n\n   *Revision (2026-11-15, owner decision): this decision previously said that tasks and milestones keep archive/restore. Only tasks do, because REQ-01.005 requires task IDs to survive that cycle; milestones are closed in place and have no archive or restore verb (ADR-0022 decision 5). ADR-0017 decision 2 records the milestone verb set.*\n\n4. **ID allocation, file names, resolution, relocation, and import are unchanged from ADR-0010 except for the allocation scope.**\n   - One number space per family (tasks, milestones, releases, each decision prefix, each document prefix). Allocation is `max(number present in the **active and archived** locations of that family) + 1`, minimum 1. **`deprecated/` locations are excluded** because they are unmanaged and unread; a number already used by a file that a human left in `deprecated/` can therefore be allocated again, which is accepted as the consequence of not reading that folder.\n   - File names: `\u003cID\u003e.md`, with `\u003cID\u003e` carrying the configured prefix and padding as a minimum; decisions keep `\u003cID\u003e-\u003ckebab-case-slug\u003e.md` and the slug is cosmetic and never regenerated; title edits never rename a file. Slug-named document records keep their names (for example `BR-016-\u003cslug\u003e.md`).\n   - Resolution is read-tolerant and never used to write: a stem `\u003cPREFIX\u003e-\u003cdigits\u003e` with optional `-\u003cslug\u003e`/` - \u003cslug\u003e`, prefix compared case-insensitively, leading zeros optional; front-matter `id` is authoritative and a disagreement with the stem marks the record invalid and refuses writes. Backlog.md storage stems are not recognized (ADR-0011 is the only bridge). Legacy archive aliases `\u003cbacklog_directory\u003e/tasks/archived/` and `\u003cbacklog_directory\u003e/milestones/archived/` remain readable as archived tasks and milestones and are never written by a command. For milestones, `\u003cbacklog_directory\u003e/archive/milestones/` is additionally a read/import location: the resolver reads it and the one-way import writes archived source milestones there, but no milestone command archives, restores, migrates, or relocates a record into or out of it and no milestone command creates it (decision 2).\n   - A configured folder change during `config set` moves every file and subfolder through the single relocation routine with pre-check, rollback, and containment (REQ-01.002, ADR-0013); it is never lazy.\n   - `papyrus.config.yml` is the only source of prefixes, padding, roots, directories, and status vocabularies; `backlog/config.yml` is not read. A status value outside the configured vocabulary is preserved verbatim and reported, never normalized.\n   - Import writes native records only; a project still in the Backlog.md layout must import before the layout switchover, and the release that ships the layout ships the import and its upgrade note.\n\n   *Revision (2026-11-15, owner decision): the legacy-alias sentence previously said that the milestone legacy alias and the milestone archive folder are never written. The alias is read-only, but `\u003cbacklog_directory\u003e/archive/milestones/` is also a read/import location that the one-way import writes to; the sentence now states that exception and repeats that no milestone command archives, restores, migrates, or relocates a record into or out of it (decision 2).*\n\n5. **Field map.** Every managed Markdown record carries the general keys in canonical order `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, followed by its type-specific keys.\n\n   | Record type | Additional front-matter keys |\n   |---|---|\n   | Task | `status`, `assignee` (YAML list), `milestone`, `dependencies`, `ordinal`, `documentation`, `type` — unchanged |\n   | Milestone | `release`, `status` (`open` or `closed`) |\n   | Release | `status` (`planned` or `released`) |\n   | Decision | `superseded_by` (optional); `status` and `type` stay in the document core, not front matter |\n   | Audit record | `type`, `status` (`active`, `archived`, or a custom status declared for the audit type) |\n   | Business requirement, non-functional requirement, glossary term, UI specification, technical specification, business rule, use case, test case, test report | `status` (`active`, `archived`, or a custom status declared for that document type) |\n   | Document type added by configuration | `status` only |\n   | UI mockup | none — HTML record, no front-matter block; state in HTML metadata |\n\n   Document `status` has two layers: the **main status** `active` or `archived`, which alone determines storage location, and the **custom statuses** declared in `document_types.\u003cslug\u003e.statuses`, which are front-matter values only and never move a file. `active` and `archived` are always declared and cannot be removed, renamed, or replaced; a new record starts at the type's `default_status` or at `active`. UI mockup state is `pending -\u003e approved -\u003e archived` in HTML metadata and declares no custom statuses.\n\n   Additional project keys are tolerated and preserved (for example `priority` on tasks). There is no Backlog.md key-set contract.\n\n6. **`status` is exempt from the create/update-option rule.** ADR-0012 decision 10's rule stands: `id`, `created_date`, and `updated_date` are exempt. For front-matter documents, `status` is additionally exempt because it is lifecycle- and configuration-owned: no create or edit option sets it, and it changes only through `papyrus \u003cslug\u003e status` and `archive` (ADR-0022). Task `status` keeps its documented option and configured vocabulary; milestone, release, and decision `status` keep the behaviour of their own requirements and commands (close operations, decision edit), and none of them is affected by the document exemption. A key a command never changes is still preserved by the patch contract.\n\n7. **Timestamps and adoption are restated with the current write-path list.** `created_date` is written once at creation and never changed; `updated_date` is refreshed by every write path — create, edit, `status`, archive, delete, supersede, milestone close, release close, and browser save — and not refreshed by a no-op write. Timestamps are quoted ISO-8601 UTC at second precision (`'YYYY-MM-DDTHH:MM:SSZ'`), one clock value per write, in-project formatter, no new dependency. Adoption of a record without a front-matter block remains lazy and per record on first read and first write, adds the block only, may retire legacy metadata sections on a write, is idempotent, is scoped to descriptor-claimed files, is metadata-only for frozen records, derives missing dates best-effort, must not partially write, and offers a dry run and a per-file inventory. No path converts a record to a Backlog.md shape.\n\n8. **Unchanged metadata rules carried forward from ADR-0012.** `id` and every reference value are Papyrus IDs (no storage ID, no translation); front matter is the only metadata store and is never mirrored into a `## ` section; `record::frontmatter` owns parsing, patching, and serialization with unknown keys and order preserved; serialization is Papyrus-documented and Backlog-independent using `yaml_serde`; the heading policy is unchanged (tasks and milestones have no `#` heading, every other Markdown record type has a generated `# \u003cID\u003e \u003ctitle\u003e`, frozen ADR bodies gain only the front-matter block); decisions keep `## Date` and `## References` additively and never move `status`/`type` into front matter; UI mockups are excluded from front matter; backfilling front matter on frozen records is permitted as a metadata-only change; Markdown that no descriptor claims is out of scope.\n\n9. **What this ADR replaces, relative to ADR-0010 and ADR-0012.**\n   - Replaced from ADR-0010: decision 2's table (the `deprecated/` idle column, the \"Inactive location\" for decisions, and the `deploy`-as-default example are replaced by decision 2 above), decision 5's allocation scope (deprecated locations excluded), and decision 7 (deprecate/restore for documents replaced by archive-only; archive/restore restated unchanged for tasks, and milestones restated as close-only with no archive or restore).\n   - Replaced from ADR-0012: decision 2's field map (superseded by decision 5 above, which adds `status` and the document rows) and decision 8's write-path list and decision 10's exemption list (both restated in decisions 7 and 6).\n   - Remaining in force from ADR-0010 through this restatement: one identity per record and file (decision 1); configuration-driven paths and containment (decision 2's principle); file naming and non-renaming (decision 3); read-tolerant resolution and authoritative front-matter `id` (decision 4); numbering immutability apart from the allocation scope (decision 5); no shape conversion (decision 6); atomic, non-destructive moves (decision 7's mechanism); whole-folder relocation during `config set` (decision 8); configuration as the only source of paths and statuses (decision 9); import writes native records only (decision 10); the switchover rule requiring import in the same release and an upgrade note (decision 11).\n   - Remaining in force from ADR-0012 through this restatement: decisions 1, 3, 4, 5, 6, 7, 9, 11, 12, 13, 14, 15 and the corrected decisions 8 and 10 above.\n   - ADR-0022's lifecycle-operation decisions are unaffected and remain the reference for archive, `status`, delete, and the no-restore rule."},{"heading":"Consequences","content":"**Positive:**\n\n- One document states the layout and the field map, so an implementer cannot follow a frozen ADR into building `deprecated/`, a document restore, or a status-less field map.\n- The corpus no longer contains two Accepted ADRs that contradict REQ-05.007, REQ-05.010, and REQ-07.001.\n- Allocation's exclusion of `deprecated/` is explicit, which makes the upgrade behaviour (a legacy folder is inert) predictable rather than accidental.\n- The in-force/replaced split is recorded, so no valid decision is lost by superseding the two ADRs.\n\n**Negative:**\n\n- A historical reader must follow two links (ADR-0010/0012 → this ADR) to see the current rule; the superseded records keep their original text by design.\n- Restating layout and metadata in a third document adds a maintenance point: a future layout change must amend this ADR, not the two superseded ones.\n- Excluding `deprecated/` from allocation means a number held by an orphan file can be reused; a record moved back by hand could then collide, which is detected at read time but not prevented.\n- The consolidated field map duplicates requirement-derived knowledge (keys and status vocabularies); a requirement change must be reflected here.\n\n**Risks and mitigations:**\n\n- *Divergence between this ADR and ADR-0022*: this ADR states layout and metadata only; every lifecycle operation is delegated to ADR-0022, and a test/assertion of the field map derives from the registry (ADR-0017), not from prose.\n- *A reader treating ADR-0010/0012 as current*: both status lines now point to this ADR, and the index shows them as Superseded.\n- *`deprecated/` reappearing in code*: the no-drift check in ADR-0013 is extended to fail on any descriptor, resolver, route, or documentation reference to `deprecated/`.\n- *Field map drift*: the registry's key table is asserted in one test against this ADR's table; adding a key requires updating both."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Consolidate into a new ADR that supersedes ADR-0010 and ADR-0012 (this ADR) | Selected | One authoritative statement, no clause-level ambiguity, and the frozen bodies stay as history. |\n| Amend ADR-0010 and ADR-0012 in place | Rejected | Their bodies are frozen once Accepted; editing them would break the ADR lifecycle rule. |\n| Leave ADR-0010/0012 Accepted and rely on ADR-0022 as the delta | Rejected | Two accepted ADRs would keep mandating `deprecated/`, restore, and a status-less field map; an implementer could follow either. |\n| Write two separate consolidation ADRs (layout, metadata) | Rejected | The two contracts are read together and share the same requirement changes; splitting them doubles the cross-reference surface. |\n| Delete ADR-0010/0012 | Rejected | The corpus keeps superseded decisions as history; deleting loses the rationale for path/identity and patch/adoption choices. |"},{"heading":"Open Questions","content":"- Should a `deprecated/` folder be reported by a read-only inventory command so a user can find orphaned files after the upgrade? Current requirement: no; the folder is inert.\n- Should ADR-0022's \"consolidation ADR outstanding\" sentence be annotated now that this ADR exists? Its body is frozen; the index shows the resolution and no edit is made."},{"heading":"Downstream constraints","content":"1. `deprecated/` must not appear in any descriptor, resolver, browser route, search path, documentation, or test fixture after this ADR, except in the historical ADR bodies and in the upgrade note that tells users the folder is inert.\n2. Document restore must not exist in any surface; only tasks keep their archive/restore pair, and milestones are closed in place with no archive or restore.\n3. Allocation scans active and archived locations only, and excludes `deprecated/`.\n4. The field map in decision 5 is authoritative; adding or removing a key requires a registry change (ADR-0012 decision 6 as carried forward) and an update to this ADR.\n5. `status` is never a create or edit option for a front-matter document; only `status` and `archive` write it.\n6. ADR-0022 remains the reference for lifecycle operations and must not be contradicted by an implementation of this ADR."},{"heading":"References","content":"- `docs/requirements/business/REQ-05.007.md` — archive state, `archived/`, delete, no restore, `deprecated/` inert.\n- `docs/requirements/business/REQ-05.010.md`, `REQ-05.011.md` — field map, `status`, option exemption, adoption.\n- `docs/requirements/business/REQ-05.008.md` — UI mockup HTML metadata.\n- `docs/requirements/business/REQ-07.001.md`, `REQ-07.002.md` — main/custom document statuses and their configuration.\n- `docs/requirements/business/REQ-01.002.md`, `REQ-01.005.md` — folder relocation, IDs.\n- `docs/requirements/business/REQ-04.002.md` — decisions have no archive state.\n- `docs/architecture/adr/ADR-0006-optimistic-concurrency-and-atomic-record-writes.md` — atomic write.\n- `docs/architecture/adr/ADR-0010-papyrus-native-on-disk-record-layout.md` — superseded by this ADR; layout, identity, formatting rationale retained as history.\n- `docs/architecture/adr/ADR-0011-one-way-backlog-md-import.md` — the only bridge from Backlog.md.\n- `docs/architecture/adr/ADR-0012-papyrus-owned-front-matter-metadata.md` — superseded by this ADR; metadata rationale retained as history.\n- `docs/architecture/adr/ADR-0013-shared-record-envelope-without-a-storage-layer.md` — envelope, patch, single writer.\n- `docs/architecture/adr/ADR-0017-artifact-category-registry-and-type-descriptors.md` — status models and descriptors.\n- `docs/architecture/adr/ADR-0022-document-lifecycle-state-and-archive-location.md` — lifecycle operations, in force.\n- Implementation: `src/record/descriptor.rs`, `src/record/store.rs`, `src/record/frontmatter.rs`, `src/record/identity.rs`, `src/record/migrate.rs`, `src/registry.rs`."}]},{"id":"ADR-0024","title":"List-Valued Configuration Keys in `papyrus config set`","status":"Accepted (2026-11-13) — accepted by explicit user decision of 2026-11-13.","sections":[{"heading":"Date","content":"2026-11-13 (status: Proposed, 2026-11-13; status: Accepted, 2026-11-13)"},{"heading":"Context","content":"REQ-01.002 defines `papyrus config set \u003ckey\u003e \u003cvalue\u003e` as persisting \"the value as a YAML scalar\". REQ-07.001/REQ-07.002 add list-valued keys — `document_types.\u003cslug\u003e.statuses` and the top-level `statuses` for tasks (REQ-01.002) — and REQ-01.002 states that `document_types.\u003cslug\u003e.statuses` and `document_types.\u003cslug\u003e.default_status` are ordinary configuration keys that `config get` reads and `config set` writes. Today the two statements cannot both hold: the current `config set` rejects a `yaml_serde::Value::Sequence` outright (`src/commands.rs`), so a status list can only be introduced by editing `papyrus.config.yml` by hand, which contradicts the configuration-edit surface the requirements promise.\n\nADR-0019 makes configuration fail-closed with two repair surfaces, one of which is `config get|set|unset|list`. A user who needs to fix a status list in a broken configuration must be able to do it through that surface, or the repair path is incomplete for exactly the keys that are easiest to get wrong.\n\nForces: keep `config set`'s single value argument and its scalar semantics for every non-list key; do not turn `config set` into a YAML parser; keep validation on the resulting configuration (ADR-0019); keep the file format stable and readable; introduce no new flag, key type, or dependency."},{"heading":"Decision","content":"1. **List-valued keys are declared in one constant.** `config::LIST_VALUED_KEYS` names the keys whose value is a YAML sequence: the top-level `statuses` (task statuses) and `document_types.\u003cslug\u003e.statuses` for every slug. Every other key — including `default_status`, `prefix`, `directory`, `enabled`, `id_padding`, and `browser_*` — keeps scalar semantics. The constant is the only place a key is classified; key parsing must not guess from the value's shape.\n\n2. **`config set` with a list-valued key takes a comma-separated list.**\n   - The value is split on `,`; each element has surrounding whitespace trimmed; empty elements are dropped only when the entire value is empty, which is rejected.\n   - An empty value (`config set statuses \"\"`, or a value whose split yields no non-empty element) is a validation error (exit 4) naming the key, because \"no statuses\" is not a valid configuration for any of these keys (ADR-0019 decision 7).\n   - The list is written to `papyrus.config.yml` as a YAML **flow sequence**, for example `statuses: [ToDo, Initiated, Done]`, and `config get`/`config list` print the same flow form.\n   - Example: `papyrus config set document_types.audit.statuses 'active,archived,open'`.\n\n3. **Commas are separators, never data, and there is no escaping.** The command does not interpret quotes, backslashes, or any escape sequence. A value that must itself contain a comma cannot be expressed through `config set`; the user edits `papyrus.config.yml` directly. For a document status list this is safe rather than lossy: a comma- or quote-containing element fails the status character rule (ADR-0019 decision 7), so a quoted attempt is rejected with a validation outcome instead of being silently split into wrong values. For the free-form task status list, a status containing a comma is simply not representable through `config set`, and that limitation is documented.\n\n4. **Scalar keys are unchanged.** For a non-list key a comma stays an ordinary character of the scalar value; no existing `config set` invocation changes meaning.\n\n5. **The resulting configuration is validated before it is persisted.** `config set` builds the effective configuration with the new list, runs the full ADR-0019 validator, and writes only if the result is valid; an invalid result is refused (exit 4) and nothing is written. When the existing configuration is already invalid, the repair-mode load of ADR-0019 decision 10 applies: the file is read tolerantly, only the result is validated, and the same sanitization and containment rules are enforced.\n\n6. **`config unset` is unchanged.** Removing a list key reverts it to its default list; there is no separate \"clear list\" operation.\n\n7. **The syntax is documented where the key is documented.** `papyrus-config(5)` and `config set`'s help state the comma-separated form, the flow-sequence storage, and the no-escape limitation. No new flag (`--append`, `--remove`, `--json`) is added."},{"heading":"Consequences","content":"**Positive:**\n\n- Status lists become editable through the documented configuration surface, which completes the ADR-0019 repair path for the keys most likely to be invalid.\n- The file stays a plain YAML mapping with readable flow sequences, and `config get` round-trips what `config set` wrote.\n- One key-classification constant prevents a value-shape guess from turning a scalar containing commas into a list.\n\n**Negative:**\n\n- A comma can never be part of a configured status through `config set`; a project that needs one must edit the file, and the limitation must be documented rather than discovered.\n- An empty list cannot be expressed through `config set`; only `config unset` (revert to defaults) or a file edit expresses it.\n- Trimming means a status with significant leading or trailing whitespace is unrepresentable through this surface.\n- REQ-01.002 still says \"persists the value as a YAML scalar\"; the requirement must be updated by `requirements-engineer` to record the owner's list exception (traceability follow-up, not a code question).\n\n**Risks and mitigations:**\n\n- *Silent mis-split*: for document statuses the charset validation rejects quote- or comma-bearing elements; for task statuses the split is the documented behaviour, and the command prints the resulting list under `config get`.\n- *List/scalar classification drift*: `LIST_VALUED_KEYS` is the only classifier and a test asserts that every key with a sequence type in `Config` appears in it.\n- *Repair-mode bypass*: the list value goes through the same validator as a file-sourced list; a test asserts an invalid list is refused and the file is byte-identical.\n- *Documentation drift*: the man page and help text are updated with the syntax, and a test asserts the documented example parses."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Comma-separated value written as a YAML flow sequence (this ADR) | Selected | Owner's decision; keeps one value argument, one key classifier, and the existing validator. |\n| Accept arbitrary YAML in the value and store it as parsed | Rejected | Turns `config set` into a second YAML entry point, lets a user write mappings where a scalar is expected, and changes error behaviour for every key. |\n| Add repeated `--append`/`--remove` options | Rejected | New surface and new semantics (ordering, duplicates) not requested; the owner chose the comma form. |\n| Require file editing for every list key | Rejected by the owner | Leaves the repair path and the documented `config set` promise incomplete. |\n| Keep `config set` scalar-only and exempt list keys | Rejected | Contradicts REQ-01.002's statement that these keys are written by `config set`. |"},{"heading":"Open Questions","content":"- Should a status value containing a comma be supported later through a documented escape, or through `--append`? Current decision: neither; file edit only.\n- Should `config get` gain a `--json` rendering for list values? Current decision: no; the flow-sequence text is the documented form."},{"heading":"Downstream constraints","content":"1. `LIST_VALUED_KEYS` is the only list-key classification; `config set` must not infer list-ness from the value.\n2. List values are stored as YAML flow sequences and validated by the ADR-0019 validator before any write.\n3. An empty list value is rejected; `config unset` is the only way to return to defaults.\n4. No escaping and no quote interpretation may be added without a new ADR.\n5. `papyrus-config(5)` and `config set --help` must state the comma syntax and the limitation."},{"heading":"References","content":"- `docs/requirements/business/REQ-01.002.md` — `config set`, list-valued keys, repair surfaces.\n- `docs/requirements/business/REQ-07.002.md` — `statuses`/`default_status` validation.\n- `docs/requirements/business/REQ-07.001.md` — custom document statuses.\n- `docs/architecture/adr/ADR-0019-fail-closed-document-type-configuration-validation.md` — validator, repair-mode load, status-list rules.\n- `docs/architecture/adr/ADR-0023-consolidated-record-layout-and-field-map.md` — field map that consumes the configured status lists.\n- Implementation: `src/commands.rs` (`config_set`, `config_get`, `config_list`), `src/config.rs` (`LIST_VALUED_KEYS`, `validate`)."}]},{"id":"ADR-0025","title":"Bundled KaTeX Client-Side Math Rendering","status":"Accepted (2026-11-15) — owner decision 2026-11-15: KaTeX is the accepted math renderer, with the `$$...$$` / `$...$` (`\\$` escape) / fenced `math|tex|latex` delimiter set and curated-prose-only scope (no record-body view). Amended 2026-11-16 by architecture decision, status unchanged: decision 5 `output` value and decision 6 inline-style rule (revision notes below; owner acknowledgement requested through TASK-145).","sections":[{"heading":"Date","content":"2026-11-15"},{"heading":"Context","content":"REQ-06.017 requires the local web interface to render math formulas embedded in managed record content, fully offline, with all assets bundled, in the supported browsers (NFR-05.001), without arbitrary script execution (NFR-02.002), and with a rendering dependency that is open source and permits linking in a GPLv3-or-later application (NFR-06.002). Malformed input must degrade to visible source text instead of breaking the page.\n\nCurrent shape that this decision must fit:\n\n- ADR-0005 fixes a dependency-free HTTP server, server-side `{{name}}` templating, `include_str!` assets, a fixed route table, `Cache-Control: no-store`, and a CSP of `default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'`. It explicitly rejected a Markdown renderer.\n- `browser::render` emits every prose field through `escape()` into `\u003cp class=\"text\"\u003e` with `white-space: pre-wrap`. Verbs `src/browser/app.js` does nothing but the dirty-form guard and the narrow-viewport sidebar toggle.\n- No record body is displayed today. The detail pages render curated sections (`description`, `rationale`, `context`, `consequences`, `content`, `story`, `applicability`, `definition`, `view`) and never the raw file.\n- The binary is 4.2 MiB (`.deb` 1.28 MiB) with four Rust dependencies (`clap`, `serde`, `serde_json`, `yaml_serde`).\n\nForces: offline and single-binary (NFR-01.003, NFR-03.001, ADR-0002); no new Rust crate and no build toolchain beyond `cargo` (ADR-0001, ADR-0004); the CSP must not be weakened in `script-src`; the source text must remain the only stored value, so rendering cannot rewrite records; and the browser must stay usable without JavaScript (ADR-0005).\n\nREQ-06.017 states that rendering happens **in the browser only** and that CLI output shows source text unchanged, which removes server-side preprocessing from the option space at requirement level; it is still recorded below so the exclusion is traceable."},{"heading":"Decision","content":"1. **Math is rendered client-side by KaTeX, vendored into the binary.** No TeX engine, service, or preprocessing step exists on the server. `papyrus` and every non-browser surface keep printing the stored source text; the browser prints the same source until a client script replaces the placeholder.\n\n2. **The server does a non-Markdown pre-pass over each displayed prose field and emits placeholders.** This is the whole of the server-side work and it is not a Markdown renderer:\n\n   - The public delimiter contract is exactly three forms: `$$...$$` (display), `$...$` (inline, a backslash-escaped `\\$` is a literal dollar and never opens math), and a fenced block whose info string is `math`, `tex`, or `latex` (display). No other delimiter is recognized: `\\(...\\)` and `\\[...\\]` stay literal text.\n   - Fenced blocks whose info string is not a recognized math/diagram language stay literal text (they are code).\n   - The pass only splits a displayed field into an ordered list of segments: *literal text* (escaped exactly as today) and *math* (a `\u003cspan class=\"math\" data-tex=\"…\"\u003e` or `\u003cdiv class=\"math math--display\" data-tex=\"…\"\u003e` container whose inner content is the escaped source).\n   - Nothing else about Markdown is interpreted. Headings, lists, tables, emphasis, links, and raw HTML remain literal text, exactly as ADR-0005 decided. This pass is the only new interpretation of record content and it is limited to math/diagram delimiters.\n\n3. **The placeholder carries the fallback, not an empty box.** Because the source text is the element's initial content, the page is correct with JavaScript disabled, when the asset fails to load, and when KaTeX rejects the input. A successful render replaces the element's content.\n\n4. **Assets and loading.**\n   - `src/browser/vendor/katex/0.16.11/katex.min.js` (275,414 B), `katex.min.css` (23,335 B), and the 20 woff2 font files (≈259,792 B total) are committed pre-built and embedded with `include_bytes!` through the asset table of ADR-0027.\n   - KaTeX CSS is served **byte-identical** from `/assets/katex/katex.min.css`; its 60 relative `url(fonts/…)` references resolve to `/assets/katex/fonts/…`, which is exactly where the woff2 files are served. No vendoring patch is applied, so the recorded digest matches the upstream file. Only the woff2 form is served (the CSS also lists woff and ttf fallbacks that the supported browsers never request). No request path is ever joined to a filesystem path: every asset path is an entry in the static table.\n   - The stylesheet and script are linked **only** on pages whose pre-pass found at least one math segment; other pages gain no bytes.\n   - The script is a classic script with `defer`. No module loading, no `fetch`, no dynamic `import()`.\n\n5. **Rendering call.** One pass over `[data-tex]` elements using `katex.render(source, element, { throwOnError: false, displayMode, trust: false, strict: 'warn', output: 'htmlAndMathml' })`. `throwOnError: false` renders the offending expression in `errorColor` rather than throwing; a thrown error or a missing global leaves the source text in place and marks the element `data-render-error=\"math\"`.\n\n   *Revision (2026-11-16, architecture decision): `output` changes from `'html'` to `'htmlAndMathml'`, the KaTeX default, and that exact string is pinned. KaTeX sets `aria-hidden=\"true\"` on the `.katex-html` node it builds (verified in the vendored 0.16.11 bundle), and with `output: 'html'` that node is the only output: a successfully rendered formula would be invisible to assistive technology, while the source-text fallback has already been replaced by the render. `'htmlAndMathml'` additionally emits `.katex-mathml`, which `katex.min.css` clips visually and exposes to assistive technology, including `\u003cannotation encoding=\"application/x-tex\"\u003e` with the source. The cost is client-side only: the server still ships the placeholder, so the response payload is unchanged, and the DOM for a rendered formula roughly doubles. No asset, no CSP directive, and no `trust`/`strict` setting changes, and the no-JavaScript and rejected-input fallbacks behave as before.*\n\n6. **CSP delta: `font-src 'self'` only.** KaTeX emits class-bearing spans and needs its woff2 files; it needs no inline script, no `eval`, and no style mechanism it cannot render without — the few inline `style` attributes it does emit are cosmetic and are dropped (revision note below). The served CSP becomes:\n\n   `default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'`\n\n   `script-src` is unchanged, so no script path other than the embedded assets can execute.\n\n   *Revision (2026-11-16, architecture decision): the `style-src 'self'` value is confirmed and the loss of KaTeX's inline `style` attributes is accepted, not repaired. KaTeX sets `style` attributes on generated nodes (`mspace` widths and rule geometry, hbox height/vertical-align, `\\color` output, and the `errorColor` of a rejected formula); the browser drops each one under this policy. The visible cost is bounded — spacing can deviate by a fraction of an em and a rejected formula shows uncoloured — and no content, structure, or execution path changes. The alternatives are rejected on mechanism, not taste: a nonce matches `\u003cstyle\u003e`/`\u003clink\u003e` elements and never a `style` attribute, and KaTeX emits no style element for math; hashes cannot enumerate content-dependent widths and `style-src-attr`/`'unsafe-hashes'` are not available on all of NFR-05.001's browsers (Firefox 100 lacks them); `'unsafe-inline'` would relax every page for a cosmetic deviation, and its use by Mermaid (ADR-0026 decision 5) is a separate decision about an injected `\u003cstyle\u003e` element. TASK-146 therefore does not inherit this rule, and the math pass must render correctly without `'unsafe-inline'`.*\n\n7. **Sanitisation is structural.** `trust: false` disables `\\href`, `\\url`, `\\includegraphics`, `\\htmlClass`, and `\\htmlData`; KaTeX output is built from its own text nodes; the TeX source reaches it as a string attribute, never as HTML. The attribute is escaped by the existing escaping rules. A record cannot make KaTeX emit a script or a remote reference.\n\n8. **Scope of rendering: curated prose fields only.** `descr
