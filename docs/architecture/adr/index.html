es","content":"**Positive:**\n\n- NFR-04.003 becomes achievable in both directions, and this repository's existing task and milestone files become visible to Papyrus.\n- One on-disk convention for task and milestone records removes the two parallel stores, while Papyrus keeps the ID format its documentation and users rely on (REQ-01.005).\n- Because the mapping is derived, adopting the Backlog.md layout requires no mapping file, no extra key, and no reconciliation job.\n- Archive layout matches the tool that created the archive, so neither tool loses track of archived work, and display IDs survive archive and restore.\n- Status vocabulary is shared, so a Papyrus status change appears on the Backlog.md board.\n- Reference values stored in storage form resolve in the tool that owns the reference, while users still see Papyrus IDs.\n\n**Negative:**\n\n- Two ID spaces now exist in every surface: documentation, error messages, JSON, and tests must state which space they mean. This is inherent to the product decision, not removable by design.\n- Existing projects do not start at `TASK-001`; display numbers mirror storage numbers and may be sparse (`TASK-018`, `TASK-048`). Users who expect contiguous IDs will be surprised.\n- The storage and display layers are configured separately and can be misconfigured; only the load-time validation prevents a mapping that is not one-to-one.\n- The simple rule \"the ID is the filename\" no longer holds: reading a filename now requires normalization and offsetting, and every diagnostic has to say which ID space it is using.\n- Filename slugs become stale after title edits, because files are not renamed.\n- Configuration precedence is layered and must be documented per setting.\n\n**Risks and mitigations:**\n\n- *Two ID spaces confuse users or leak into output*: one projection type supplies the display ID everywhere; a test asserts that no CLI or browser surface prints a storage ID as identity; diagnostics label the storage ID explicitly.\n- *Translation bugs (off-by-one on milestones, casing, padding)*: translation is a single pure function in `record::identity` with property tests (round-trip identity for every offset/padding combination, monotonicity, rejection of malformed input); the empirical round trip in decision 10 is the acceptance gate.\n- *Mapping persisted accidentally by a later change*: the contract states the mapping is derived and the record has no key for it; a storage ID differing from the pattern is a validation error, not an invitation to add a table.\n- *Collision when a Backlog.md file and a Papyrus file denote the same record*: decision 9 detects it by normalized storage ID, stops the migration, and refuses writes; nothing is merged, and the report names both paths.\n- *Migration of records that use either format*: conversion on first read or first write reads both shapes (ADR-0007 decision 8), preserves the number, and refuses to guess when both exist; the dry-run inventory shows every rename before it happens.\n- *Legacy body conversion losing content*: the legacy-to-storage conversion (decision 8) drops a heading and retires metadata sections; unknown sections and free text are appended verbatim, the dry-run inventory records the before/after body for each converted file, and the conversion is a one-time path with no second use in the writer.\n- *Backlog.md rejects or rewrites a file Papyrus wrote*: the NFR-04.003 two-direction verification runs before the change is accepted; any rejected field is a blocker, not a known limitation.\n- *Storage front-matter casing asymmetry (task `TASK-18` upper vs milestone `m-0` lower)*: this is observed Backlog.md behavior, encoded as-is; the translation normalizes on read, and a round-trip test confirms Backlog.md accepts what Papyrus writes. If Backlog.md tolerates a uniform form, normalizing is a later simplification, not a correctness requirement.\n- *Status validation blocking legitimate edits*: the accepted status set comes from configuration; an unknown observed status is reported and preserved, not normalized.\n- *Slug collisions*: resolved by number, never by slug; a duplicate stem is a validation error, not a silent overwrite.\n- *A changed display prefix or padding silently rewriting user expectations*: the change is detected at load and reported; storage IDs are untouched, so nothing on disk breaks."},{"heading":"Resolved open questions (user decisions 2026-11-08)","content":"1. Resolved (user decision 2026-11-08): Papyrus commands accept only the Papyrus display format; a Backlog.md storage ID (`task-18`, `m-0`, `TASK-18`) supplied as input is rejected with a hint naming the equivalent Papyrus ID. Not blocking.\n2. Resolved (user decision 2026-11-08): the milestone offset is fixed `+1` (`m-0` → `MS-001`, `m-12` → `MS-013`); not configurable. Not blocking.\n3. Resolved (user decision 2026-11-08): when a storage number's digit count exceeds `id_padding`, the display ID uses the wider number; padding is a minimum, never truncated or errored. Not blocking.\n4. Resolved (user decision 2026-11-08): confirmed via REQ-05.011 — the byte-identical guarantee covers bodies already in Backlog.md shape; legacy bodies are converted with a reported per-file diff. Blocking for the task/milestone migration task only, not for the design."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Adopt the Backlog.md layout for storage and translate IDs at the boundary (this ADR) | Selected | Satisfies NFR-04.003 in both directions while keeping the Papyrus ID contract of REQ-01.005. |\n| Adopt Backlog.md IDs directly as Papyrus IDs (earlier draft of this ADR) | Superseded by product decision | It works mechanically but discards the configured prefix, `id_padding`, and the documented `TASK-001`/`MS-001` examples. |\n| Keep the Papyrus layout and add only front matter | Rejected | Backlog.md cannot see `\u003cTASK-001\u003e.md`, `tasks/archived/`, or `## Status`; NFR-04.003 fails. |\n| Dual-write a Backlog.md-compatible file next to the Papyrus file | Rejected | Two sources of truth, two files to keep in sync, violates NFR-04.001's single text store. |\n| Persist an ID mapping table (sidecar file or extra front-matter key) | Rejected | A second store that can drift, must be migrated, and would have to be repaired when files are edited by Backlog.md; a derived affine map needs neither. |\n| Make the display prefix and offset fully configurable per project | Rejected | Adds renumbering hazards with no observed need; display prefixes and padding are already configurable, the offset is a fixed property of each tool's numbering. |\n| Convert on import/export only | Rejected | Requires a conversion step, which NFR-04.003 explicitly rules out. |\n| Use `papyrus.config.yml` as the sole configuration and ignore `backlog/config.yml` | Rejected | The two configurations already disagree on statuses and prefixes; Backlog.md would break on files Papyrus writes. |\n| Adopt Backlog.md layout for every record type (requirements, decisions, docs) | Rejected | Backlog.md has no format for those; Papyrus's document conventions stay authoritative there. |"},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-04.003.md` — interoperability requirement and verification method.\n- `docs/requirements/business/REQ-01.005.md` — stable IDs, two ID spaces, bidirectional translation, reference translation.\n- `docs/requirements/business/REQ-05.010.md` — front-matter field map and Backlog.md compatibility statement.\n- `docs/requirements/business/REQ-03.001.md`, `REQ-03.002.md` — milestone and release identity and lifecycle.\n- `docs/architecture/adr/ADR-0007-yaml-front-matter-as-single-record-metadata-source.md` — front-matter field map, canonical key order, lazy per-record migration.\n- `docs/architecture/adr/ADR-0009-shared-record-envelope-and-unified-write-path.md` — one writer, ID translation at the store boundary, migration staging.\n- Observed files: `backlog/config.yml`, `backlog/tasks/*.md`, `backlog/milestones/*.md`, `backlog/archive/`.\n- Implementation: `src/task.rs` (`active_dir`, `archived_dir`, `create`, `view`, `list`), `src/milestone.rs` (`active_dir`, `create`), `src/browser/records.rs` (`build_index` stem filter, `resolve_id`), `src/config.rs` (`Config::default`)."}]},{"id":"ADR-0009","title":"Shared Record Envelope and Unified Write Path for CLI and Browser","status":"Superseded by ADR-0013 on 2026-11-11 — the shared-envelope, single-writer, projection, and staged-delivery decisions carry over, but this ADR's storage-identity translation, storage ID pattern, Stage 2 (storage identity), and Stage 4 (migration to the Backlog.md layout) contradict NFR-04.004 (adopted 2026-11-11) and REQ-01.005. Body frozen; ADR-0013 restates the structure without the storage layer and fixes the revised stage plan.","sections":[{"heading":"Date","content":"2026-11-08 (status: Superseded, 2026-11-11)"},{"heading":"Context","content":"ADR-0007 makes YAML front matter the single metadata store, requires field-preserving patches, and requires lazy per-record migration on first read and first write that adds front matter to each managed Markdown record and converts legacy task/milestone bodies, with idempotent no-ops thereafter. ADR-0008 makes task and milestone storage Backlog.md-shaped and introduces a translation layer between Papyrus display IDs and Backlog.md storage IDs. Both requirements land on a codebase with duplicated record handling:\n\n- Fourteen modules each implement their own heading parser, `## ` section parser, renderer, and writer: `requirement`, `task`, `milestone`, `release`, `decision`, `glossary`, `rule`, `ui_spec`, `ui_mockup`, `audit`, `tech_spec`, plus the browser's `records` and `render`, and `search` reads the same files again.\n- Two independent parsers already disagree in risk profile: `browser::records::parse_doc` + `apply_*_edit` (section-preserving, version-checked, atomic) and the CLI modules' `parse_*` + `render_*` + `fs::write` (full re-render, non-atomic, no version token).\n- ADR-0006 (Accepted) fixed optimistic concurrency and atomic writes for browser edits and explicitly deferred the CLI: \"Reconciling the CLI with this contract (atomic writes, optimistic concurrency, section preservation) is deferred to a follow-up task and is not part of this ADR.\"\n- REQ-05.011 requires every writing command, CLI and browser, to preserve untouched fields and requires lazy per-record migration on first read and first write; REQ-06.004 requires the browser to write metadata back into front matter and preserve the rest of the file. Re-rendering from a parsed model cannot satisfy either: the browser's `apply_*_edit` functions rebuild the file from `# heading` + preamble + sections, which would discard a front-matter block entirely.\n- REQ-01.005 requires the display/storage ID translation to happen at the storage boundary and to be consistent in both surfaces.\n- ADR-0005 fixes the module boundaries inside the single crate and forbids new dependencies; any restructuring must stay inside that baseline.\n\nThe alternative to a shared implementation is to add front-matter handling to each of the fourteen modules and to the browser, plus one migration script per family. That guarantees the drift ADR-0006 already lists as a risk and makes \"CLI and browser show the same values\" and \"migration changes nothing but the block\" impossible to guarantee."},{"heading":"Decision","content":"1. **Introduce one shared record module inside the single crate** (ADR-0004, ADR-0005), planned as `src/record/`:\n   - `record::frontmatter` — detect, parse, patch, and serialize the leading YAML block; owns the key registry (general keys plus per-type keys) from ADR-0007.\n   - `record::document` — the lossless envelope: front matter plus ordered body units (optional heading line, preamble lines, `## ` sections with their raw bodies). Section text and unknown content are kept as raw lines, never re-rendered.\n   - `record::patch` — the only mutation API: a list of `PatchOp` values (`SetFrontMatter(key, value)`, `ClearFrontMatter(key)`, `SetSection(heading, value)`, `ClearSection(heading)`, `SetHeadingTitle(title)`). Applying a patch returns the new text; applying an empty patch or a patch whose values equal the current values returns byte-identical text.\n   - `record::identity` — the only ID code: parse, normalize, and translate between the Papyrus display ID and the Backlog.md storage ID (ADR-0008 decision 4), validate reference values, and allocate the next storage number from the records present in both active and archived locations.\n   - `record::store` — record location, safe path resolution (`Context::ensure_within`), read, atomic write (the `create_new` + `sync_all` + same-directory rename + cleanup sequence from ADR-0006), the version token, and translation of incoming display IDs to storage paths and of stored storage IDs to display IDs on the way out.\n2. **Every record module becomes a descriptor, not a serializer.** A record type declares: its display ID pattern and directory, its storage ID pattern and directory (where they differ), its extra front-matter keys, its known body sections and their order, and its field validation rules. Creation and editing build patch operations through the shared module. No module keeps a `render_*` function that assembles a whole file, except UI mockups (HTML, out of front-matter scope per ADR-0007) and the lazy per-record migration, which must itself be expressed as patches through `record::patch`.\n3. **The browser uses the same reader, patcher, and identity.** `browser::records::parse_doc` and the ten `apply_*_edit` functions are replaced by `record::document` + `record::patch` + `record::identity`. Metadata edits (title, status, milestone, assignee, labels, dependencies, release, audit type, `superseded_by`) become front-matter patch operations; free-text edits remain section patches. Title edits patch the front matter and, where the record type keeps one, the heading line, in the same write. Browser routes, form values, and links carry the display ID; the store translates it before touching the filesystem, and a storage ID in a URL is rejected like any unknown ID.\n4. **One write path for both surfaces.** All CLI writes use `record::store::write_atomic`; the CLI no longer calls `fs::write` on a record file. The browser keeps the ADR-0006 optimistic concurrency contract: a stale or malformed version token is `409`/`400` before any write. The CLI does not gain version tokens (there is no client to return a conflict to), but it does gain atomicity and section preservation, which discharges the ADR-0006 deferred follow-up without changing ADR-0006's decision. A write that changes no byte does not happen at all, so `updated_date` is not refreshed by a no-op (ADR-0007 decision 7).\n5. **One projection for both views, with an explicit identity field.** A single `RecordView` type exposes the record identity (the display ID), the raw metadata (`metadata` as an ordered map of the front-matter keys as stored, where `id` is the storage value), and the typed document fields. CLI `list`/`view` text and `--json`, browser list/detail JSON, and browser HTML all render from it, so REQ-06.004's \"same metadata values\" is structural rather than maintained by hand. The identity field is the display ID and is the only value presented as the record's ID; the storage ID appears only inside `metadata` and in labelled diagnostics. `--json` gains a `metadata` object; the browser JSON record and form gain the same object plus `created_date`/`updated_date`. The `metadata` object is a stable public contract (resolved 2026-11-08): documented in `papyrus(1)` and the browser specifications; changes are additive only.\n6. **The front-matter key registry is the only metadata extension point.** Adding a key to a record type (for example decision `status` if the product decision later moves it, or a release state) is a registry entry plus a section-retirement rule; it must not require a new serializer.\n7. **Strict no-drift rule.** From the implementation of this ADR onward, no new record parsing, metadata formatting, ID translation, or record writing may be added outside `src/record/`. Existing module-local code is removed as each type migrates. Temporary dual implementations during the migration must be marked and tracked, and the migration is not complete until `grep` finds no `fs::write` on record paths, no `format!(\"---` outside the shared module, and no ID-formatting outside `record::identity`.\n8. **Delivery is staged so the corpus stays readable and the migration has exactly one implementation.**\n   - Stage 1 — `record::frontmatter` + `record::document` + `record::patch` + `record::store`, able to read both the legacy (no front matter) and new shapes, with the descriptor set for the record types.\n   - Stage 2 — `record::identity` for task and milestone IDs, including the storage-number allocator and conflict detection (ADR-0008 decision 9).\n   - Stage 3 — lazy migration of document record types (requirements, NFRs, specifications, glossary, rules, decisions, audits, releases) on first read and first write, built only on `record::patch`, with a dry run and a per-file inventory available as a reporting and verification aid (ADR-0007 decision 9). Stages 1 and 2 are prerequisites; Stage 2 is not needed for document types but the shared reader/patcher is.\n   - Stage 4 — lazy migration of tasks and milestones to the Backlog.md layout and storage IDs on first read and first write, which must follow Stage 2 because their front matter carries storage IDs and reference values (ADR-0008 decision 8). This is the only stage permitted to change a task or milestone body, and only for records still in the legacy Papyrus shape (ADR-0008 decision 8); records already in Backlog.md shape stay byte-identical.\n   - Stage 5 — removal of the legacy per-module parsers/writers and enforcement of the no-drift checks in decision 7.\n   - Stage 6 (verification) — a dedicated verification task for lazy migration correctness and idempotency: first read and first write of a managed record adds front matter; a second read and second write are byte-identical no-ops; legacy Papyrus-shape task/milestone files convert on first access with unknown sections and free text preserved verbatim and a before/after diff reported; Backlog.md-shape files keep a byte-identical body apart from the front-matter block; migration covers only descriptor-claimed files; unread records may remain unmigrated; read-path write failures (read-only media, missing permission) leave the original file byte-identical and are reported.\n   The migration cannot run before Stages 1 and 2. A migration implemented independently of `record::patch` is prohibited: it would be a second writer whose byte-identity guarantees nobody tests.\n9. **One clock per write.** Every write path obtains a single UTC timestamp value and uses it for `updated_date` (and `created_date` at creation); no module calls the clock separately for the same write."},{"heading":"Consequences","content":"**Positive:**\n\n- \"Preserve everything the operation does not change\" becomes one tested property instead of fourteen untested behaviours.\n- CLI and browser cannot disagree about a record's metadata or its ID because there is one reader, one identity function, and one projection.\n- REQ-05.011's per-field options become a loop over the key registry instead of fourteen hand-written CLI surfaces.\n- The ADR-0006 deferred gap (CLI non-atomic writes, full re-render, lost unknown sections) is closed as a side effect of the requirement, not as separate scope.\n- Backlog.md round-trip tests can target one patcher, and the migration reuses it, so migration fidelity is the same property as edit fidelity.\n- The ID translation is testable as one pure function rather than per command.\n\n**Negative:**\n\n- This is the largest refactor in the change: every record type's read and write path is touched, and the migration cannot be delivered in one small task.\n- The staged order creates a delivery constraint: nothing user-visible can ship before Stage 1 and 2 exist, so the first merge is large and low on visible value.\n- The shared envelope must model enough of each type's structure (heading or not, section order, markers) without becoming a general Markdown engine; there is a real risk of over-generalizing.\n- Error messages, validation text, and JSON shapes currently produced per module must be preserved exactly; the refactor will surface hidden per-module quirks as test failures.\n- Identity becomes a concept every surface must respect (display ID out, storage path in); a single bypass reintroduces the confusion the previous draft created.\n- Search still reads raw file text independently and will now also match front-matter values, including storage IDs; that behaviour must be documented rather than fixed by filtering.\n\n**Risks and mitigations:**\n\n- *Refactor regression*: migrate one record type at a time with its existing tests unchanged, plus new patch tests (no-op byte identity, unknown-key preservation, unknown-section preservation).\n- *Over-generalization*: the envelope models lines and sections only; it does not parse Markdown semantics. Type-specific structure stays in descriptors.\n- *Partial migration with two writers*: the completion check in decision 7 is mechanical and can be enforced in review; the migration is required to use `record::patch` (decision 8).\n- *Migration ordered before identity*: task and milestone front matter would encode display IDs, silently breaking the Backlog.md round trip; decision 8 forbids it, and the round-trip test in ADR-0008 decision 10 catches it.\n- *Migration growing into a body rewriter*: only Stage 4 may change a task/milestone body, only for legacy-shaped files, and only through explicit body-mapping ops; document record migration and every normal edit stay front-matter/section patches. A test asserts that migrating an already-storage-shaped corpus is byte-identical.\n- *ID translation bypassed by a new surface*: `record::identity` is the only ID code under the no-drift rule; a test asserts that CLI and browser output never contains a storage ID in the identity position.\n- *JSON API change*: adding `metadata` to the browser JSON record is an additive change, but the identity field keeps its meaning (`id` = display ID); the specification pages for each browser surface must be updated by `business-analyst`/`tech-writer`, and JSON consumers in tests must be checked. If a consumer needs the storage ID, it reads `metadata.id`; no second top-level field is introduced without a decision. Ownership note (settled 2026-11-08): the specification documents to revise for the display/storage ID split (`papyrus(1)` ID sections plus `docs/specifications/browser-*.md` showing IDs) are owned by `business-analyst`/`tech-writer` after this ADR is accepted; not blocking the design.\n- *Write atomicity on unusual filesystems*: unchanged from ADR-0006; same-directory rename assumption still holds.\n- *Lazy migration on the read path*: a first read may trigger a write (front-matter insertion or legacy body conversion). On read-only media or without write permission the migration must fail without partial writes and must leave the original file byte-identical; the reader reports the error rather than a migrated record. Two concurrent readers of the same unmigrated record serialize through the atomic write contract; the second observes the already-migrated file and becomes a no-op. A reader that loaded pre-migration bytes is not silently upgraded. These implications are also recorded in ADR-0007.\n- *Performance*: per-request re-reads stay; the shared reader should parse once per record instead of the current duplicate parsing in `browser::records`, so the change is not expected to regress. ID translation is arithmetic, not I/O."},{"heading":"Resolved open questions (user decisions 2026-11-08)","content":"1. Resolved (user decision 2026-11-08): CLI `--json` `metadata` is a stable public contract, documented in `papyrus(1)` and the browser specifications; changes are additive only. Not blocking."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| One shared record module with a patch-based writer and identity function (this ADR) | Selected | Only design that makes field preservation, CLI/browser parity, and one ID translation testable once; stays inside ADR-0004/0005 boundaries. |\n| Add front-matter and ID code to each of the fourteen modules | Rejected | Guarantees drift, repeats fourteen times the logic that must match Backlog.md byte-for-byte. |\n| Keep the browser serializer and give the CLI a separate one | Rejected | Two parsers already disagree; REQ-06.004 requires identical values and identical preservation. |\n| Lazy per-record migration on first read and first write (this ADR, revised 2026-11-08) | Selected | Matches the revised REQ-05.011; the corpus converges record by record; readers keep the legacy fallback until convergence; idempotent. Stages 1 and 2 remain prerequisites; Stage 6 verifies correctness and idempotency. |\n| One bulk migration stage instead of lazy per-record migration | Rejected by product decision 2026-11-08 | ADR-0007 decision 9 no longer requires a bulk pass; lazy migration achieves the same end state without a dedicated command and keeps readers robust to both shapes. |\n| A standalone migration script separate from the shared writer | Rejected | Becomes a second writer whose body-preservation and byte-identity behaviour is untested and diverges from normal edits. |\n| Adopt a Markdown/AST library | Rejected | New dependency and a rendering model that would not preserve unknown content byte-identically; ADR-0005 forbids new dependencies. |\n| Move records into a database or an index cache | Rejected | Violates NFR-04.001 text-file persistence and the no-parallel-store constraint; an ID mapping table is the same mistake at smaller scale. |\n| Full re-render from a typed model on every write | Rejected | Cannot preserve unknown keys, foreign front matter, or ADR-frozen bodies. |"},{"heading":"References","content":"- `docs/requirements/business/REQ-05.011.md` — every writing command preserves untouched metadata; lazy per-record migration.\n- `docs/requirements/business/REQ-06.004.md` — CLI and browser read front matter, browser writes it back.\n- `docs/requirements/business/REQ-01.005.md` — display/storage ID translation at the storage boundary.\n- `docs/requirements/non-functional/NFR-04.001.md` — text-file persistence.\n- `docs/requirements/non-functional/NFR-04.002.md` — project-directory boundary.\n- `docs/architecture/adr/ADR-0005-embedded-dependency-free-http-server-and-server-rendered-ui.md` — module boundaries and no-new-dependency baseline.\n- `docs/architecture/adr/ADR-0006-optimistic-concurrency-and-atomic-record-writes.md` — atomic write and version token contract; deferred CLI alignment.\n- `docs/architecture/adr/ADR-0007-yaml-front-matter-as-single-record-metadata-source.md` — front-matter key registry, patch requirement, lazy per-record migration.\n- `docs/architecture/adr/ADR-0008-adopt-backlog-md-on-disk-layout-for-tasks-and-milestones.md` — task/milestone shape, two ID spaces, conflict handling.\n- Implementation: `src/browser/records.rs` (`parse_doc`, `apply_*_edit`, `write_atomic`, `version_token`), `src/browser/mod.rs` (`form_post`, `api_post`), per-type CLI modules under `src/`, `src/context.rs` (`ensure_within`).\n- Tests: `tests/browser_cli.rs`, module unit tests in `src/browser/records.rs`."}]},{"id":"ADR-0010","title":"Papyrus-Native On-Disk Record Layout and Path Convention","status":"Superseded by ADR-0023 on 2026-11-13 — ADR-0023 restates the native layout and identity contract with `archived/` as the only inactive document location (no `deprecated/` read or migration, no document restore) and the current front-matter field map, so this ADR's deprecate/restore clauses and its allocation scope are no longer in force. Body frozen; the still-valid path, identity, naming, resolution, relocation, import, and atomic-move decisions are restated in ADR-0023.","sections":[{"heading":"Date","content":"2026-11-11 (status: Accepted, 2026-11-11; status: Superseded, 2026-11-13)"},{"heading":"Context","content":"NFR-04.004 (adopted 2026-11-11) renounces file-level interoperability with Backlog.md and replaces it with a one-way import. NFR-04.003 is superseded. REQ-01.005 now defines a **single Papyrus ID space**: the Papyrus ID is the record identity in front matter, CLI and browser output, and command input, with no tool-specific storage ID and no translation. REQ-05.010 and REQ-05.011 require each managed Markdown record to carry YAML front matter as the single metadata store and to be adopted lazily per record. REQ-01.002 requires a configuration-driven folder change to move the whole folder atomically. REQ-01.003 forbids falling back to built-in defaults when no configuration file is found.\n\nNFR-04.004 leaves the **native on-disk file layout and path convention** as an explicit open question, and so does REQ-01.005 (\"the on-disk file-name convention is an architecture decision\"). ADR-0008 currently answers it the other way: it makes the Backlog.md on-disk contract authoritative for task and milestone storage (`backlog/tasks/task-18 - slug.md`, `backlog/milestones/m-0 - slug.md`), derives a second storage identity, and translates numbers with a task offset of 0 and a milestone offset of +1. It cannot survive NFR-04.004 and is superseded by this ADR. ADR-0007's \"Backlog.md key set\" and \"Backlog-compatible quoting\" clauses are superseded by ADR-0012; ADR-0009's storage-identity stage is superseded by ADR-0013.\n\nObserved state that the layout must account for:\n\n- On-disk corpus: `backlog/tasks/task-18 - \u003cslug\u003e.md` … `task-73`, `backlog/milestones/m-0` … `m-14`, `backlog/archive/tasks/`, `backlog/archive/milestones/`, `backlog/docs/`, `backlog/drafts/`, `backlog/decisions/`, `backlog/config.yml`. Legacy Papyrus archives remain at `backlog/tasks/archived/` and `backlog/milestones/archived/`.\n- Code: `src/record/identity.rs` implements bidirectional display/storage translation with storage prefixes and offsets; `src/record/descriptor.rs` declares fixed directories (`backlog/tasks`, `backlog/milestones`, `backlog/releases`, `docs/decisions`, `docs/requirements/...`); `src/task.rs` still resolves three task locations (`tasks/`, `tasks/archived/`, `archive/tasks/`) and three milestone locations.\n- Configuration roots already exist: `backlog_directory`, `decision_directory`, `doc_directory`, and a `directory` per document type. `papyrus.config.yml` for this project sets `decision_directory: docs/architecture/adr`.\n- Document records already follow `\u003cID\u003e.md` (`REQ-01.001.md`, `NFR-04.004.md`, `GLO-001.md`, `TASK-73` front matter); decisions follow `\u003cID\u003e-\u003ckebab-slug\u003e.md` (`ADR-0010-papyrus-native-on-disk-record-layout.md`) because the ADR corpus and external links depend on that name.\n\nForces: one identity, one file, one name, derived and not translated; paths fully configuration-driven; stable IDs across rename, archive, restore, deprecate; no renaming on title edits (browser sessions, in-flight edits and version tokens address a path); atomic, conflict-detecting folder moves; project-directory containment (NFR-04.002, NFR-04.001); and no read or write path that produces a Backlog.md shape."},{"heading":"Decision","content":"1. **One record, one file, one identity.** The Papyrus ID (REQ-01.005) is the record identity everywhere and is derivable from the file location. There is no storage ID, no second prefix, no number offset, and no translation layer in either direction. `record::identity` keeps only: parse and format a Papyrus ID under the configured prefix and `id_padding`, validate a reference value, and allocate the next number of a type.\n\n2. **Directories are configuration-driven; descriptors name a configuration key, never a literal path.**\n\n   | Record family | Active location | Inactive location | Idle/deprecated location |\n   |---|---|---|---|\n   | Task | `\u003cbacklog_directory\u003e/tasks/` | `\u003cbacklog_directory\u003e/archive/tasks/` | — |\n   | Milestone | `\u003cbacklog_directory\u003e/milestones/` | `\u003cbacklog_directory\u003e/archive/milestones/` | — |\n   | Release | `\u003cbacklog_directory\u003e/releases/` | `\u003cbacklog_directory\u003e/archive/releases/` | — |\n   | Decision (ADR, BDR) | `\u003cdecision_directory\u003e/` | — | — (deprecation is expressed by the `## Status` line in place; decision files are not moved) |\n   | Document record (`req`, `nfr`, `glossary`, `rule`, `ui-spec`, `tech-spec`, `audit`, `deploy`, `use-case`, `test-case`, `test-report`) | `\u003cdoc_directory\u003e/\u003ctype directory\u003e/` | — | `\u003cdoc_directory\u003e/\u003ctype directory\u003e/deprecated/` |\n\n   UI mockups remain HTML records under their configured `ui-mockup` directory and keep REQ-05.008 metadata; they are not Markdown records and this layout does not change them. `backlog_directory` and `decision_directory` are relative to the project directory; a document type's `directory` is relative to `doc_directory`. Every resolved path passes `Context::ensure_within` before any read or write (NFR-04.002).\n\n3. **File name.**\n\n   - Default: `\u003cID\u003e.md`, where `\u003cID\u003e` is the full Papyrus ID including the configured prefix and padding (`TASK-001.md`, `MS-001.md`, `REL-001.md`, `REQ-01.001.md`, `NFR-04.004.md`, `GLO-001.md`, `RUL-016.md`, `AUD-001.md`).\n   - Decisions keep a descriptive suffix because the ADR corpus convention and its external links require it: `\u003cID\u003e-\u003ckebab-case-slug\u003e.md` (`ADR-0010-papyrus-native-on-disk-record-layout.md`). The slug is fixed at creation and is never regenerated; the ADR skill's `ADR-NNNN-\u003ckebab-case-title\u003e.md` convention is preserved.\n   - The slug is cosmetic. Resolution never uses it. No writer renames a file when a title changes. Document records that already carry a slug (for example this repository's `BR-016-\u003cslug\u003e.md`) keep their names when read and written; new records of those types use `\u003cID\u003e.md` unless a later decision gives that type its own suffix rule.\n\n4. **Resolution (read tolerance), never used to write.**\n\n   - A file inside a claimed directory whose stem is `\u003cPREFIX\u003e-\u003cdigits\u003e` optionally followed by `-\u003cslug\u003e` or ` - \u003cslug\u003e` is a candidate record. The prefix is compared case-insensitively against the configured prefix; leading zeros are optional, so `TASK-1.md`, `TASK-001.md` and `TASK-0001.md` all denote `TASK-001`.\n   - Backlog.md storage stems are **not** recognized. `task-18`, `m-0` and any other Backlog storage prefix match no Papyrus record, so an unimported Backlog store is invisible to every Papyrus surface. This is the enforcement of \"the import is the only bridge\" (ADR-0011).\n   - Front-matter `id` is authoritative. If it disagrees with the stem after normalization, the record is read from front matter, is flagged invalid, and writes to it are refused until the file is fixed.\n   - Legacy archive aliases `\u003cbacklog_directory\u003e/tasks/archived/` and `\u003cbacklog_directory\u003e/milestones/archived/` are read as archived tasks and milestones. A read never relocates or renames them; archive/restore operations follow decision 7.\n\n5. **Numbering and immutability.**\n\n   - Each record family has one number space: tasks, milestones, releases, and each decision prefix and document prefix separately. **Milestones start at 1 (`MS-001`); the Backlog `m-0` offset is gone (confirmed by the user on 2026-11-11).**\n   - **Milestone renumbering is accepted as a user-visible consequence (confirmed 2026-11-11).** A milestone stored as `m-N` is remapped into the Papyrus milestone space by allocation (ADR-0011 decision 4), for example `m-0` → `MS-001`-style IDs; the source `m-` number is never preserved, and the new number is what appears in front matter, the file name, references, the CLI, and the browser.\n   - Allocation is `max(number present in every active, archived and deprecated location of that family) + 1`, minimum 1. A number is allocated once, at creation, and never recomputed.\n   - Deleting the highest-numbered record makes that number available again; existing records are never renumbered. Archive, restore, deprecate, restore, supersede, and title edits never change an ID or a file name.\n   - A configuration change to a prefix or `id_padding` affects only records created afterwards. Existing IDs, file names and reference values are untouched, and padding remains a minimum (REQ-01.005, REQ-01.007).\n\n6. **No shape conversion, no renaming on read or write.**\n\n   - No path converts a record to a Backlog.md on-disk shape, writes a Backlog storage ID, or renames a file into another naming convention.\n   - Lazy adoption (REQ-05.011, ADR-0012) adds a front-matter block and may retire legacy metadata sections; it does not move, rename, or re-shape the file.\n   - A record that is not in the native layout stays where it is; the one-way import (ADR-0011) is the supported way to bring a Backlog.md store into the native layout.\n\n7. **Archive, restore, deprecate, restore are moves, not rewrites.**\n\n   - An archive moves the file from the active directory to the archive directory of its family and an unarchive moves it back, keeping the file name and the ID.\n   - Deprecate and restore do the same between the active and `deprecated/` directories of a **document** type (REQ-05.007). Decision records are never moved on deprecation: their state is the `## Status` line, and keeping them in the decision directory keeps them in the ADR index.\n   - A move inside the project uses a same-directory-or-same-filesystem rename where available, otherwise the ADR-0006 atomic write sequence (write the destination with `create_new`, `sync_all`, then remove the source). A failed move leaves the record readable at exactly one location and reports the error; it never duplicates a record silently. If both locations hold the file, the record is flagged invalid and writes are refused.\n\n8. **A configured folder change moves the whole folder during `config set` (REQ-01.002).** `backlog_directory`, `decision_directory`, `doc_directory`, and a document type's `directory` are handled by one shared relocation routine:\n   - it runs inside the `config set` command, never lazily and never on a later read;\n   - it moves every file and subfolder of the source folder, not only managed records;\n   - it pre-checks the whole plan (destination entry conflicts, containment, permissions) before moving anything;\n   - on any failure it moves nothing (or rolls back what it already moved), persists no configuration value, and reports the conflict outcome of REQ-01.004;\n   - after success the source folder is removed when empty.\n   The browser configuration view (REQ-06.008) must call this same `config set` path; it may not move folders itself.\n\n9. **Configuration is the only source of paths and statuses.** `papyrus.config.yml` is authoritative for prefixes, padding, roots, directories and the status vocabulary. The Backlog.md `backlog/config.yml` is no longer read (dropping ADR-0008 decision 7): statuses come only from Papyrus configuration, and a record whose status is not in the configured list is preserved verbatim and reported, never silently normalized.\n\n10. **The import writes native records only.** Imported tasks and milestones are created with `\u003cID\u003e.md` under the configured directories, with a Papyrus ID and Papyrus front matter; the import contract is ADR-0011. After import, the source Backlog.md store is not read again and no compatibility is guaranteed (NFR-04.004).\n\n11. **Switchover rule for a project whose store is still in the Backlog.md layout (confirmed by the user on 2026-11-11).** Because decision 4 stops recognizing Backlog stems, such records become invisible the moment this layout ships. A project in that state (including this repository, whose backlog is `backlog/tasks/task-N - …`) must run the one-way import before using the new version. The release that introduces this layout **must** ship the import command in the same release (ADR-0013 stage constraint) and **must** document a one-time import in its upgrade notes, naming the affected directories (`backlog/tasks`, `backlog/milestones`, `backlog/archive/tasks`, `backlog/archive/milestones`) and the resulting renumbering. No transitional read compatibility, environment flag, or dual-recognition mode is introduced: a temporary reader for a layout the product has renounced would be exactly the compatibility layer NFR-04.004 removes."},{"heading":"Confirmed decisions (user validation 2026-11-11)","content":"- Milestone renumbering (`m-N` → `MS-001`-style Papyrus IDs, imported milestones remapped by allocation) is accepted (decision 5).\n- Switchover: the release that introduces this layout also ships the import and documents the one-time import in its upgrade notes (decision 11).\n- The native layout, the single ID space, and the configuration-driven path convention are accepted as recorded."},{"heading":"Consequences","content":"**Positive:**\n\n- The identity story collapses to one value and one rule; no affine mapping, offsets, storage prefixes, or normalization layer remains to be tested, documented, and explained.\n- A record is addressable from its file name, and its file name is stable for its whole life, so browser URLs, version tokens, and links do not break on edits, configuration changes, or archiving.\n- Paths become fully configuration-driven and testable through one relocation routine, which is also what REQ-01.002 needs.\n- Removing Backlog.md layout recognition means an unimported store cannot be half-read; the import is the single, explicit bridge.\n- The existing document corpus (`\u003cID\u003e.md`, decisions `\u003cID\u003e-\u003cslug\u003e.md`) already matches the decision, so document records need no renaming.\n\n**Negative:**\n\n- This is a breaking on-disk change for a project whose backlog is in the Backlog.md layout: tasks and milestones must be imported once, and their Papyrus IDs are newly allocated, so displayed numbers differ from the Backlog numbers.\n- Milestone numbering changes from `m-0`-based to `MS-001`-based, and imported milestones are remapped rather than preserved (`m-0` becomes an `MS-` ID allocated in the Papyrus space). This is a confirmed, accepted consequence (2026-11-11): a project used to `MS-001` = `m-0` will see different milestone numbers after import.\n- Existing specs, tests and documentation that describe storage IDs, offsets, slugs-as-identity, or `backlog/config.yml` precedence become wrong and must be revised.\n- A record that is deleted loses its number only until it is reused; users who expect monotonic, never-reused IDs may be surprised. (Stated, accepted: existing records are never renumbered.)\n\n**Risks and mitigations:**\n\n- *Legacy files that are neither native nor importable*: they are read through the tolerant stem rules when their stem matches the Papyrus prefix; a Backlog-shaped file is intentionally invisible and must be imported. A diagnostic for \"a file exists in a claimed directory but does not resolve\" is available to the import dry run, not to normal listing.\n- *Both archive locations holding the same record*: detected as a duplicate, flagged invalid, writes refused, neither copy deleted (same rule as ADR-0008 decision 9, retained).\n- *Rename hazards*: no rename path exists outside archive/restore, deprecate/restore, and the two location moves; any future rename needs a new decision because it invalidates version tokens and browser URLs.\n- *Folder moves crossing filesystems*: pre-flight check plus rollback; a cross-device move falls back to the atomic copy-then-remove sequence and is reported as a non-atomic operation in the command output if a single rename is impossible.\n- *Case-insensitive filesystems*: prefix matching is case-insensitive but the writer always emits the configured casing, so two files differing only in prefix case cannot be produced by Papyrus; a pre-existing pair is a duplicate conflict.\n- *Configuration pointing outside the project*: rejected by validation at load time, not only at access time (NFR-04.002).\n- *Orphaned old directories*: the model does not delete empty directories except after a successful relocation; leftover legacy archive folders remain readable and are not migrated.\n- *This repository's own store disappearing on upgrade*: the switchover rule (decision 11) requires importing `backlog/tasks` and `backlog/milestones` once, in the same release that ships this layout, with upgrade notes naming it; a test project fixture exercises the import before the old names are removed from the tree."},{"heading":"Downstream constraints","content":"Implementation and specification tasks that touch record storage MUST follow:\n\n1. `record::identity` exposes Papyrus ID parse/format/allocation only. Remove storage prefixes, offsets, `to_storage_id`, `to_display_id`, and every translation call site (`src/record/identity.rs`, `src/task.rs`, `src/milestone.rs`, `src/browser/*`, migration code).\n2. Record descriptors reference configuration keys for directories; no module hardcodes `backlog/tasks`, `backlog/milestones`, `docs/decisions`, or `archive/tasks`.\n3. Writers emit `\u003cID\u003e.md` (decisions `\u003cID\u003e-\u003cslug\u003e.md`) and never rename an existing file. No code path may construct a Backlog.md stem.\n4. Number allocation scans every location of a family, applies no offset, and starts milestones at 1; removal of the `m-0` base changes `next_task_number`/milestone allocation tests.\n5. Reading `backlog/config.yml` is deleted together with its precedence rules and test fixtures.\n6. Archive/restore/deprecate/restore are moves of an unchanged file name; tests assert the ID and file name are identical after the round trip.\n7. `config set` folder relocation is implemented once, used by CLI and browser, with the pre-flight/rollback semantics of decision 8 and tests for conflict, partial failure, and cross-device fallback.\n8. Every path is checked with `Context::ensure_within`; configuration validation rejects absolute or traversal paths.\n9. Specifications that describe the Backlog.md layout, storage IDs, the `m-0` offset, or slug-based identity must be rewritten; `docs/specifications/migrate-tasks-and-milestones-to-the-backlog-md-layout.md`, `docs/specifications/translate-papyrus-and-backlog-md-ids-at-the-storage-boundary.md`, and `docs/specifications/verify-backlog-md-round-trip-interoperability.md` are directly superseded in intent."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Native `\u003cID\u003e.md` layout, configuration-driven roots, no translation (this ADR) | Selected | Only layout consistent with one ID space (REQ-01.005) and no Backlog.md compatibility (NFR-04.004); simplest identity and strongest stability. |\n| Keep ADR-0008's Backlog.md layout without the ID translation (store Papyrus IDs in Backlog-shaped stems) | Rejected | A Backlog-shaped stem cannot carry `TASK-001` without an offset/lowercase mapping, so it either reintroduces a second form or breaks Backlog.md for no benefit now that compatibility is renounced. |\n| Keep the Backlog.md layout and IDs as-is, importing nothing | Rejected | Contradicts REQ-01.005 and NFR-04.004; `task-18` would remain the identity and no Papyrus ID would exist. |\n| `\u003cID\u003e - \u003cslug\u003e.md` for every record | Rejected | Slugs go stale on title edits, invite renames, and add a second naming surface with no benefit; the slug is not identity. |\n| Nested per-type directories under a single `backlog/` root, e.g. `backlog/tasks/archive/` | Rejected | Either convention works; keeping a top-level `archive/\u003cfamily\u003e/` preserves the existing archive layout and avoids nesting moves inside the active scan directory. |\n| Keep `decision_directory` out of the layout and hardcode ADR paths | Rejected | Paths must come from configuration; the ADR skill's `docs/architecture/adr/` requirement is met by the configured value. |\n| Move the whole project to a flat store (`records/`) | Rejected | Loses the per-family, per-type directories that the browser, search, and configuration already use. |"},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-04.004.md` — renounce Backlog.md compatibility; native layout is an explicit open question.\n- `docs/requirements/non-functional/NFR-04.002.md` — project-directory boundary.\n- `docs/requirements/non-functional/NFR-04.001.md` — text-file persistence.\n- `docs/requirements/business/REQ-01.005.md` — single Papyrus ID space.\n- `docs/requirements/business/REQ-01.002.md` — configuration folder change moves the whole folder atomically.\n- `docs/requirements/business/REQ-01.007.md` — `id_padding` 1–6, padding is a minimum.\n- `docs/requirements/business/REQ-05.010.md`, `REQ-05.011.md` — front matter and lazy adoption.\n- `docs/requirements/business/REQ-06.008.md` — browser configuration view delegates to `config set`.\n- `docs/architecture/adr/ADR-0008-adopt-backlog-md-on-disk-layout-for-tasks-and-milestones.md` — superseded by this ADR.\n- `docs/architecture/adr/ADR-0011-one-way-backlog-md-import.md` — the only bridge from a Backlog.md store.\n- `docs/architecture/adr/ADR-0012-papyrus-owned-front-matter-metadata.md` — metadata representation.\n- `docs/architecture/adr/ADR-0013-shared-record-envelope-without-a-storage-layer.md` — code structure and write path.\n- `docs/architecture/adr/ADR-0006-optimistic-concurrency-and-atomic-record-writes.md` — atomic write sequence reused by moves.\n- Implementation: `src/record/identity.rs`, `src/record/descriptor.rs`, `src/record/store.rs`, `src/task.rs`, `src/milestone.rs`, `src/config.rs`, `src/context.rs`."}]},{"id":"ADR-0011","title":"One-Way Backlog.md Import as the Only Bridge","status":"Accepted — approved by explicit user confirmation on 2026-11-11","sections":[{"heading":"Date","content":"2026-11-11 (status: Accepted, 2026-11-11)"},{"heading":"Context","content":"NFR-04.004 requires Papyrus to stop maintaining file-level interoperability with Backlog.md and, instead, to offer a one-way script that imports Backlog.md backlog records. Scope is fixed by the requirement: tasks and milestones are imported; Backlog.md `docs`, `drafts` and `decisions` are out of scope. Imported records receive Papyrus IDs (REQ-01.005) and are written in the Papyrus record format with the front matter of REQ-05.010. REQ-05.011 confirms that no read or write path may adopt a Backlog.md storage ID or re-shape a record into the Backlog.md layout, so the import is the only entry point for such data.\n\nNFR-04.004 records two open questions that this ADR must answer: **collision handling when an existing Papyrus record has the same number or title**, and implicitly the contractual behaviour of the import itself (what it reads, what it writes, how it reports). ADR-0010 fixes the destination: native `\u003cID\u003e.md` records with a single Papyrus ID space, `\u003cbacklog_directory\u003e/archive/\u003cfamily\u003e/` for archived records, and no recognition of Backlog storage stems. ADR-0013 fixes that every write goes through the shared record writer.\n\nForces: one-way and explicit (no sync, no watcher, no bidirectional expectation); no second ID space and no persisted ID mapping; never destructive on either side; deterministic, reviewable allocation; partial metadata (Backlog has no release, no Papyrus `release` key on milestones); status vocabularies differ (`To Do` versus `ToDo`); a single write path with atomic writes; and NFR-04.002 containment for both the source read and the destination write."},{"heading":"Decision","content":"1. **Delivery shape (confirmed by the user on 2026-11-11).** The import is the dedicated CLI command `papyrus import backlog`, implemented inside the single crate (ADR-0004, ADR-0005) and using the shared record reader, descriptor, and writer (ADR-0013). No second parser and no second writer may exist for Backlog.md files. An optional convenience shell entry point (for example `scripts/import-backlog.sh`) MAY be provided, but it must only forward arguments to the CLI command and contain no import logic. This satisfies NFR-04.004's \"one-way script\" without creating an independent writer.\n\n2. **Invocation and inputs.**\n\n   ```\n   papyrus import backlog --from \u003csource-project-dir\u003e [--source-backlog-dir \u003cdir\u003e]\n                          [--dry-run] [--allow-existing] [--report \u003cpath\u003e]\n   ```\n\n   - The target project is selected per REQ-01.003 (`--dir`, `PAPYRUS_DIR`, cwd) and must have a `papyrus.config.yml`; otherwise the command fails as a runtime error (REQ-01.003, REQ-01.004).\n   - `--from` names the Backlog.md project root; `--source-backlog-dir` defaults to `\u003cfrom\u003e/backlog` for projects that do not use the default folder name.\n   - `--dry-run` performs phase 1 and phase 2 fully and prints the plan and report without writing anything.\n   - `--allow-existing` is required when the target already holds any record of a family being imported; without it the command refuses before writing (see decision 7).\n   - `--report \u003cpath\u003e` writes the same report to a path inside the project directory only; a path outside is a validation error (NFR-04.002). The report is diagnostic output, never a machine-readable store that later commands consult.\n   - Exit codes follow REQ-01.004: `0` when every in-scope source record was imported (or planned, for a dry run); `1` runtime/validation failure; import with skipped records exits non-zero and the summary lists them.\n\n3. **Source scope.**\n\n   | Source | Treatment |\n   |---|---|\n   | `backlog/tasks/*.md` | Imported as tasks |\n   | `backlog/archive/tasks/*.md` | Imported as archived tasks |\n   | `backlog/milestones/*.md` | Imported as milestones |\n   | `backlog/archive/milestones/*.md` | Imported as archived milestones |\n   | `backlog/docs/**`, `backlog/drafts/**`, `backlog/archive/drafts/**`, `backlog/decisions/**` | Not read as records; counted and reported as excluded by NFR-04.004 |\n   | `backlog/config.yml`, `backlog/.locks/**` | Source metadata only; never written; the source status vocabulary and prefixes may be read to interpret the source |\n\n   Only `.md` files whose stem matches the source family's storage form (`\u003cprefix\u003e-\u003cnumber\u003e`, optionally followed by ` - \u003cslug\u003e`) are candidates. Anything else in a source directory is reported as skipped. Files outside the source backlog directory and outside `backlog/archive/` are never read.\n\n4. **ID assignment: fresh Papyrus numbers, allocated before any write.**\n\n   - Phase 1 (plan) enumerates every in-scope source record, sorts per family by source number ascending (from the stem, cross-checked against the source front-matter `id`), and allocates consecutive target numbers per family starting from `max(existing target number in active, archived and deprecated locations) + 1`, minimum 1 (ADR-0010 decision 5). Milestones are allocated in the Papyrus milestone space starting at 1; the source `m-0` base carries no offset.\n   - Ties, duplicate source numbers and unparseable source numbers are ordered by source path and reported as source anomalies.\n   - Phase 2 resolves every reference against the completed plan, and validates statuses, timestamps and destinations.\n   - Phase 3 writes. The plan is computed once, so a failed write can never shift a later number.\n   - The plan is printed by both a dry run and a real import. It is the only record of the source→Papyrus mapping: **no mapping file, sidecar, marker key, or extra front-matter field is written**, because that would be the parallel ID space NFR-04.004 and REQ-01.005 forbid. The source ID is not persisted in the imported record.\n\n5. **Field mapping and content preservation.**\n\n   | Target front-matter key | Source | Rule |\n   |---|---|---|\n   | `id` | source `id` / stem | Replaced by the allocated Papyrus ID; the source ID is not kept |\n   | `title` | `title` | Copied verbatim; required — a record without it is skipped and reported |\n   | `status` | `status` | Compared to the target's configured statuses after normalization (case-insensitive, spaces/hyphens/underscores removed). A match adopts the configured spelling; no match preserves the source value verbatim and raises a warning (never silently coerced) |\n   | `assignee` | `assignee` | Copied as a YAML list |\n   | `created_date`, `updated_date` | same keys | Copied verbatim when a valid quoted ISO-8601 UTC value; otherwise set from the import clock and reported as approximate |\n   | `labels` | `labels` | Copied |\n   | `milestone` | `milestone` (source milestone ID) | Translated through the plan to the imported milestone ID; dropped with a warning when the source milestone is not in the import set |\n   | `dependencies` | `dependencies` (source task IDs) | Each entry translated through the plan; entries that resolve to no imported or existing target record are dropped with a warning. No source ID may survive |\n   | `references` | `references` | Copied verbatim (they name documents, not backlog records) |\n   | `documentation` | `documentation` | Copied verbatim |\n   | `type` | `type` | Copied for tasks (`task`) |\n   | `ordinal` | `ordinal` | Copied when a non-negative integer; otherwise allocated from the target maximum |\n   | other source keys | any remaining key (`priority`, …) | Preserved verbatim, so no metadata is lost and no source key-set validation exists |\n   | `release` (milestones) | none | Not written. Backlog.md has no release and Papyrus does not infer one from milestone names |\n\n   Timestamps are normalized to the quoted ISO-8601 UTC form of REQ-05.010; a source value in another format is replaced by the import time and reported.\n\n6. **Body mapping.** Backlog.md marker sections are converted to the record's native section layout, preserving content:\n\n   | Source marker | Target section |\n   |---|---|\n   | `SECTION:DESCRIPTION` | `## Description` |\n   | `AC` (numbered `- [ ] #N …` items) | `## Acceptance Criteria` — the `#N` ordinal is dropped, checkbox state and item text are preserved verbatim and order is unchanged |\n   | `DOD` | `## Definition of Done` |\n   | `SECTION:PLAN` | `## Implementation Notes` |\n   | `SECTION:NOTES` | `## Notes` |\n   | `COMMENTS` | `## Comments` |\n\n   Marker comment lines are removed. Unknown sections, free text, and any content outside a recognized marker block are appended verbatim in file order, so nothing is discarded. Milestone bodies keep a single `## Description` with the source text verbatim. Tasks acquire no `# \u003cID\u003e \u003ctitle\u003e` heading (REQ-05.010). Archived source records are written to the archived destination directory.\n\n7. **Collision and duplicate handling.**\n\n   | Situation | Outcome |\n   |---|---|\n   | Target already holds a record with the same number | Cannot occur through allocation; if the computed destination path exists at write time, that record fails with a conflict, nothing is overwritten, and the import aborts |\n   | Target already holds a record with the same title | Not a collision: the record is imported as a new record and the report flags \"possible duplicate: `\u003cnew ID\u003e` and `\u003cexisting ID\u003e` share the title\". No merge, no skip, no renumber |\n   | Target store already holds records of an imported family and `--allow-existing` is absent | Refused before writing, with a message telling the user to use `--allow-existing` if the duplication is intended |\n   | Two source files share a source number | Both are imported as distinct records; the report flags the source anomaly |\n   | Source record is unparseable (no title, malformed block) | Skipped, reported, exit non-zero; other records still import |\n   | Destination write fails mid-import | The import aborts and reports exactly which records were written; already-written records are kept (no rollback), and the user resolves the cause and continues in a fresh target or with `--allow-existing` |\n\n   The import never overwrites, deletes, renumbers, or merges an existing Papyrus record.\n\n8. **One-way and non-idempotent by design.** The import is a one-time bridge per source store. A second run against the same source allocates new numbers and therefore duplicates records; this is documented, and `--dry-run` plus the same-title report are the review mechanisms. No marker, lock file, import registry, or source-state database is created. Nothing in the import is bidirectional: the source is opened read-only, and Papyrus never regenerates Backlog.md files afterwards (NFR-04.004).\n\n9. **Shipment coupling with the native layout (confirmed by the user on 2026-11-11).** The import command ships in the same release as ADR-0010's native layout, and that release's upgrade notes document the one-time import: the affected source directories, the command to run, that IDs and milestone numbers are reallocated (ADR-0010 decision 5), that the source store must be kept until the import is verified, and that after import Papyrus owns the records. The import may be delivered earlier, but it may not be delivered later than the layout switch, because the layout switch hides records that have not been imported (ADR-0010 decision 11, ADR-0013 stage constraint).\n\n10. **Security and containment.** Source paths are resolved and checked for existence and readability; destination paths go through `Context::ensure_within` before any write (NFR-04.002). Symlinked records whose real path escapes either root are refused. No source content is echoed into logs beyond the reported titles and paths.\n\n11. **Explicitly out of scope.** Importing `docs`, `drafts`, or `decisions`; importing Backlog.md configuration as Papyrus configuration; release records (none exist upstream); issue/custom fields beyond front-matter copying; re-import reconciliation; continuous or scheduled sync; any reverse export."},{"heading":"Confirmed decisions (user validation 2026-11-11)","content":"- Delivery shape: the dedicated `papyrus import backlog` subcommand is accepted; a wrapper script is optional and logic-free (decision 1).\n- Milestone renumbering: imported milestones are remapped into the Papyrus milestone space (`m-N` → `MS-001`-style IDs) and source numbers are not preserved (ADR-0010 decision 5).\n- Switchover: the import ships in the same release as the native layout and that release documents a one-time import in its upgrade notes (decision 9).\n- Remaining scope decisions of NFR-04.004 stand unchanged: tasks and milestones only, `docs`/`drafts`/`decisions` excluded, single Papyrus ID space, no persisted mapping."},{"heading":"Consequences","content":"**Positive:**\n\n- Projects holding a Backlog.md store have one documented, reviewable path into Papyrus, satisfying NFR-04.004 without keeping a compatibility layer.\n- Fresh, planned allocation makes numeric collisions impossible and keeps existing Papyrus records untouched, which removes the hardest failure mode of an import.\n- Content fidelity (front matter, sections, unknown keys, unknown sections) is defined and testable against a real corpus.\n- Only the shared writer is used, so imported records are normal records for every later command, view, and search.\n\n**Negative:**\n\n- Imported IDs do not match the numbers users saw in Backlog.md (for example `task-18` may become `TASK-042`), and the mapping exists only in the printed report.\n- Re-running the import duplicates records, and detecting that after the fact relies on the title report.\n- Status values that do not match the target vocabulary survive verbatim, which can leave a project with two spellings until the user normalizes them.\n- Dependencies and milestone references that cannot be resolved are dropped (with warnings), so the imported graph can be incomplete.\n- A mid-import failure leaves a partial import with no rollback.\n- Release coupling is mandatory: the native layout cannot ship before the import, so the two changes are delivered and verified together in one release.\n\n**Risks and mitigations:**\n\n- *Silently duplicated work*: same-title report plus the `--allow-existing` gate, and the one-way, one-time framing in the command documentation.\n- *Lost identity for users who relied on Backlog numbers*: the plan report is printed for every run and can be saved with `--report`; no command ever accepts the old number, so there is no half-supported identifier.\n- *Reference translation bugs*: translation happens after the whole plan exists, is pure, and is covered by tests where dependencies and milestones resolve, are missing, or point outside the import set.\n- *Body conversion losing content*: unknown sections and free text are appended verbatim; the report records per-record warnings; a byte-level comparison of the source text against the imported body is a test fixture for each marker family.\n- *Import into a wrong directory*: target must be an initialized project and every destination path is contained; the source is read-only and is never modified.\n- *Large stores*: the plan holds one entry per in-scope record; phases 1–2 are read-only, so a dry run costs no writes."},{"heading":"Downstream constraints","content":"Implementation and specification tasks for the import MUST follow:\n\n1. The import is a CLI subcommand in the single crate; any wrapper script contains no logic; no new dependency (ADR-0005).\n2. Reading a Backlog.md file must reuse the shared front-matter/document parser and writing must reuse `record::store::write_atomic`; a Backlog-specific parser or serializer is prohibited.\n3. The plan phase must allocate all IDs before any write, must not consult or create a mapping store, and must run unchanged under `--dry-run`.\n4. IDs come from `record::identity` allocation with no offset; milestones start at 1.\n5. No source storage ID may appear in a written record, in front matter, in a filename, or as an accepted later input.\n6. Status mapping is normalization-plus-report; unknown statuses are preserved, never coerced.\n7. `docs`, `drafts` and `decisions` are never read as records; the report states they were excluded.\n8. Tests must cover: active and archived tasks/milestones; dependency and milestone translation; missing/dangling references; status mismatch; duplicate source numbers; same-title target record; existing-target refusal; `--dry-run` producing no writes; and a source directory left byte-identical after import.\n9. Command help and the man page gain the command, its options, the one-way/non-idempotent caveat, and the excluded-scope statement; the specification is owned by `business-analyst`/`tech-writer`."},{"heading":"Alternatives Considered","content":"| Option | Outcome | Reason |\n|---|---|---|\n| Planned fresh Papyrus IDs, no persisted mapping, shared writer (this ADR) | Selected | Single ID space, no collisions, no second store, and imported records become ordinary records. |\n| Preserve source numbers as Papyrus numbers (offset only by prefix/padding) | Rejected | A number reused from a Backlog store can collide with an existing Papyrus record, and it implies adopting the source ID as identity, which REQ-01.005 forbids. |\n| Persist a source→Papyrus mapping file or front-matter key | Rejected | It is a parallel ID space and a second store that can drift; NFR-04.004 and REQ-01.005 exclude it. |\n| Skip records whose title already exists in the target | Rejected | Silently discarding a source record loses data; the requirement asks for collision handling, not deletion. Merge or overwrite would be worse. |\n| Standalone external script with its own parser/writer | Rejected | A second writer with untested preservation behaviour, outside the no-drift rule (ADR-0013). |\n| Import `docs`/`drafts`/`decisions` as generic documents | Rejected | NFR-04.004 excludes them; mapping them would invent record types and metadata. |\n| Bidirectional sync or re-import reconciliation | Rejected | NFR-04.004 makes the import explicit and one-way; compatibility is renounced. |"},{"heading":"References","content":"- `docs/requirements/non-functional/NFR-04.004.md` — renounce compatibility, provide a one-way import; open questions answered here.\n- `docs/requirements/business/REQ-01.005.md` — single Papyrus ID space; imported records receive Papyrus IDs.\n- `docs/requirements/business/REQ-05.010.md` — front-matter fields and record format for imported records.\n- `docs/requirements/business/REQ-05.011.md` — no path adopts a Backlog storage ID or re-lays out a record.\n- `docs/requirements/business/REQ-01.002.md`, `REQ-01.003.md`, `REQ-01.004.md` — configuration selection, runtime errors, conflict outcomes.\n- `docs/requirements/non-functional/NFR-04.002.md` — project-directory containment.\n- `docs/architecture/adr/ADR-0010-papyrus-native-on-disk-record-layout.md` — destination layout, ID allocation, no Backlog stems.\n- `docs/architecture/adr/ADR-0012-papyrus-owned-front-matter-metadata.md` — target record format.\n- `docs/architecture/adr/ADR-0013-shared-record-envelope-without-a-storage-layer.md` — one writer, no second serializer.\n- Source evidence: `backlog/config.yml`, `backlog/tasks/task-18 - … .md`, `backlog/milestones/m-0 - … .md`, `backlog/archive/`, `backlog/docs/doc-1 - … .md`."}]},{"id":"ADR-0012","title":"Papyrus-Owned Front Matter as the Single Record Metadata Source","status":"Superseded by ADR-0023 on 2026-11-13 — ADR-0023 restates the front-matter field map with `status` for milestone, release, and front-matter document types and the document `status` exemption from the create/update-option rule, which this ADR's field map and option rule do not carry. Body frozen; the metadata, patch, adoption, serialization, heading, and scoping decisions are restated in ADR-0023.","sections":[{"heading":"Date","content":"2026-11-11 (status: Accepted, 2026-11-11; status: Superseded, 2026-11-13)"},{"heading":"Context","content":"REQ-05.010 requires every managed Markdown record to begin with a YAML front-matter block and fixes its field map; REQ-05.011 requires every command and every browser save to maintain it, and requires lazy per-record adoption of records that do not yet carry a block. REQ-01.005 now defines a single Papyrus ID space, and NFR-04.004 renounces Backlog.md compatibility. REQ-06.004 requires CLI and browser to read the same front-matter values.\n\nADR-0007 (Accepted) established front matter as the single metadata source and the patch-based writer, which remain correct. It also fixed three things that the new requirements remove: the task key set was declared to be \"the complete Backlog.md key set\", serialization had to stay Backlog-compatible for round trips, and the `id` and reference values of tasks and milestones were declared to be Backlog.md storage IDs. It also assumed NFR-04.003 interoperability and a legacy-to-Backlog body conversion. Those clauses contradict NFR-04.004 and REQ-01.005 and cannot be amended in place because an Accepted ADR body is frozen; this ADR supersedes ADR-0007 and restates the metadata contract without them.\n\nForces: one metadata source per field; lossless preservation of everything a command does not change; identical values in CLI and browser; a single ID space; no second parser or serializer; no new dependency (`yaml_serde` 0.10 is already used); frozen ADR bodies; and a corpus that still contains records without front matter, which must converge without a bulk rewrite."},{"heading":"Decision","content":"1. **A YAML front-matter block is mandatory for every Markdown record created or adopted by Papyrus.** The block starts at byte 0, opens with a line containing exactly `---`, and closes with a line containing exactly `---` followed by a blank line before the body. Nothing precedes it. Records created by Papyrus always carry it; existing records gain it on first read or first write (decision 9), so a record never read or written may still lack it, and the corpus converges record by record.\n\n2. **Field map.** Every record type carries the general keys in this canonical order:\n\n   `id`, `title`, `created_date`, `updated_date`, `labels`, `references`\n\n   Type-specific keys follow the general keys:\n\n   | Record type | Additional front-matter keys | Source |\n   |---|---|---|\n   | Task | `status`, `assignee` (YAML list), `milestone`, `dependencies`, `ordinal`, `documentation`, `type` | REQ-05.010 |\n   | Milestone | `release` | REQ-05.010, REQ-03.002 |\n   | Release | none (general keys only; REQ-03.002 defines no stored release state) | REQ-05.010 |\n   | Decision | `superseded_by` (optional) | REQ-05.010 |\n   | Audit record | `type` | REQ-05.010 |\n   | Business requirement, NFR, glossary, UI spec, technical spec, business rule, use case, test case, test report | none | REQ-05.010 |\n   | UI mockup | not applicable — HTML, excluded (decision 11) | REQ-05.008, REQ-05.010 |\n\n   Additional project keys are tolerated and preserved (`priority` on tasks is the observed example). There is **no Backlog.md key-set contract**: Papyrus neither requires Backlog.md's key set nor validates against it, and a key present in an existing file is preserved whether or not Papyrus understands it.\n\n3. **`id` and every reference value are Papyrus IDs.** This covers `id`, `milestone`, `dependencies`, `references` and `superseded_by` (REQ-01.005). No storage ID, no tool-specific form, and no translation at any boundary. The `id` value and the file name are consistent per ADR-0010; a disagreement is a validation error that refuses writes.\n\n4. **Front matter is authoritative and is the only metadata store.** Values are never mirrored into a `## ` section. These body sections are retired as metadata carriers: task `## Status`, `## Assignee`, `## Milestone`, `## Labels`, `## Dependencies`; milestone `## Release`; audit `## Audit Type`; requirement `## Group` is **not** affected (it is content, not front matter). New files never write the retired sections; a write to an existing file moves their values into front matter and removes the section, so no field is stored twice. Content sections are retained unchanged: `## Description`, `## User Story`, `## Group`, `## Acceptance Criteria`, `## Comments`, `## Implementation Notes`, `## Definition of Done`, `## Notes`, `## Definition`, `## Rationale`, `## Applicability`, `## Requirements`, `## View`, `## Content`, `## Decision`, `## Context`, `## Consequences`.\n\n5. **Heading policy.**\n\n   - Tasks and milestones: no `#` heading. Their bodies use the record's section layout.\n   - Every other Markdown record type: a `# \u003cID\u003e \u003ctitle\u003e` body title line is generated by the writer from the front-matter `id` and `title`, so the two cannot diverge; readers take both values from front matter. The heading is retained because accepted ADR bodies are frozen, and because existing readers, search excerpts, and documentation indexes rely on it.\n   - Frozen ADR bodies keep their existing heading and sections; the added front-matter block is the only change made to an existing decision file.\n\n6. **One shared front-matter implementation owns parsing and serialization** (`src/record/frontmatter`, layout in ADR-0013): detection and separation of the block, a parse result that keeps key order, raw scalar text and unknown keys, typed accessors backed by one key registry, and a patch operation that rewrites only changed keys while preserving unknown keys, key order and comments. No record module and no browser code may hand-format a `---` block, re-serialize an untouched block, or split front matter with ad-hoc string parsing.\n\n7. **Serialization is Papyrus-documented and Backlog-independent.** Quoting and key order are fixed by Papyrus and covered by its own golden tests; they are no longer required to match Backlog.md, and no round-trip against Backlog.md is a gate. Parsing and serialization use the existing `yaml_serde` dependency; full re-serialization that reorders or requotes foreign keys remains prohibited because it would defeat \"preserve what the operation does not change\".\n\n8. **Timestamps.** `created_date` and `updated_date` are quoted ISO-8601 UTC strings at second precision, `'YYYY-MM-DDTHH:MM:SSZ'`. `created_date` is written once at creation and never changed later; `updated_date` is refreshed by every write path (create, edit, archive, restore, deprecate, supersede, browser save). A save that changes nothing does not refresh it because no write happens. One clock value is read per write (ADR-0013). A small in-project UTC formatter is used; no new dependency.\n\n9. **Existing records are adopted lazily, per record, on first read and first write.** There is no bulk pass and no migration command; the corpus converges record by record. Adoption:\n   - **adds the block only** — it never re-renders, re-shapes, renames or relocates a record, and it never converts a task or milestone body;\n   - **may retire legacy metadata sections** on a write, after moving their values into front matter (decision 4), so no field is stored twice;\n   - **is idempotent** — a record that already carries front matter is a byte-identical no-op on both read and write;\n   - **is scoped to descriptor-claimed files** — task, milestone, release, decision, business requirement, non-functional requirement, glossary term, UI specification, technical specification, business rule, use case, test case, test report, audit record, deployment record. Prose Markdown that no descriptor claims (`docs/specifications/`, `docs/domain-model/`, `docs/business-processes/`, `README.md`, workflow docs) and UI mockups/HTML are excluded;\n   - **is metadata-only for frozen records** — an Accepted ADR gains the block and nothing else;\n   - **derives missing values best-effort** — `created_date` from the record's own `## Date` section where the type has one, otherwise from the file modification time; `updated_date` from the adoption time; both documented as approximate, never recomputed later;\n   - **must not partially write** — if the patch cannot be applied (read-only media, permissions), the reader reports the error and leaves the file byte-identical; two concurrent first readers serialize through the atomic write contract and the second becomes a no-op;\n   - **is reviewable** — a dry run and a per-file inventory (path, action, resulting keys) remain available as a reporting and verification aid, not as a prerequisite step;\n   - **no longer converts anything to the Backlog.md layout** — the legacy task/milestone body conversion of ADR-0007/ADR-0008 and the lazy Backlog-layout relocation are removed (NFR-04.004, REQ-05.011). A Backlog.md record enters Papyrus only through the one-way import (ADR-0011).\n\n10. **`id`, `created_date` and `updated_date` are exempt from the \"every field is a create/update option\" rule.** Every other front-matter key of a type is exposed as a create option and an update option. `ordinal` is an opaque non-negative integer with a create option, an update option, and a default derived from the current maximum. A key a command never changes must still be preserved, which is the patch contract in decision 6.\n\n11. **UI mockups are excluded from front matter.** REQ-05.008 fixes mo
