<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Requirements</title>
<style>
  :root { --bg:#f4f4f2; --panel:#fff; --border:#e2e2df; --ink:#1c1c1a; --muted:#6b6b66; --accent:#2f6f4f; --accent-soft:#e7f1ec; --badge:#eceff1; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:grid; place-items:center; padding:24px; }
  .app { width:min(1200px,100%); height:min(88vh,900px); background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.08); display:grid; grid-template-rows:auto 1fr; overflow:hidden; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:17px; margin:0; } header .sub { color:var(--muted); font-size:13px; } header .back { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; } header .back:hover { text-decoration:underline; }
  .panes { display:grid; grid-template-columns:330px 1fr; min-height:0; }
  .tree-pane { border-right:1px solid var(--border); overflow-y:auto; padding:12px; background:#fafaf9; }
  #filter { width:100%; padding:7px 10px; margin-bottom:10px; border:1px solid var(--border); border-radius:8px; font:inherit; font-size:13px; }
  .root-title { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 6px 6px; }
  .root-title:first-child { margin-top:2px; }
  .group-head { display:flex; align-items:center; gap:6px; width:100%; background:none; border:0; padding:6px; font:inherit; font-weight:600; font-size:13.5px; color:var(--ink); cursor:pointer; border-radius:6px; text-align:left; }
  .group-head:hover,.leaf:hover { background:#f0f0ee; }
  .caret { width:12px; color:var(--muted); flex:none; transition:transform .12s; }
  .group.collapsed .caret { transform:rotate(-90deg); } .group.collapsed .leaves { display:none; }
  .leaves { list-style:none; margin:0 0 4px; padding:0 0 0 14px; }
  .leaf { display:flex; align-items:baseline; gap:8px; width:100%; background:none; border:0; border-radius:6px; padding:5px 8px; font:inherit; font-size:13.5px; color:var(--ink); cursor:pointer; text-align:left; }
  .leaf.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .badge { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; background:var(--badge); color:var(--muted); border-radius:5px; padding:1px 6px; flex:none; }
  .leaf.active .badge { background:#d5e8de; color:var(--accent); }
  .detail-pane { overflow-y:auto; padding:26px 30px; }
  .detail .rid { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; color:var(--accent); }
  .detail h2 { margin:2px 0 10px; font-size:22px; }
  .tags { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tag { font-size:12px; border:1px solid var(--border); border-radius:999px; padding:2px 10px; color:var(--muted); background:#fafaf9; }
  .tag.must { border-color:#bcd8c9; background:var(--accent-soft); color:var(--accent); }
  .detail h3 { font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 0 6px; }
  .detail p { margin:0 0 8px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .detail .story { font-style:italic; color:#444; }
  .empty { color:var(--muted); } .hidden { display:none !important; }
  @media(max-width:720px) { body{padding:0}.app{height:100vh;border-radius:0}.panes{grid-template-columns:minmax(150px,40%) 1fr}.detail-pane{padding:18px} }
</style>

  <header><h1>Business Requirements</h1><span class="sub" id="counts"></span><a class="back" href="../../index.html">Back to documentation index</a></header>

<script id="data" type="application/json">{"groups":[{"id":"REQ-01","title":"Project Setup and CLI Access","userStory":"As a project maintainer, I want to initialize and configure Papyrus projects from its CLI so that I can manage project data in the intended project context.","description":"This group covers project initialization, configuration access, directory selection, record identification, and common command-line controls and outcomes described by the Papyrus man page.","children":[{"id":"REQ-01.001","title":"Initialize a Papyrus Project","criticality":"Must have","userStory":"As a project maintainer, I want to initialize Papyrus in a chosen directory so that the project has its backlog store, documentation structure, and configuration.","description":"The user can initialize a project in the current directory or select a project directory with `--dir`; if it does not exist it is created. Initialization records the supplied project name in configuration, creates the backlog store and documentation structure, and creates `papyrus.config.yml`. The generated configuration seeds the default document-type set (REQ-07.002). `--no-git` skips Git initialization.\n\nInitialization is allowed in a non-empty directory, and files other than `papyrus.config.yml` are never modified. An existing `papyrus.config.yml` blocks initialization unless `--force` is given, and `--force` overwrites that file completely with the generated configuration; it is a replacement, not a merge.\n\nAn interactive walkthrough (REQ-01.006) asks the user which artifact to activate for the project before generating the corresponding `papyrus.config.yml`. Defaults are provided for non-interactive/CI environments.","criteria":"Running `papyrus init \u003cname\u003e` initializes the current directory and stores `\u003cname\u003e` as the project name.\nRunning `papyrus --dir \u003cpath\u003e init \u003cname\u003e` initializes `\u003cpath\u003e`, creating it if absent.\nInitialization succeeds in a non-empty target directory without `--force`; every pre-existing file other than `papyrus.config.yml` remains unmodified.\nIf `papyrus.config.yml` already exists and `--force` is absent, initialization fails with a conflict outcome (REQ-01.004) and writes nothing.\nIf `papyrus.config.yml` already exists and `--force` is present, initialization overwrites that file in full with the generated configuration; no value from the previous file is kept.\n`--no-git` suppresses Git repository initialization.\nInitialization writes the default document-type set into `papyrus.config.yml`; the set can be edited afterwards to add, rename, disable, or remove document types (REQ-07.002).\nAn interactive walkthrough presents all available artifacts, lets the user choose which to activate, and prompts for the prefix and folder of each before generating `papyrus.config.yml` (REQ-01.006).\nNon-interactive/CI environments (no TTY) work with default selections or explicit flags."},{"id":"REQ-01.002","title":"Read and Edit Project Configuration","criticality":"Must have","userStory":"As a project maintainer, I want to inspect and change configuration values so that Papyrus uses settings appropriate to my project.","description":"The user can list effective configuration keys and defaults, get one effective value, persist a value, and unset a key to fall back to its default. Keys support dotted notation.\n\nValues supplied to `set` follow the key's shape. A scalar key keeps the current behavior: the supplied value is parsed as a YAML scalar. A list-valued key — the task status list `statuses` and each document type's `statuses` (REQ-07.002) — accepts a comma-separated list, for example `papyrus config set document_types.req.statuses active,archived`, and writes it as a YAML flow sequence. In this form a comma is always a separator and cannot be escaped, so a value that must contain a comma can only be set by editing `papyrus.config.yml` directly. An empty value for a list-valued key is rejected as invalid rather than written as an empty list. The configuration that would result from a write is validated before it is persisted; an invalid result is refused and nothing is written (fail-closed, as above).\n\nWhen an artifact's folder is changed with `papyrus config set` — a document type's `directory`, or `backlog_directory`, `decision_directory`, or `doc_directory` — the entire content of the original folder is moved to the new folder. The move covers every file and subfolder, not only Papyrus-managed records. It happens during the `set` command (not later, not lazily), it is a move rather than a copy, and it is atomic: if any entry cannot be moved, for example because an entry with the same relative path already exists at the destination, nothing is moved, both folders are left as they were, the configuration value is not persisted, and the command reports a conflict (REQ-01.004). After a successful move the original folder no longer holds the moved content.\n\nThe effective configuration is validated at load (REQ-07.002), including each document type's `statuses` and `default_status`. While the effective configuration is invalid, every command fails closed with a validation outcome (REQ-01.004) except the repair surfaces: `papyrus config get|set|unset|list` load the configuration tolerantly, validate the configuration that would result from the requested change, and refuse a write that would still be invalid; `papyrus init --force` replaces the file with the generated default configuration. A broken configuration is therefore always repairable through Papyrus.","criteria":"`papyrus config list` prints effective keys including defaults.\n`papyrus config get \u003ckey\u003e` prints that key's effective value.\n`papyrus config set \u003ckey\u003e \u003cvalue\u003e` persists a scalar key's value as a YAML scalar, unchanged from the current behavior.\nA comma inside a scalar value is part of that scalar and is not treated as a list separator.\nFor a list-valued key (`statuses` and `document_types.\u003cslug\u003e.statuses`), `papyrus config set \u003ckey\u003e \u003cvalue\u003e` accepts a comma-separated value such as `active,custom-status,archived` and writes it as a YAML flow sequence.\nA list value written with `config set` is read back by `config get` and `config list` as the same values in the same order.\nCommas in a list value are separators and have no escape form: `active\\,archived` is not read as an escaped comma, and the resulting value is rejected as invalid because a comma is not a permitted status character (REQ-07.002).\nAn empty value for a list-valued key is rejected with a validation outcome (REQ-01.004); neither an empty list nor any other value is written.\nA list value is validated as the configuration that would result before it is persisted: a value that violates the `statuses` rules of REQ-07.002, for example one that omits `active`, is refused with a validation outcome and nothing is written.\n`papyrus config unset \u003ckey\u003e` removes the configured key and uses its default.\nA nested key can be addressed with dotted notation, such as `document_types.req.enabled`.\nAdding a `document_types.\u003cslug\u003e` entry creates a new document type whose slug becomes its CLI command name (REQ-07.002).\nA configuration with an invalid document slug or a slug that collides with a built-in command name is rejected with a validation outcome (REQ-01.004, REQ-07.002).\n`document_types.\u003cslug\u003e.statuses` and `document_types.\u003cslug\u003e.default_status` are ordinary configuration keys: they are read by `config get` and written by `config set`, and their values are validated at load as described in REQ-07.002.\nWhile the effective configuration is invalid, every command fails closed with a validation outcome (REQ-01.004) except `config get`, `config set`, `config unset`, `config list`, and `init --force`.\n`config get|set|unset|list` load an otherwise invalid configuration, validate the configuration that would result from the requested change, and refuse to write a configuration that is still invalid.\n`init --force` can replace an invalid configuration file with the generated default configuration.\nWhen an artifact's folder is changed via `papyrus config set`, every file and subfolder of the original folder is moved to the new folder.\nThe move is performed as part of the `set` command, not lazily; afterwards the original folder no longer holds the moved content and is removed once empty.\nIf the move cannot complete (destination entry conflict or write failure), the command reports a conflict, persists no configuration change, and leaves both folders unchanged.\nThe configured task statuses must be unique, and the configured default task status must be one of them.\nWith default settings, new tasks start at `ToDo` and the ordered statuses are `ToDo`, `Initiated`, `Refined`, `Implemented`, `Validated`, and `Done`."},{"id":"REQ-01.003","title":"Select Project and Configuration Context","criticality":"Must have","userStory":"As a user managing project data, I want to select the project directory and configuration file so that commands operate using the intended project settings.","description":"Papyrus selects a project directory from `--dir`, `PAPYRUS_DIR`, or the current working directory, in that precedence order. Configuration selection uses `--config`, then `PAPYRUS_CONFIG`, then the project directory's `papyrus.config.yml`. If none of these yields an existing configuration file, every command except `papyrus init` fails: Papyrus does not fall back to built-in defaults and does not walk up directories or discover a configuration file elsewhere. Built-in defaults apply only to individual keys absent from a configuration file that was found. Command-line options take precedence over environment variables, project configuration, and defaults.","criteria":"With no project-directory override, commands use the current working directory.\n`PAPYRUS_DIR` selects the default project directory, and `--dir` overrides it.\nThe configuration file is selected from `--config`, then `PAPYRUS_CONFIG`, then the project directory's `papyrus.config.yml`.\nIf none of those paths exists, every command except `papyrus init` fails; no built-in-defaults fallback and no directory walk-up or discovery is performed.\nAn explicitly named `--config` or `PAPYRUS_CONFIG` path that does not exist counts as \"not found\" and fails the same way.\nThe failure is a runtime error with exit code 1 (REQ-01.004); the message names the configuration path that was looked for (the resolved `--config`/`PAPYRUS_CONFIG` path when one is given, otherwise `\u003cproject directory\u003e/papyrus.config.yml`) and states that `papyrus init` creates it.\n`papyrus init` runs without an existing configuration file.\nBuilt-in defaults apply only to individual keys absent from a configuration file that was found.\nA command-line option takes precedence over the corresponding environment, file, or built-in setting."},{"id":"REQ-01.004","title":"Use Common CLI Controls and Outcomes","criticality":"Must have","userStory":"As a Papyrus user or command-line integration, I want consistent common options and exit outcomes so that I can operate the tool and recognize command results.","description":"Papyrus provides global JSON, color, version, and help options. `--json` applies to commands that produce output, including errors. Color can also be disabled with `NO_COLOR`. The man page defines distinct exit statuses for success, runtime error, usage error, not-found, and validation/conflict outcomes. An invalid effective configuration is a validation outcome reported before any command work begins, except for the repair surfaces (REQ-01.002, REQ-07.002).","criteria":"`--version` prints the version and exits; `-h`/`--help` prints help, and command help is available as `papyrus \u003ccommand\u003e --help`.\n`--json` produces machine-readable JSON for output-producing commands, including error output.\n`--no-color` or setting `NO_COLOR` disables ANSI color output.\nSuccess, runtime error, usage error, record-not-found, and validation/conflict outcomes use exit codes 0, 1, 2, 3, and 4 respectively.\nAn invalid effective configuration produces a validation outcome (exit code 4) before command dispatch, except for `config get`, `config set`, `config unset`, `config list`, and `init --force` (REQ-01.002, REQ-07.002)."},{"id":"REQ-01.005","title":"Assign Stable Record IDs","criticality":"Must have","userStory":"As a project user, I want Papyrus to assign and preserve record identifiers so that records can be referred to consistently.","description":"Papyrus generates record IDs automatically. IDs remain stable across archive/restore cycles for tasks and milestones and across archiving for documents. Configurable prefixes and padding determine the generated ID format: task, milestone, and release IDs, and records of a document type that uses the generic content model, whose IDs use that type's `prefix` with the shared `id_padding` (REQ-07.004). Document types with type-specific content keep their documented ID forms, such as the hierarchical `REQ-XX.XXX` of business requirements (REQ-05.001). The man page gives `TASK-001`, `MS-001`, and `REL-001` as default examples.\n\nPapyrus keeps a single ID space. The Papyrus ID is the record identity everywhere: in the front-matter `id`, in the CLI and browser output, and as command input. Papyrus does not maintain a second, tool-specific storage ID and does not translate between ID spaces, because file-level interoperability with Backlog.md is renounced (NFR-04.004); the on-disk file-name convention is an architecture decision. Records brought into Papyrus by the one-way Backlog.md import script (NFR-04.004) receive Papyrus IDs on import, and no Backlog.md ID is accepted as command input.\n\nThe `id_padding` configuration is constrained to 1-6 characters (REQ-01.007). Values outside this range error out during configuration validation. Display padding is a minimum: when a record's number digit count exceeds `id_padding`, the ID uses the wider number (REQ-01.007, ADR-0008).","criteria":"Creating a supported record automatically assigns it an ID.\nArchiving a document, or archiving and restoring a task or milestone, does not change its ID; documents have no restore command (REQ-05.007).\nWith default configuration, task, milestone, and release IDs use the documented prefixes and three-digit examples (`TASK-001`, `MS-001`, `REL-001`); the configured prefix and padding control their format.\nA record of a document type that uses the generic content model is identified by its type's configured `prefix` and the configured `id_padding`, following the same padding rules (REQ-07.004).\nPapyrus uses a single ID space: the same Papyrus ID is written to the front-matter `id` and displayed by CLI and browser output, and it is the only accepted command input form for that record.\nNo Backlog.md storage ID (for example `task-18` or `m-0`) is treated as a Papyrus record identity or accepted as command input.\nRecords imported from a Backlog.md store receive Papyrus IDs; the import does not create or preserve a parallel Papyrus-visible ID space.\n`id_padding` must be between 1 and 6 inclusive; values outside this range are rejected with clear error messages (REQ-01.007).\nWhen a record's number digit count exceeds `id_padding`, the displayed ID uses the wider number; padding is a minimum, never truncated or errored (REQ-01.007)."},{"id":"REQ-01.006","title":"Interactive Init Walkthrough at `papyrus init \u003cproject_name\u003e`","criticality":"Should have","userStory":"As a user managing project data, I want the initialization process to ask which artifact to activate before generating the corresponding `papyrus.config.yml`, so that commands operate using the intended project settings.","description":"At `papyrus init \u003cproject_name\u003e` (and with `--dir`/`PAPYRUS_DIR`), an interactive walkthrough runs before writing `papyrus.config.yml`. It presents the available artifacts as a single cursor-driven list: exactly one selectable row is highlighted at a time, starting on the first selectable artifact, the up and down arrow keys (or `k` and `j`) move the highlight to the previous or next selectable artifact, the space key toggles the highlighted artifact on or off, and Enter confirms the list and continues the walkthrough. The list redraws after every keypress so that the highlight and each artifact's `[x]`/`[ ]` state are always visible; navigating past the first or last artifact keeps the highlight on that artifact. Typed token input, such as space-separated artifact names entered on one text line, is not an acceptable presentation. The core artifacts task, milestone, and release are always active, are shown as such, and are never highlighted or toggled, because the configuration has no `enabled` flag for them (BR-016); their prefixes are still prompted. For each activated artifact the walkthrough prompts for its ID prefix, and for each activated decision or document type its storage folder; the shared roots (`backlog_directory`, `decision_directory`, `doc_directory`) are prompted once. Prompts show their default in brackets, and invalid input re-prompts with a hint naming the default equivalent value. End of input on the list confirms the current state and continues, so the walkthrough never waits on closed input.\n\nSensible defaults are kept for non-interactive/CI environments: interactive mode runs only when standard input is a terminal (TTY); otherwise the walkthrough is skipped and defaults are written without prompting. Artifact activation toggles the corresponding `enabled` flags, prefixes, and directories in configuration (BR-016). This requirement replaces the earlier behavior of writing defaults without prompts.","criteria":"After running `papyrus init \u003cname\u003e`, the walkthrough presents all available artifacts as a single list with exactly one highlighted row as the cursor, starting on the first selectable artifact; the up and down arrow keys (or `k` and `j`) move the highlight, the space key toggles the highlighted artifact, and Enter confirms the list.\nToggling is immediate and visible: the list redraws after each keypress so that the highlight and the `[x]`/`[ ]` state of every artifact reflect the current selection.\nThe highlight never lands on task, milestone, or release, which are shown as always active, so space cannot toggle them and their prefixes are prompted without an activation decision; navigating past the first or last artifact keeps the highlight on that artifact.\nEnter confirms the current list state and the walkthrough continues with the prefix and folder prompts; the activation written to `papyrus.config.yml` equals the state shown when Enter was pressed.\nArtifact activation is never entered as typed tokens: the walkthrough does not prompt for artifact names on a text line, and end of input on the list confirms the current state and continues instead of waiting.\nFor each activated artifact, the walkthrough prompts for its ID prefix before writing `papyrus.config.yml`; each activated decision or document type also has its storage folder prompted, and each shared root is prompted once.\nDetails (prefix/folder) are prompted only for activated artifacts.\nOnly activated artifacts are enabled in the generated `papyrus.config.yml`; inactive types are written with `enabled: false` (BR-016).\nPrompts show the default in brackets and accept it with empty input.\nChoices are validated: an ID prefix must be non-empty, contain no control characters, and contain no path separators; a folder must be non-empty, relative, and free of traversal segments and backslashes.\nAn invalid prefix or folder is rejected and re-prompted with a hint naming the default equivalent value (for example `invalid prefix; use TASK`).\nThe offered artifact set is task, milestone, release, the decision types (`adr`, `bdr`), and the default document types (`req`, `nfr`, `glossary`, `rule`, `ui-spec`, `ui-mockup`, `audit`, `tech-spec`, `use-case`, `test-case`, `test-report`), with the defaults as default selections (REQ-07.002).\nThe walkthrough offers only the default set; a document type added after initialization is configured by editing `papyrus.config.yml` or with `papyrus config set`, not through the walkthrough.\nInteractive mode runs only when standard input is a terminal (TTY); otherwise the walkthrough is skipped and defaults are written without prompting (all artifacts activated, default prefixes/folders, `id_padding` 3), and no new CLI flag or environment variable is required.\n`--force` and `--no-git` continue to behave as documented (REQ-01.001).\nThe generated configuration validates successfully (including `id_padding` range, REQ-01.007)."},{"id":"REQ-01.007","title":"ID Padding Constraint for File IDs","criticality":"Should have","userStory":"As a project maintainer, I want to constrain the `id_padding` configuration to 1-6 characters so that file IDs (task-001, ms-001, rel-001, etc.) use consistent padding with a clear upper limit, improving readability and preventing invalid configurations.","description":"The `id_padding` configuration sets the numbering width after the prefix (for example `task-1` to `task-0001`). It currently accepts any positive integer with default 3. This requirement adds a constraint to limit `id_padding` to values between 1 and 6 inclusive. Values outside this range should error out during configuration validation or init. This affects task, milestone, and release ID formatting. Display padding is a minimum, not a truncation: when a storage number's digit count exceeds `id_padding`, the display ID uses the wider number and no error is raised (ADR-0008). There is no re-padding on disk and no migration of existing files.","criteria":"`id_padding` must be configured to a value between 1 and 6 inclusive.\nValues outside the 1-6 range error out with clear messages during configuration validation or init.\nThe default value remains 3 and is constrained to 1-6.\nWhen a storage number's digit count exceeds `id_padding`, the display ID uses the wider number; padding is a minimum, never truncated or errored.\nThe constraint applies to task, milestone, and release IDs as specified in REQ-01.005."}]},{"id":"REQ-02","title":"Task and Board Management","userStory":"As a project contributor, I want to record, organize, inspect, and track tasks so that project work is visible and can be managed through its lifecycle.","description":"This group covers the task record type of the backlog artifact category (REQ-07.001): task records and their relationships, filtering and monitoring task lists, and task lifecycle actions. Tasks are the only backlog type with configurable statuses (`statuses`, `default_status`); milestone and release lifecycles are fixed (REQ-03).","children":[{"id":"REQ-02.001","title":"Create and Describe Tasks","criticality":"Must have","userStory":"As a project contributor, I want to create tasks with planning details so that work and its completion expectations can be recorded.","description":"The user can create a task with a title and optional description, repeatable acceptance criteria, dependencies, labels, and an assignee, and can associate it with a milestone. A task may also reference zero or more business requirements, non-functional requirements, UI specifications, technical specifications, audit records, and business rules. Task IDs use the configured task prefix and padding; the default example is `TASK-001`. New tasks use the configured default status, which defaults to `ToDo`.","criteria":"`papyrus task create \u003ctitle\u003e` creates a task and returns/records its task ID.\nDescription, acceptance criteria, dependencies, milestone, labels, and assignee can be supplied with the documented options; repeatable options accept multiple values.\nThe assigned milestone and dependencies are represented on the created task.\nA task can reference zero or more of each documented requirement, specification, audit-record, and business-rule type.\nWith default settings, the task ID follows the `TASK-001` format and its status is `ToDo`."},{"id":"REQ-02.002","title":"View and Edit Tasks","criticality":"Must have","userStory":"As a project contributor, I want to inspect and update a task so that its current information and progress remain useful.","description":"The user can view a task using either `task view \u003cid\u003e` or `task \u003cid\u003e`, and update its title, description, status, milestone, assignee, or add acceptance criteria, comments, dependencies, and labels. Repeated add-options append to the existing set. Field flags update metadata without opening an editor; `--editor` opens the task body in the selected editor.","criteria":"`papyrus task view \u003cid\u003e` and `papyrus task \u003cid\u003e` display the same task.\nDocumented task edit options update the indicated task fields; repeatable options add entries.\n`--editor` opens the task body in `$VISUAL` or `$EDITOR`.\nField flags update metadata without launching an editor."},{"id":"REQ-02.003","title":"List and Filter Tasks","criticality":"Must have","userStory":"As a project contributor, I want to find tasks by their attributes and text so that I can focus on relevant work.","description":"The task list supports filtering by status, milestone, release, label, assignee, and text, limiting the number of results, and sorting by a selected field. A release filter includes tasks belonging to milestones assigned to that release. Watch mode keeps the list open and refreshes it on changes.","criteria":"Each documented task-list filter restricts results to matching tasks.\nA release filter includes tasks on milestones assigned to that release.\n`--limit` caps the number of results and `--sort \u003cfield\u003e` sorts by the requested field.\n`--watch` keeps the list open and refreshes it when changes occur."},{"id":"REQ-02.004","title":"Archive, Restore, and Delete Tasks","criticality":"Must have","userStory":"As a project maintainer, I want to archive, restore, or permanently delete tasks so that completed or unwanted records can be managed appropriately.","description":"Archiving moves a task off the board while preserving its ID and every dependency. Restore returns an archived task to the board with its previous status. Deletion permanently removes a task; an active task is archived first. `--force` skips the deletion confirmation prompt.","criteria":"Archiving a task removes it from the board and preserves its ID and dependencies.\nRestoring an archived task returns it to the board with its previous status and same ID.\nDeleting an archived task permanently deletes it; deleting an active task archives it first.\n`--force` skips the confirmation prompt when deleting."}]},{"id":"REQ-03","title":"Milestone and Release Planning","userStory":"As a project maintainer, I want to group work into milestones and releases so that planned delivery can be organized and reviewed.","description":"This group covers the milestone and release record types of the backlog artifact category (REQ-07.001): creating, viewing, listing, and editing them, the documented relationship between them, and their fixed lifecycles. Their lifecycles are not configurable; only task statuses are configurable in the backlog category.","children":[{"id":"REQ-03.001","title":"Manage Milestones","criticality":"Must have","userStory":"As a project maintainer, I want to create and maintain milestones so that related tasks can be organized around a delivery milestone.","description":"The user can create, list, view, edit, close, and delete milestones. A milestone has a title, optional description, and may be assigned to zero or one release. Milestone IDs use the configured prefix and padding (default example `MS-001`).\n\nThe milestone lifecycle is fixed by the backlog category (REQ-07.001): `open -\u003e closed`. A milestone starts `open`, is stored with its lifecycle state in the front-matter `status` field (REQ-05.010), and becomes `closed` through `papyrus milestone close \u003cid\u003e`. There is no configurable milestone status list and no milestone restore command. Deleting a milestone permanently removes it, with `--force` skipping confirmation.","criteria":"The documented milestone commands create, list, view, and edit milestones, including title, description, and optional release assignment.\nA milestone can be assigned to no more than one release.\nA milestone starts `open` and its lifecycle state is stored in the front-matter `status` field.\n`papyrus milestone close \u003cid\u003e` changes the milestone from `open` to `closed`.\nThe milestone lifecycle is fixed to `open -\u003e closed`; it is not configurable and has no restore command.\nDeleting a milestone permanently deletes it, with `--force` skipping confirmation.\nWith default settings, a generated milestone ID follows the `MS-001` format."},{"id":"REQ-03.002","title":"Manage Releases","criticality":"Must have","userStory":"As a project maintainer, I want to create and maintain releases so that milestones can be grouped for planned delivery.","description":"The user can create, list, view, edit, and close releases. A release has a title and may have a description. A release may contain multiple milestones, while each milestone may be assigned to zero or one release. Release IDs use the configured prefix and padding (default example `REL-001`).\n\nThe release lifecycle is fixed by the backlog category (REQ-07.001): `planned -\u003e released`. A release starts `planned`, is stored with its lifecycle state in the front-matter `status` field (REQ-05.010), and becomes `released` through `papyrus release close \u003cid\u003e`. `released` represents delivery completion and is distinct from archiving; releases are not archived. There is no configurable release status list, no `--status` edit option, and no release restore command.","criteria":"The documented release commands create, list, view, and edit release title and description.\nA release can be associated with multiple milestones, and each milestone is associated with at most one release.\nWith default settings, a generated release ID follows the `REL-001` format.\nA release starts `planned` and its lifecycle state is stored in the front-matter `status` field.\n`papyrus release close \u003cid\u003e` changes the release from `planned` to `released`.\nThe release lifecycle is documented as `planned -\u003e released`; `released` is delivery completion, distinct from archiving, and releases are not archived.\nThe lifecycle is not configurable, no `--status` option performs the transition, and no restore command exists."}]},{"id":"REQ-04","title":"Decision Records","userStory":"As a project decision-maker, I want to capture, find, and update decisions so that the rationale and status of project decisions can be reviewed later.","description":"This group covers the decision artifact category (REQ-07.001): decision records, their types and content, status changes, and supersession. Decision records follow the Nygard ADR template and a fixed status vocabulary; their statuses are not configurable. The decision status `deprecated` is a Nygard status and is not the document state `archived` (REQ-05.007).","children":[{"id":"REQ-04.001","title":"Create and Inspect Decisions","criticality":"Must have","userStory":"As a project decision-maker, I want to create and inspect decisions with context and consequences so that decisions are recorded for future reference.","description":"The user can create and list decisions, optionally filtering by type, and view a decision. A decision records a title, decision type, decision, context, and consequences. Built-in types are `adr` and `bdr`; additional types may be configured. Decisions may reference zero or more business and non-functional requirements. Records follow the Nygard ADR template and the fixed status vocabulary of the decision category (REQ-07.001): `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded`. `rejected` is the canonical term; `refused` is not a Papyrus status. A decision's status stays in the document core and its type is derived from the record ID prefix (REQ-05.010).","criteria":"A decision can be created with the documented title, type, decision, context, and consequences fields.\nThe default decision type is `adr`; `adr` and `bdr` are the built-in types.\nDecisions can be listed and viewed; listing can be filtered by type.\nDecision records expose the documented Nygard fields and exactly these status values: `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded`.\n`refused` is not accepted as a decision status.\nStatus transitions are proposed to accepted or rejected, and accepted to deprecated or superseded.\nA decision may reference zero or more business requirements and zero or more non-functional requirements.\nDecision status is not configurable."},{"id":"REQ-04.002","title":"Update and Supersede Decisions","criticality":"Must have","userStory":"As a project decision-maker, I want to update decision records and mark replaced decisions so that their current standing is clear.","description":"The user can edit a decision's title, decision text, status, context, and consequences. A decision may be superseded by at most one decision of the same type; the supersession option cannot be combined with status editing. Decision records have no archive command and no archive state: their lifecycle is expressed only by the five Nygard statuses (`proposed`, `accepted`, `rejected`, `deprecated`, `superseded`), and `papyrus decision archive` is not part of the command set. An earlier decision or an inactive decision is marked `superseded` or `deprecated` instead of being archived.","criteria":"The documented edit options update title, decision, status, context, and consequences.\nA decision can be marked as superseded by at most one decision of the same type.\n`--superseded-by` cannot be used together with `--status`.\n`papyrus decision archive` does not exist; decisions have no archive state.\nAn inactive or replaced decision is expressed as status `superseded` or `deprecated`, not as an archived record.\nDecision status values are exactly `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded`."}]},{"id":"REQ-05","title":"Project Documentation Management","userStory":"As a project contributor, I want to manage structured project documentation so that requirements, terms, specifications, rules, and audit records are available alongside backlog information.","description":"This group covers the document artifact category (REQ-07.001): the create, list, view, edit, status, archive, and delete capabilities of document records, including requirement grouping and type-specific content. Document types are declared under `document_types`, whose keys are the document slugs and CLI command names (REQ-07.002); the set includes the default types seeded at init and any type added by editing the configuration. Every document type has the main `active` or `archived` status, which alone governs storage location, plus optional custom statuses configured per type and held only in front matter (REQ-07.001); archiving has no restore command (REQ-05.007). The group also covers the YAML front-matter metadata carried by every managed Markdown record, excluding UI mockup HTML files, and its automatic maintenance by commands.","children":[{"id":"REQ-05.001","title":"Manage Business Requirements","criticality":"Must have","userStory":"As a project contributor, I want to create, find, and maintain business requirements in groups so that business needs can be documented and traced.","description":"The user can create a business-requirement group and create business requirements only within a required group. Groups contain business requirements only, and each requirement belongs to exactly one group. Requirements contain a title, user story, and description, and can be listed, viewed, and edited. They can be archived and deleted under the common document rules (REQ-05.007), and archiving preserves their ID.","criteria":"A group can be created with a title, optional user story, and optional description.\nA business requirement can be created only with its required business-requirement group.\nA requirement belongs to exactly one group, and a group contains business requirements only.\nRequirements can be listed, viewed, and edited for title, user story, and description.\nArchiving hides a requirement from lists, search, and the web UI, moves it to the type's `archived/` subfolder, and preserves its ID (REQ-05.007).\nDeleting a requirement permanently removes it under the document deletion rules (REQ-05.007)."},{"id":"REQ-05.002","title":"Manage Non-Functional Requirements","criticality":"Must have","userStory":"As a project contributor, I want to manage non-functional requirements in their own groups so that non-functional needs can be documented separately from business requirements.","description":"The user can create a non-functional-requirement group and create non-functional requirements only within a required group. Groups contain non-functional requirements only, and each requirement belongs to exactly one group. Requirements have a title and description and can be listed, viewed, and edited. They can be archived and deleted under the common document rules (REQ-05.007), and archiving preserves their ID. The family is addressed by the document slug `nfr` (`papyrus nfr`); the former `nfreq` command name is not retained (REQ-07.002).","criteria":"A group can be created with a title and optional description.\nA non-functional requirement can be created only with its required non-functional-requirement group.\nA requirement belongs to exactly one group, and a group contains non-functional requirements only.\nNon-functional requirements can be listed, viewed, and edited for title and description.\nArchiving hides a requirement from lists, search, and the web UI, moves it to the type's `archived/` subfolder, and preserves its ID (REQ-05.007).\nDeleting a requirement permanently removes it under the document deletion rules (REQ-05.007).\nThe family command is `papyrus nfr`; no `papyrus nfreq` alias exists."},{"id":"REQ-05.003","title":"Manage Glossary Terms","criticality":"Must have","userStory":"As a project contributor, I want to maintain glossary terms and definitions so that project terminology can be looked up consistently.","description":"The user can create glossary terms with a term and definition, list and view terms, and edit either field. Terms can be archived and deleted under the common document rules (REQ-05.007). Archived terms are hidden from lists, search, and the web UI, and archiving preserves their IDs.","criteria":"A glossary term can be created with the required term and definition.\nTerms can be listed, viewed, and edited for term and definition.\nArchiving hides a term from lists, search, and the web UI, moves it to the type's `archived/` subfolder, and preserves its ID (REQ-05.007).\nDeleting a term permanently removes it under the document deletion rules (REQ-05.007)."},{"id":"REQ-05.004","title":"Manage UI Specifications","criticality":"Must have","userStory":"As a project contributor, I want to maintain UI specifications associated with views so that UI documentation can be found and updated.","description":"The user can create a UI specification with a title, associated view, and description; list, view, and edit it; and archive or delete it under the common document rules (REQ-05.007). Archived specifications are hidden from lists, search, and the web UI, and archiving preserves their IDs.","criteria":"A UI specification can be created with the required title, view, and description.\nUI specifications can be listed, viewed, and edited for view and description.\nArchiving hides a specification from lists, search, and the web UI, moves it to the type's `archived/` subfolder, and preserves its ID (REQ-05.007).\nDeleting a specification permanently removes it under the document deletion rules (REQ-05.007)."},{"id":"REQ-05.005","title":"Manage Business Rules","criticality":"Must have","userStory":"As a project contributor, I want to record and maintain business rules with their rationale and applicability so that rules can be understood in the context of requirements.","description":"The user can create rules with a title, description, rationale, and applicability, optionally referencing business requirements. Rules can be listed, viewed, and edited. They can be archived and deleted under the common document rules (REQ-05.007). Requirement references are repeatable and can be removed individually or all at once.","criteria":"Creating a rule requires description, rationale, and applicability; title is supplied as the command title.\nA rule may reference zero or more business requirements.\nRules can be listed, viewed, and edited for title, description, and requirement references.\nA requirement reference can be removed by ID or all references can be removed.\nArchiving hides a rule from lists, search, and the web UI, moves it to the type's `archived/` subfolder, and preserves its ID (REQ-05.007).\nDeleting a rule permanently removes it under the document deletion rules (REQ-05.007)."},{"id":"REQ-05.006","title":"Manage Audit Records","criticality":"Must have","userStory":"As a project contributor, I want to record and maintain audit information so that the project can retain searchable audit records.","description":"The user can create audit records with a title and content, optionally specifying an audit type. Built-in types are `security` (default), `licence`, and `architecture`; additional types are configurable. Records can be listed, viewed, and edited, and can be archived and deleted under the common document rules (REQ-05.007).","criteria":"An audit record can be created with the required title and content.\nThe default audit type is `security`; `licence` and `architecture` are also built in, and additional types may be configured.\nAudit records can be listed, viewed, and edited for title, content, and type.\nArchiving an audit record hides it from lists, search, and the web UI, moves it to the type's `archived/` subfolder, and preserves its ID (REQ-05.007).\nDeleting an audit record permanently removes it under the document deletion rules (REQ-05.007)."},{"id":"REQ-05.007","title":"Manage Document Archive State and Deletion","criticality":"Must have","userStory":"As a project maintainer, I want to archive or delete document records so that inactive documents are out of the way while identity is preserved until I deliberately delete them.","description":"Every document type declared under `document_types` — the default entries and any type added by configuration — has the main status `active` or `archived`, and those two values are the only statuses that affect storage location. A front-matter-backed record starts `active` (or at its type's configured `default_status`, REQ-07.002) and its main status is the front-matter `status` field (REQ-05.010). A type may declare custom statuses (REQ-07.001): they are front-matter values only, cause no file move, and define no folder per status. UI mockups add the approval states `pending` and `approved` before `archived` and keep the state in their HTML metadata (REQ-05.008).\n\n`papyrus \u003cdocument-slug\u003e archive \u003cid\u003e` sets the record to `archived` and moves its file into the `archived/` subfolder of that document type's configured directory. Archiving preserves the record ID (REQ-01.005). If the record carried a custom status, archiving replaces it with `archived` and the previous value is not retained anywhere (REQ-07.001). Archived records are hidden from lists, search, and the browser.\n\nThere is no restore command for documents in this release: no Papyrus command returns an archived record to `active`. This is a deliberate product decision, not a missing requirement. Only the `archived/` subfolder is recognized as archive storage. A `deprecated/` subfolder left by an earlier version is not read as archived, is not migrated, and is not inventoried by any command; it stays inert on disk and can be recovered only by manual file and metadata changes outside Papyrus.\n\n`papyrus \u003cdocument-slug\u003e delete \u003cid\u003e` permanently removes a record. An active record is archived first and then deleted. Deletion asks for confirmation and `--force` skips the prompt. A deleted record keeps no file, and its ID is not reused under the current allocator: allocation is max(observed number) + 1 over active and archived locations with no high-water mark (REQ-01.005), so deleted numbers generally remain gaps and deleting the highest record makes its number available again. No change to the allocator is made.\n\nAuto-relocation on read: if a record's front-matter `status` is `archived` while its file still resides in the active folder (for example a hand-edited file or an interrupted write), Papyrus treats the file as misplaced and relocates it to the type's `archived/` subfolder on any read, list, view, search, or browser path, using the same atomic write-destination-then-unlink sequence as `archive`, before returning the record. The relocation is reported in diagnostics. If the relocation fails, the record is returned read-only with a validation outcome and writes to it are refused until the conflict is resolved.\n\nThe same rules apply to every document type, including technical specifications, business requirements, non-functional requirements, glossary terms, UI specifications, UI mockups, business rules, audit records, use cases, test cases, test reports, and config-defined types.","criteria":"Every front-matter-backed document type configured under `document_types` has the main status `active` or `archived`, and may declare custom statuses that never affect storage location; UI mockups add `pending` and `approved` before `archived`.\nA new front-matter-backed document record starts `active`, or at its type's configured `default_status` when one is set (REQ-07.002).\nA custom status causes no file move and creates no per-status folder; a record carrying a custom status stays in the type folder.\n`papyrus \u003cdocument-slug\u003e archive \u003cid\u003e` sets `status` to `archived` and moves the file to the `archived/` subfolder of that type's configured directory.\nArchiving a record that carries a custom status sets `status` to `archived` and does not retain the previous custom status value anywhere.\nArchiving preserves the record ID.\nArchived records are hidden from lists, search, and the browser.\nOn any read, list, view, search, or browser path, a record whose front-matter `status` is `archived` while its file is in the active folder is relocated to the type's `archived/` subfolder using the archive write-destination-then-unlink sequence before it is returned; the relocation is reported in diagnostics.\nIf that relocation fails, the record is returned read-only with a validation outcome and writes to it are refused until the conflict is resolved.\nOrphaned `deprecated/` folders are inert: no command reads, migrates, or inventories them.\nNo Papyrus command returns an archived document to `active`; no `restore` command exists for documents.\nOnly an `archived/` subfolder is recognized as archive storage; an existing `deprecated/` subfolder is not read as archived and is not migrated.\n`papyrus \u003cdocument-slug\u003e delete \u003cid\u003e` permanently removes the record.\nDeleting an active record archives it first, then removes it.\nDeletion requires confirmation, and `--force` skips the confirmation prompt.\nA deleted record's ID is not reused.\nThe rules apply to every configured document type, including config-defined types."},{"id":"REQ-05.008","title":"Manage UI Mockups","criticality":"Must have","userStory":"As a project contributor, I want to maintain UI mockups associated with UI specifications and tickets so that UI design artifacts can be found, reviewed, approved, updated, and retired.","description":"The user can create a UI mockup as a document type declared by the default `document_types` entry `ui-mockup`, with prefix MOCK, stored under `docs/specifications/ui/mockups/`. A mockup realizes a UI specification: it carries a title, an associated task, references to other documents, and an implementation reference to one or more UI specifications by spec id. Mockups are editable, are not versioned by Papyrus (version control is provided by git), and can be associated to tickets (the ticket is recorded in the mockup and the mockup is referenced by the ticket). Mockups can be listed, viewed, and edited, and can be archived or deleted.\n\nA mockup's status is one of: pending (waiting user approval), approved, or archived. Status transitions follow the linear table pending -\u003e approved -\u003e archived: an approved mockup is archived by `papyrus ui-mockup archive \u003cid\u003e` or by supersession, and an archived mockup has no restore command (REQ-05.007). A mockup may supersede an older mockup; supersession is performed by command only, `papyrus ui-mockup supersede \u003cold\u003e \u003cnew\u003e`; the superseded mockup becomes archived and records a back-reference to its successor. Status transitions are blocked while a mockup is superseded.\n\nMockups are the document type that keeps its metadata in HTML rather than YAML front matter. Their status, associated task, and references remain stored in the mockup's HTML content, and mockup HTML files carry no front matter (REQ-05.010). Archiving sets that HTML status to `archived` and moves the file into the `archived/` subfolder of the mockup directory, keeping the ID.","criteria":"A mockup can be created with the required title, associated task, and reference(s) to UI specification(s) by spec id.\nMockups are stored under `docs/specifications/ui/mockups/` with IDs using the MOCK prefix.\nA mockup records its associated ticket and references to other documents within its HTML content.\nMockups can be listed, viewed, and edited.\nA mockup's status is one of pending (waiting user approval), approved, or archived.\nArchiving a mockup sets its HTML status to `archived`, moves it to the `archived/` subfolder, hides it from lists, search, and the web UI, and preserves its ID.\nNo restore command exists for mockups (REQ-05.007).\nA mockup may supersede an older mockup; supersession is performed only via the command `papyrus ui-mockup supersede \u003cold\u003e \u003cnew\u003e`, the superseded mockup becomes archived and records a back-reference to its successor.\nStatus transitions are blocked for a mockup that has been superseded.\nStatus transitions follow the linear table pending -\u003e approved -\u003e archived.\n`papyrus ui-mockup delete \u003cid\u003e` permanently removes a mockup, archiving an active mockup first, with confirmation and `--force` as for other document types (REQ-05.007).\nMockups are not versioned by Papyrus; version control is provided by git.\nA mockup's metadata is carried in its HTML content and never in YAML front matter; mockup HTML files are excluded from the front-matter requirement (REQ-05.010)."},{"id":"REQ-05.009","title":"Manage Technical Specifications","criticality":"Must have","userStory":"As a project contributor, I want technical specifications to be recognized as a project documentation type so that technical documentation can be referenced by tasks and can reference non-functional requirements.","description":"Technical specifications are a document type declared by the default `document_types` entry `tech-spec`. A technical specification is created with a required title and description. Its ID uses the `TECH` prefix (for example `TECH-001`), padded to the configured `id_padding`, and it is stored under the `technical/` directory (under `doc_directory`). Technical specifications can be listed, viewed, and edited for title and description, and support the `--editor` option for editing the description. They follow the document lifecycle `active -\u003e archived`: a technical specification can be archived and deleted under the common document rules (REQ-05.007), and archiving preserves its ID. Technical specifications follow the same input sanitization and project-directory path boundary as other document types. A task may reference zero or more technical specifications (REQ-02.001), and non-functional requirements may be referenced by technical specifications.","criteria":"Technical specifications are recognized as a document type in Papyrus documentation management (README DESCRIPTION).\nA technical specification can be created with the required title and description.\nTechnical specifications are stored under `technical/` (under `doc_directory`) with IDs using the `TECH` prefix, padded to `id_padding` digits.\nTechnical specifications can be listed, viewed, and edited for title and description, including via `--editor`.\nThe `tech-spec` command supports `create \u003ctitle\u003e --description \u003ctext\u003e`, `list`, `view \u003cid\u003e`, `edit \u003cid\u003e [--title] [--description] [--editor]`, `archive \u003cid\u003e`, and `delete \u003cid\u003e [--force]`.\nArchiving a technical specification hides it from lists, search, and the web UI, moves it to `archived/`, and preserves its ID; no restore command exists (REQ-05.007).\nTechnical specifications follow the same input sanitization and project-directory path boundary as other document types.\nA task may reference zero or more technical specifications (REQ-02.001).\nNon-functional requirements may be referenced by technical specifications."},{"id":"REQ-05.010","title":"Record Metadata in YAML Front Matter","criticality":"Must have","userStory":"As a project contributor, I want every managed file to begin with structured record metadata so that records can be identified, related, filtered, and displayed consistently without reading the document body.","description":"Every Markdown file managed by Papyrus begins with a YAML front-matter block. The block carries the general fields `id`, `title`, `created_date`, `updated_date`, `labels`, and `references` for every managed record type, followed by the type-specific fields. Task front matter carries `id`, `title`, `status`, `assignee`, `created_date`, `updated_date`, `labels`, `milestone`, `dependencies`, `references`, `documentation`, `type`, and `ordinal`; `assignee` is a YAML list. Milestone front matter carries the general fields plus `release` and `status` (`open` or `closed`). Release front matter carries the general fields plus `status` (`planned` or `released`). Front-matter-backed document types carry `status` with the value `active`, `archived`, or a custom status declared for that document type (REQ-07.001, REQ-07.002); UI mockups keep that state in their HTML content and carry no front matter (REQ-05.008). A decision's front matter may carry `superseded_by`, and front matter is additive for decisions: the existing `## Date` and `## References` sections remain part of the body, `created_date` is the front-matter timestamp and does not replace or duplicate the ADR `## Date` line, and neither section becomes an editable metadata source. Decision `status` stays in the document core and decision `type` (`adr`/`bdr`) stays derived from the record ID prefix; neither moves to front matter. Audit records carry `type`.\n\nThe front-matter `id` and every reference value (`milestone`, `dependencies`, `references`, `superseded_by`) use the Papyrus ID (REQ-01.005). There is no separate storage ID and no translation at a storage boundary (NFR-04.004).\n\nScope is Markdown records. UI mockups are excluded: their status, associated task, and references remain stored in the mockup's HTML content (REQ-05.008), which is the single source for mockup metadata, and mockup HTML files carry no front matter. Backlog.md `docs` and `drafts` directories are not managed record types and are out of scope.\n\nFront matter is authoritative for the fields it carries and replaces the equivalent information in the document core for records Papyrus writes, so no retired metadata section stores a field that front matter carries; frozen decision bodies are the exception described above. Key order and YAML quoting follow the documented serialization, with general keys preceding type-specific keys. Task and milestone records have no `# \u003cID\u003e \u003ctitle\u003e` body title line; their bodies use the record's section layout. Every other Markdown record type keeps a `# \u003cID\u003e \u003ctitle\u003e` body title line that the writer generates from the front-matter `id` and `title`, so the two cannot diverge; frozen ADR bodies keep their existing heading and gain front matter only. Timestamps are quoted ISO-8601 UTC strings, for example `'2026-10-31T22:26:00Z'`. Adding front matter to an existing record does not change its body. Records brought in by the one-way Backlog.md import script (NFR-04.004) are written in the Papyrus record format, with this front-matter block, on import.","criteria":"Every managed Markdown record file created by Papyrus begins with a YAML front-matter block at byte 0, delimited by `---` lines.\nEvery managed Markdown record type carries `id`, `title`, `created_date`, `updated_date`, `labels`, and `references` in its front matter.\nTask front matter carries `id`, `title`, `status`, `assignee`, `created_date`, `updated_date`, `labels`, `milestone`, `dependencies`, `references`, `documentation`, `type`, and `ordinal`; `assignee` is a YAML list.\nMilestone front matter carries the general fields plus `release` and `status`; `status` is `open` or `closed`.\nRelease front matter carries the general fields plus `status`; `status` is `planned` or `released`.\nFront-matter-backed document types carry `status`; its value is `active`, `archived`, or a custom status declared for that type, and Papyrus writes `archived` only when it moves the record into the type's `archived/` subfolder.\nA decision's front matter may carry `superseded_by`; adding front matter to a decision leaves `## Date` and `## References` intact and does not move decision `status` or decision `type` into front matter.\nAn audit record's front matter carries `type`.\nThe front-matter `id` and every reference value carry the Papyrus ID; no second, tool-specific ID appears in front matter.\nTasks and milestones have no `# \u003cID\u003e \u003ctitle\u003e` body title line; every other Markdown record type keeps a body title line generated by the writer from the front-matter `id` and `title`.\nA frozen ADR body keeps its existing heading and sections; the added front-matter block is the only change made to an existing decision file.\nUI mockup HTML files carry no YAML front matter; mockup metadata stays in the HTML content (REQ-05.008).\nBacklog.md `docs` and `drafts` files are not managed by Papyrus front matter.\n`created_date` and `updated_date` are quoted ISO-8601 UTC strings of the form `'YYYY-MM-DDTHH:MM:SSZ'`.\nNo front-matter field is also stored in a retired metadata section of the document core.\nAdding front matter to an existing record leaves the record body unchanged.\nRecords imported by the one-way Backlog.md import script carry this front-matter block in the Papyrus record format."},{"id":"REQ-05.011","title":"Maintain Record Metadata Through All Commands","criticality":"Must have","userStory":"As a project contributor, I want Papyrus commands to set and maintain record metadata automatically so that front matter stays accurate without manual editing.","description":"`created_date` is set automatically when a record is created and is never changed afterwards. `updated_date` is set automatically at creation and refreshed by every write path, including a browser save. `id` is generated and stable (REQ-01.005), and `id`, `created_date`, and `updated_date` are exempt from the option rule; every other front-matter field can be supplied as a command option at creation and at update, and a command that lacks an option for an applicable field gains one. For document records, `status` is also exempt from the option rule and is lifecycle- and configuration-owned: a new record takes the type's configured `default_status` (or `active`), and the value changes only through `papyrus \u003cdocument-slug\u003e status` and `archive`, so no create or edit option sets it (REQ-07.001). The status of a task, milestone, release, or decision keeps its documented behavior (REQ-02, REQ-03, REQ-04); the exemption applies to document records only. `ordinal` is an opaque non-negative integer supplied through a create/update option and defaulted from the current maximum. Every command that writes a record file keeps the existing front matter intact and changes only the fields that the operation changes; a browser save follows the same contract.\n\nExisting managed Markdown records that do not yet carry a front-matter block are adopted per record: the block is added on the record's first read and on its first write, and no bulk migration command is required. The managed record types are task, milestone, release, decision, business requirement, non-functional requirement, glossary term, UI specification, technical specification, business rule, and audit record, plus every document type declared under `document_types` (REQ-07.002). Prose Markdown that no managed record type claims, such as files under `docs/specifications`, `docs/domain-model`, and `docs/business-processes` or `README` files, is out of scope and is not adopted. UI mockups and other HTML files are excluded. Frozen ADR bodies are not edited beyond the added front-matter block.\n\nAdoption adds the block and changes nothing else in the body; when adoption happens on a write, a field that the record still holds in a legacy document section moves to front matter and that section is removed, so no field is stored twice. Adoption is idempotent: once a record carries front matter, neither a read nor a write adopts it again. Papyrus does not convert a record to, or rewrite it in, a Backlog.md on-disk layout and does not use a Backlog.md storage ID (NFR-04.004): Backlog.md backlog records enter Papyrus only through the one-way import script, and no read or write path re-shapes a task or milestone record. Timestamps are quoted ISO-8601 UTC strings, for example `'2026-10-31T22:26:00Z'`.","criteria":"`created_date` and `updated_date` are set automatically when a record is created.\n`updated_date` is refreshed automatically on every write, including a browser save of an edit; `created_date` is never changed.\n`id`, `created_date`, and `updated_date` are exempt from the option rule; for every record type, each other front-matter field can be supplied as an option on creation and as an option on update.\nFor document records, `status` is exempt from the option rule: a new record starts at the type's `default_status` or `active`, no create or edit option sets it, and it changes only through `papyrus \u003cdocument-slug\u003e status` and `archive` (REQ-07.001).\nThe status of a task, milestone, release, or decision keeps its documented behavior and is not affected by the document `status` exemption.\n`ordinal` is an opaque non-negative integer with a create option and an update option; a new record's default is derived from the current maximum.\nEvery command that writes a record (create, edit, status, archive, delete, supersede, milestone close, release close) preserves the front-matter fields that the operation does not change.\nA browser save preserves the front-matter fields and body content the save does not change.\nAn existing command that has no option for an applicable front-matter field provides that option.\nEach managed Markdown record file without a front-matter block is adopted lazily: the block is added on its first read and on its first write; after either, the record carries front matter.\nAdoption is idempotent: a record that already carries front matter is not adopted again on subsequent reads or writes.\nNo bulk migration command is required; the corpus converges record by record as records are read or written.\nAdoption covers only existing files claimed by a managed record type; prose Markdown that is not a managed record (for example under `docs/specifications`, `docs/domain-model`, `docs/business-processes`, or `README` files) is not modified.\nAdoption excludes HTML files, including UI mockups.\nAdoption changes nothing in a frozen ADR body except adding the front-matter block.\nAdoption adds nothing else to the body; on a write, a field-holding legacy section is removed after its values move to front matter, so no field is stored twice.\nNo read or write path converts a task or milestone record to a Backlog.md on-disk layout or assigns a Backlog.md storage ID; Backlog.md backlog records enter Papyrus only through the one-way import script (NFR-04.004).\n`created_date` and `updated_date` are quoted ISO-8601 UTC strings of the form `'YYYY-MM-DDTHH:MM:SSZ'`."},{"id":"REQ-05.012","title":"Manage Use Cases","criticality":"Should have","userStory":"As a project contributor, I want to create, find, and maintain Use Case documents so that behavioral requirements and user journeys can be documented and traced.","description":"Use cases are a document type declared by the default `document_types` entry `use-case`, with prefix `UC`, stored under `use-cases/` below `doc_directory`, and managed by the command `papyrus use-case`. Use cases capture functional behavior and user interactions. They follow the document lifecycle `active -\u003e archived` (REQ-05.007) and can be listed, viewed, edited, archived, and deleted with their ID preserved until deletion.","criteria":"A use case can be created with the required title and description and optional applicability.\nUse cases can be listed, viewed, and edited for title and description.\nUse cases can be archived; archiving hides them from lists, search, and the web UI, moves them to the type's `archived/` subfolder, and preserves their ID (REQ-05.007).\nUse cases can be permanently deleted with confirmation, and `--force` skips the prompt (REQ-05.007).\nUse cases follow the document lifecycle `active -\u003e archived` and have no restore command.\nThe command family is `papyrus use-case create|list|view|edit|archive|delete`, with the slug and defaults defined by the `use-case` configuration entry (REQ-07.002, REQ-07.003)."},{"id":"REQ-05.013","title":"Manage Test Cases","criticality":"Should have","userStory":"As a project contributor, I want to create, find, and maintain Test Case documents so that test scenarios and verification activities can be documented and traced.","description":"Test cases are a document type declared by the default `document_types` entry `test-case`, with prefix `TC`, stored under `test-cases/` below `doc_directory`, and managed by the command `papyrus test-case`. Test cases capture specific test scenarios, expected outcomes, and verification steps. They follow the document lifecycle `active -\u003e archived` (REQ-05.007) and can be listed, viewed, edited, archived, and deleted with their ID preserved until deletion.","criteria":"A test case can be created with the required title and description and optional applicability.\nTest cases can be listed, viewed, and edited for title and description.\nTest cases can be archived; archiving hides them from lists, search, and the web UI, moves them to the type's `archived/` subfolder, and preserves their ID (REQ-05.007).\nTest cases can be permanently deleted with confirmation, and `--force` skips the prompt (REQ-05.007).\nTest cases follow the document lifecycle `active -\u003e archived` and have no restore command.\nThe command family is `papyrus test-case create|list|view|edit|archive|delete`, with the slug and defaults defined by the `test-case` configuration entry (REQ-07.002, REQ-07.003)."},{"id":"REQ-05.014","title":"Manage Test Reports","criticality":"Should have","userStory":"As a project contributor, I want to create, find, and maintain Test Report documents so that test execution results, pass/fail outcomes, and verification evidence can be documented and traced.","description":"Test reports are a document type declared by the default `document_types` entry `test-report`, with prefix `TR`, stored under `test-reports/` below `doc_directory`, and managed by the command `papyrus test-report`. Test reports capture the results of test executions, including pass/fail status, test case coverage, and verification evidence. They follow the document lifecycle `active -\u003e archived` (REQ-05.007) and can be listed, viewed, edited, archived, and deleted with their ID preserved until deletion.","criteria":"A test report can be created with the required title and description and optional applicability.\nTest reports can be listed, viewed, and edited for title and description.\nTest reports can be archived; archiving hides them from lists, search, and the web UI, moves them to the type's `archived/` subfolder, and preserves their ID (REQ-05.007).\nTest reports can be permanently deleted with confirmation, and `--force` skips the prompt (REQ-05.007).\nTest reports follow the document lifecycle `active -\u003e archived` and have no restore command.\nThe command family is `papyrus test-report create|list|view|edit|archive|delete`, with the slug and defaults defined by the `test-report` configuration entry (REQ-07.002, REQ-07.003)."}]},{"id":"REQ-06","title":"Search and Local Web Interface","userStory":"As a project contributor, I want to search project records and use the local web interface so that backlog and documentation information can be discovered in a single project context.","description":"This group covers unified free-text search across the documented record types, starting the local web UI over the project's backlog and documentation stores, a browser page describing the managed artifact types and their lifecycles, a browser page listing agent skills and workflows for configuring Papyrus via `papyrus.config.yml`, and CLI and browser views that render record metadata from front matter. It also covers browser navigation and presentation of requirements, browser views for every configured document type, browser console verbosity, the browser configuration view, page-title branding, links to referenced records, the glossary landing page, the single record view layout, and the kanban presentation of the backlog view.","children":[{"id":"REQ-06.001","title":"Search Project Records","criticality":"Must have","userStory":"As a project contributor, I want to search backlog and documentation records together so that relevant project information can be found without searching stores separately.","description":"The user can run a free-text search across tasks, milestones, releases, decisions, and documents in one pass. Documents include every type declared under `document_types`, including types added by configuration. The user may restrict results to one or more record types and limit the maximum number of results. The documented type values are task, milestone, release, decision, and doc; the default is all types.","criteria":"A query searches tasks, milestones, releases, decisions, and documents by default.\nA quoted phrase containing spaces is accepted as one query.\nRepeatable `--type` options restrict results to the selected documented record types.\n`--limit \u003cn\u003e` caps the number of returned results.\n`--type doc` includes records of every document type declared under `document_types`, including config-defined types (REQ-07.002)."},{"id":"REQ-06.002","title":"Serve the Local Web Interface","criticality":"Must have","userStory":"As a project contributor, I want to open a local web interface over project stores so that I can access project information through a browser.","description":"The browser command serves the local web UI over both backlog and documentation stores. Its default bind address is `127.0.0.1` and default port is `6420`; the host and port can be selected. A non-loopback host is permitted but causes a warning. The default browser opens automatically unless disabled by option or configuration.","criteria":"`papyrus browser` starts the web UI over the backlog and documentation stores using the configured/default host and port.\nThe default host is `127.0.0.1` and the default port is `6420`.\nA user-specified non-loopback host is accepted and causes a warning.\n`--no-open` prevents automatic opening of the default browser."},{"id":"REQ-06.003","title":"Describe Managed Artifacts and Their Lifecycles in the Browser","criticality":"Should have","userStory":"As a project contributor, I want a browser page that describes every artifact and document type managed in the project and its lifecycle so that I can understand what each record type is and how it moves through its states.","description":"The local web interface provides a page that describes the artifact and document types managed in the current project, with one section per type, and explains the lifecycle of each type. The page covers the three artifact categories (REQ-07.001):\n\n- **backlog** — tasks, milestones, and releases.\n- **decision** — decision records.\n- **document** — every document type declared in `document_types`, enabled or not, including the default entries and any type added by configuration (REQ-07.002).\n\nThe document sections are therefore derived from the effective configuration and are not a fixed list. The task section's states and transitions are derived from the configured statuses (REQ-01.002); the milestone section shows the fixed `open -\u003e closed` lifecycle; the release section shows the fixed `planned -\u003e released` lifecycle; the decision section shows the five Nygard statuses (REQ-04.001); every document section shows the main `active -\u003e archived` storage lifecycle (REQ-05.007) together with the custom statuses declared for that type (REQ-07.002), and the UI mockup section shows `pending -\u003e approved -\u003e archived` (REQ-05.008). Backlog.md `docs`, `drafts`, and project configuration files are not covered. The page route, navigation entry, and format are design decisions.\n\nEach section provides a good description of its artifact on top of the lifecycle and the existing status, and represents the configuration associated to that artifact. Description text is curated content shipped with the browser for the default types, works offline (NFR-01.003), and is not derived from requirement files, record content, or configuration; a document type added by configuration is described by the shared document lifecycle and its configured prefix and folder, since no curated text is shipped for it. The configuration shown per section is read-only and consists of the artifact's effective `enabled` state, its ID prefix, and its storage folder; the task section additionally presents the configured task statuses, and a document section presents the statuses declared for that document type. Configuration values on this page are display-only: changes are made only through the browser configuration view (REQ-06.008).","criteria":"The local web interface serves a page that describes every managed artifact and document type in a separate section, grouped by the three artifact categories.\nThe page covers tasks, milestones, releases, decision records, and every document type declared in `document_types`, including types added by configuration.\nThe document sections are derived from the effective configuration and are not a fixed list.\nThe task section's states and transitions reflect the configured task statuses.\nThe milestone section shows th
