<!DOCTYPE html>

<title>Business Rules</title>
<style>
  :root { --bg:#f4f4f2; --panel:#fff; --border:#e2e2df; --ink:#1c1c1a; --muted:#6b6b66; --accent:#765327; --soft:#f4eddf; --badge:#eceff1; }
  * { box-sizing:border-box; } html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:grid; place-items:center; padding:24px; }
  .app { width:min(1200px,100%); height:min(88vh,900px); background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.08); display:grid; grid-template-rows:auto 1fr; overflow:hidden; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:12px; } h1 { font-size:17px; margin:0; } .sub { color:var(--muted); font-size:13px; } .back { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; } .back:hover { text-decoration:underline; }
  .panes { display:grid; grid-template-columns:330px 1fr; min-height:0; } nav { border-right:1px solid var(--border); overflow:auto; padding:12px; background:#fafaf9; } main { overflow:auto; padding:26px 30px; }
  #filter { width:100%; padding:7px 10px; margin-bottom:10px; border:1px solid var(--border); border-radius:8px; font:inherit; font-size:13px; }
  .rule { display:flex; align-items:baseline; gap:8px; width:100%; background:none; border:0; border-radius:6px; padding:7px 8px; font:inherit; font-size:13.5px; color:var(--ink); cursor:pointer; text-align:left; }
  .rule:hover { background:#f0f0ee; } .rule.active { background:var(--soft); color:var(--accent); font-weight:600; }
  .badge { font:11px ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--badge); color:var(--muted); border-radius:5px; padding:1px 6px; flex:none; }
  .rule.active .badge { background:#eadcc2; color:var(--accent); } .label { overflow-wrap:anywhere; }
  .rid { font:13px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); } h2 { margin:2px 0 10px; font-size:22px; }
  h3 { font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 0 6px; }
  .content { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; } .empty { color:var(--muted); } .hidden { display:none !important; }
  @media(max-width:720px) { body{padding:0}.app{height:100vh;border-radius:0}.panes{grid-template-columns:minmax(150px,40%) 1fr}main{padding:18px} }
</style>

<script id="data" type="application/json">{"rules":[{"id":"BR-001","title":"Papyrus Command Behavior","description":"Papyrus exposes one command family per enabled `document_types` entry, named `papyrus \u003cslug\u003e`, whose baseline verbs are `create`, `list`, `view`, `edit`, `archive`, and `delete`, plus `status \u003cid\u003e \u003cvalue\u003e` for front-matter-backed types; the former static per-type document commands and the `nfreq` command name are removed.","rationale":"Based on REQ-07.003 — Dispatch Config-Defined Document Commands, REQ-07.002 — Configure Document Types and Slugs, and REQ-07.001 — Organize Artifacts into Three Categories, this rule exists because the document command set is no longer compiled per type: the effective configuration is the single source of the available document commands, so adding a valid entry must add a working command and removing an entry must remove it, without a rebuild or per-type code. REQ-01.004 — Use Common CLI Controls and Outcomes supplies the exit codes and the global options that apply to those commands.","applicability":"Applies to every Papyrus invocation and to every document type declared under `document_types`.\n\n### Command model\n\n- Every enabled entry has `papyrus \u003cslug\u003e create|list|view|edit|archive|delete`.\n- The baseline is a lower bound, not the complete verb set: front-matter-backed types also accept `status \u003cid\u003e \u003cvalue\u003e`, and a built-in typed type may declare additional verbs.\n- `create-group` plus a required `--group` on `create` exist only for `req` and `nfr` (BR-009, BR-010); UI mockups add `supersede` and no `status`.\n- `papyrus --help` lists every enabled document slug alongside the built-in commands, and `papyrus \u003cslug\u003e --help` lists that type's verbs.\n- An unknown slug, or the slug of a disabled entry, is a usage error (exit code 2) with no fallback to another command.\n- Global options (`--json`, `--dir`, `--config`, `--no-color`) apply as for every command; outcomes use exit codes 0, 1, 2, 3, and 4.\n- The former static document command inventory is not compiled in, and `nfreq` is not retained as a command or alias: the non-functional family is `nfr`.\n\n### Categories and lifecycles\n\n- Exactly three artifact categories exist: backlog (tasks, milestones, releases), decision, and document; each record type belongs to one category.\n- Task statuses are configurable through `statuses` and `default_status`; the milestone (`open -\u003e closed`) and release (`planned -\u003e released`) lifecycles are fixed and configuration cannot change them.\n- Decisions use only the Nygard statuses `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded`; a decision is never archived.\n- Documents have the main statuses `active` and `archived` plus optional configured custom statuses; only `archive` produces `archived`, archiving does not retain a previous custom status value, and documents have no inverse command.\n- Archived records live in the `archived/` subfolder of the type's configured directory, which is the only document inactive location."},{"id":"BR-002","title":"Papyrus init Command Behavior","description":"The papyrus init command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → init); behavior not stated there is unspecified.","rationale":"Based on REQ-01.001 — Initialize a Papyrus Project, this rule exists because the documented init behavior is the contract for papyrus init; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus init` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): init — `README.md` (init section)\n\n```text\ninit\n\n       Initialize a project in the directory where papyrus init is run. If --dir \u003cpath\u003e is given, initialize in that directory instead; the directory is created if it does not exist. Initialization creates the backlog store, the documentation structure, and papyrus.config.yml.\n\n       papyrus init \u003cname\u003e [--no-git] [--force]\n\n       \u003cname\u003e is the project name stored in the configuration.\n\n       In an interactive terminal, papyrus init walks through all available artifacts (task, milestone, release, decision types, and document types), lets you choose which to activate, and prompts for the ID prefix and storage folder of each activated artifact. Core artifacts (task, milestone, release) are always activated. Non-interactive or CI environments (no TTY) use default selections and defaults without prompting. Invalid prefixes or folders are rejected and re-prompted with hints naming the default equivalent value.\n\n       --no-git\n       Do not initialize a Git repository.\n\n       --force\n       Overwrite an existing papyrus.config.yml in full with the generated configuration (replacement, not a merge). Initialization is allowed in a non-empty directory without --force; only an existing papyrus.config.yml conflicts without it. Other pre-existing files are never overwritten.\n```"},{"id":"BR-003","title":"Papyrus config Command Behavior","description":"The papyrus config command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → config); behavior not stated there is unspecified.","rationale":"Based on REQ-01.002 — Read and Edit Project Configuration, this rule exists because the documented config behavior is the contract for papyrus config; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus config` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): config — `README.md` lines 71–93\n\n```text\nconfig\n\n       Read and edit the configuration. Keys use dotted notation for nested values, for example document_types.req.enabled.\n       \n       papyrus config list\n       papyrus config get \u003ckey\u003e\n       papyrus config set \u003ckey\u003e \u003cvalue\u003e\n       papyrus config unset \u003ckey\u003e\n       \n       list\n       Print all effective keys, including defaults.\n\n       get \u003ckey\u003e\n       Print one effective value.\n\n       set \u003ckey\u003e \u003cvalue\u003e\n       Persist one value. The value is parsed as a YAML scalar.\n\n       unset \u003ckey\u003e\n       Remove one key and fall back to its default.\n\n       Precedence is described in papyrus-config(5).\n```"},{"id":"BR-004","title":"Papyrus browser Command Behavior","description":"The papyrus browser command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → browser); behavior not stated there is unspecified.","rationale":"Based on REQ-06.002 — Serve the Local Web Interface, this rule exists because the documented browser behavior is the contract for papyrus browser; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus browser` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): browser — `README.md` lines 94–108\n\n```text\nbrowser\n\n       Serve the local web UI over both the backlog and documentation stores.\n       \n       papyrus browser [--host \u003chost\u003e] [--port \u003cport\u003e] [--no-open]\n       \n       --host \u003chost\u003e\n       Bind address. Default: 127.0.0.1. A non-loopback address is allowed but prints a warning.\n\n       --port \u003cport\u003e\n       TCP port. Default: 6420.\n\n       --no-open\n       Do not open the default browser automatically.\n```"},{"id":"BR-005","title":"Papyrus task Command Behavior","description":"The papyrus task command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → task); behavior not stated there is unspecified.","rationale":"Based on REQ-02.001 — Create and Describe Tasks and REQ-02.002 — View and Edit Tasks and REQ-02.003 — List and Filter Tasks and REQ-02.004 — Archive, Restore, and Delete Tasks, this rule exists because the documented task behavior is the contract for papyrus task; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus task` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): task — `README.md` lines 109–228\n\n```text\ntask\n\n        Manage tasks (TASK-001, ...). A task may be assigned to zero or one milestone, may depend on zero or more tasks, and may reference zero or more business requirements, non-functional requirements, UI specifications, technical specifications, audit records, and business rules.\n       \n       papyrus task create \u003ctitle\u003e [options]\n       papyrus task list [options]\n       papyrus task view \u003cid\u003e\n       papyrus task \u003cid\u003e\n       papyrus task edit \u003cid\u003e [options]\n       papyrus task archive \u003cid\u003e\n       papyrus task restore \u003cid\u003e\n       papyrus task delete \u003cid\u003e [--force]\n       \n       create\n       Create a task.\n\n          -d, --description \u003ctext\u003e\n          Task description.\n\n          --ac \u003ccriteria\u003e\n          Acceptance criterion. Repeatable.\n\n          --depends-on \u003cid\u003e\n           Task dependency. Repeatable; tasks may depend on zero or more tasks.\n\n          --milestone \u003cid\u003e\n          Parent milestone.\n\n          --label \u003clabel\u003e\n          Label. Repeatable.\n\n          --assignee \u003cname\u003e\n          Assignee.\n\n       list\n       List tasks.\n\n          -s, --status \u003cstatus\u003e\n          Filter by status. See STATUSES.\n\n          --milestone \u003cid\u003e\n          Filter by milestone.\n\n          --release \u003cid\u003e\n          Filter by release. Collects tasks belonging to milestones that belong to the release.\n\n          --label \u003clabel\u003e\n          Filter by label.\n\n          --assignee \u003cname\u003e\n          Filter by assignee.\n\n          --search \u003ctext\u003e\n          Filter by text.\n\n          --limit \u003cn\u003e\n          Maximum number of results.\n\n          --sort \u003cfield\u003e\n          Sort field, for example id, created, or status.\n\n          --watch\n          Keep the list open and refresh on changes.\n\n       view \u003cid\u003e\n       View a task.\n\n       edit \u003cid\u003e\n       Edit a task.\n\n          --title \u003ctitle\u003e\n          Update the title.\n\n          -d, --description \u003ctext\u003e\n          Update the description.\n\n          --ac \u003ccriteria\u003e\n          Add an acceptance criterion. Repeatable.\n\n          --comment \u003ctext\u003e\n          Add a comment.\n\n          --comment-author \u003cname\u003e\n          Set the comment author.\n\n          --status \u003cstatus\u003e\n          Set the status.\n\n          --depends-on \u003cid\u003e\n          Add a dependency. Repeatable.\n\n          --milestone \u003cid\u003e\n          Set the parent milestone.\n\n          --no-milestone [\u003cid\u003e]\n          Remove the specified milestone; without an ID, remove all milestone assignments.\n\n          --label \u003clabel\u003e\n          Add a label. Repeatable.\n\n          --assignee \u003cname\u003e\n          Set the assignee.\n\n          --editor\n          Open the task body in $VISUAL or $EDITOR. All repeatable options add to the existing set; field flags update metadata without launching an editor.\n\n       archive \u003cid\u003e\n       Move a task off the board. The ID and every dependency are preserved.\n\n       restore \u003cid\u003e\n       Return an archived task to the board with its previous status.\n\n       delete \u003cid\u003e [--force]\n       Permanently delete a task. An archived task can be deleted; an active task is archived first.\n\n          --force\n          Skip confirmation prompt.\n\n       task view \u003cid\u003e and task \u003cid\u003e are equivalent.\n```"},{"id":"BR-006","title":"Papyrus milestone Command Behavior","description":"The `papyrus milestone` command manages milestones with the verbs `create`, `list`, `view`, `edit`, `close`, and `delete`, where `papyrus milestone close \u003cid\u003e` is the only transition of the fixed `open -\u003e closed` lifecycle; a milestone has no archive or restore command, no configurable status list, and no `--status` transition option.","rationale":"Based on REQ-03.001 — Manage Milestones and REQ-07.001 — Organize Artifacts into Three Categories, this rule exists because a milestone is a backlog artifact whose lifecycle is fixed by the category model rather than configurable: the state is stored in the front-matter `status` field, `close` is the single command that moves a milestone from `open` to `closed`, and document archive semantics never apply to a milestone. The milestone vocabulary is therefore fixed at `open` and `closed`, and configuration cannot add, remove, or rename either value.","applicability":"Applies to every invocation of `papyrus milestone` and to every milestone record.\n\n### Command surface\n\n- `create \u003ctitle\u003e [-d \u003cdescription\u003e] [--release \u003cid\u003e]`\n- `list`\n- `view \u003cid\u003e`\n- `edit \u003cid\u003e [--title \u003ctitle\u003e] [-d \u003cdescription\u003e] [--release \u003cid\u003e] [--no-release [\u003cid\u003e]]`\n- `close \u003cid\u003e` is the only transition command and moves the milestone from `open` to `closed`.\n- `delete \u003cid\u003e [--force]` permanently deletes the milestone; `--force` skips the confirmation prompt.\n- No `--status` option performs the transition, and no archive or restore verb is declared.\n\n### Lifecycle\n\n- Fixed `open -\u003e closed`, reached only through `papyrus milestone close \u003cid\u003e`; `statuses` or `default_status` configuration cannot change it.\n- A milestone starts `open` and its state is stored in the front-matter `status` field.\n- `closed` is lifecycle completion, not an archive state; closing changes the front-matter value and there is no archive or restore command for a milestone.\n- A milestone may be assigned to zero or one release; a release may group multiple milestones. Assigning a release does not change the milestone lifecycle."},{"id":"BR-007","title":"Papyrus release Command Behavior","description":"The `papyrus release` command manages releases with the verbs `create`, `list`, `view`, `edit`, and `close`, where `papyrus release close \u003cid\u003e` is the only transition of the fixed `planned -\u003e released` lifecycle; releases are not documents and have no archive, restore, or delete command.","rationale":"Based on REQ-03.002 — Manage Releases and REQ-07.001 — Organize Artifacts into Three Categories, this rule exists because a release is a backlog artifact whose lifecycle is fixed by the category model rather than configurable: the state is stored in the front-matter `status` field, `close` is the single command that moves a release from `planned` to `released`, and document archive semantics never apply to a release.","applicability":"Applies to every invocation of `papyrus release` and to every release record.\n\n### Command surface\n\n- `create`, `list`, `view`, and `edit` (`--title`, `-d/--description`).\n- `close \u003cid\u003e` is the only transition command and moves the release from `planned` to `released`.\n- No `--status` option performs the transition, and no archive, restore, delete, or other document verb is declared.\n\n### Lifecycle\n\n- Fixed `planned -\u003e released`, reached only through `papyrus release close \u003cid\u003e`; `statuses` or `default_status` configuration cannot change it.\n- `released` represents delivery completion and is distinct from archiving; releases are not archived.\n- Release status is stored in the front-matter `status` field and is neither a document main status nor configurable, and a release is never moved to a document `archived/` folder.\n- A release groups milestones; each milestone may be assigned to at most one release."},{"id":"BR-008","title":"Papyrus decision Command Behavior","description":"The `papyrus decision` command creates, lists, views, and edits decision records (ADR/BDR) and expresses their lifecycle only through the Nygard statuses `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded`; there is no decision archive command and a decision carries no archive state.","rationale":"Based on REQ-04.001 — Create and Inspect Decisions and REQ-04.002 — Update and Supersede Decisions, this rule exists because decisions belong to the decision category, whose lifecycle is the five Nygard statuses; an inactive or replaced decision is marked `superseded` or `deprecated`, so documenting an archive operation would invent a state the category does not have and contradict the command set.","applicability":"Applies to every invocation of `papyrus decision` and to every decision record.\n\n### Command surface\n\n- `create` (`-t/--decision-type`, `-d/--decision`, `--context`, `--consequences`), `list`, `view`, and `edit` (`--title`, `-d`, `--status`, `--context`, `--consequences`, `--superseded-by`).\n- `--superseded-by` cannot be combined with `--status`.\n- No archive command exists, and a decision is never moved to a document `archived/` folder.\n\n### Status model\n\n- Exactly `proposed`, `accepted`, `rejected`, `deprecated`, and `superseded`.\n- Decision statuses are distinct from document statuses: a decision is never `active` or `archived`, and a document is never `deprecated`.\n- Decision status changes are performed through `edit --status` or supersession, not through a document status command."},{"id":"BR-009","title":"Papyrus req Command Behavior","description":"`papyrus req` manages business requirements as the ordinary `document_types.req` entry, using the baseline document verbs plus `create-group` and a required `--group` on `create`; records use the document status model and become inactive only through `archive`.","rationale":"Based on REQ-05.001 — Manage Business Requirements, REQ-07.002 — Configure Document Types and Slugs, REQ-07.003 — Dispatch Config-Defined Document Commands, and REQ-05.007 — Manage Document Archive State and Deletion, this rule exists because business requirements are the document type that adds a group concept on top of the shared document family: requirement-to-group cardinality is 1..1 and groups contain business requirements only, while storage, status, and archive behavior must stay identical to every other document type.","applicability":"Applies to every invocation of `papyrus req` and to every business-requirement record and group, in projects where the `req` entry is enabled.\n\n### Type entry\n\n- `req` is an ordinary `document_types` entry (default prefix `REQ`, directory `requirements/business/`); it can be renamed, removed, disabled, or given another prefix or `doc_directory`-relative directory.\n- Renaming the key renames the command; the change does not move existing files.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n\n### Verbs\n\n- Baseline: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- Extensions: `create-group` and a required `--group` on `create`.\n- Content is retained: create and edit carry title, user story, and description; a group carries a title, optional user story, and optional description; `--editor` opens the body.\n- No other extension verb is declared for `req`.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-010","title":"Papyrus nfr Command Behavior","description":"`papyrus nfr` manages non-functional requirements as the ordinary `document_types.nfr` entry, using the baseline document verbs plus `create-group` and a required `--group` on `create`; records use the document status model and become inactive only through `archive`.","rationale":"Based on REQ-05.002 — Manage Non-Functional Requirements, REQ-07.002 — Configure Document Types and Slugs, REQ-07.003 — Dispatch Config-Defined Document Commands, and REQ-05.007 — Manage Document Archive State and Deletion, this rule exists because non-functional requirements are addressed by the document slug `nfr`, which is itself the command name, and add a group concept on top of the shared document family: requirement-to-group cardinality is 1..1 and groups contain non-functional requirements only, while storage, status, and archive behavior stay identical to every other document type. The former command name is not retained as an alias.","applicability":"Applies to every invocation of `papyrus nfr` and to every non-functional-requirement record and group, in projects where the `nfr` entry is enabled.\n\n### Type entry\n\n- `nfr` is an ordinary `document_types` entry (default prefix `NFR`, directory `requirements/non-functional/`); it can be renamed, removed, disabled, or given another prefix or `doc_directory`-relative directory.\n- Renaming the key renames the command; the change does not move existing files.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n\n### Verbs\n\n- Baseline: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- Extensions: `create-group` and a required `--group` on `create`.\n- Content is retained: create and edit carry title and description; a group carries a title and optional description; `--editor` opens the body.\n- No other extension verb is declared for `nfr`.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-011","title":"Papyrus glossary Command Behavior","description":"`papyrus glossary` manages glossary terms as the ordinary `document_types.glossary` entry using only the baseline document verbs and the document status model, with each term carrying a required term and definition.","rationale":"Based on REQ-05.003 — Manage Glossary Terms, REQ-07.002 — Configure Document Types and Slugs, REQ-07.003 — Dispatch Config-Defined Document Commands, and REQ-05.007 — Manage Document Archive State and Deletion, this rule exists because a glossary term is a standard document record: it needs a stable identity, the common create/list/view/edit/archive/delete family, and the common status model, and it adds no verb or lifecycle of its own.","applicability":"Applies to every invocation of `papyrus glossary` and to every glossary record, in projects where the `glossary` entry is enabled.\n\n### Type entry\n\n- Ordinary `document_types` entry (default prefix `GLO`, directory `glossary/`); renameable, removable, disableable, and assignable another prefix or `doc_directory`-relative directory.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n\n### Verbs\n\n- Baseline only: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- No extension verb is declared.\n- Content is retained: `--term` and `--definition` on create and edit, and `--editor` for the body.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-012","title":"Papyrus ui-spec Command Behavior","description":"`papyrus ui-spec` manages UI specifications as the ordinary `document_types.ui-spec` entry using only the baseline document verbs and the document status model, with each specification carrying a view association and a description.","rationale":"Based on REQ-05.004 — Manage UI Specifications, REQ-07.002 — Configure Document Types and Slugs, REQ-07.003 — Dispatch Config-Defined Document Commands, and REQ-05.007 — Manage Document Archive State and Deletion, this rule exists because a UI specification is a standard front-matter document record that adds a view association to the shared document family; its storage, status, and archive behavior must remain the common document behavior.","applicability":"Applies to every invocation of `papyrus ui-spec` and to every UI-specification record, in projects where the `ui-spec` entry is enabled. UI mockups are a separate entry (`ui-mockup`) with HTML metadata and an additional `supersede` verb.\n\n### Type entry\n\n- Ordinary `document_types` entry (default prefix `UI`, directory `specifications/ui/`); renameable, removable, disableable, and assignable another prefix or `doc_directory`-relative directory.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n\n### Verbs\n\n- Baseline only: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- No extension verb is declared.\n- Content is retained: `--view` and `--description` on create and edit, and `--editor` for the body.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-013","title":"Papyrus rule Command Behavior","description":"`papyrus rule` manages business rules as the ordinary `document_types.rule` entry using only the baseline document verbs and the document status model, with each rule carrying a description, rationale, applicability, and optional requirement references.","rationale":"Based on REQ-05.005 — Manage Business Rules, REQ-07.002 — Configure Document Types and Slugs, REQ-07.003 — Dispatch Config-Defined Document Commands, and REQ-05.007 — Manage Document Archive State and Deletion, this rule exists because a business rule is a front-matter document record whose content is defined by its three prose sections and its requirement references; it therefore keeps those content fields while using the common document command family and status model.","applicability":"Applies to every invocation of `papyrus rule` and to every business-rule record, in projects where the `rule` entry is enabled.\n\n### Type entry\n\n- Ordinary `document_types` entry (default prefix `RUL`, directory `business-rules/`); renameable, removable, disableable, and assignable another prefix or `doc_directory`-relative directory.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n\n### Verbs\n\n- Baseline only: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- No extension verb is declared.\n- Content is retained: `--description`, `--rationale`, and `--applicability` on create; `--title`, `-d/--description`, `--requirement \u003cid\u003e` (repeatable), `--no-requirement`, and `--editor` on edit.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-014","title":"Papyrus audit Command Behavior","description":"`papyrus audit` manages audit records as the ordinary `document_types.audit` entry using only the baseline document verbs and the document status model, with each record carrying a title, content, and audit type.","rationale":"Based on REQ-05.006 — Manage Audit Records, REQ-05.007 — Manage Document Archive State and Deletion, REQ-07.002 — Configure Document Types and Slugs, and REQ-07.003 — Dispatch Config-Defined Document Commands, this rule exists because an audit record is a front-matter document record with a configurable audit type; it keeps that type field while using the common document command family, status model, and archive location.","applicability":"Applies to every invocation of `papyrus audit` and to every audit record, in projects where the `audit` entry is enabled.\n\n### Type entry\n\n- Ordinary `document_types` entry (default prefix `AUD`, directory `audit-records/`); renameable, removable, disableable, and assignable another prefix or `doc_directory`-relative directory.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n\n### Verbs\n\n- Baseline only: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- No extension verb is declared.\n- Content is retained: `--title`, `--content`, and `--audit-type` on create and edit, and `--editor` for the body.\n- The built-in audit types remain `security` (default), `licence`, and `architecture`; additional audit types are configurable.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-015","title":"Papyrus search Command Behavior","description":"The papyrus search command performs the behavior stated in its Papyrus manpage entry (README.md, papyrus(1) → COMMANDS → search); behavior not stated there is unspecified.","rationale":"Based on REQ-06.001 — Search Project Records, this rule exists because the documented search behavior is the contract for papyrus search; README.md is the sole behavior source.","applicability":"Applies to all invocations of `papyrus search` and the project data they manage. The excerpt below reproduces relevant manpage behavior verbatim; heading identifies README section and exact source line range.\n\n### papyrus(1): search — `README.md` lines 692–706\n\n```text\nsearch\n\n       Search tasks, milestones, releases, decisions, and documents in one pass.\n       \n        papyrus search \u003cquery\u003e [--type \u003ctype\u003e]... [--limit \u003cn\u003e]\n        \n        \u003cquery\u003e\n        Free-text search term or phrase. Quote phrases that contain spaces.\n\n        --type \u003ctype\u003e...\n        Repeatable. Restrict to record types: task, milestone, release, decision, or doc. Default: all types.\n\n       --limit \u003cn\u003e\n       Maximum number of results.\n```"},{"id":"BR-016","title":"Papyrus Configuration Keys and Precedence","description":"`papyrus.config.yml` is the single source of project paths, ID formats, workflow statuses, document types, and browser settings, and its effective value is resolved in the fixed precedence order command-line options, environment variables, the project configuration file, then built-in defaults.","rationale":"Based on REQ-01.002 — Read and Edit Project Configuration, REQ-01.003 — Select Project and Configuration Context, REQ-07.001 — Organize Artifacts into Three Categories, and REQ-07.002 — Configure Document Types and Slugs, this rule exists because configuration is the only place document types, their slugs, prefixes, directories, and status vocabularies are declared; the loader must therefore validate the whole map fail-closed and still leave a repair path, or one bad entry would make every command unusable and the project could not be fixed through Papyrus itself.","applicability":"Applies to every `papyrus.config.yml` file and to the project data it governs.\n\n### Precedence\n\n1. Command-line options.\n2. Environment variables (`PAPYRUS_DIR`, `PAPYRUS_CONFIG`).\n3. `papyrus.config.yml` in the project directory.\n4. Built-in defaults.\n\nThis order is unchanged by the document-type model.\n\n### General, path, and workflow keys\n\n- `project_name`, `task_prefix`, `milestone_prefix`, `release_prefix`, `id_padding` (1–6, default 3), `date_format`, and `editor`.\n- `backlog_directory`, `decision_directory`, and `doc_directory`; each document type's `directory` is relative to `doc_directory`.\n- `statuses` and `default_status` configure task statuses only. The milestone (`open -\u003e closed`), release (`planned -\u003e released`), and decision lifecycles stay fixed, and the document main statuses `active` and `archived` are not configurable.\n\n### document_types\n\n- The map is keyed by document slug; the key is the command name (`papyrus \u003cslug\u003e`) and the identifier used elsewhere. There is no separate document-slug attribute.\n- Each entry declares `prefix`, `directory` (relative to `doc_directory`), and `enabled`, and may declare `statuses` and `default_status`. Archived records are stored in an `archived/` subfolder of the entry's directory.\n- `papyrus init` seeds eleven entries: `req` (REQ, `requirements/business/`), `nfr` (NFR, `requirements/non-functional/`), `glossary` (GLO, `glossary/`), `rule` (RUL, `business-rules/`), `ui-spec` (UI, `specifications/ui/`), `ui-mockup` (MOCK, `specifications/ui/mockups/`), `audit` (AUD, `audit-records/`), `tech-spec` (TECH, `technical/`), `use-case` (UC, `use-cases/`), `test-case` (TC, `test-cases/`), and `test-report` (TR, `test-reports/`). `deploy` is not seeded and can be added as an ordinary user-defined entry.\n- Default entries are fully ordinary: any entry can be renamed, removed, disabled, or given another prefix or directory.\n- The map is whole: when the key is present, exactly its entries exist and no seeded entry is re-added. Removing an entry stops managing its records and deletes no file; `enabled: false` removes the command and browser view while keeping the entry, its prefix reservation, and its files.\n- `statuses`, when present, is a non-empty duplicate-free list that contains `active` and `archived` exactly once; `active` and `archived` are fixed and every other value is a custom status. Every declared value follows the slug character rule. `default_status`, when present, must be a declared status and must never be `archived`. An entry without `statuses` has only the two main statuses and starts `active` unless `default_status` is set. `statuses` and `default_status` are rejected on `ui-mockup`, which keeps its state in HTML metadata.\n- `statuses` is list-valued: `papyrus config set document_types.\u003cslug\u003e.statuses active,archived,review` writes the value as a YAML flow sequence; commas are separators with no escape form, and an empty value is rejected.\n\n### Validation\n\n- Fail-closed: every command except the repair surfaces (`config get|set|unset|list`) and `init --force` refuses to run while the effective configuration is invalid, and no partially valid document-type set is used.\n- A violation is a validation outcome (exit code 4) that names `document_types.\u003cslug\u003e` and the offending field.\n- Slug: non-empty, ASCII letters, digits, `-`, and `_`, not starting with `-`, with no whitespace, control character, or path separator; values are rejected, never trimmed or normalized.\n- Reserved names: a slug equal to `init`, `config`, `task`, `milestone`, `release`, `decision`, `search`, `browser`, `import`, `help`, or `version` is rejected. The comparison is case-insensitive, so `Config` and `SEARCH` are rejected too.\n- `prefix` is non-empty and unique across all entries, including disabled ones.\n- `directory` is relative, stays inside the project directory, and is unique among enabled entries.\n- A repeated `document_types` slug key is invalid configuration; neither occurrence is preferred.\n\n### Repair surfaces\n\n- `papyrus config get|set|unset|list` load tolerantly, validate the configuration that would result, and refuse an invalid write.\n- `papyrus init --force` replaces the file with the generated default set."},{"id":"BR-017","title":"Papyrus tech-spec Command Behavior","description":"`papyrus tech-spec` manages technical specifications as the ordinary `document_types.tech-spec` entry using only the baseline document verbs and the document status model, with each record carrying a required title and optional description.","rationale":"Based on REQ-05.009 — Manage Technical Specifications, REQ-07.002 — Configure Document Types and Slugs, REQ-07.003 — Dispatch Config-Defined Document Commands, and REQ-05.007 — Manage Document Archive State and Deletion, this rule exists because technical specifications are the model the generic document content follows: a title, an optional description, and the general front-matter keys, with the common command family, status model, and archive location.","applicability":"Applies to every invocation of `papyrus tech-spec` and to every technical-specification record, in projects where the `tech-spec` entry is enabled.\n\n### Type entry\n\n- Ordinary `document_types` entry (default prefix `TECH`, directory `technical/`); renameable, removable, disableable, and assignable another prefix or `doc_directory`-relative directory.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n\n### Verbs\n\n- Baseline only: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- No extension verb is declared.\n- Content is retained: a required title and description on create; `--title`, `--description`, and `--editor` on edit.\n- Records follow the same input sanitization and project-directory boundary as every other document type.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-018","title":"Use-Case Document Type Behavior","description":"A use case is the ordinary `document_types.use-case` entry managed by `papyrus use-case`; its records carry a required title and description plus an optional applicability, use only the baseline document verbs and the document status model, and become inactive only through `archive`.","rationale":"Based on REQ-05.012 — Manage Use Cases, with REQ-05.007 — Manage Document Archive State and Deletion, REQ-05.010 — Record Metadata in YAML Front Matter, REQ-07.002 — Configure Document Types and Slugs, and REQ-07.003 — Dispatch Config-Defined Document Commands, this rule exists because a use case is a first-class document record whose behavioral documentation and traceability depend on a stable ID, the common command family, and the common status model; it adds an applicability field but no verb or lifecycle of its own.","applicability":"Applies to every use-case record and to the command invocations that create, list, view, edit, archive, or delete one, in projects where the `use-case` entry is enabled.\n\n### Type entry\n\n- Ordinary `document_types` entry (default prefix `UC`, directory `use-cases/`); renameable, removable, disableable, and assignable another prefix or `doc_directory`-relative directory.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n- Records carry the general front-matter keys `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, and `status`, plus a `# \u003cID\u003e \u003ctitle\u003e` body heading; `description` and `applicability` are body fields.\n\n### Verbs and content\n\n- Baseline only: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- No extension verb is declared.\n- Create requires a title and description; applicability is optional. Edit updates title and description.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-019","title":"Test-Case Document Type Behavior","description":"A test case is the ordinary `document_types.test-case` entry managed by `papyrus test-case`; its records carry a required title and description plus an optional applicability, use only the baseline document verbs and the document status model, and become inactive only through `archive`.","rationale":"Based on REQ-05.013 — Manage Test Cases, with REQ-05.007 — Manage Document Archive State and Deletion, REQ-05.010 — Record Metadata in YAML Front Matter, REQ-07.002 — Configure Document Types and Slugs, and REQ-07.003 — Dispatch Config-Defined Document Commands, this rule exists because test scenarios are only traceable when they are first-class document records with a stable ID and the common command family and status model; the type adds an applicability field but no verb or lifecycle of its own.","applicability":"Applies to every test-case record and to the command invocations that create, list, view, edit, archive, or delete one, in projects where the `test-case` entry is enabled.\n\n### Type entry\n\n- Ordinary `document_types` entry (default prefix `TC`, directory `test-cases/`); renameable, removable, disableable, and assignable another prefix or `doc_directory`-relative directory.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n- Records carry the general front-matter keys `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, and `status`, plus a `# \u003cID\u003e \u003ctitle\u003e` body heading; `description` and `applicability` are body fields.\n\n### Verbs and content\n\n- Baseline only: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- No extension verb is declared.\n- Create requires a title and description; applicability is optional. Edit updates title and description.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."},{"id":"BR-020","title":"Test-Report Document Type Behavior","description":"A test report is the ordinary `document_types.test-report` entry managed by `papyrus test-report`; its records carry a required title and description plus an optional applicability, use only the baseline document verbs and the document status model, and become inactive only through `archive`.","rationale":"Based on REQ-05.014 — Manage Test Reports, with REQ-05.007 — Manage Document Archive State and Deletion, REQ-05.010 — Record Metadata in YAML Front Matter, REQ-07.002 — Configure Document Types and Slugs, and REQ-07.003 — Dispatch Config-Defined Document Commands, this rule exists because execution evidence is only auditable when results are stored as first-class document records with a stable ID and the common command family and status model; the type adds an applicability field but no verb or lifecycle of its own.","applicability":"Applies to every test-report record and to the command invocations that create, list, view, edit, archive, or delete one, in projects where the `test-report` entry is enabled.\n\n### Type entry\n\n- Ordinary `document_types` entry (default prefix `TR`, directory `test-reports/`); renameable, removable, disableable, and assignable another prefix or `doc_directory`-relative directory.\n- IDs use the entry prefix and `id_padding` and are preserved on archive.\n- Records carry the general front-matter keys `id`, `title`, `created_date`, `updated_date`, `labels`, `references`, and `status`, plus a `# \u003cID\u003e \u003ctitle\u003e` body heading; `description` and `applicability` are body fields.\n\n### Verbs and content\n\n- Baseline only: `create`, `list`, `view`, `edit`, `archive`, `delete`, plus `status \u003cid\u003e \u003cvalue\u003e`.\n- No extension verb is declared.\n- Create requires a title and description; applicability is optional. Edit updates title and description.\n- Test-case coverage is recorded through the general front-matter `references` field, because the requirement defines no dedicated field; pass/fail outcome values are not defined by this rule.\n\n### Status and archive\n\n- Main statuses `active` and `archived` plus optional configured custom statuses; custom statuses are front-matter values only and move no file.\n- A new record starts at the configured `default_status`, or `active` when none is configured.\n- `archive` sets `archived`, moves the file into the entry's `archived/` subfolder, and keeps the ID.\n- Archiving does not retain a previous custom status value, and there is no inverse command.\n- `status` never archives: `status \u003cid\u003e archived` is rejected, naming `archive` as the only way.\n- Decision statuses are a separate lifecycle and never apply to documents; the milestone `open -\u003e closed` and release `planned -\u003e released` lifecycles are fixed and unaffected by `statuses` or `default_status`."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const listEl = document.getElementById("list");
const detailEl = document.getElementById("detail");
const filterEl = document.getElementById("filter");
const buttons = new Map();

function addField(label, value) {
  const heading = document.createElement("h3");
  heading.textContent = label;
  const text = document.createElement("p");
  text.className = value ? "content" : "content empty";
  text.textContent = value || "—";
  detailEl.append(heading, text);
}

function select(rule) {
  for (const button of buttons.values()) button.classList.remove("active");
  buttons.get(rule.id).classList.add("active");
  detailEl.replaceChildren();
  const id = document.createElement("div");
  id.className = "rid";
  id.textContent = rule.id;
  const title = document.createElement("h2");
  title.textContent = rule.title;
  detailEl.append(id, title);
  addField("Description", rule.description);
  addField("Rationale", rule.rationale);
  addField("Applicability", rule.applicability);
}

for (const rule of DATA.rules) {
  const button = document.createElement("button");
  button.className = "rule";
  button.dataset.search = [rule.id, rule.title, rule.description, rule.rationale, rule.applicability].join(" ").toLowerCase();
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = rule.id;
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = rule.title;
  button.append(badge, label);
  button.addEventListener("click", () => select(rule));
  listEl.appendChild(button);
  buttons.set(rule.id, button);
}
if (!DATA.rules.length) {
  const empty = document.createElement("p");
  empty.className = "empty";
  empty.textContent = "No business rules yet.";
  listEl.appendChild(empty);
}

filterEl.addEventListener("input", () => {
  const query = filterEl.value.trim().toLowerCase();
  for (const button of buttons.values()) button.classList.toggle("hidden", !button.dataset.search.includes(query));
});
document.getElementById("counts").textContent = DATA.rules.length + (DATA.rules.length === 1 ? " business rule" : " business rules");
if (DATA.rules.length) select(DATA.rules[0]);
</script>
</body>
