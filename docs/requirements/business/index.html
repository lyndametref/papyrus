<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Requirements</title>
<style>
  :root { --bg:#f4f4f2; --panel:#fff; --border:#e2e2df; --ink:#1c1c1a; --muted:#6b6b66; --accent:#2f6f4f; --accent-soft:#e7f1ec; --badge:#eceff1; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:grid; place-items:center; padding:24px; }
  .app { width:min(1200px,100%); height:min(88vh,900px); background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.08); display:grid; grid-template-rows:auto 1fr; overflow:hidden; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:17px; margin:0; } header .sub { color:var(--muted); font-size:13px; } header .back { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; } header .back:hover { text-decoration:underline; }
  .panes { display:grid; grid-template-columns:330px 1fr; min-height:0; }
  .tree-pane { border-right:1px solid var(--border); overflow-y:auto; padding:12px; background:#fafaf9; }
  #filter { width:100%; padding:7px 10px; margin-bottom:10px; border:1px solid var(--border); border-radius:8px; font:inherit; font-size:13px; }
  .root-title { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 6px 6px; }
  .root-title:first-child { margin-top:2px; }
  .group-head { display:flex; align-items:center; gap:6px; width:100%; background:none; border:0; padding:6px; font:inherit; font-weight:600; font-size:13.5px; color:var(--ink); cursor:pointer; border-radius:6px; text-align:left; }
  .group-head:hover,.leaf:hover { background:#f0f0ee; }
  .caret { width:12px; color:var(--muted); flex:none; transition:transform .12s; }
  .group.collapsed .caret { transform:rotate(-90deg); } .group.collapsed .leaves { display:none; }
  .leaves { list-style:none; margin:0 0 4px; padding:0 0 0 14px; }
  .leaf { display:flex; align-items:baseline; gap:8px; width:100%; background:none; border:0; border-radius:6px; padding:5px 8px; font:inherit; font-size:13.5px; color:var(--ink); cursor:pointer; text-align:left; }
  .leaf.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .badge { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; background:var(--badge); color:var(--muted); border-radius:5px; padding:1px 6px; flex:none; }
  .leaf.active .badge { background:#d5e8de; color:var(--accent); }
  .detail-pane { overflow-y:auto; padding:26px 30px; }
  .detail .rid { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; color:var(--accent); }
  .detail h2 { margin:2px 0 10px; font-size:22px; }
  .tags { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tag { font-size:12px; border:1px solid var(--border); border-radius:999px; padding:2px 10px; color:var(--muted); background:#fafaf9; }
  .tag.must { border-color:#bcd8c9; background:var(--accent-soft); color:var(--accent); }
  .detail h3 { font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 0 6px; }
  .detail p { margin:0 0 8px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .detail .story { font-style:italic; color:#444; }
  .empty { color:var(--muted); } .hidden { display:none !important; }
  @media(max-width:720px) { body{padding:0}.app{height:100vh;border-radius:0}.panes{grid-template-columns:minmax(150px,40%) 1fr}.detail-pane{padding:18px} }
</style>
</head>

  <header><h1>Business Requirements</h1><span class="sub" id="counts"></span><a class="back" href="../../index.html">Back to documentation index</a></header>

    <nav class="tree-pane" aria-label="Requirements">
      <input id="filter" type="search" placeholder="Filter requirements…" autocomplete="off">
      <div id="tree"></div>

    <main class="detail-pane"><div class="detail" id="detail" aria-live="polite"></div></main>

<script id="data" type="application/json">{"groups":[{"id":"REQ-01","title":"Project Setup and CLI Access","userStory":"As a project maintainer, I want to initialize and configure Papyrus projects from its CLI so that I can manage project data in the intended project context.","description":"This group covers project initialization, configuration access, directory selection, record identification, and common command-line controls and outcomes described by the Papyrus man page.","children":[{"id":"REQ-01.001","title":"Initialize a Papyrus Project","criticality":"Must have","userStory":"As a project maintainer, I want to initialize Papyrus in a chosen directory so that the project has its backlog store, documentation structure, and configuration.","description":"The user can initialize a project in the current directory or select a project directory with `--dir`; if it does not exists it is created. Initialization records the supplied project name in configuration, creates the backlog store and documentation structure, and creates `papyrus.config.yml`. `--no-git` skips Git initialization. `--force` permits initialization in a non-empty directory without overwriting existing files.","criteria":"Running `papyrus init \u003cname\u003e` initializes the current directory and stores `\u003cname\u003e` as the project name.\nRunning `papyrus --dir \u003cpath\u003e init \u003cname\u003e` initializes `\u003cpath\u003e`, creating it if absent.\n`--no-git` suppresses Git repository initialization.\n`--force` permits a non-empty target directory, and pre-existing files remain unmodified."},{"id":"REQ-01.002","title":"Read and Edit Project Configuration","criticality":"Must have","userStory":"As a project maintainer, I want to inspect and change configuration values so that Papyrus uses settings appropriate to my project.","description":"The user can list effective configuration keys and defaults, get one effective value, persist a value, and unset a key to fall back to its default. Keys support dotted notation, and values supplied to `set` are parsed as YAML scalars.","criteria":"`papyrus config list` prints effective keys including defaults.\n`papyrus config get \u003ckey\u003e` prints that key's effective value.\n`papyrus config set \u003ckey\u003e \u003cvalue\u003e` persists the value as a YAML scalar.\n`papyrus config unset \u003ckey\u003e` removes the configured key and uses its default.\nA nested key can be addressed with dotted notation, such as `document_types.req.enabled`.\nThe configured task statuses must be unique, and the configured default task status must be one of them.\nWith default settings, new tasks start at `ToDo` and the ordered statuses are `ToDo`, `Initiated`, `Refined`, `Implemented`, `Validated`, and `Done`."},{"id":"REQ-01.003","title":"Select Project and Configuration Context","criticality":"Must have","userStory":"As a user managing project data, I want to select the project directory and configuration file so that commands operate using the intended project settings.","description":"Papyrus selects a project directory from `--dir`, `PAPYRUS_DIR`, or the current working directory, in that precedence order. Configuration selection uses `--config`, `PAPYRUS_CONFIG`, the project directory's `papyrus.config.yml`, then built-in defaults. Command-line options take precedence over environment variables, project configuration, and defaults.","criteria":"With no project-directory override, commands use the current working directory.\n`PAPYRUS_DIR` selects the default project directory, and `--dir` overrides it.\nThe configuration file is selected from `--config`, then `PAPYRUS_CONFIG`, then the project directory's `papyrus.config.yml`.\nA command-line option takes precedence over the corresponding environment, file, or built-in setting."},{"id":"REQ-01.004","title":"Use Common CLI Controls and Outcomes","criticality":"Must have","userStory":"As a Papyrus user or command-line integration, I want consistent common options and exit outcomes so that I can operate the tool and recognize command results.","description":"Papyrus provides global JSON, color, version, and help options. `--json` applies to commands that produce output, including errors. Color can also be disabled with `NO_COLOR`. The man page defines distinct exit statuses for success, runtime error, usage error, not-found, and validation/conflict outcomes.","criteria":"`--version` prints the version and exits; `-h`/`--help` prints help, and command help is available as `papyrus \u003ccommand\u003e --help`.\n`--json` produces machine-readable JSON for output-producing commands, including error output.\n`--no-color` or setting `NO_COLOR` disables ANSI color output.\nSuccess, runtime error, usage error, record-not-found, and validation/conflict outcomes use exit codes 0, 1, 2, 3, and 4 respectively."},{"id":"REQ-01.005","title":"Assign Stable Record IDs","criticality":"Must have","userStory":"As a project user, I want Papyrus to assign and preserve record identifiers so that records can be referred to consistently.","description":"Papyrus generates record IDs automatically. IDs remain stable across archive/restore and deprecate/restore cycles. Configurable prefixes and padding determine the format for task, milestone, and release IDs; the man page gives `TASK-001`, `MS-001`, and `REL-001` as default examples.","criteria":"Creating a supported record automatically assigns it an ID.\nArchiving and restoring a record, or deprecating and restoring a document, does not change its ID.\nWith default configuration, task, milestone, and release IDs use the documented prefixes and three-digit examples (`TASK-001`, `MS-001`, `REL-001`); the configured prefix and padding control their format."}]},{"id":"REQ-02","title":"Task and Board Management","userStory":"As a project contributor, I want to record, organize, inspect, and track tasks so that project work is visible and can be managed through its lifecycle.","description":"This group covers task records and their relationships, filtering and monitoring task lists, and task lifecycle actions.","children":[{"id":"REQ-02.001","title":"Create and Describe Tasks","criticality":"Must have","userStory":"As a project contributor, I want to create tasks with planning details so that work and its completion expectations can be recorded.","description":"The user can create a task with a title and optional description, repeatable acceptance criteria, dependencies, labels, and an assignee, and can associate it with a milestone. A task may also reference zero or more business requirements, non-functional requirements, UI specifications, technical specifications, audit records, and business rules. Task IDs use the configured task prefix and padding; the default example is `TASK-001`. New tasks use the configured default status, which defaults to `ToDo`.","criteria":"`papyrus task create \u003ctitle\u003e` creates a task and returns/records its task ID.\nDescription, acceptance criteria, dependencies, milestone, labels, and assignee can be supplied with the documented options; repeatable options accept multiple values.\nThe assigned milestone and dependencies are represented on the created task.\nA task can reference zero or more of each documented requirement, specification, audit-record, and business-rule type.\nWith default settings, the task ID follows the `TASK-001` format and its status is `ToDo`."},{"id":"REQ-02.002","title":"View and Edit Tasks","criticality":"Must have","userStory":"As a project contributor, I want to inspect and update a task so that its current information and progress remain useful.","description":"The user can view a task using either `task view \u003cid\u003e` or `task \u003cid\u003e`, and update its title, description, status, milestone, assignee, or add acceptance criteria, comments, dependencies, and labels. Repeated add-options append to the existing set. Field flags update metadata without opening an editor; `--editor` opens the task body in the selected editor.","criteria":"`papyrus task view \u003cid\u003e` and `papyrus task \u003cid\u003e` display the same task.\nDocumented task edit options update the indicated task fields; repeatable options add entries.\n`--editor` opens the task body in `$VISUAL` or `$EDITOR`.\nField flags update metadata without launching an editor."},{"id":"REQ-02.003","title":"List and Filter Tasks","criticality":"Must have","userStory":"As a project contributor, I want to find tasks by their attributes and text so that I can focus on relevant work.","description":"The task list supports filtering by status, milestone, release, label, assignee, and text, limiting the number of results, and sorting by a selected field. A release filter includes tasks belonging to milestones assigned to that release. Watch mode keeps the list open and refreshes it on changes.","criteria":"Each documented task-list filter restricts results to matching tasks.\nA release filter includes tasks on milestones assigned to that release.\n`--limit` caps the number of results and `--sort \u003cfield\u003e` sorts by the requested field.\n`--watch` keeps the list open and refreshes it when changes occur."},{"id":"REQ-02.004","title":"Archive, Restore, and Delete Tasks","criticality":"Must have","userStory":"As a project maintainer, I want to archive, restore, or permanently delete tasks so that completed or unwanted records can be managed appropriately.","description":"Archiving moves a task off the board while preserving its ID and every dependency. Restore returns an archived task to the board with its previous status. Deletion permanently removes a task; an active task is archived first. `--force` skips the deletion confirmation prompt.","criteria":"Archiving a task removes it from the board and preserves its ID and dependencies.\nRestoring an archived task returns it to the board with its previous status and same ID.\nDeleting an archived task permanently deletes it; deleting an active task archives it first.\n`--force` skips the confirmation prompt when deleting."}]},{"id":"REQ-03","title":"Milestone and Release Planning","userStory":"As a project maintainer, I want to group work into milestones and releases so that planned delivery can be organized and reviewed.","description":"This group covers creating, viewing, listing, and editing milestones and releases, and the documented relationship between them.","children":[{"id":"REQ-03.001","title":"Manage Milestones","criticality":"Must have","userStory":"As a project maintainer, I want to create and maintain milestones so that related tasks can be organized around a delivery milestone.","description":"The user can create, list, view, edit, archive, and delete milestones. A milestone has a title, optional description, and may be assigned to zero or one release. Milestone IDs use the configured prefix and padding (default example `MS-001`). The man page specifies archive but does not describe a milestone restore command.","criteria":"The documented milestone commands create, list, view, and edit milestones, including title, description, and optional release assignment.\nA milestone can be assigned to no more than one release.\nArchive marks a milestone archived; delete permanently deletes it, with `--force` skipping confirmation.\nWith default settings, a generated milestone ID follows the `MS-001` format."},{"id":"REQ-03.002","title":"Manage Releases","criticality":"Must have","userStory":"As a project maintainer, I want to create and maintain releases so that milestones can be grouped for planned delivery.","description":"The user can create, list, view, and edit releases. A release has a title and may have a description. A release may contain multiple milestones, while each milestone may be assigned to zero or one release. Release IDs use the configured prefix and padding (default example `REL-001`). The release lifecycle is `active -\u003e released`: `released` represents delivery completion and is distinct from archiving (record management); releases are not archived. The man page documents no release archive, restore, or status-transition command, so no such transition is inferred.","criteria":"The documented release commands create, list, view, and edit release title and description.\nA release can be associated with multiple milestones, and each milestone is associated with at most one release.\nWith default settings, a generated release ID follows the `REL-001` format.\nThe release lifecycle is documented as `active -\u003e released`; `released` is delivery completion, distinct from archiving, and releases are not archived.\nThe man page does not specify how users perform the active-to-released transition; no undocumented archive, restore, or status command is inferred."}]},{"id":"REQ-04","title":"Decision Records","userStory":"As a project decision-maker, I want to capture, find, and update decisions so that the rationale and status of project decisions can be reviewed later.","description":"This group covers decision records, their types and content, status changes, supersession, and archival.","children":[{"id":"REQ-04.001","title":"Create and Inspect Decisions","criticality":"Must have","userStory":"As a project decision-maker, I want to create and inspect decisions with context and consequences so that decisions are recorded for future reference.","description":"The user can create and list decisions, optionally filtering by type, and view a decision. A decision records a title, decision type, decision, context, and consequences. Built-in types are `adr` and `bdr`; additional types may be configured. Decisions may reference zero or more business and non-functional requirements. Records follow the Nygard ADR template and decision status vocabulary described in the man page.","criteria":"A decision can be created with the documented title, type, decision, context, and consequences fields.\nThe default decision type is `adr`; `adr` and `bdr` are the built-in types.\nDecisions can be listed and viewed; listing can be filtered by type.\nDecision records expose the documented Nygard fields and status values: proposed, accepted, rejected, deprecated, and superseded.\nStatus transitions shown in the man page are proposed to accepted or rejected, and accepted to deprecated or superseded.\nA decision may reference zero or more business requirements and zero or more non-functional requirements."},{"id":"REQ-04.002","title":"Update, Supersede, and Archive Decisions","criticality":"Must have","userStory":"As a project decision-maker, I want to update decision records and mark replaced or inactive decisions so that their current standing is clear.","description":"The user can edit a decision's title, decision text, status, context, and consequences. A decision may be superseded by at most one decision of the same type; the supersession option cannot be combined with status editing. Decisions can be archived.","criteria":"The documented edit options update title, decision, status, context, and consequences.\nA decision can be marked as superseded by at most one decision of the same type.\n`--superseded-by` cannot be used together with `--status`.\n`papyrus decision archive \u003cid\u003e` archives the selected decision."}]},{"id":"REQ-05","title":"Project Documentation Management","userStory":"As a project contributor, I want to manage structured project documentation so that requirements, terms, specifications, rules, and audit records are available alongside backlog information.","description":"This group covers the documented documentation record types and their create, list, view, edit, deprecate, and restore capabilities, including requirement grouping and type-specific content. Document types include business requirements, non-functional requirements, glossary terms, UI specifications, technical specifications, UI mockups, business rules, and audit records.","children":[{"id":"REQ-05.001","title":"Manage Business Requirements","criticality":"Must have","userStory":"As a project contributor, I want to create, find, and maintain business requirements in groups so that business needs can be documented and traced.","description":"The user can create a business-requirement group and create business requirements only within a required group. Groups contain business requirements only, and each requirement belongs to exactly one group. Requirements contain a title, user story, and description, and can be listed, viewed, edited, deprecated, and restored with their ID preserved.","criteria":"A group can be created with a title, optional user story, and optional description.\nA business requirement can be created only with its required business-requirement group.\nA requirement belongs to exactly one group, and a group contains business requirements only.\nRequirements can be listed, viewed, and edited for title, user story, and description.\nDeprecation hides a requirement from lists, search, and the web UI; restoration returns it to its original folder with the same ID."},{"id":"REQ-05.002","title":"Manage Non-Functional Requirements","criticality":"Must have","userStory":"As a project contributor, I want to manage non-functional requirements in their own groups so that non-functional needs can be documented separately from business requirements.","description":"The user can create a non-functional-requirement group and create non-functional requirements only within a required group. Groups contain non-functional requirements only, and each requirement belongs to exactly one group. Requirements have a title and description and can be listed, viewed, edited, deprecated, and restored with their ID preserved.","criteria":"A group can be created with a title and optional description.\nA non-functional requirement can be created only with its required non-functional-requirement group.\nA requirement belongs to exactly one group, and a group contains non-functional requirements only.\nNon-functional requirements can be listed, viewed, and edited for title and description.\nDeprecation hides a requirement from lists, search, and the web UI; restoration returns it to its original folder with the same ID."},{"id":"REQ-05.003","title":"Manage Glossary Terms","criticality":"Must have","userStory":"As a project contributor, I want to maintain glossary terms and definitions so that project terminology can be looked up consistently.","description":"The user can create glossary terms with a term and definition, list and view terms, edit either field, and deprecate or restore terms. Deprecated terms are hidden from lists, search, and the web UI; restored terms retain their IDs.","criteria":"A glossary term can be created with the required term and definition.\nTerms can be listed, viewed, and edited for term and definition.\nDeprecation hides a term from lists, search, and the web UI.\nRestoration returns a term to its original folder with its ID preserved."},{"id":"REQ-05.004","title":"Manage UI Specifications","criticality":"Must have","userStory":"As a project contributor, I want to maintain UI specifications associated with views so that UI documentation can be found and updated.","description":"The user can create a UI specification with a title, associated view, and description; list, view, and edit it; and deprecate or restore it. Deprecated specifications are hidden from lists, search, and the web UI, and restored records retain their IDs.","criteria":"A UI specification can be created with the required title, view, and description.\nUI specifications can be listed, viewed, and edited for view and description.\nDeprecation hides a specification from lists, search, and the web UI.\nRestoration returns a specification to its original folder with its ID preserved."},{"id":"REQ-05.005","title":"Manage Business Rules","criticality":"Must have","userStory":"As a project contributor, I want to record and maintain business rules with their rationale and applicability so that rules can be understood in the context of requirements.","description":"The user can create rules with a title, description, rationale, and applicability, optionally referencing business requirements. Rules can be listed, viewed, edited, deprecated, and restored. Requirement references are repeatable and can be removed individually or all at once.","criteria":"Creating a rule requires description, rationale, and applicability; title is supplied as the command title.\nA rule may reference zero or more business requirements.\nRules can be listed, viewed, and edited for title, description, and requirement references.\nA requirement reference can be removed by ID or all references can be removed.\nDeprecation hides a rule from lists, search, and the web UI; restoration returns it to its original folder with the same ID."},{"id":"REQ-05.006","title":"Manage Audit Records","criticality":"Must have","userStory":"As a project contributor, I want to record and maintain audit information so that the project can retain searchable audit records.","description":"The user can create audit records with a title and content, optionally specifying an audit type. Built-in types are `security` (default), `licence`, and `architecture`; additional types are configurable. Records can be listed, viewed, edited, deprecated, and restored.","criteria":"An audit record can be created with the required title and content.\nThe default audit type is `security`; `licence` and `architecture` are also built in, and additional types may be configured.\nAudit records can be listed, viewed, and edited for title, content, and type.\nAudit records can be deprecated and restored using their documented commands."},{"id":"REQ-05.007","title":"Manage Documentation Record Lifecycle","criticality":"Must have","userStory":"As a project maintainer, I want to deprecate and restore supported documentation records so that outdated documents can be hidden without losing their identity.","description":"For business requirements, non-functional requirements, glossary terms, UI specifications, technical specifications, UI mockups, business rules, and audit records, the man page documents deprecate and restore commands. Deprecated documents are stored in a `deprecated/` subfolder for their document type. The man page explicitly says deprecation hides requirements, glossary terms, UI specifications, technical specifications, UI mockups, and business rules from lists, search, and the web UI; it does not spell out the same visibility effects for audit records.","criteria":"Each documented document type with deprecate/restore commands can be deprecated and restored.\nDeprecated documents are stored in that document type's `deprecated/` subfolder.\nFor requirements, glossary terms, UI specifications, technical specifications, UI mockups, and business rules, deprecation hides them from lists, search, and the web UI.\nRestoring a deprecated business requirement, non-functional requirement, glossary term, UI specification, or technical specification preserves its ID and returns it to its original folder."},{"id":"REQ-05.008","title":"Manage UI Mockups","criticality":"Must have","userStory":"As a project contributor, I want to maintain UI mockups associated with UI specifications and tickets so that UI design artifacts can be found, reviewed, approved, and updated.","description":"The user can create a UI mockup as a document type with prefix MOCK stored under `docs/specifications/ui/mockups/`. A mockup realizes a UI specification: it carries a title, an associated task, references to other documents, and an implementation reference to one or more UI specifications by spec id. Mockups are editable, are not versioned by Papyrus (version control is provided by git), and can be associated to tickets (the ticket is recorded in the mockup and the mockup is referenced by the ticket). Mockups can be listed, viewed, and edited; they can be deprecated and restored with their ID preserved, with deprecation visibility matching UI specifications (hidden from lists, search, and the web UI). A mockup's status is one of: pending (waiting user approval), approved, or deprecated. A mockup may supersede an older mockup; the superseded mockup becomes deprecated and records a back-reference to its successor. Status transitions are blocked while a mockup is superseded. Restore copies a deprecated mockup back to its original folder and updates its status field in the HTML.","criteria":"A mockup can be created with the required title, associated task, and reference(s) to UI specification(s) by spec id.\nMockups are stored under `docs/specifications/ui/mockups/` with IDs using the MOCK prefix.\nA mockup records its associated ticket and references to other documents within its HTML content.\nMockups can be listed, viewed, and edited.\nA mockup's status is one of pending (waiting user approval), approved, or deprecated.\nDeprecation hides a mockup from lists, search, and the web UI; restoration returns it to its original folder with its ID preserved and updates its status field in the HTML.\nA mockup may supersede an older mockup; the superseded mockup becomes deprecated and records a back-reference to its successor.\nStatus transitions are blocked for a mockup that has been superseded.\nMockups are not versioned by Papyrus; version control is provided by git."},{"id":"REQ-05.009","title":"Manage Technical Specifications","criticality":"Must have","userStory":"As a project contributor, I want technical specifications to be recognized as a project documentation type so that technical documentation can be referenced by tasks and can reference non-functional requirements.","description":"Technical specifications are a documented documentation type in Papyrus, managed with the `tech-spec` command. A technical specification is created with a required title and description. Its ID uses the `TECH` prefix (for example `TECH-001`), padded to the configured `id_padding`, and it is stored under the `technical/` directory (under `doc_directory`). Technical specifications can be listed, viewed, and edited for title and description, and support the `--editor` option for editing the description. They follow the Documents lifecycle `active -\u003e deprecated`: a technical specification can be deprecated and restored with its ID preserved, with deprecation hiding it from lists, search, and the web UI. Technical specifications follow the same input sanitization and project-directory path boundary as other document types. A task may reference zero or more technical specifications (REQ-02.001), and non-functional requirements may be referenced by technical specifications.","criteria":"Technical specifications are recognized as a documentation type in Papyrus documentation management (README DESCRIPTION).\nA technical specification can be created with the required title and description.\nTechnical specifications are stored under `technical/` (under `doc_directory`) with IDs using the `TECH` prefix, padded to `id_padding` digits.\nTechnical specifications can be listed, viewed, and edited for title and description, including via `--editor`.\nThe `tech-spec` command supports `create \u003ctitle\u003e --description \u003ctext\u003e`, `list`, `view \u003cid\u003e`, `edit \u003cid\u003e [--title] [--description] [--editor]`, `deprecate \u003cid\u003e`, and `restore \u003cid\u003e`.\nTechnical specifications can be deprecated and restored using the `tech-spec` command; deprecation hides them from lists, search, and the web UI, and restoration returns them to their original folder with the same ID.\nTechnical specifications follow the same input sanitization and project-directory path boundary as other document types.\nA task may reference zero or more technical specifications (REQ-02.001).\nNon-functional requirements may be referenced by technical specifications."}]},{"id":"REQ-06","title":"Search and Local Web Interface","userStory":"As a project contributor, I want to search project records and use the local web interface so that backlog and documentation information can be discovered in a single project context.","description":"This group covers unified free-text search across the documented record types and starting the local web UI over the project's backlog and documentation stores.","children":[{"id":"REQ-06.001","title":"Search Project Records","criticality":"Must have","userStory":"As a project contributor, I want to search backlog and documentation records together so that relevant project information can be found without searching stores separately.","description":"The user can run a free-text search across tasks, milestones, releases, decisions, and documents in one pass. The user may restrict results to one or more record types and limit the maximum number of results. The documented type values are task, milestone, release, decision, and doc; the default is all types.","criteria":"A query searches tasks, milestones, releases, decisions, and documents by default.\nA quoted phrase containing spaces is accepted as one query.\nRepeatable `--type` options restrict results to the selected documented record types.\n`--limit \u003cn\u003e` caps the number of returned results."},{"id":"REQ-06.002","title":"Serve the Local Web Interface","criticality":"Must have","userStory":"As a project contributor, I want to open a local web interface over project stores so that I can access project information through a browser.","description":"The browser command serves the local web UI over both backlog and documentation stores. Its default bind address is `127.0.0.1` and default port is `6420`; the host and port can be selected. A non-loopback host is permitted but causes a warning. The default browser opens automatically unless disabled by option or configuration.","criteria":"`papyrus browser` starts the web UI over the backlog and documentation stores using the configured/default host and port.\nThe default host is `127.0.0.1` and the default port is `6420`.\nA user-specified non-loopback host is accepted and causes a warning.\n`--no-open` prevents automatic opening of the default browser."}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const treeEl = document.getElementById("tree");
const detailEl = document.getElementById("detail");
const filterEl = document.getElementById("filter");
const nodes = {};

function leafButton(leaf) {
  const button = document.createElement("button");
  button.className = "leaf";
  button.dataset.id = leaf.id;
  button.dataset.search = (leaf.id + " " + leaf.title).toLowerCase();
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = leaf.id;
  const label = document.createElement("span");
  label.textContent = leaf.title;
  button.append(badge, label);
  button.addEventListener("click", () => select(leaf.id));
  nodes[leaf.id] = leaf;
  return button;
}

function renderTree() {
  const fragment = document.createDocumentFragment();
  for (const group of DATA.groups) {
    const wrapper = document.createElement("div");
    wrapper.className = "group";
    wrapper.dataset.group = group.id;
    const head = document.createElement("button");
    head.className = "group-head";
    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = "▾";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = group.id;
    const label = document.createElement("span");
    label.textContent = group.title;
    head.append(caret, badge, label);
    head.addEventListener("click", () => wrapper.classList.toggle("collapsed"));
    wrapper.appendChild(head);
    const list = document.createElement("ul");
    list.className = "leaves";
    for (const leaf of group.children) list.appendChild(leafButton(leaf));
    wrapper.appendChild(list);
    fragment.appendChild(wrapper);
  }
  treeEl.appendChild(fragment);
}

function addField(label, value, className) {
  const heading = document.createElement("h3");
  heading.textContent = label;
  const text = document.createElement("p");
  text.className = value ? (className || "") : "empty";
  text.textContent = value || "—";
  detailEl.append(heading, text);
}

function renderDetail(leaf) {
  const isReq = leaf.id.startsWith("REQ-");
  const id = document.createElement("div");
  id.className = "rid";
  id.textContent = leaf.id;
  const title = document.createElement("h2");
  title.textContent = leaf.title;
  detailEl.replaceChildren(id, title);
  const tags = document.createElement("div");
  tags.className = "tags";
  if (isReq) {
    const criticality = document.createElement("span");
    criticality.className = "tag" + (leaf.criticality === "Must have" ? " must" : "");
    criticality.textContent = leaf.criticality || "—";
    tags.appendChild(criticality);
  }
  const type = document.createElement("span");
  type.className = "tag";
  type.textContent = isReq ? "Business requirement" : "Non-functional requirement";
  tags.appendChild(type);
  detailEl.appendChild(tags);
  if (isReq) {
    addField("User Story", leaf.userStory, "story");
    addField("Description", leaf.description);
    const criteria = (leaf.criteria || "").split("\n").map(line => line.replace(/^[-*]\s+/, "")).filter(Boolean).join("\n");
    addField("Acceptance Criteria", criteria);
  } else {
    addField("Description", leaf.description);
    addField("Rationale", leaf.rationale);
    addField("Verification Method", leaf.verification);
  }
}

function select(id) {
  document.querySelectorAll(".leaf.active").forEach(button => button.classList.remove("active"));
  const button = document.querySelector('.leaf[data-id="' + CSS.escape(id) + '"]');
  if (button) button.classList.add("active");
  if (nodes[id]) renderDetail(nodes[id]);
}

function applyFilter() {
  const query = filterEl.value.trim().toLowerCase();
  document.querySelectorAll(".group").forEach(group => {
    let shown = 0;
    group.querySelectorAll(".leaf").forEach(leaf => {
      const hit = !query || leaf.dataset.search.includes(query);
      leaf.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    group.classList.toggle("hidden", shown === 0);
    if (query && shown) group.classList.remove("collapsed");
  });
}

filterEl.addEventListener("input", applyFilter);
renderTree();
const leafCount = DATA.groups.reduce((n, group) => n + group.children.length, 0);
if (!leafCount) {
  const empty = document.createElement("p");
  empty.className = "empty";
  empty.textContent = "No requirements yet.";
  treeEl.appendChild(empty);
}
document.getElementById("counts").textContent = leafCount + " requirements";
const first = DATA.groups.find(group => group.children.length)?.children[0];
if (first) select(first.id);
</script>
</body>
</html>
