<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Non-Functional Requirements</title>
<style>
  :root { --bg:#f4f4f2; --panel:#fff; --border:#e2e2df; --ink:#1c1c1a; --muted:#6b6b66; --accent:#2f6f4f; --accent-soft:#e7f1ec; --badge:#eceff1; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:grid; place-items:center; padding:24px; }
  .app { width:min(1200px,100%); height:min(88vh,900px); background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.08); display:grid; grid-template-rows:auto 1fr; overflow:hidden; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:17px; margin:0; } header .sub { color:var(--muted); font-size:13px; } header .back { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; } header .back:hover { text-decoration:underline; }
  .panes { display:grid; grid-template-columns:330px 1fr; min-height:0; }
  .tree-pane { border-right:1px solid var(--border); overflow-y:auto; padding:12px; background:#fafaf9; }
  #filter { width:100%; padding:7px 10px; margin-bottom:10px; border:1px solid var(--border); border-radius:8px; font:inherit; font-size:13px; }
  .root-title { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 6px 6px; }
  .root-title:first-child { margin-top:2px; }
  .group-head { display:flex; align-items:center; gap:6px; width:100%; background:none; border:0; padding:6px; font:inherit; font-weight:600; font-size:13.5px; color:var(--ink); cursor:pointer; border-radius:6px; text-align:left; }
  .group-head:hover,.leaf:hover { background:#f0f0ee; }
  .caret { width:12px; color:var(--muted); flex:none; transition:transform .12s; }
  .group.collapsed .caret { transform:rotate(-90deg); } .group.collapsed .leaves { display:none; }
  .leaves { list-style:none; margin:0 0 4px; padding:0 0 0 14px; }
  .leaf { display:flex; align-items:baseline; gap:8px; width:100%; background:none; border:0; border-radius:6px; padding:5px 8px; font:inherit; font-size:13.5px; color:var(--ink); cursor:pointer; text-align:left; }
  .leaf.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .badge { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; background:var(--badge); color:var(--muted); border-radius:5px; padding:1px 6px; flex:none; }
  .leaf.active .badge { background:#d5e8de; color:var(--accent); }
  .detail-pane { overflow-y:auto; padding:26px 30px; }
  .detail .rid { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; color:var(--accent); }
  .detail h2 { margin:2px 0 10px; font-size:22px; }
  .tags { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tag { font-size:12px; border:1px solid var(--border); border-radius:999px; padding:2px 10px; color:var(--muted); background:#fafaf9; }
  .tag.must { border-color:#bcd8c9; background:var(--accent-soft); color:var(--accent); }
  .detail h3 { font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 0 6px; }
  .detail p { margin:0 0 8px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .detail .story { font-style:italic; color:#444; }
  .empty { color:var(--muted); } .hidden { display:none !important; }
  @media(max-width:720px) { body{padding:0}.app{height:100vh;border-radius:0}.panes{grid-template-columns:minmax(150px,40%) 1fr}.detail-pane{padding:18px} }
</style>
</head>
<body>
<div class="app">
  <header><h1>Non-Functional Requirements</h1><span class="sub" id="counts"></span><a class="back" href="../../index.html">Back to documentation index</a></header>
  <div class="panes">
    <nav class="tree-pane" aria-label="Requirements">
      <input id="filter" type="search" placeholder="Filter requirements…" autocomplete="off">
      <div id="tree"></div>
    </nav>
    <main class="detail-pane"><div class="detail" id="detail" aria-live="polite"></div></main>
  </div>
</div>
<script id="data" type="application/json">{"groups":[{"id":"NFR-01","title":"Product Form","userStory":"","description":"This group records Papyrus's command-line and browser-based product-form constraints, including displaying, viewing, and editing all Papyrus content in a local browser interface, and using the `browser` command and interface without an internet connection.","children":[{"id":"NFR-01.001","title":"Provide Papyrus as a Command-Line Tool","description":"Papyrus shall be provided as a command-line tool.","rationale":"This records the confirmed product form so the product scope and its verification remain aligned.","verification":"Review the documented product entry point and invocation instructions to confirm that Papyrus is provided as a command-line tool."},{"id":"NFR-01.002","title":"Display, View, and Edit All Papyrus Content in a Local Browser","description":"The local browser interface opened by the `browser` command shall display all Papyrus content and allow users to view and edit that content.","rationale":"This records the full content scope requested for the browser interface while preserving the command-line product form in NFR-01.001.","verification":"Invoke the `browser` command and use an inventory of Papyrus content to verify that every item is displayed in the local browser interface and can be viewed and edited; confirm that edits are saved and can be viewed again."},{"id":"NFR-01.003","title":"Use the Browser Command and Interface Without Internet","description":"The `browser` command and local browser interface shall be usable without an internet connection.","rationale":"This records the requirement that both the command and the locally served interface work without internet access.","verification":"Disconnect internet access, invoke the `browser` command, and verify that the local browser interface starts and remains usable."}]},{"id":"NFR-02","title":"Security","userStory":"","description":"This group records the security priority and the requirement to sanitize input. Input scope and sanitization criteria remain to be defined.","children":[{"id":"NFR-02.001","title":"Treat Security as a Project Priority","description":"Security shall be treated as a priority when making Papyrus design and review decisions.","rationale":"This records the requested security focus without prescribing unspecified security standards, controls, or risk targets.","verification":"Review project design and review records to confirm that security is explicitly considered. This verifies the stated priority only; beyond the input-sanitization objective in NFR-02.002, security objectives and measurable acceptance criteria have not been specified."},{"id":"NFR-02.002","title":"Sanitize Input","description":"Papyrus shall sanitize every user-supplied value (IDs, paths, titles, free text) from all CLI and browser inputs before using it, covering all command types. Input that fails the per-command-type sanitization criteria shall be rejected rather than silently cleaned.","rationale":"Input sanitization is the specific security control requested for Papyrus.","verification":"Review and test Papyrus input-handling paths for every command type to confirm all user-supplied values are sanitized before use and that input failing the per-command-type criteria is rejected (not silently cleaned)."}]},{"id":"NFR-03","title":"Implementation and Distribution","userStory":"","description":"This group records the requested implementation-language constraint, distribution as amd64 Debian `.deb` packages for Debian Forky only, and the requirement that every command be documented by a man page included in the Debian package.","children":[{"id":"NFR-03.001","title":"Implement Papyrus in Rust","description":"The Papyrus application shall be implemented in Rust.","rationale":"This records the requested programming language constraint.","verification":"Review the application's source files and build metadata to confirm that Rust is its implementation language."},{"id":"NFR-03.002","title":"Distribute Papyrus as a Debian Package","description":"Papyrus shall be distributed as `.deb` packages for the amd64 architecture on Debian Forky only.","rationale":"This records the requested Debian package format, architecture, and supported release. Supported-release scope is narrowed to Debian Forky only per ADR-0003 (accepted), which supersedes ADR-0002 (superseded); Debian Trixie and any other Debian release are not claimed or verified as supported.","verification":"Inspect the distribution artifacts to confirm that an amd64 `.deb` package is provided, and install and smoke-test it on Debian Forky."},{"id":"NFR-03.003","title":"Provide Command Man Pages in the Debian Package","description":"Papyrus shall provide a man page for every command, and these man pages shall be included in the Debian package. Man page sources shall be Markdown files under `docs/man/`, generated to roff at build time, and installed to the standard man paths in the `.deb`.","rationale":"This records the requested packaging and documentation requirement that the man page is not optional or deferred, and that each command is documented as a man page. The man pages also serve as development input and are intended to be reusable with minimal improvements.","verification":"Inspect the Debian package contents to confirm that a man page is present for every documented Papyrus command, that roff man pages are installed under standard man paths and generated from Markdown sources under `docs/man/`, and verify that each command's documented behavior matches its man page."}]},{"id":"NFR-04","title":"Persistence","userStory":"","description":"This group records the requirement that all saved data use text files, that Papyrus not read from or write to paths outside the project directory except during `init`, and that task and milestone files remain interoperable with Backlog.md. Detailed boundary interpretations are noted in the atomic requirements.","children":[{"id":"NFR-04.001","title":"Persist Application Data Only in Text Files","description":"All data saved by Papyrus shall be stored in text files only. \"All data saved by Papyrus\" means managed record files (tasks, milestones, releases, decisions, docs) plus configuration; these files shall be UTF-8 text files, with no binary data.","rationale":"This records the requirement that all saved data use text files without adding a particular text-file format.","verification":"Review Papyrus's saved artifacts and storage mechanisms to confirm that managed record files (tasks, milestones, releases, decisions, docs) and configuration are stored as UTF-8 text files only, with no binary data."},{"id":"NFR-04.002","title":"Restrict File Access to the Project Directory","description":"Papyrus shall not read from or write to paths outside the project directory, except during `init`. The project directory boundary shall be enforced by canonicalizing paths and resolving symbolic links, rejecting any path that escapes the canonical project root. The `init` exception permits writing outside the project directory only to create the project directory itself.","rationale":"This records the requested boundary on Papyrus file access and the stated `init` exception.","verification":"Exercise Papyrus operations, including `init`, while monitoring filesystem reads and writes; confirm that no operation other than `init` reads from or writes to a path outside the project directory, that symlink traversal cannot escape the canonical project root, and that `init` writes outside the project directory only to create the project directory itself."},{"id":"NFR-04.003","title":"Keep Task and Milestone Files Interoperable with Backlog.md","description":"Papyrus task and milestone files shall remain readable, listable, and updatable by Backlog.md without loss of the fields Backlog.md requires. Task files carry the Backlog.md front-matter key set. Milestone files may carry the general front-matter keys in addition to `id`, `title`, and `release`; Backlog.md must still read, list, and update these files, and the additive general keys are accepted and preserved. Release records have no Backlog.md counterpart and are outside this requirement's scope, as are Backlog.md `docs` and `drafts` records.","rationale":"The project stores tasks and milestones using Backlog.md conventions, and the requested front matter must preserve that interoperability. The quality attributes are interoperability and maintainability: both tools operate on the same project files without a conversion step or a parallel store. Additive keys are tolerated rather than forbidden, because Papyrus needs metadata (general keys, milestone `release`) that Backlog.md does not write itself.","verification":"Create and edit tasks and milestones with Papyrus, then run Backlog.md list, view, and update commands against the same project and confirm that every required field is read and preserved, including the additive milestone general keys and `release`. Repeat in the other direction: create and edit records with Backlog.md, then read, list, update, and view them with Papyrus. Run both directions on newly created records and on legacy records migrated lazily on first read and on first write, covering both migration input shapes: files already in Backlog.md shape keep a byte-identical body apart from the front-matter block, and legacy Papyrus-shape files are converted on first read or first write and then round-trip. Verify migration is idempotent across repeated reads and writes in both directions."}]},{"id":"NFR-05","title":"Browser Compatibility","userStory":"","description":"This group records support for the browser interface in Firefox, Microsoft Edge, and Safari version 100 and later. The interpretation of Safari version 100 is noted in the atomic requirement.","children":[{"id":"NFR-05.001","title":"Display the Browser Interface in Named Browsers","description":"The Papyrus browser interface shall be supported in Firefox version 100 and later, Microsoft Edge version 130 and later, and Safari version 18 and later. \"Supported\" means the interface renders and is usable with no layout breakage in the named browsers.","rationale":"This records the requested browser families and minimum version without defining visual behavior not supplied in the scope.","verification":"Verify the browser interface using version 100 and later of Firefox, version 130 and later of Microsoft Edge, and version 18 and later of Safari, confirming that the interface renders and is usable with no layout breakage in each tested version."}]},{"id":"NFR-06","title":"Licensing","userStory":"","description":"This group records the requirement to license Papyrus under GPL-3.0-or-later and use only open-source dependencies whose licenses do not prevent linking them in a GPLv3-or-later application. Interpretive questions are noted in the atomic requirements.","children":[{"id":"NFR-06.001","title":"License Papyrus Under GPL-3.0-or-later","description":"Papyrus shall be licensed under GPL-3.0-or-later.","rationale":"This records the requested project license and its “or later” version grant.","verification":"Review the project's licensing declaration and distributed license notice to confirm that they identify GPL-3.0-or-later."},{"id":"NFR-06.002","title":"Use Open-Source Dependencies That Permit GPLv3-or-Later Linking","description":"Papyrus shall use only open-source runtime dependencies with licenses that do not prevent linking those dependencies in a GPLv3-or-later application. \"Open-source\" means OSI-approved licenses; \"linking\" means dynamic or static linking under GPLv3-or-later.","rationale":"This records the requested open-source and linking-license constraints for dependencies used by Papyrus.","verification":"Review the runtime dependency inventory and each dependency's license to confirm that every dependency is open source (OSI-approved license) and its license does not prevent dynamic or static linking in a GPLv3-or-later application."}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const treeEl = document.getElementById("tree");
const detailEl = document.getElementById("detail");
const filterEl = document.getElementById("filter");
const nodes = {};

function leafButton(leaf) {
  const button = document.createElement("button");
  button.className = "leaf";
  button.dataset.id = leaf.id;
  button.dataset.search = (leaf.id + " " + leaf.title).toLowerCase();
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = leaf.id;
  const label = document.createElement("span");
  label.textContent = leaf.title;
  button.append(badge, label);
  button.addEventListener("click", () => select(leaf.id));
  nodes[leaf.id] = leaf;
  return button;
}

function renderTree() {
  const fragment = document.createDocumentFragment();
  for (const group of DATA.groups) {
    const wrapper = document.createElement("div");
    wrapper.className = "group";
    wrapper.dataset.group = group.id;
    const head = document.createElement("button");
    head.className = "group-head";
    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = "▾";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = group.id;
    const label = document.createElement("span");
    label.textContent = group.title;
    head.append(caret, badge, label);
    head.addEventListener("click", () => wrapper.classList.toggle("collapsed"));
    wrapper.appendChild(head);
    const list = document.createElement("ul");
    list.className = "leaves";
    for (const leaf of group.children) list.appendChild(leafButton(leaf));
    wrapper.appendChild(list);
    fragment.appendChild(wrapper);
  }
  treeEl.appendChild(fragment);
}

function addField(label, value, className) {
  const heading = document.createElement("h3");
  heading.textContent = label;
  const text = document.createElement("p");
  text.className = value ? (className || "") : "empty";
  text.textContent = value || "—";
  detailEl.append(heading, text);
}

function renderDetail(leaf) {
  const isReq = leaf.id.startsWith("REQ-");
  const id = document.createElement("div");
  id.className = "rid";
  id.textContent = leaf.id;
  const title = document.createElement("h2");
  title.textContent = leaf.title;
  detailEl.replaceChildren(id, title);
  const tags = document.createElement("div");
  tags.className = "tags";
  if (isReq) {
    const criticality = document.createElement("span");
    criticality.className = "tag" + (leaf.criticality === "Must have" ? " must" : "");
    criticality.textContent = leaf.criticality || "—";
    tags.appendChild(criticality);
  }
  const type = document.createElement("span");
  type.className = "tag";
  type.textContent = isReq ? "Business requirement" : "Non-functional requirement";
  tags.appendChild(type);
  detailEl.appendChild(tags);
  if (isReq) {
    addField("User Story", leaf.userStory, "story");
    addField("Description", leaf.description);
    const criteria = (leaf.criteria || "").split("\n").map(line => line.replace(/^[-*]\s+/, "")).filter(Boolean).join("\n");
    addField("Acceptance Criteria", criteria);
  } else {
    addField("Description", leaf.description);
    addField("Rationale", leaf.rationale);
    addField("Verification Method", leaf.verification);
  }
}

function select(id) {
  document.querySelectorAll(".leaf.active").forEach(button => button.classList.remove("active"));
  const button = document.querySelector('.leaf[data-id="' + CSS.escape(id) + '"]');
  if (button) button.classList.add("active");
  if (nodes[id]) renderDetail(nodes[id]);
}

function applyFilter() {
  const query = filterEl.value.trim().toLowerCase();
  document.querySelectorAll(".group").forEach(group => {
    let shown = 0;
    group.querySelectorAll(".leaf").forEach(leaf => {
      const hit = !query || leaf.dataset.search.includes(query);
      leaf.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    group.classList.toggle("hidden", shown === 0);
    if (query && shown) group.classList.remove("collapsed");
  });
}

filterEl.addEventListener("input", applyFilter);
renderTree();
const leafCount = DATA.groups.reduce((n, group) => n + group.children.length, 0);
if (!leafCount) {
  const empty = document.createElement("p");
  empty.className = "empty";
  empty.textContent = "No requirements yet.";
  treeEl.appendChild(empty);
}
document.getElementById("counts").textContent = leafCount + " requirements";
const first = DATA.groups.find(group => group.children.length)?.children[0];
if (first) select(first.id);
</script>
</body>
</html>
